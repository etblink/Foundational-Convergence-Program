          /usr/bin/time -f 'DIAG_RESOURCE_TIME %e CPU %P MAX_RSS_KB %M' -o "/tmp/bfss-m4f1-qualified-d3b-recovery-gate2/$stem.resource" timeout --signal=TERM --kill-after=5s 105s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" >"/tmp/bfss-m4f1-qualified-d3b-recovery-gate2/$stem.log" 2>&1 || {
            code=$?
            echo "M4F1_D3B_GATE2_INDEPENDENT_CHARGE_FAILED_EXIT=$code"
            tail -n 70 "/tmp/bfss-m4f1-qualified-d3b-recovery-gate2/$stem.log"
