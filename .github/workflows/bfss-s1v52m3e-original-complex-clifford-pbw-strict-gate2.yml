name: BFSS S1V52M3E Original Complex Clifford PBW Basis Strict Gate 2

# Exact source-only target, manual single-path workflow gate.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s1v52m3e-original-complex-clifford-pbw-strict-gate2.yml

permissions:
  contents: read

concurrency:
  group: bfss-m3e-complex-pbw-gate2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-complex-pbw:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout qualified original Clifford research ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout immutable BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Pin original source hashes and isolated M3E candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v52m3e
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          d=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in d['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          test "$(git rev-parse 'HEAD:experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52M3AOriginalComplexCliffordActionImageIrreducibilityProbe.lean')" = ca640e2667a1574cca750a76fb8eaab34f5e59a0
          test "$(git rev-parse 'HEAD:experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52M2OriginalComplexifiedCliffordFockRepresentationProbe.lean')" = fa67dfde6cb6a21a97180797bdf5e917e0b417d2
          git fetch --no-tags --depth=1 origin research/fcp-m3e-complex-clifford-pbw-20261021
          test "$(git rev-parse FETCH_HEAD)" = c2638df97aa854f82daf9c952f1e38e95d3044af
          git show "FETCH_HEAD:experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52M3EOriginalComplexCliffordPBWBasisProbe.lean" > /tmp/bfss-s1v52m3e/SU2BFSSPhysicalDomainS1V52M3EOriginalComplexCliffordPBWBasisProbe.lean
          test "$(git hash-object --no-filters /tmp/bfss-s1v52m3e/SU2BFSSPhysicalDomainS1V52M3EOriginalComplexCliffordPBWBasisProbe.lean)" = 47d6a1606e4929ef3ccf8ac865f02310620101d9
          echo M3E_ORIGINAL_UPSTREAM_AND_EXACT_CANDIDATE_PINS_PASS

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore pinned Lean toolchain and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v52m3e/toolchain.log; then
              ok=true; break
            fi
            echo M3E_PINNED_LEAN_RETRY_$attempt | tee -a /tmp/bfss-s1v52m3e/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo M3E_PINNED_LEAN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v52m3e/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo M3E_PINNED_LEAN_MATHLIB_PASS

      - name: Restore qualified M3D original full-image source cache
        id: cacheM3D
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-fcp-m3d-original-full-image-v3-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed on qualified original Clifford and 48-PBW prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.cacheM3D.outputs.cache-hit }}" = true || { echo M3E_QUALIFIED_M3D_CACHE_MISS; exit 1; }
          cd upstream-math/lean
          for root in OAI/MathematicalPhysics/BFSS/Core SU2BFSSG1APairedThetaProbe SU2BFSSPhysicalDomainS1V52M2OriginalComplexifiedCliffordFockRepresentationProbe SU2BFSSPhysicalDomainS1V52M3AOriginalComplexCliffordActionImageIrreducibilityProbe SU2BFSSPhysicalDomainS1V52M3BOriginalComplexCliffordSimpleModuleProbe SU2BFSSPhysicalDomainS1V52M3COriginalCliffordFockSchurAndFiniteProbe SU2BFSSPhysicalDomainS1V52M3DOriginalComplexCliffordFullFockImageProbe SU2BFSSPhysicalDomainS1V52L9E5F20BOriginalSource48CliffordPBWBasisFiniteDimensionalProbe; do
            test -s ".lake/build/lib/lean/$root.olean" || { echo "M3E_QUALIFIED_PARENT_OLEAN_MISSING: $root"; exit 1; }
          done
          echo M3E_ORIGINAL_M3D_QUALIFIED_CACHE_READY

      - name: Compile exact original complex Clifford 48-PBW basis and dimension theorem
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=SU2BFSSPhysicalDomainS1V52M3EOriginalComplexCliffordPBWBasisProbe
          cp "/tmp/bfss-s1v52m3e/$stem.lean" "$stem.lean"
          timeout 660s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v52m3e/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean" || { echo M3E_FRESH_SOURCE_OLEAN_MISSING; exit 1; }
          python3 - <<'PY'
          import pathlib,re
          stem="SU2BFSSPhysicalDomainS1V52M3EOriginalComplexCliffordPBWBasisProbe"
          ns="FCP.BFSSS1V52M3E"
          roots=["originalComplexClifford_finrank"]
          definitions=["originalComplexCliffordPBWBasis"]
          src=pathlib.Path(stem+'.lean').read_text()
          log=pathlib.Path('/tmp/bfss-s1v52m3e',stem+'.log').read_text()
          assert re.findall(r'^namespace (\S+)',src,re.M)==[ns]
          assert re.findall(r'^theorem (\S+)',src,re.M)==roots
          assert re.findall(r'^(?:noncomputable )?def (\S+)',src,re.M)==definitions
          assert re.findall(r'^#print axioms (\S+)',src,re.M)==definitions+roots
          rr=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          report={k:{x.strip() for x in v.split(',') if x.strip()} for k,v in rr}
          assert len(rr)==len(report)==2,rr
          for root in definitions+roots:
            ax=report[ns+'.'+root]
            assert ax <= {'propext','Classical.choice','Quot.sound'},(root,ax)
          assert 'error:' not in log and 'sorryAx' not in log and 'unknownIdentifier' not in log,log[-9000:]
          print('M3E_ACTUAL_SOURCE_COMPLEX_CLIFFORD_PBW_FINRANK_ONE_ROOT_STRICT_PASS')
          PY

      - name: Save qualified original complex Clifford PBW source cache
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-fcp-m3e-complex-clifford-pbw-v2-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve M3E exact-source diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m3e-gate2-${{ github.run_id }}
          path: /tmp/bfss-s1v52m3e
          if-no-files-found: ignore
