name: BFSS Native Bridge Reduction Gate

on:
  push:
    branches:
      - research/openai-math-bfss-native-bridge
    paths:
      - experiments/openai-math-bfss-native-bridge/**
      - .github/workflows/openai-math-bfss-native-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FCP native-bridge branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check out pinned OpenAI Math
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: openai/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Restore pinned Lean environment
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake
            ~/.elan
          key: family270b-bridge-ubuntu-lean4341-openai-adc7f124-deformedcharge-v2

      - name: Compile native DeformedCharge append in ephemeral checkout
        shell: bash
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          test "$(cat upstream-math/lean/lean-toolchain)" = "leanprover/lean4:v4.34.1"
          cat experiments/openai-math-bfss-native-bridge/DeformedChargeNativeAppend.lean >> upstream-math/lean/OAI/MathematicalPhysics/BFSS/DeformedCharge.lean
          cat experiments/openai-math-bfss-native-bridge/MassiveMomentsNativeConsumer.lean >> upstream-math/lean/OAI/MathematicalPhysics/BFSS/MassiveMoments.lean
          cd upstream-math/lean
          lake exe cache get
          lake build OAI.MathematicalPhysics.BFSS.MassiveMoments
          lake env lean OAI/MathematicalPhysics/BFSS/DeformedCharge.lean
          lake env lean OAI/MathematicalPhysics/BFSS/MassiveMoments.lean
