name: BFSS SU2 Concrete Color Gate

on:
  push:
    branches:
      - research/openai-math-su2-concrete-potential
    paths:
      - experiments/openai-math-su2-concrete-potential/**
      - .github/workflows/openai-math-su2-concrete-potential.yml
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Recompile entire pinned SU2 chain from source, bypassing compiled proof cache'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  color-cross:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FCP research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check out pinned OpenAI Math
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: openai/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Restore pinned Lean environment
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake
            ~/.elan
          key: family270b-bridge-ubuntu-lean4341-openai-adc7f124-deformedcharge-v2

      - name: Verify immutable accepted G4-K8E3 prerequisite inputs
        shell: bash
        run: |
          set -euo pipefail
          # The compiled cache is sound only for the EXACT accepted source chain.
          # Fetch the owner-verified Gate #159 commit even with shallow checkout.
          git fetch --quiet --no-tags --depth=1 origin 31849ff72d569d38a18988e62e371c6b6f3e256c
          # G4-K8E4 is the only newly authorized, uncompiled leaf. Changes to
          # any accepted precursor are a hard error, even for a cold rebuild.
          changed="$(git diff --name-only 31849ff72d569d38a18988e62e371c6b6f3e256c HEAD -- experiments/openai-math-su2-concrete-potential/ | grep -v -x 'experiments/openai-math-su2-concrete-potential/SU2BFSSG4K8E4L2BridgeProbe.lean' || true)"
          if [ -n "$changed" ]; then
            printf 'Accepted baseline source has drifted; explicitly requalify before changing the compiled cache:\n%s\n' "$changed" >&2
            exit 1
          fi

      - name: Prepare pinned Lean and restore Mathlib dependency cache
        shell: bash
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          test "$(cat upstream-math/lean/lean-toolchain)" = "leanprover/lean4:v4.34.1"
          cp experiments/openai-math-su2-concrete-potential/SU2ColorCrossProbe.lean upstream-math/lean/SU2ColorCrossProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2RealGammaProbe.lean upstream-math/lean/SU2RealGammaProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionFockProbe.lean upstream-math/lean/SU2FermionFockProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF2Probe.lean upstream-math/lean/SU2FermionF2Probe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF2BProbe.lean upstream-math/lean/SU2FermionF2BProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF2B2Probe.lean upstream-math/lean/SU2FermionF2B2Probe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF2B2ImagProbe.lean upstream-math/lean/SU2FermionF2B2ImagProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF2B2MixedProbe.lean upstream-math/lean/SU2FermionF2B2MixedProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF2B2MixedDiagProbe.lean upstream-math/lean/SU2FermionF2B2MixedDiagProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF2B2MixedAllProbe.lean upstream-math/lean/SU2FermionF2B2MixedAllProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF2B2IndexedProbe.lean upstream-math/lean/SU2FermionF2B2IndexedProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF2B2ThetaProbe.lean upstream-math/lean/SU2FermionF2B2ThetaProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3InvariantProbe.lean upstream-math/lean/SU2FermionF3InvariantProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3RecoveryProbe.lean upstream-math/lean/SU2FermionF3RecoveryProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3B1OccupationProbe.lean upstream-math/lean/SU2FermionF3B1OccupationProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3B2BasisActionProbe.lean upstream-math/lean/SU2FermionF3B2BasisActionProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3B3ProjectorProbe.lean upstream-math/lean/SU2FermionF3B3ProjectorProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3B4SelectorProbe.lean upstream-math/lean/SU2FermionF3B4SelectorProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3B5CoordinateProbe.lean upstream-math/lean/SU2FermionF3B5CoordinateProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3B6NonzeroKetProbe.lean upstream-math/lean/SU2FermionF3B6NonzeroKetProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3B7SignedModeProbe.lean upstream-math/lean/SU2FermionF3B7SignedModeProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3B8LocalReachabilityProbe.lean upstream-math/lean/SU2FermionF3B8LocalReachabilityProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3B9FiniteReachabilityProbe.lean upstream-math/lean/SU2FermionF3B9FiniteReachabilityProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3C1SubmoduleDichotomyProbe.lean upstream-math/lean/SU2FermionF3C1SubmoduleDichotomyProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3C2ThetaFieldsProbe.lean upstream-math/lean/SU2FermionF3C2ThetaFieldsProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSFullAlgebraDataProbe.lean upstream-math/lean/SU2BFSSFullAlgebraDataProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSConcretePotentialProbe.lean upstream-math/lean/SU2BFSSConcretePotentialProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSPotentialAverageFlatProbe.lean upstream-math/lean/SU2BFSSPotentialAverageFlatProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSSingleColorMultiplierZeroProbe.lean upstream-math/lean/SU2BFSSSingleColorMultiplierZeroProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG1APairedThetaProbe.lean upstream-math/lean/SU2BFSSG1APairedThetaProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG1BColorAnnihilatorProbe.lean upstream-math/lean/SU2BFSSG1BColorAnnihilatorProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG2ABosonGaugeProbe.lean upstream-math/lean/SU2BFSSG2ABosonGaugeProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG2BBosonGaugeContinuityProbe.lean upstream-math/lean/SU2BFSSG2BBosonGaugeContinuityProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG3AAdjointColorRepresentationProbe.lean upstream-math/lean/SU2BFSSG3AAdjointColorRepresentationProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG3B24ModeOrthogonalLiftProbe.lean upstream-math/lean/SU2BFSSG3B24ModeOrthogonalLiftProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG3CComplexOneParticleUnitaryProbe.lean upstream-math/lean/SU2BFSSG3CComplexOneParticleUnitaryProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4AExteriorGaugeActionProbe.lean upstream-math/lean/SU2BFSSG4AExteriorGaugeActionProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4BFermionLinearTransportProbe.lean upstream-math/lean/SU2BFSSG4BFermionLinearTransportProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4CFermionOperatorCovarianceProbe.lean upstream-math/lean/SU2BFSSG4CFermionOperatorCovarianceProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4DExteriorOccupationIsometryProbe.lean upstream-math/lean/SU2BFSSG4DExteriorOccupationIsometryProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4EFermionHilbertUnitaryProbe.lean upstream-math/lean/SU2BFSSG4EFermionHilbertUnitaryProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4FRealColorAnnihilatorForwardProbe.lean upstream-math/lean/SU2BFSSG4FRealColorAnnihilatorForwardProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4GMajoranaModeCovarianceProbe.lean upstream-math/lean/SU2BFSSG4GMajoranaModeCovarianceProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4HExactThetaCovarianceProbe.lean upstream-math/lean/SU2BFSSG4HExactThetaCovarianceProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4IAOneParticleContinuityProbe.lean upstream-math/lean/SU2BFSSG4IAOneParticleContinuityProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4IB1ExteriorFockSeedContinuityProbe.lean upstream-math/lean/SU2BFSSG4IB1ExteriorFockSeedContinuityProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4IB2ExteriorFockTwoWedgeContinuityProbe.lean upstream-math/lean/SU2BFSSG4IB2ExteriorFockTwoWedgeContinuityProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4IB3ExteriorFockAllContinuityProbe.lean upstream-math/lean/SU2BFSSG4IB3ExteriorFockAllContinuityProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4IC1FermionParameterContinuityProbe.lean upstream-math/lean/SU2BFSSG4IC1FermionParameterContinuityProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4IC2FermionJointContinuityProbe.lean upstream-math/lean/SU2BFSSG4IC2FermionJointContinuityProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean upstream-math/lean/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4K1PhysicalSpaceCoreProbe.lean upstream-math/lean/SU2BFSSG4K1PhysicalSpaceCoreProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4K2ANonzeroVacuumRadialProfileProbe.lean upstream-math/lean/SU2BFSSG4K2ANonzeroVacuumRadialProfileProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4K2BNonzeroPhysicalL2Probe.lean upstream-math/lean/SU2BFSSG4K2BNonzeroPhysicalL2Probe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4K3NonzeroSmoothInvariantCoreProbe.lean upstream-math/lean/SU2BFSSG4K3NonzeroSmoothInvariantCoreProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4K4ClosedChargeGraphProbe.lean upstream-math/lean/SU2BFSSG4K4ClosedChargeGraphProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4K5ConcreteEnergyDensityProbe.lean upstream-math/lean/SU2BFSSG4K5ConcreteEnergyDensityProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4K6PhysicalTrialEnergyLowerProbe.lean upstream-math/lean/SU2BFSSG4K6PhysicalTrialEnergyLowerProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4K7EnergySumOfSquaresCorrectionProbe.lean upstream-math/lean/SU2BFSSG4K7EnergySumOfSquaresCorrectionProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4K8ANonzeroDerivativeProbe.lean upstream-math/lean/SU2BFSSG4K8ANonzeroDerivativeProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4K8BNonzeroCoordinateL2Probe.lean upstream-math/lean/SU2BFSSG4K8BNonzeroCoordinateL2Probe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4K8CZeroParameterChargeProbe.lean upstream-math/lean/SU2BFSSG4K8CZeroParameterChargeProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4K8DPositiveCouplingAlternativeProbe.lean upstream-math/lean/SU2BFSSG4K8DPositiveCouplingAlternativeProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4K8E1MasslessPotentialParityProbe.lean upstream-math/lean/SU2BFSSG4K8E1MasslessPotentialParityProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4K8E2KineticOddParityProbe.lean upstream-math/lean/SU2BFSSG4K8E2KineticOddParityProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4K8E3CoreNoncancellationProbe.lean upstream-math/lean/SU2BFSSG4K8E3CoreNoncancellationProbe.lean
          cd upstream-math/lean
          lake exe cache get

      - name: Restore immutable compiled G4-K8E3 source proof chain
        id: proof_cache
        if: ${{ inputs.clean_build != true }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: upstream-math/lean/.lake/build
          key: bfss-su2-accepted-g4k8e3-v1-31849ff72d569d38a18988e62e371c6b6f3e256c-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream-math/lean/lean-toolchain', 'upstream-math/lean/lake-manifest.json') }}

      - name: Compile exact accepted source proof chain
        if: ${{ steps.proof_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          # Starting at Gate 10, this file imports the upstream local BFSS Core.
          # `lake exe cache get` restores dependencies but does NOT compile OAI modules.
          # Build both pinned OAI modules explicitly. The native Pauli expansion
          # module supplies the complex spanning lemma; BFSS supplies the potential.
          lake build OAI.MathematicalPhysics.BFSS.PotentialBasis OAI.Analysis.CharacterCriterion.Pauli
          lake env lean -o .lake/build/lib/lean/SU2ColorCrossProbe.olean SU2ColorCrossProbe.lean
          # Additional independently checkable gamma9 witness, same pinned BFSS Core API.
          lake env lean -o .lake/build/lib/lean/SU2RealGammaProbe.olean SU2RealGammaProbe.lean
          # Stage F1: 24-mode Fock transport and one Majorana CAR on the exact BFSS Hilbert type.
          # Build the pinned operator/adjoint dependencies before compiling the candidate.
          lake build OAI.MathematicalPhysics.ContinuumCoulomb.ManyBody.FockNorm
          # Emit the accepted F1 module as an importable olean for F2; keep its axiom checks.
          lake env lean -o .lake/build/lib/lean/SU2FermionFockProbe.olean SU2FermionFockProbe.lean
          # F2-A is bounded to full mode CAR, second self-adjoint Majorana and theta indexing.
          # Preserve the accepted F2-A check and emit an importable module for F2-B1.
          lake env lean -o .lake/build/lib/lean/SU2FermionF2Probe.olean SU2FermionF2Probe.lean
          # Preserve kernel-accepted F2-B1 and make it importable into the F2-B2a probe.
          lake env lean -o .lake/build/lib/lean/SU2FermionF2BProbe.olean SU2FermionF2BProbe.lean
          # Preserve accepted F2-B2a and import its olean into F2-B2b.
          lake env lean -o .lake/build/lib/lean/SU2FermionF2B2Probe.olean SU2FermionF2B2Probe.lean
          # Preserve kernel-accepted F2-B2b as an importable olean for F2-B2c1.
          lake env lean -o .lake/build/lib/lean/SU2FermionF2B2ImagProbe.olean SU2FermionF2B2ImagProbe.lean
          # Preserve kernel-accepted F2-B2c1 and emit its olean for F2-B2c2.
          lake env lean -o .lake/build/lib/lean/SU2FermionF2B2MixedProbe.olean SU2FermionF2B2MixedProbe.lean
          # Preserve accepted F2-B2c2 and emit its olean for the all-pair mixed CAR proof.
          lake env lean -o .lake/build/lib/lean/SU2FermionF2B2MixedDiagProbe.olean SU2FermionF2B2MixedDiagProbe.lean
          # Preserve accepted mixed-all F2-B2c3 as an importable module for the 48-generator theorem.
          lake env lean -o .lake/build/lib/lean/SU2FermionF2B2MixedAllProbe.olean SU2FermionF2B2MixedAllProbe.lean
          # Preserve accepted F2-B2d1 as an importable olean for the exact BFSS theta_CAR transport.
          lake env lean -o .lake/build/lib/lean/SU2FermionF2B2IndexedProbe.olean SU2FermionF2B2IndexedProbe.lean
          # Preserve accepted F2-B2d2 theta_CAR as an importable module for the F3 irreducibility program.
          lake env lean -o .lake/build/lib/lean/SU2FermionF2B2ThetaProbe.olean SU2FermionF2B2ThetaProbe.lean
          # F3-A1: theorem-only invariant-submodule transport; irreducibility remains pending.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3InvariantProbe.olean SU2FermionF3InvariantProbe.lean
          # F3-A2: derive creator/annihilator invariance without assuming irreducibility.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3RecoveryProbe.olean SU2FermionF3RecoveryProbe.lean
          # F3-B1: mode-number/complement submodule stability; no projector-eigenvalue claim.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3B1OccupationProbe.olean SU2FermionF3B1OccupationProbe.lean
          # F3-B2: true number/complement action on exact transported occupation vectors.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3B2BasisActionProbe.olean SU2FermionF3B2BasisActionProbe.lean
          # F3-B3: idempotence and pairwise commutation of actual occupied-mode operators.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3B3ProjectorProbe.olean SU2FermionF3B3ProjectorProbe.lean
          # F3-B4: exact action of a 24-mode ordered selector on each canonical occupation ket.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3B4SelectorProbe.olean SU2FermionF3B4SelectorProbe.lean
          # F3-B5: full finite basis expansion and arbitrary-vector selector action.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3B5CoordinateProbe.olean SU2FermionF3B5CoordinateProbe.lean
          # F3-B6: selector stability and ket extraction from a nonzero invariant vector.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3B6NonzeroKetProbe.olean SU2FermionF3B6NonzeroKetProbe.lean
          # F3-B7: exact transported signed creation/annihilation mode action.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3B7SignedModeProbe.olean SU2FermionF3B7SignedModeProbe.lean
          # F3-B8: theta-invariant submodule local ket insert/erase reachability.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3B8LocalReachabilityProbe.olean SU2FermionF3B8LocalReachabilityProbe.lean
          # F3-B9: finite induction from any ket through vacuum to all kets.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3B9FiniteReachabilityProbe.olean SU2FermionF3B9FiniteReachabilityProbe.lean
          # F3-C1: concrete theta-invariant submodule top/bottom dichotomy.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3C1SubmoduleDichotomyProbe.olean SU2FermionF3C1SubmoduleDichotomyProbe.lean
          # F3-C2: match all pinned upstream AlgebraData 2 theta field types.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3C2ThetaFieldsProbe.olean SU2FermionF3C2ThetaFieldsProbe.lean
          # F4-G1: assemble all twelve fields of pinned BFSS AlgebraData 2.
          lake env lean -o .lake/build/lib/lean/SU2BFSSFullAlgebraDataProbe.olean SU2BFSSFullAlgebraDataProbe.lean
          # F5-G1: unconditional pinned SU2 color brackets and bosonic wedge potential.
          lake env lean -o .lake/build/lib/lean/SU2BFSSConcretePotentialProbe.olean SU2BFSSConcretePotentialProbe.lean
          # F5-G2: exact 1/16 Clifford average and single-color flat potential sector.
          lake env lean -o .lake/build/lib/lean/SU2BFSSPotentialAverageFlatProbe.olean SU2BFSSPotentialAverageFlatProbe.lean
          # F5-G3: each exact Clifford potential multiplier vanishes on the single-color sector.
          lake env lean SU2BFSSSingleColorMultiplierZeroProbe.lean
          # G1-A: explicitly paired spin/color theta labeling and second AlgebraData 2.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG1APairedThetaProbe.olean SU2BFSSG1APairedThetaProbe.lean
          # G1-B: exact paired spin/color annihilator normalization in the actual AlgebraData 2.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG1BColorAnnihilatorProbe.olean SU2BFSSG1BColorAnnihilatorProbe.lean
          # G2-A imports the pinned GaugeCore API, not yet present in the saved OAI .olean build.
          # Build its exact pinned dependency closure (including GaugeOrbits) before Lean checks.
          lake build OAI.MathematicalPhysics.BFSS.GaugeCore
          # G2-A: genuine paired bosonic GaugeGroup action and matrix adjoint identity.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG2ABosonGaugeProbe.olean SU2BFSSG2ABosonGaugeProbe.lean
          # G2-B: joint continuity of the actual special-unitary bosonic gauge representation.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG2BBosonGaugeContinuityProbe.olean SU2BFSSG2BBosonGaugeContinuityProbe.lean
          # G3-A source reuses exact pinned CovariantFields.colorConjugate_coefficient.
          lake build OAI.MathematicalPhysics.BFSS.CovariantFields
          # G4-K5 imports source-local BFSS.KineticMeasures, not provided by mathlib cache.
          # Build the pinned upstream module and its Lean import closure before G4-K5.
          lake build OAI.MathematicalPhysics.BFSS.KineticMeasures
          # G4-K6 imports pinned source-local ProfileEnergy; cache does not supply OAI modules.
          lake build OAI.MathematicalPhysics.BFSS.ProfileEnergy
          # G3-A: exact SU2 adjoint 3x3 matrix group and orthogonality laws.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG3AAdjointColorRepresentationProbe.olean SU2BFSSG3AAdjointColorRepresentationProbe.lean
          # G3-B: actual 24 Fock modes, eight independent real SU2 color blocks.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG3B24ModeOrthogonalLiftProbe.olean SU2BFSSG3B24ModeOrthogonalLiftProbe.lean
          # G3-C: exact ℝ→ℂ one-particle SU2 unitary hom, before Fock second quantization.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG3CComplexOneParticleUnitaryProbe.olean SU2BFSSG3CComplexOneParticleUnitaryProbe.lean
          # G4-A imports the pinned generic exterior-algebra covariance machinery.
          lake build OAI.Analysis.Laughlin.Exterior.SpinAction
          # G4-A: actual SU2 exterior algebra action on the 24 Fock orbitals.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4AExteriorGaugeActionProbe.olean SU2BFSSG4AExteriorGaugeActionProbe.lean
          # G4-B: actual 2^24-dimensional BFSS Fermion 2 complex-linear SU2 representation.
          # Unitarity, 48-theta covariance and joint continuity are NOT asserted.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4BFermionLinearTransportProbe.olean SU2BFSSG4BFermionLinearTransportProbe.lean
          # G4-C: transport actual creators/annihilators and prove full Fermion 2 covariance.
          # This does not yet assert Fock Hilbert norm preservation.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4CFermionOperatorCovarianceProbe.olean SU2BFSSG4CFermionOperatorCovarianceProbe.lean
          # G4-D: compile pinned occupation inner-product and vector-annihilation source.
          lake build OAI.Analysis.Laughlin.Exterior.SpinUnitary
          # G4-D: true BFSS SU2 exterior Fock occupation inner-product isometry.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4DExteriorOccupationIsometryProbe.olean SU2BFSSG4DExteriorOccupationIsometryProbe.lean
          # G4-E: exact BFSS Fermion 2 norm isometry and unitary SU2 homomorphism.
          # 48-theta covariance and joint continuity are still separate.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4EFermionHilbertUnitaryProbe.olean SU2BFSSG4EFermionHilbertUnitaryProbe.lean
          # G4-F: exact real SU2 color coefficients and forward annihilator covariance.
          # The 48 paired theta operator covariance is a separate later gate.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4FRealColorAnnihilatorForwardProbe.olean SU2BFSSG4FRealColorAnnihilatorForwardProbe.lean
          # G4-G: exact paired Majorana real and imaginary covariance across all 24 modes.
          # Full 48-label GaugeData.fermion_adjoint and continuity remain open.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4GMajoranaModeCovarianceProbe.olean SU2BFSSG4GMajoranaModeCovarianceProbe.lean
          # G4-H: exact 48-label paired theta covariance at the pinned GaugeData field type.
          # Fermionic continuity and complete GaugeData remain distinct later obligations.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4HExactThetaCovarianceProbe.olean SU2BFSSG4HExactThetaCovarianceProbe.lean
          # G4-I-A: derive continuity of the exact pinned SU2 color coefficients and 24-mode matrix.
          # This does not yet prove joint fermionic continuity or full GaugeData.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4IAOneParticleContinuityProbe.olean SU2BFSSG4IAOneParticleContinuityProbe.lean
          # G4-I-B1: genuine exterior action on vacuum and degree-one occupation states.
          # Multiparticle Fock and full fermion_continuous are separate later obligations.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4IB1ExteriorFockSeedContinuityProbe.olean SU2BFSSG4IB1ExteriorFockSeedContinuityProbe.lean
          # G4-I-B2: actual two-fermion exterior wedge continuity from finite-coordinate polynomials.
          # Full multiparticle, exact Fermion 2, and joint GaugeData continuity remain unproved.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4IB2ExteriorFockTwoWedgeContinuityProbe.olean SU2BFSSG4IB2ExteriorFockTwoWedgeContinuityProbe.lean
          # G4-I-B3: exact full exterior-Fock parameter continuity by finite product and wedge induction.
          # The joint Fermion 2 continuity and complete GaugeData remain separate obligations.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4IB3ExteriorFockAllContinuityProbe.olean SU2BFSSG4IB3ExteriorFockAllContinuityProbe.lean
          # G4-I-C1: exact Fermion 2 fixed-state parameter continuity via the pinned G4-B/F1 transport.
          # Joint continuity (G4-I-C2) and six-field GaugeData (G4-J) are separate obligations.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4IC1FermionParameterContinuityProbe.olean SU2BFSSG4IC1FermionParameterContinuityProbe.lean
          # G4-I-C2: literal joint Fermion 2 gauge continuity by isometry/triangle estimate.
          # Full six-field GaugeData is not assembled in this candidate.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4IC2FermionJointContinuityProbe.olean SU2BFSSG4IC2FermionJointContinuityProbe.lean
          # G4-J: literal pairedAlgebraData.GaugeData six-field structure assembly.
          # This does not establish any BFSS Hamiltonian spectrum or physical prediction.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4JExactGaugeDataAssemblyProbe.olean SU2BFSSG4JExactGaugeDataAssemblyProbe.lean
          # G4-K1: instantiate literal Gauss physical subspace closedness and smooth-core equivariance.
          # Nonzero physical states and spectral claims remain distinct open obligations.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4K1PhysicalSpaceCoreProbe.olean SU2BFSSG4K1PhysicalSpaceCoreProbe.lean
          # G4-K2A: exact nonzero singlet and pointwise Gauss-equivariant radial profile.
          # Genuine square-integrable nonzero physical state remains an open obligation.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4K2ANonzeroVacuumRadialProfileProbe.olean SU2BFSSG4K2ANonzeroVacuumRadialProfileProbe.lean
          # G4-K2B: a nonzero normalizable SU2-invariant state in the literal Gauss FullL2 space.
          # No Hamiltonian eigenstate, SUSY vacuum, spectral bound or physics prediction is asserted.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4K2BNonzeroPhysicalL2Probe.olean SU2BFSSG4K2BNonzeroPhysicalL2Probe.lean
          # G4-K3: exact nonzero smooth invariant Gauss core witness and coreToL2 identity.
          # No Hamiltonian eigenstate or BFSS spectral/physical conclusion.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4K3NonzeroSmoothInvariantCoreProbe.olean SU2BFSSG4K3NonzeroSmoothInvariantCoreProbe.lean
          # G4-K4: explicit nonzero physical L2 state in the genuine closed BFSS supercharge graph.
          # No supercharge gauge covariance, zero-energy state, spectral gap or bound state claim.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4K4ClosedChargeGraphProbe.olean SU2BFSSG4K4ClosedChargeGraphProbe.lean
          # G4-K5: exact gauge-invariant integrable energy densities of nonzero physical smooth state.
          # No positive spectral bound, SUSY ground-state or physical model verification claim.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4K5ConcreteEnergyDensityProbe.olean SU2BFSSG4K5ConcreteEnergyDensityProbe.lean
          # G4-K6: exact integrated physical energy and normalized uniform source lower bound.
          # No spectral gap, energy eigenvector or supersymmetric vacuum claim.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4K6PhysicalTrialEnergyLowerProbe.olean SU2BFSSG4K6PhysicalTrialEnergyLowerProbe.lean
          # G4-K7: correct lower-bound interpretation with global source sum-of-squares.
          # Strict positivity stays CONDITIONAL on a nonzero deformed charge; no spectral claims.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4K7EnergySumOfSquaresCorrectionProbe.olean SU2BFSSG4K7EnergySumOfSquaresCorrectionProbe.lean
          # G4-K8A: real Frechet derivative of the true nonzero physical radial state is nonzero somewhere.
          # Does NOT claim a supercharge, coordinate L2 derivative or trial energy is strictly positive.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4K8ANonzeroDerivativeProbe.olean SU2BFSSG4K8ANonzeroDerivativeProbe.lean
          # G4-K8B: nonzero exact coordinate derivative FullL2 image and strictly positive kinetic integral.
          # Does NOT claim a nonzero deformed supercharge, strict total energy or BFSS spectral result.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4K8BNonzeroCoordinateL2Probe.olean SU2BFSSG4K8BNonzeroCoordinateL2Probe.lean
          # G4-K8C: all 16 first-order charge components nonzero; zero-parameter h=m=0
          # deformed charge nonzero and strictly positive concrete trial energy.
          # Does NOT claim interacting BFSS h=1 or positive mass spectral gap.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4K8CZeroParameterChargeProbe.olean SU2BFSSG4K8CZeroParameterChargeProbe.lean
          # G4-K8D: source-bound exact comparison of h=1 and h=2 interacting m=0 supercharges.
          # Strictly positive interacting trial energy at one of h=1 or h=2, not a specific h=1 claim.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4K8DPositiveCouplingAlternativeProbe.olean SU2BFSSG4K8DPositiveCouplingAlternativeProbe.lean
          # G4-K8E1: true evenness of physical radial wavepacket and source massless potential.
          # Necessary parity input, not yet strict h=1 energy or spectral gap.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4K8E1MasslessPotentialParityProbe.olean SU2BFSSG4K8E1MasslessPotentialParityProbe.lean
          # G4-K8E2: pointwise oddness of the genuine first-order kinetic term
          # on the same physical radial trial; NOT yet h=1 strict energy.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4K8E2KineticOddParityProbe.olean SU2BFSSG4K8E2KineticOddParityProbe.lean
          # G4-K8E3: genuine interacting source charge nonzero as a SMOOTH CORE section
          # at m=0 for all h; L² nonvanishing and strict h=1 energy remain unproved.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG4K8E3CoreNoncancellationProbe.olean SU2BFSSG4K8E3CoreNoncancellationProbe.lean

