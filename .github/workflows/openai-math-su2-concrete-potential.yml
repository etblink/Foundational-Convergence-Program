name: BFSS SU2 Concrete Color Gate

on:
  push:
    branches:
      - research/openai-math-su2-concrete-potential
    paths:
      - experiments/openai-math-su2-concrete-potential/**
      - .github/workflows/openai-math-su2-concrete-potential.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  color-cross:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FCP research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check out pinned OpenAI Math
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: openai/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Restore pinned Lean environment
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake
            ~/.elan
          key: family270b-bridge-ubuntu-lean4341-openai-adc7f124-deformedcharge-v2

      - name: Compile concrete SU2 color identity
        shell: bash
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          test "$(cat upstream-math/lean/lean-toolchain)" = "leanprover/lean4:v4.34.1"
          cp experiments/openai-math-su2-concrete-potential/SU2ColorCrossProbe.lean upstream-math/lean/SU2ColorCrossProbe.lean
          cd upstream-math/lean
          lake exe cache get
          # Starting at Gate 10, this file imports the upstream local BFSS Core.
          # `lake exe cache get` restores dependencies but does NOT compile OAI.Core.
          lake build OAI.MathematicalPhysics.BFSS.Core
          lake env lean SU2ColorCrossProbe.lean
