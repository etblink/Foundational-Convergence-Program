name: BFSS SU2 Concrete Color Gate

on:
  push:
    branches:
      - research/openai-math-su2-concrete-potential
    paths:
      - experiments/openai-math-su2-concrete-potential/**
      - .github/workflows/openai-math-su2-concrete-potential.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  color-cross:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FCP research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check out pinned OpenAI Math
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: openai/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Restore pinned Lean environment
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake
            ~/.elan
          key: family270b-bridge-ubuntu-lean4341-openai-adc7f124-deformedcharge-v2

      - name: Compile concrete SU2 color identity
        shell: bash
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          test "$(cat upstream-math/lean/lean-toolchain)" = "leanprover/lean4:v4.34.1"
          cp experiments/openai-math-su2-concrete-potential/SU2ColorCrossProbe.lean upstream-math/lean/SU2ColorCrossProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2RealGammaProbe.lean upstream-math/lean/SU2RealGammaProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionFockProbe.lean upstream-math/lean/SU2FermionFockProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF2Probe.lean upstream-math/lean/SU2FermionF2Probe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF2BProbe.lean upstream-math/lean/SU2FermionF2BProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF2B2Probe.lean upstream-math/lean/SU2FermionF2B2Probe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF2B2ImagProbe.lean upstream-math/lean/SU2FermionF2B2ImagProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF2B2MixedProbe.lean upstream-math/lean/SU2FermionF2B2MixedProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF2B2MixedDiagProbe.lean upstream-math/lean/SU2FermionF2B2MixedDiagProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF2B2MixedAllProbe.lean upstream-math/lean/SU2FermionF2B2MixedAllProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF2B2IndexedProbe.lean upstream-math/lean/SU2FermionF2B2IndexedProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF2B2ThetaProbe.lean upstream-math/lean/SU2FermionF2B2ThetaProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3InvariantProbe.lean upstream-math/lean/SU2FermionF3InvariantProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3RecoveryProbe.lean upstream-math/lean/SU2FermionF3RecoveryProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3B1OccupationProbe.lean upstream-math/lean/SU2FermionF3B1OccupationProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3B2BasisActionProbe.lean upstream-math/lean/SU2FermionF3B2BasisActionProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3B3ProjectorProbe.lean upstream-math/lean/SU2FermionF3B3ProjectorProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3B4SelectorProbe.lean upstream-math/lean/SU2FermionF3B4SelectorProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3B5CoordinateProbe.lean upstream-math/lean/SU2FermionF3B5CoordinateProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3B6NonzeroKetProbe.lean upstream-math/lean/SU2FermionF3B6NonzeroKetProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3B7SignedModeProbe.lean upstream-math/lean/SU2FermionF3B7SignedModeProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3B8LocalReachabilityProbe.lean upstream-math/lean/SU2FermionF3B8LocalReachabilityProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3B9FiniteReachabilityProbe.lean upstream-math/lean/SU2FermionF3B9FiniteReachabilityProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3C1SubmoduleDichotomyProbe.lean upstream-math/lean/SU2FermionF3C1SubmoduleDichotomyProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2FermionF3C2ThetaFieldsProbe.lean upstream-math/lean/SU2FermionF3C2ThetaFieldsProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSFullAlgebraDataProbe.lean upstream-math/lean/SU2BFSSFullAlgebraDataProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSConcretePotentialProbe.lean upstream-math/lean/SU2BFSSConcretePotentialProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSPotentialAverageFlatProbe.lean upstream-math/lean/SU2BFSSPotentialAverageFlatProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSSingleColorMultiplierZeroProbe.lean upstream-math/lean/SU2BFSSSingleColorMultiplierZeroProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG1APairedThetaProbe.lean upstream-math/lean/SU2BFSSG1APairedThetaProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG1BColorAnnihilatorProbe.lean upstream-math/lean/SU2BFSSG1BColorAnnihilatorProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG2ABosonGaugeProbe.lean upstream-math/lean/SU2BFSSG2ABosonGaugeProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG2BBosonGaugeContinuityProbe.lean upstream-math/lean/SU2BFSSG2BBosonGaugeContinuityProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG3AAdjointColorRepresentationProbe.lean upstream-math/lean/SU2BFSSG3AAdjointColorRepresentationProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG3B24ModeOrthogonalLiftProbe.lean upstream-math/lean/SU2BFSSG3B24ModeOrthogonalLiftProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG3CComplexOneParticleUnitaryProbe.lean upstream-math/lean/SU2BFSSG3CComplexOneParticleUnitaryProbe.lean
          cp experiments/openai-math-su2-concrete-potential/SU2BFSSG4AExteriorGaugeActionProbe.lean upstream-math/lean/SU2BFSSG4AExteriorGaugeActionProbe.lean
          cd upstream-math/lean
          lake exe cache get
          # Starting at Gate 10, this file imports the upstream local BFSS Core.
          # `lake exe cache get` restores dependencies but does NOT compile OAI modules.
          # Build both pinned OAI modules explicitly. The native Pauli expansion
          # module supplies the complex spanning lemma; BFSS supplies the potential.
          lake build OAI.MathematicalPhysics.BFSS.PotentialBasis OAI.Analysis.CharacterCriterion.Pauli
          lake env lean -o .lake/build/lib/lean/SU2ColorCrossProbe.olean SU2ColorCrossProbe.lean
          # Additional independently checkable gamma9 witness, same pinned BFSS Core API.
          lake env lean -o .lake/build/lib/lean/SU2RealGammaProbe.olean SU2RealGammaProbe.lean
          # Stage F1: 24-mode Fock transport and one Majorana CAR on the exact BFSS Hilbert type.
          # Build the pinned operator/adjoint dependencies before compiling the candidate.
          lake build OAI.MathematicalPhysics.ContinuumCoulomb.ManyBody.FockNorm
          # Emit the accepted F1 module as an importable olean for F2; keep its axiom checks.
          lake env lean -o .lake/build/lib/lean/SU2FermionFockProbe.olean SU2FermionFockProbe.lean
          # F2-A is bounded to full mode CAR, second self-adjoint Majorana and theta indexing.
          # Preserve the accepted F2-A check and emit an importable module for F2-B1.
          lake env lean -o .lake/build/lib/lean/SU2FermionF2Probe.olean SU2FermionF2Probe.lean
          # Preserve kernel-accepted F2-B1 and make it importable into the F2-B2a probe.
          lake env lean -o .lake/build/lib/lean/SU2FermionF2BProbe.olean SU2FermionF2BProbe.lean
          # Preserve accepted F2-B2a and import its olean into F2-B2b.
          lake env lean -o .lake/build/lib/lean/SU2FermionF2B2Probe.olean SU2FermionF2B2Probe.lean
          # Preserve kernel-accepted F2-B2b as an importable olean for F2-B2c1.
          lake env lean -o .lake/build/lib/lean/SU2FermionF2B2ImagProbe.olean SU2FermionF2B2ImagProbe.lean
          # Preserve kernel-accepted F2-B2c1 and emit its olean for F2-B2c2.
          lake env lean -o .lake/build/lib/lean/SU2FermionF2B2MixedProbe.olean SU2FermionF2B2MixedProbe.lean
          # Preserve accepted F2-B2c2 and emit its olean for the all-pair mixed CAR proof.
          lake env lean -o .lake/build/lib/lean/SU2FermionF2B2MixedDiagProbe.olean SU2FermionF2B2MixedDiagProbe.lean
          # Preserve accepted mixed-all F2-B2c3 as an importable module for the 48-generator theorem.
          lake env lean -o .lake/build/lib/lean/SU2FermionF2B2MixedAllProbe.olean SU2FermionF2B2MixedAllProbe.lean
          # Preserve accepted F2-B2d1 as an importable olean for the exact BFSS theta_CAR transport.
          lake env lean -o .lake/build/lib/lean/SU2FermionF2B2IndexedProbe.olean SU2FermionF2B2IndexedProbe.lean
          # Preserve accepted F2-B2d2 theta_CAR as an importable module for the F3 irreducibility program.
          lake env lean -o .lake/build/lib/lean/SU2FermionF2B2ThetaProbe.olean SU2FermionF2B2ThetaProbe.lean
          # F3-A1: theorem-only invariant-submodule transport; irreducibility remains pending.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3InvariantProbe.olean SU2FermionF3InvariantProbe.lean
          # F3-A2: derive creator/annihilator invariance without assuming irreducibility.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3RecoveryProbe.olean SU2FermionF3RecoveryProbe.lean
          # F3-B1: mode-number/complement submodule stability; no projector-eigenvalue claim.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3B1OccupationProbe.olean SU2FermionF3B1OccupationProbe.lean
          # F3-B2: true number/complement action on exact transported occupation vectors.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3B2BasisActionProbe.olean SU2FermionF3B2BasisActionProbe.lean
          # F3-B3: idempotence and pairwise commutation of actual occupied-mode operators.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3B3ProjectorProbe.olean SU2FermionF3B3ProjectorProbe.lean
          # F3-B4: exact action of a 24-mode ordered selector on each canonical occupation ket.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3B4SelectorProbe.olean SU2FermionF3B4SelectorProbe.lean
          # F3-B5: full finite basis expansion and arbitrary-vector selector action.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3B5CoordinateProbe.olean SU2FermionF3B5CoordinateProbe.lean
          # F3-B6: selector stability and ket extraction from a nonzero invariant vector.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3B6NonzeroKetProbe.olean SU2FermionF3B6NonzeroKetProbe.lean
          # F3-B7: exact transported signed creation/annihilation mode action.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3B7SignedModeProbe.olean SU2FermionF3B7SignedModeProbe.lean
          # F3-B8: theta-invariant submodule local ket insert/erase reachability.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3B8LocalReachabilityProbe.olean SU2FermionF3B8LocalReachabilityProbe.lean
          # F3-B9: finite induction from any ket through vacuum to all kets.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3B9FiniteReachabilityProbe.olean SU2FermionF3B9FiniteReachabilityProbe.lean
          # F3-C1: concrete theta-invariant submodule top/bottom dichotomy.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3C1SubmoduleDichotomyProbe.olean SU2FermionF3C1SubmoduleDichotomyProbe.lean
          # F3-C2: match all pinned upstream AlgebraData 2 theta field types.
          lake env lean -o .lake/build/lib/lean/SU2FermionF3C2ThetaFieldsProbe.olean SU2FermionF3C2ThetaFieldsProbe.lean
          # F4-G1: assemble all twelve fields of pinned BFSS AlgebraData 2.
          lake env lean -o .lake/build/lib/lean/SU2BFSSFullAlgebraDataProbe.olean SU2BFSSFullAlgebraDataProbe.lean
          # F5-G1: unconditional pinned SU2 color brackets and bosonic wedge potential.
          lake env lean -o .lake/build/lib/lean/SU2BFSSConcretePotentialProbe.olean SU2BFSSConcretePotentialProbe.lean
          # F5-G2: exact 1/16 Clifford average and single-color flat potential sector.
          lake env lean -o .lake/build/lib/lean/SU2BFSSPotentialAverageFlatProbe.olean SU2BFSSPotentialAverageFlatProbe.lean
          # F5-G3: each exact Clifford potential multiplier vanishes on the single-color sector.
          lake env lean SU2BFSSSingleColorMultiplierZeroProbe.lean
          # G1-A: explicitly paired spin/color theta labeling and second AlgebraData 2.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG1APairedThetaProbe.olean SU2BFSSG1APairedThetaProbe.lean
          # G1-B: exact paired spin/color annihilator normalization in the actual AlgebraData 2.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG1BColorAnnihilatorProbe.olean SU2BFSSG1BColorAnnihilatorProbe.lean
          # G2-A imports the pinned GaugeCore API, not yet present in the saved OAI .olean build.
          # Build its exact pinned dependency closure (including GaugeOrbits) before Lean checks.
          lake build OAI.MathematicalPhysics.BFSS.GaugeCore
          # G2-A: genuine paired bosonic GaugeGroup action and matrix adjoint identity.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG2ABosonGaugeProbe.olean SU2BFSSG2ABosonGaugeProbe.lean
          # G2-B: joint continuity of the actual special-unitary bosonic gauge representation.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG2BBosonGaugeContinuityProbe.olean SU2BFSSG2BBosonGaugeContinuityProbe.lean
          # G3-A source reuses exact pinned CovariantFields.colorConjugate_coefficient.
          lake build OAI.MathematicalPhysics.BFSS.CovariantFields
          # G3-A: exact SU2 adjoint 3x3 matrix group and orthogonality laws.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG3AAdjointColorRepresentationProbe.olean SU2BFSSG3AAdjointColorRepresentationProbe.lean
          # G3-B: actual 24 Fock modes, eight independent real SU2 color blocks.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG3B24ModeOrthogonalLiftProbe.olean SU2BFSSG3B24ModeOrthogonalLiftProbe.lean
          # G3-C: exact ℝ→ℂ one-particle SU2 unitary hom, before Fock second quantization.
          lake env lean -o .lake/build/lib/lean/SU2BFSSG3CComplexOneParticleUnitaryProbe.olean SU2BFSSG3CComplexOneParticleUnitaryProbe.lean
          # G4-A imports the pinned generic exterior-algebra covariance machinery.
          lake build OAI.Analysis.Laughlin.Exterior.SpinAction
          # G4-A: actual SU2 exterior algebra action on the 24 Fock orbitals.
          lake env lean SU2BFSSG4AExteriorGaugeActionProbe.lean
