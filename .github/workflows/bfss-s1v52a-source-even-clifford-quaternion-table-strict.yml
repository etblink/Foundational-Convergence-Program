name: BFSS S1V52A Source Clifford Quaternion Table Strict Gate

# Deliberately branch-isolated and single-shot. Only the workflow file
# triggers a push gate; source and audit commits do NOT automatically run.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s1v52a-source-even-clifford-quaternion-table-strict.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v52a-quaternion-table-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-source-clifford-table:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout original FCP research sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout immutable original upstream BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Strict original source SHA and toolchain preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v52a
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          data=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in data['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          r=experiments/openai-math-su2-physical-domain
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.lean")" = 22f3101b243a7b7857d9597b547322174d9281c8
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V5ConcreteSixteenSourceColorBlocksProbe.lean")" = 6d15a3a76625b3677f132c544f71e5d5eb1dc93c
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V6ConcreteSource48ColorAxisOrthogonalityProbe.lean")" = 4ae8b38d5601b8c57f09e94c523beb9b4598dcb1
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V52ASourceEvenCliffordQuaternionTableProbe.lean")" = ad67d8eac5a8147f7ae099c3d9b913db2038f53a
          echo S1V52A_ORIGINAL_GEOMETRY_TOOLCHAIN_AND_SOURCE_SHA_PASS

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore immutable original Lean and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v52a/toolchain.log; then
              ok=true; break
            fi
            echo S1V52A_PINNED_LEAN_RETRY_$attempt | tee -a /tmp/bfss-s1v52a/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo PINNED_ORIGINAL_LEAN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v52a/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo S1V52A_PINNED_LEAN_MATHLIB_VERIFIED

      - name: Build exact isolated source geometry directly from pinned Mathlib
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          mkdir -p .lake/build/lib/lean
          for stem in \
            SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe \
            SU2BFSSPhysicalDomainS1V5ConcreteSixteenSourceColorBlocksProbe \
            SU2BFSSPhysicalDomainS1V6ConcreteSource48ColorAxisOrthogonalityProbe; do
            cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
            timeout 240s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v52a/$stem.log"
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "S1V52A_SOURCE_GEOMETRY_OLEAN_MISSING=$stem"; exit 1; }
          done
          echo S1V52A_EXACT_SOURCE_GEOMETRY_FRESH_REBUILD_PASS

      - name: Compile and strictly audit eleven real Clifford quaternion roots
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          mkdir -p .lake/build/lib/lean
          stem=SU2BFSSPhysicalDomainS1V52ASourceEvenCliffordQuaternionTableProbe
          cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
          timeout 600s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v52a/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean" || { echo S1V52A_SOURCE_CLIFFORD_OLEAN_MISSING; exit 1; }
          python3 - <<'PY'
          import pathlib,re
          stem='SU2BFSSPhysicalDomainS1V52ASourceEvenCliffordQuaternionTableProbe'
          src=pathlib.Path(stem+'.lean').read_text()
          log=pathlib.Path('/tmp/bfss-s1v52a',stem+'.log').read_text()
          names=re.findall(r'^#print axioms (\S+)',src,re.M)
          expected=['sourceAxis_square','sourceAxis_anticomm',
                    'sourceZBivector_square','sourceYBivector_square',
                    'sourceXBivector_square','sourceZ_mul_Y',
                    'sourceY_mul_X','sourceX_mul_Z','sourceY_mul_Z',
                    'sourceX_mul_Y','sourceZ_mul_X']
          assert names==expected,names
          assert re.findall(r'^namespace (\S+)',src,re.M)==['FCP.BFSSS1V52A']
          reports=re.findall(r"'(FCP\.BFSSS1V52A\.[^\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          found={k:{x.strip() for x in v.split(',') if x.strip()} for k,v in reports}
          assert len(reports)==len(found)==11,reports
          allowed={'propext','Classical.choice','Quot.sound'}
          for name in expected:
            key='FCP.BFSSS1V52A.'+name
            assert key in found and found[key]<=allowed,(key,found)
          assert 'sorryAx' not in log and 'error:' not in log and 'unknownIdentifier' not in log,log[-9000:]
          print('S1V52A_ORIGINAL_SOURCE_CLIFFORD_QUATERNION_TABLE_11_ROOTS_KERNEL_PASS')
          PY

      - name: Save qualified cache only after strict eleven-root green
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v52a-isolated-source48-even-quaternion-table-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve diagnostic logs for failure analysis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v52a-even-clifford-table-${{ github.run_id }}
          path: /tmp/bfss-s1v52a/
          if-no-files-found: warn
