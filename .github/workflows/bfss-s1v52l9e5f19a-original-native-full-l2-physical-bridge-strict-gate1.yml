name: BFSS S1V52L9E5F19A Original Native Fock FullL2 Physical Bridge Strict Gate 1

# Isolated research branch; only first creation of this workflow triggers this gate.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s1v52l9e5f19a-original-native-full-l2-physical-bridge-strict-gate1.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v52l9e5f19a-original-native-full-l2-physical-bridge-gate1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-native-fock-full-l2:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - name: Checkout original FCP research sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout immutable original upstream BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Strict exact original F19A and qualified parent source preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v52l9e5f19a
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          data=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in data['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52L9E5F19AOriginalNativeFockFullL2GaugePhysicalBridgeProbe.lean)" = 5218ba3e5f831d0c991bbb0d4c1d296e7882fab8 || { echo F19A_EXACT_SOURCE_PIN_FAIL=SU2BFSSPhysicalDomainS1V52L9E5F19AOriginalNativeFockFullL2GaugePhysicalBridgeProbe; exit 1; }
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52L9E5F18COriginalNativeFockSourceGaugeIdentificationProbe.lean)" = 159dcb0a2d1ef45e3894f33eae851166faba0fb3 || { echo F19A_EXACT_SOURCE_PIN_FAIL=SU2BFSSPhysicalDomainS1V52L9E5F18COriginalNativeFockSourceGaugeIdentificationProbe; exit 1; }
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52L9E5F15OriginalNativeSpin48FockLinearEquivGaugeHomProbe.lean)" = 394ead3a1d61402127daeb506ac86586dd3aca15 || { echo F19A_EXACT_SOURCE_PIN_FAIL=SU2BFSSPhysicalDomainS1V52L9E5F15OriginalNativeSpin48FockLinearEquivGaugeHomProbe; exit 1; }
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2BFSSG4BFermionLinearTransportProbe.lean)" = c6270243d0f61e8ee415e378c0865d2954958472 || { echo F19A_EXACT_SOURCE_PIN_FAIL=SU2BFSSG4BFermionLinearTransportProbe; exit 1; }
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2BFSSG4EFermionHilbertUnitaryProbe.lean)" = d29e7acf325db8e9e383b26b8ee6b536c9078676 || { echo F19A_EXACT_SOURCE_PIN_FAIL=SU2BFSSG4EFermionHilbertUnitaryProbe; exit 1; }
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean)" = dd82ff793918e448a2d91781edb84d273a664cd4 || { echo F19A_EXACT_SOURCE_PIN_FAIL=SU2BFSSG4JExactGaugeDataAssemblyProbe; exit 1; }
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G7UActualSourceFullL2GaugeContractionProbe.lean)" = e00cab4fefc992e63acf674a966c5493ed11e21a || { echo F19A_EXACT_SOURCE_PIN_FAIL=SU2BFSSPhysicalDomainL6G7UActualSourceFullL2GaugeContractionProbe; exit 1; }
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G7VActualSourceFullL2PhysicalFixedSpaceProbe.lean)" = 3ff0d30993ec4afc9405f71c6d4ab27f338b25b6 || { echo F19A_EXACT_SOURCE_PIN_FAIL=SU2BFSSPhysicalDomainL6G7VActualSourceFullL2PhysicalFixedSpaceProbe; exit 1; }
          target=experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52L9E5F19AOriginalNativeFockFullL2GaugePhysicalBridgeProbe.lean
          expected=5218ba3e5f831d0c991bbb0d4c1d296e7882fab8
          committed="$(git rev-parse "HEAD:$target")"
          filtered="$(git hash-object --path="$target" "$target")"
          raw="$(git hash-object --no-filters "$target")"
          echo "F19A_SOURCE_SHA_DIAGNOSTIC expected=$expected committed=$committed filtered=$filtered raw=$raw"
          test "$expected" = "$committed" && test "$expected" = "$filtered" && test "$expected" = "$raw"
          echo F19A_PINNED_SOURCES_AND_ORIGINAL_TOOLCHAIN_PASS

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore immutable original Lean and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v52l9e5f19a/toolchain.log; then
              ok=true; break
            fi
            echo F19A_PINNED_LEAN_RETRY_$attempt | tee -a /tmp/bfss-s1v52l9e5f19a/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo F19A_PINNED_LEAN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v52l9e5f19a/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo F19A_PINNED_LEAN_MATHLIB_PASS

      - name: Restore accepted F18C original gauge-hom, historical S1H and physical-source cache
        id: cacheF18C
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v52l9e5f18c-original-source-gauge-identification-v4-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed on source cache absence or actual imported modules
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.cacheF18C.outputs.cache-hit }}" = true || { echo F19A_EXACT_QUALIFIED_F18C_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Core.olean || { echo F19A_ORIGINAL_BFSS_CORE_MISSING; exit 1; }
          for stem in SU2BFSSPhysicalDomainS1V52L9E5F18COriginalNativeFockSourceGaugeIdentificationProbe SU2BFSSPhysicalDomainS1V52L9E5F15OriginalNativeSpin48FockLinearEquivGaugeHomProbe SU2BFSSG4BFermionLinearTransportProbe SU2BFSSG4EFermionHilbertUnitaryProbe SU2BFSSG4JExactGaugeDataAssemblyProbe SU2BFSSPhysicalDomainL6G7UActualSourceFullL2GaugeContractionProbe SU2BFSSPhysicalDomainL6G7VActualSourceFullL2PhysicalFixedSpaceProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "F19A_REQUIRED_REAL_SOURCE_OLEAN_MISSING=$stem"; exit 1; }
          done
          echo F19A_F18C_AND_ORIGINAL_PHYSICAL_SOURCE_OLEANS_READY

      - name: Compile real native Fock FullL2 bridge and validate three theorem roots
        shell: bash
        timeout-minutes: 14
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          mkdir -p .lake/build/lib/lean
          stem=SU2BFSSPhysicalDomainS1V52L9E5F19AOriginalNativeFockFullL2GaugePhysicalBridgeProbe
          cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
          timeout 780s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v52l9e5f19a/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean" || { echo F19A_FRESH_SOURCE_OLEAN_MISSING; exit 1; }
          python3 - <<'PY'
          import pathlib,re
          stem="SU2BFSSPhysicalDomainS1V52L9E5F19AOriginalNativeFockFullL2GaugePhysicalBridgeProbe"
          ns="FCP.BFSSS1V52L9E5F19A"
          roots=[
            "originalNativeSixteenSpinFockOp_eq_sourceGauge",
            "originalNativeSpin48FullL2GaugePair_eq_sourceGauge",
            "originalNativeSpin48FullL2GaugePair_fixed_iff_physical"]
          defs=["originalNativeSpin48FullL2GaugePairCLM"]
          required=roots[:1]+defs+roots[1:]
          source=pathlib.Path(stem+'.lean').read_text()
          log=pathlib.Path('/tmp/bfss-s1v52l9e5f19a',stem+'.log').read_text()
          assert re.findall(r'^namespace (\S+)',source,re.M)==[ns]
          assert re.findall(r'^theorem (\S+)',source,re.M)==roots
          assert re.findall(r'^noncomputable def (\S+)',source,re.M)==defs
          assert re.findall(r'^#print axioms (\S+)',source,re.M)==required
          rr=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          reports={k:{v.strip() for v in ax.split(',') if v.strip()} for k,ax in rr}
          assert len(rr)==len(reports)==len(required),rr
          allowed={'propext','Classical.choice','Quot.sound'}
          for k in required:
            full=ns+'.'+k
            assert full in reports and reports[full]<=allowed,(full,reports)
          assert 'sorryAx' not in log and 'error:' not in log and 'unknownIdentifier' not in log,log[-9000:]
          print('F19A_ORIGINAL_NATIVE_FOCK_FULLL2_PHYSICAL_BRIDGE_THREE_ROOTS_STRICT_AXIOMS_PASS')
          PY

      - name: Save qualified original native Spin48 FullL2 bridge cache
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v52l9e5f19a-original-full-l2-physical-bridge-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve strict original native Fock FullL2 diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v52l9e5f19a-native-full-l2-${{ github.run_id }}
          path: /tmp/bfss-s1v52l9e5f19a
          if-no-files-found: ignore
