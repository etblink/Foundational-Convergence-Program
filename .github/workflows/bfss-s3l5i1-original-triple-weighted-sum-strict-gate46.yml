  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s3l5i1-original-triple-weighted-sum-strict-gate46.yml
permissions:
  contents: read
concurrency:
  group: bfss-s3l5i1-gate46-${{ github.ref }}
  cancel-in-progress: false
