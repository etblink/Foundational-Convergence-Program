name: BFSS S1V52L9E5F20B Original Source Clifford PBW Finite Dimensional Strict Gate 1

# Strict single source / workflow-path trigger; source and audits do not launch CI.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s1v52l9e5f20b-original-source-clifford-pbw-finite-dimensional-strict-gate1.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v52l9e5f20b-original-source-clifford-pbw-gate1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-clifford-pbw:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - name: Checkout original FCP research sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout immutable original upstream BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Strict source PBW source SHA and immutable toolchain preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v52l9e5f20b
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          manifest=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in manifest['packages'] if p['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52L9E5F20BOriginalSource48CliffordPBWBasisFiniteDimensionalProbe.lean)" = 3fb776dd563564f95346e376f2d312934a29bfa6 || { echo F20B_PINNED_ORIGINAL_SOURCE_MISMATCH=SU2BFSSPhysicalDomainS1V52L9E5F20BOriginalSource48CliffordPBWBasisFiniteDimensionalProbe; exit 1; }
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52L9E5F20AOriginalNativeQuaternionCoordinateContinuityProbe.lean)" = f76b71b1b47227bd75727b997064e381f016e913 || { echo F20B_PINNED_ORIGINAL_SOURCE_MISMATCH=SU2BFSSPhysicalDomainS1V52L9E5F20AOriginalNativeQuaternionCoordinateContinuityProbe; exit 1; }
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.lean)" = 22f3101b243a7b7857d9597b547322174d9281c8 || { echo F20B_PINNED_ORIGINAL_SOURCE_MISMATCH=SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe; exit 1; }
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52L7C7OriginalNativeEulerWitnessAndSpinHomProbe.lean)" = 581dd3f565f4b32260470f51bf240deac057c1a8 || { echo F20B_PINNED_ORIGINAL_SOURCE_MISMATCH=SU2BFSSPhysicalDomainS1V52L7C7OriginalNativeEulerWitnessAndSpinHomProbe; exit 1; }
          target=experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52L9E5F20BOriginalSource48CliffordPBWBasisFiniteDimensionalProbe.lean
          expected=3fb776dd563564f95346e376f2d312934a29bfa6
          committed="$(git rev-parse "HEAD:$target")"
          filtered="$(git hash-object --path="$target" "$target")"
          raw="$(git hash-object --no-filters "$target")"
          echo "F20B_EXACT_SOURCE_SHA expected=$expected committed=$committed filtered=$filtered raw=$raw"
          test "$expected" = "$committed" && test "$expected" = "$filtered" && test "$expected" = "$raw"
          echo F20B_EXACT_ORIGINAL_SOURCE_PINS_PASS

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore pinned Lean 4.34.1 and Mathlib source/cache
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v52l9e5f20b/toolchain.log; then
              ok=true; break
            fi
            echo F20B_LEAN_RETRY_$attempt | tee -a /tmp/bfss-s1v52l9e5f20b/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo F20B_PINNED_LEAN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v52l9e5f20b/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo F20B_EXACT_ORIGINAL_LEAN_MATHLIB_READY

      - name: Restore accepted F20A original quaternion coordinate continuity cache
        id: cacheF20A
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v52l9e5f20a-native-quaternion-coordinate-continuity-v2-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed without qualified F20A original source dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.cacheF20A.outputs.cache-hit }}" = true || { echo F20B_QUALIFIED_F20A_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Core.olean || { echo F20B_PINNED_ORIGINAL_OAI_MISSING; exit 1; }
          for stem in SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe SU2BFSSPhysicalDomainS1V52L7C7OriginalNativeEulerWitnessAndSpinHomProbe SU2BFSSPhysicalDomainS1V52L9E5F20AOriginalNativeQuaternionCoordinateContinuityProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "F20B_REQUIRED_QUALIFIED_SOURCE_MISSING=$stem"; exit 1; }
          done
          echo F20B_QUALIFIED_ORIGINAL_PARENT_CACHE_READY

      - name: Compile actual source Clifford PBW real basis and finite dimensionality
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=SU2BFSSPhysicalDomainS1V52L9E5F20BOriginalSource48CliffordPBWBasisFiniteDimensionalProbe
          cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
          timeout 660s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v52l9e5f20b/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean" || { echo F20B_FRESH_SOURCE_OLEAN_MISSING; exit 1; }
          python3 - <<'PY'
          import pathlib,re
          stem="SU2BFSSPhysicalDomainS1V52L9E5F20BOriginalSource48CliffordPBWBasisFiniteDimensionalProbe"
          ns="FCP.BFSSS1V52L9E5F20B"
          src=pathlib.Path(stem+'.lean').read_text()
          log=pathlib.Path('/tmp/bfss-s1v52l9e5f20b',stem+'.log').read_text()
          names=["originalSourceCliffordPBWBasis","originalSourceClifford_finiteDimensional"]
          assert re.findall(r'^namespace (\S+)',src,re.M)==[ns]
          assert re.findall(r'^noncomputable def (\S+)',src,re.M)==[names[0]]
          assert re.findall(r'^theorem (\S+)',src,re.M)==[names[1]]
          assert re.findall(r'^#print axioms (\S+)',src,re.M)==names
          rr=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          reports={k:{v.strip() for v in ax.split(',') if v.strip()} for k,ax in rr}
          assert len(rr)==len(reports)==2,rr
          allowed={'propext','Classical.choice','Quot.sound'}
          for name in names:
            k=ns+'.'+name
            assert k in reports and reports[k]<=allowed,(k,reports)
          assert 'error:' not in log and 'sorryAx' not in log and 'unknownIdentifier' not in log,log[-8000:]
          print('F20B_ACTUAL_SOURCE_CLIFFORD_PBW_BASIS_FINITE_DIMENSIONAL_ONE_THEOREM_STRICT_PASS')
          PY

      - name: Save strictly qualified source Clifford PBW dimensionality cache
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v52l9e5f20b-source-clifford-pbw-finite-dim-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve F20B actual Clifford algebra diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v52l9e5f20b-pbw-${{ github.run_id }}
          path: /tmp/bfss-s1v52l9e5f20b
          if-no-files-found: ignore
