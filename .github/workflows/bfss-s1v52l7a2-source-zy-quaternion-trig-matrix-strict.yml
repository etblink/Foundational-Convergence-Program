name: BFSS S1V52L7A2 Source ZY Quaternion Trigonometric Matrix Strict Gate

# Deliberately branch-isolated and single-shot. Only the workflow file
# triggers a push gate; source and audit commits do NOT automatically run.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s1v52l7a2-source-zy-quaternion-trig-matrix-strict.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v52l7a2-finite-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-source-clifford-table:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout original FCP research sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout immutable original upstream BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Strict original source SHA and toolchain preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v52l7a2
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          data=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in data['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          r=experiments/openai-math-su2-physical-domain
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.lean")" = 22f3101b243a7b7857d9597b547322174d9281c8
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V5ConcreteSixteenSourceColorBlocksProbe.lean")" = 6d15a3a76625b3677f132c544f71e5d5eb1dc93c
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V6ConcreteSource48ColorAxisOrthogonalityProbe.lean")" = 4ae8b38d5601b8c57f09e94c523beb9b4598dcb1
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V52ASourceEvenCliffordQuaternionTableProbe.lean")" = ad67d8eac5a8147f7ae099c3d9b913db2038f53a
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V52B1SourcePauliQuaternionMatrixMultiplicationProbe.lean")" = 8a5558fa127893b6bbb971a8047df4840d74e760
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V52B2Original48CliffordQuaternionPolynomialMulProbe.lean")" = 164add0b3a17b9d5417aa3595de841ad5eee33f4
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V52B3Original48CliffordQuaternionUnitNormProbe.lean")" = 175d0865ddb413bb02ad29d9ba945be5f0c0639f
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V52C1OriginalNativeGaugeQuaternionCoordinatesProbe.lean")" = bbb6fd81e68787d236a9919c3a7675230e899818
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V52L7A0NativeSourceCurveFirstRowTransportProbe.lean")" = 2570ae7ffa7e7a720282950e7ba008d2544aaadf
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V52L7A2SourceZYQuaternionTrigonometricMatrixProbe.lean")" = 7f91fc7bc1370f7e43fcc3ce2226c1c066bdb411
          test "$(git hash-object upstream-math/lean/OAI/MathematicalPhysics/BFSS/Core.lean)" = 9882359ced78b0a3bd7e2f057974bd0a031b3e60
          echo S1V52L7A2_EXACT_ORIGINAL_GAUGE_CORE_AND_SOURCE_SHA_PASS

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore immutable original Lean and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v52l7a2/toolchain.log; then
              ok=true; break
            fi
            echo S1V52L7A2_PINNED_LEAN_RETRY_$attempt | tee -a /tmp/bfss-s1v52l7a2/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo PINNED_ORIGINAL_LEAN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v52l7a2/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo S1V52L7A2_PINNED_LEAN_MATHLIB_VERIFIED

      - name: Restore qualified L7A0 native original Z/Y first-row cache
        id: cacheL7A0
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v52l7a0-native-zy-firstrow-transport-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed without accepted exact Clifford quaternion dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.cacheL7A0.outputs.cache-hit }}" = true || { echo S1V52L7A2_ACCEPTED_L7A0_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe SU2BFSSPhysicalDomainS1V5ConcreteSixteenSourceColorBlocksProbe SU2BFSSPhysicalDomainS1V6ConcreteSource48ColorAxisOrthogonalityProbe SU2BFSSPhysicalDomainS1V52ASourceEvenCliffordQuaternionTableProbe SU2BFSSPhysicalDomainS1V52B1SourcePauliQuaternionMatrixMultiplicationProbe SU2BFSSPhysicalDomainS1V52B2Original48CliffordQuaternionPolynomialMulProbe SU2BFSSPhysicalDomainS1V52B3Original48CliffordQuaternionUnitNormProbe SU2BFSSPhysicalDomainS1V52C1OriginalNativeGaugeQuaternionCoordinatesProbe SU2BFSSPhysicalDomainS1V52L7A0NativeSourceCurveFirstRowTransportProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "S1V52L7A2_REQUIRED_SOURCE_OLEAN_MISSING=$stem"; exit 1; }
          done
          echo S1V52L7A2_ACCEPTED_SOURCE_CLIFFORD_DEPENDENCIES_READY

      - name: Verify accepted original BFSS Core Olean from C1 cache
        shell: bash
        run: |
          set -euo pipefail
          cd upstream-math/lean
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Core.olean
          echo S1V52L7A2_ACCEPTED_NATIVE_BFSS_CORE_READY

      - name: Compile and audit three finite source Z/Y quaternion trigonometric matrix roots
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          mkdir -p .lake/build/lib/lean
          stem=SU2BFSSPhysicalDomainS1V52L7A2SourceZYQuaternionTrigonometricMatrixProbe
          cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
          timeout 600s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v52l7a2/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean" || { echo S1V52L7A2_GAUGE_COORDINATE_OLEAN_MISSING; exit 1; }
          python3 - <<'PY'
          import pathlib,re
          stem='SU2BFSSPhysicalDomainS1V52L7A2SourceZYQuaternionTrigonometricMatrixProbe'
          src=pathlib.Path(stem+'.lean').read_text()
          log=pathlib.Path('/tmp/bfss-s1v52l7a2',stem+'.log').read_text()
          expected=['sourcePositiveIZQuaternionMatrix',
                    'sourcePositiveIYQuaternionMatrix',
                    'sourcePositiveIZQuaternion_exp_first']
          assert re.findall(r'^#print axioms (\S+)',src,re.M)==expected
          assert re.findall(r'^namespace (\S+)',src,re.M)==['FCP.BFSSS1V52L7A2']
          reports=re.findall(r"'(FCP\.BFSSS1V52L7A2\.[^\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          found={k:{x.strip() for x in v.split(',') if x.strip()} for k,v in reports}
          assert len(reports)==len(found)==3,reports
          allowed={'propext','Classical.choice','Quot.sound'}
          for name in expected:
            key='FCP.BFSSS1V52L7A2.'+name
            assert key in found and found[key]<=allowed,(key,found)
          assert 'sorryAx' not in log and 'error:' not in log and 'unknownIdentifier' not in log,log[-9000:]
          print('S1V52L7A2_SOURCE_ZY_QUATERNION_MATRIX_3_ROOTS_KERNEL_PASS')
          PY

      - name: Save qualified S1V52L7A2 cache only after strict three-root green
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v52l7a2-source-zy-quaternion-trig-matrix-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve L7A2 finite trigonometric matrix diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v52l7a2-finite-matrix-${{ github.run_id }}
          path: /tmp/bfss-s1v52l7a2/
          if-no-files-found: warn
