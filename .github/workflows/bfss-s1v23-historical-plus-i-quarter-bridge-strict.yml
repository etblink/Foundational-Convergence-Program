name: BFSS S1V23 Original Historical Plus I Quarter Gauge Curve Equality Strict Gate

# C2 qualifies three NEW source-typed historical curve equality and theta field roots.
# Must restore ACTUAL accepted historical L6G6X source cache; no surrogate curve.
on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v23-historical-plus-i-quarter-bridge-strict.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v23-original-plus-i-quarter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  historical-source-plus-i-quarter:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact original source candidates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout immutable original upstream OAI mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Verify all source hashes and toolchain pins before expensive setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v23-historical-quarter
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          data=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in data['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          r=experiments/openai-math-su2-physical-domain
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G6XOriginalSU2GaugeCurveProbe.lean")" = b4aff5ae8e55e506d6850765ec661d777b63a58e
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V23OriginalPlusICurveNativeQuarterBridgeProbe.lean")" = cb29eb6261fc50550cc275bceb5b000619d521b7
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2BFSSG4MOriginalPairedSourceZExponentialQuarterProbe.lean)" = 8f1b853916529b0260bc4edb47b1a11076c680cf
          echo S1V23_ACTUAL_HISTORICAL_CURVE_AND_BRIDGE_SOURCE_PINS_VERIFIED

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore pinned Lean 4.34.1 and exact Mathlib sources
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v23-historical-quarter/toolchain.log; then
              ok=true; break
            fi
            echo ORIGINAL_PINNED_LEAN_RETRY_$attempt | tee -a /tmp/bfss-s1v23-historical-quarter/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo PINNED_ORIGINAL_LEAN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v23-historical-quarter/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo S1V23_HISTORICAL_QUARTER_PINNED_LEAN_MATHLIB_VERIFIED

      - name: Restore strictly accepted actual historical L6G6X source gauge curve cache
        id: accepted_curve
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v23-isolated-l6g6x-original-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed unless original L6G6X, G4M and G4J source caches are present
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.accepted_curve.outputs.cache-hit }}" = true || { echo ACCEPTED_HISTORICAL_L6G6X_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in SU2BFSSPhysicalDomainL6G6XOriginalSU2GaugeCurveProbe SU2BFSSPhysicalDomainL6G6VOriginalPlusIConjugationDerivativeProbe SU2BFSSG4MOriginalPairedSourceZExponentialQuarterProbe SU2BFSSG4LNativeQuarterSourceGaugeWitnessProbe SU2BFSSG4JExactGaugeDataAssemblyProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "HISTORICAL_QUARTER_SOURCE_DEPENDENCY_MISSING=$stem"; exit 1; }
          done
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GaugeGeometry.olean
          echo S1V23_REAL_HISTORICAL_SOURCE_AND_PAIRED_THETA_CACHE_READY

      - name: Compile the actual historical L6G6X-to-G4M source quarter bridge and strictly audit 3 Lean roots
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=SU2BFSSPhysicalDomainS1V23OriginalPlusICurveNativeQuarterBridgeProbe
          cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
          timeout 600s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v23-historical-quarter/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean" || { echo S1V23_HISTORICAL_SOURCE_BRIDGE_OLEAN_MISSING; exit 1; }
          python3 - <<'PY'
          import pathlib,re
          stem='SU2BFSSPhysicalDomainS1V23OriginalPlusICurveNativeQuarterBridgeProbe'
          src=pathlib.Path(stem+'.lean').read_text()
          log=pathlib.Path('/tmp/bfss-s1v23-historical-quarter',stem+'.log').read_text()
          namespaces=re.findall(r'^namespace (\S+)',src,re.M)
          assert namespaces==['FCP.BFSSS1V23'],namespaces
          names=re.findall(r'^#print axioms (\S+)',src,re.M)
          expected=[
            'original_sourcePlusIGaugeCurve_z_matrix_eq',
            'original_sourcePlusIGaugeCurve_quarter_eq_actualGauge',
            'original_sourcePlusIGaugeCurve_quarter_fermion_theta_sign',
          ]
          assert names==expected,(names,expected)
          matches=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          reports={name:{a.strip() for a in ax.split(',') if a.strip()} for name,ax in matches}
          assert len(matches)==len(reports)==len(expected)==3,(matches,expected)
          allowed={'propext','Classical.choice','Quot.sound'}
          for root in expected:
            fq='FCP.BFSSS1V23.'+root
            assert fq in reports and reports[fq]<=allowed,(fq,reports)
          assert 'sorryAx' not in log and 'error:' not in log and 'unknownIdentifier' not in log,log[-7500:]
          print('ORIGINAL_S1V23_HISTORICAL_SOURCE_PLUS_I_QUARTER_3_ROOTS_KERNEL_PASS')
          PY

      - name: Save accepted complete actual historical source quarter identification cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v23-isolated-source-plus-i-quarter-original-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve first causal source and pin logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v23-l6g5h-${{ github.run_id }}
          path: /tmp/bfss-s1v23-historical-quarter/
          if-no-files-found: warn
          retention-days: 14
