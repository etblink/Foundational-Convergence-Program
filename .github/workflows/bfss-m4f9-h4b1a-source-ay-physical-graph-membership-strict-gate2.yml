      - name: Verify qualified H3B2 and BF source graph ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.parent.outputs.cache-hit }}" = true || { echo H4B1A_QUALIFIED_H4A_PARENT_CACHE_MISSING; exit 1; }
          b=upstream-math/lean/.lake/build/lib/lean
          for stem in FCPM4F9H3B2OriginalAYNativePhysicalHilbertChargeColumn FCPM4F9H2APhysicalHilbertOutputUnitary FCPM4F9H2BPhysicalHilbertE2GraphRebase FCPIndependentPhysicalUnitary FCPIndependentGraphTransportHomeomorph SU2BFSSPhysicalDomainL6H5E8BFOriginalSourceGraphAndPairedHamiltonianProbe; do
            test -s "$b/$stem.olean" || { echo "H4B1A_MISSING_OLEAN=$stem"; exit 1; }
          done
          echo BFSS_H4A_CURRENT_BRANCH_QUALIFIED_ANCESTRY_PASS
      - name: Fresh strict Lean H4B1A source graph membership and axioms
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=FCPM4F9H4B1ASourceNamedNativeGraphMembership
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          timeout 240s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-m4f9-h4b1a-gate2/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/bfss-m4f9-h4b1a-gate2/FCPM4F9H4B1ASourceNamedNativeGraphMembership.log').read_text()
          ns='FCP.M4F9H4B1ASourceNamedNativeGraphMembership.'
          roots=['pairedNativeSourcePhysicalGraph_mem_source_iff']
          reports=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          got={n:{t.strip() for t in a.split(',') if t.strip()} for n,a in reports}
          assert len(reports)==len(got)==1 and set(got)=={ns+n for n in roots},('H4B1A_WRONG_ROOTS',reports)
          for name,axioms in got.items():
              assert axioms <= {'propext','Classical.choice','Quot.sound'},(name,axioms)
          known={'belyi','formal-schemes','elliptic-curves','tempered-fundamental-groups','oka','orbicurve-cores','pi1','heights','genl','tate-curves-theta','iut'}
          filtered=[]
          for line in s.splitlines():
              m=re.fullmatch(r"warning: ([a-z0-9-]+): repository '([^']+)' has local changes",line)
              if m and m.group(1) in known and m.group(2).endswith('/upstream-math/lean/.lake/packages/'+m.group(1)): continue
              filtered.append(line)
          checked='\n'.join(filtered)
          assert not any(t in checked for t in ('sorryAx','error:','warning:','unknownIdentifier')),checked[-5000:]
          print('BFSS_M4F9_H4B1A_SOURCE_NAMED_GRAPH_MEMBERSHIP_ONE_ROOT_STRICT_PASS')
          PY
