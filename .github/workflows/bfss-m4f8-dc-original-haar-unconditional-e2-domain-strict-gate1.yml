        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p /tmp/bfss-unconditional-domain-density
          stem=FCPM4F8IndependentE2UnconditionalPhysicalDomainDenseDC
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          for ancestor in FCPM4F8IndependentE2ConditionalPhysicalDomainDenseDD SU2BFSSPhysicalDomainD2B10CFullHaarCoreCompatibilityAndDensityProbe OAI/MathematicalPhysics/BFSS/ClosedProfiles; do
            test -s ".lake/build/lib/lean/$ancestor.olean" || { echo DC_GATE1_ANCESTOR_MISSING=$ancestor; exit 1; }
          done
          /usr/bin/time -f 'DC_RESOURCE_TIME %e CPU %P MAX_RSS_KB %M' -o "/tmp/bfss-unconditional-domain-density/$stem.resource" \
            timeout --signal=TERM --kill-after=5s 210s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" >"/tmp/bfss-unconditional-domain-density/$stem.log" 2>&1 || {
              ec=$?
              echo M4F8_DC_GATE1_LEAN_EXIT=$ec
              grep -n 'error:' "/tmp/bfss-unconditional-domain-density/$stem.log" | head -n 22 || true
              tail -n 110 "/tmp/bfss-unconditional-domain-density/$stem.log"
              cat "/tmp/bfss-unconditional-domain-density/$stem.resource" || true
              exit "$ec"
            }
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/bfss-unconditional-domain-density/FCPM4F8IndependentE2UnconditionalPhysicalDomainDenseDC.log').read_text()
          names={
