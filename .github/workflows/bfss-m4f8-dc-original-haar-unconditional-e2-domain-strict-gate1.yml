            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentChargeOutputTypedE7A.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7GenericClosedRangeOutputsE7G.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7OpaqueLiteralGraphInterfaceE7D.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentNamedSmoothGraphMapsE7K.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7NamedSmoothGraphIdentityE7K2.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7NamedClosedSmoothGraphIdentityE7K3.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7GenericOpaqueOutputConstraintE7H.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentPhysicalOutputPredicateE7I.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7NamedConditionalPhysicalOutputBridgeE7L.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentLiteralClosedPhysicalOutputsE7M.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentActualClosedGraphNamedBridgeE7N1.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentActualClosedPhysicalOutputsE7N2.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentInvariantCoreL2ImageDA.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentConditionalPhysicalCoreDensityDB.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentE2ConditionalPhysicalDomainDenseDD.olean
          key: bfss-fcp-m4f8-dd-e2-physical-domain-2dd18079-gate5-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail-closed DC and exact original source bridge provenance preflight
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.ddcache.outputs.cache-hit }}" = true || { echo M4F8_DC_GATE1_DD_QUALIFIED_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in OAI/MathematicalPhysics/BFSS/ClosedProfiles FCPM4F8IndependentE2ConditionalPhysicalDomainDenseDD SU2BFSSG4JExactGaugeDataAssemblyProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo M4F8_DC_GATE1_REQUIRED_ANCESTOR_OLEAN_MISSING=$stem; exit 1; }
          done
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          f=Path('experiments/openai-math-su2-physical-domain/FCPM4F8IndependentE2UnconditionalPhysicalDomainDenseDC.lean')
          source='bac97ce908456a400a3e74919367a9e2f12ba1c8'
          assert subprocess.check_output(['git','rev-parse','HEAD:'+str(f)],text=True).strip()==source
          assert subprocess.check_output(['git','hash-object','--no-filters',str(f)],text=True).strip()==source
          t=f.read_text()
          assert t.startswith('import FCPM4F8IndependentE2ConditionalPhysicalDomainDenseDD\nimport SU2BFSSPhysicalDomainD2B10CFullHaarCoreCompatibilityAndDensityProbe\n')
          assert re.findall(r'^theorem (\S+)',t,re.M)==[
            'sourceHaar_coreL2_set_closure_eq_physical',
            'independentE2_actual_closed_domain_dense_in_physical'
          ]
          assert re.findall(r'^#print axioms (\S+)',t,re.M)==[
            'sourceHaar_coreL2_set_closure_eq_physical',
            'independentE2_actual_closed_domain_dense_in_physical'
          ]
          assert 'sourceCoreNormClosure_eq_physical_unconditional' in t
          assert 'independentE2_actual_closed_domain_dense_in_physical_of_source' in t
          assert not re.search(r'(?m)^[ \t]*(?:sorry|admit|axiom)\b|\bsorryAx\b',t)
          assert 'hsource :' not in t.split('theorem independentE2_actual_closed_domain_dense_in_physical',1)[-1]
          print('M4F8_DC_GATE1_ACTUAL_HAAR_AND_DD_IMPORT_BRIDGE_FROZEN_PASS')
          PY

      - name: Rebuild historical qualified G4K9D and G4K10A dependency closure from exact sources
        shell: bash
        timeout-minutes: 36
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          qualified9d=1fbd0db2af96914d20b8750bfbbeb3af6770a491
          qualified10a=6eeb4293abcc1cf3a111ff5c511f708cb5ed320a
          git fetch --quiet --no-tags --depth=1 origin "$qualified9d"
          git fetch --quiet --no-tags --depth=1 origin "$qualified10a"
          base=upstream-math/lean/.lake/build/lib/lean
          test -s "$base/SU2BFSSG4JExactGaugeDataAssemblyProbe.olean" || {
            echo SOURCE_G4J_ACCEPTED_PREREQUISITE_MISSING
            exit 1
          }
          stems=(
            SU2BFSSG4K1PhysicalSpaceCoreProbe
            SU2BFSSG4K2ANonzeroVacuumRadialProfileProbe
            SU2BFSSG4K2BNonzeroPhysicalL2Probe
            SU2BFSSG4K3NonzeroSmoothInvariantCoreProbe
            SU2BFSSG4K4ClosedChargeGraphProbe
            SU2BFSSG4K5ConcreteEnergyDensityProbe
            SU2BFSSG4K6PhysicalTrialEnergyLowerProbe
            SU2BFSSG4K7EnergySumOfSquaresCorrectionProbe
            SU2BFSSG4K8ANonzeroDerivativeProbe
            SU2BFSSG4K8BNonzeroCoordinateL2Probe
            SU2BFSSG4K8CZeroParameterChargeProbe
            SU2BFSSG4K8DPositiveCouplingAlternativeProbe
            SU2BFSSG4K8E1MasslessPotentialParityProbe
            SU2BFSSG4K8E2KineticOddParityProbe
            SU2BFSSG4K8E3CoreNoncancellationProbe
            SU2BFSSG4K9ASourceChargeCoefficientCrosswalkProbe
            SU2BFSSG4K9BSourcePairAndChargeReductionProbe
            SU2BFSSG4K9COrderedPairCoefficientProbe
            SU2BFSSG4K9DSourcePotentialMultiplierProbe
            SU2BFSSG4K10ASourceClosedJointChargeGraphProbe
          )
          test "${#stems[@]}" -eq 20
          for stem in "${stems[@]}"; do
            p="experiments/openai-math-su2-concrete-potential/$stem.lean"
            expected="$qualified9d"
            if [ "$stem" = SU2BFSSG4K10ASourceClosedJointChargeGraphProbe ]; then
              expected="$qualified10a"
            fi
            test "$(git hash-object "$p")" = "$(git rev-parse "$expected:$p")" || {
              echo "PINNED_G4K_ACCEPTED_SOURCE_DRIFT=$p"
              exit 1
            }
            cp "$p" upstream-math/lean/
          done
          mkdir -p /tmp/bfss-unconditional-domain-density
          cd upstream-math/lean
          for module in OAI.MathematicalPhysics.BFSS.KineticMeasures OAI.MathematicalPhysics.BFSS.CovariantFields OAI.MathematicalPhysics.BFSS.ProfileEnergy; do
            dest=".lake/build/lib/lean/$(printf '%s' "$module" | tr . /).olean"
            if ! test -s "$dest"; then
              echo "REBUILDING_PINNED_ORIGINAL_SOURCE=$module"
              timeout 480s lake build "$module" 2>&1 | tee "/tmp/bfss-unconditional-domain-density/upstream-$(basename "$dest").log"
              test -s "$dest"
            fi
          done
          for stem in "${stems[@]}"; do
            echo "REBUILDING_EXACT_ACCEPTED_G4K_SOURCE=$stem"
            timeout 240s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 |
              tee "/tmp/bfss-unconditional-domain-density/$stem.log"
            test -s ".lake/build/lib/lean/$stem.olean"
          done
          python3 - <<'PY'
          import pathlib,re
          d=pathlib.Path('/tmp/bfss-unconditional-domain-density')
          stems='''SU2BFSSG4K1PhysicalSpaceCoreProbe
          SU2BFSSG4K2ANonzeroVacuumRadialProfileProbe
          SU2BFSSG4K2BNonzeroPhysicalL2Probe
          SU2BFSSG4K3NonzeroSmoothInvariantCoreProbe
          SU2BFSSG4K4ClosedChargeGraphProbe
          SU2BFSSG4K5ConcreteEnergyDensityProbe
          SU2BFSSG4K6PhysicalTrialEnergyLowerProbe
          SU2BFSSG4K7EnergySumOfSquaresCorrectionProbe
          SU2BFSSG4K8ANonzeroDerivativeProbe
          SU2BFSSG4K8BNonzeroCoordinateL2Probe
          SU2BFSSG4K8CZeroParameterChargeProbe
          SU2BFSSG4K8DPositiveCouplingAlternativeProbe
          SU2BFSSG4K8E1MasslessPotentialParityProbe
          SU2BFSSG4K8E2KineticOddParityProbe
          SU2BFSSG4K8E3CoreNoncancellationProbe
          SU2BFSSG4K9ASourceChargeCoefficientCrosswalkProbe
          SU2BFSSG4K9BSourcePairAndChargeReductionProbe
          SU2BFSSG4K9COrderedPairCoefficientProbe
          SU2BFSSG4K9DSourcePotentialMultiplierProbe
          SU2BFSSG4K10ASourceClosedJointChargeGraphProbe'''.split()
          allowed={'propext','Classical.choice','Quot.sound'}
          for stem in stems:
              s=(d/(stem+'.log')).read_text()
              assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,stem
              reports=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",s)
              assert reports,('G4K_MISSING_AXIOM_REPORTS',stem)
              for name,ax in reports:
                  assert {a.strip() for a in ax.split(',') if a.strip()}<=allowed,(stem,name,ax)
          leaf=(d/(stems[-1]+'.log')).read_text()
          for name in ['sourceChargeMap_equal','sourceChargeVector_equal','sourceCoreGraph_equal','sourceClosedJointChargeGraph_equal','sourceClosedJointChargeDomain_iff']:
              assert 'FCP.BFSSSU2GaugeG4K10A.'+name in leaf,name
          print('G4K9D_AND_G4K10A_BYTE_IDENTICAL_SOURCE_20_MODULE_REBUILD_AXIOM_PASS')
          PY

      - name: Rebuild source-qualified Gate 28 and Gate 47 Haar prerequisites in same Lean environment
        shell: bash
        timeout-minutes: 33
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          qualified28=b3f22a8dd3edea0d68436b20bcdc63e0dbac56ab
          qualified47=d50fe847096df7cf981173cd69787392d8d3d268
          git fetch --quiet --no-tags --depth=1 origin "$qualified28"
          git fetch --quiet --no-tags --depth=1 origin "$qualified47"
          before=(
            SU2BFSSPhysicalDomainD1RestrictedSourceGraphProbe
            SU2BFSSPhysicalDomainD3AKineticGaugeContractionProbe
            SU2BFSSPhysicalDomainD3BFullChargeGaugePreservationProbe
            SU2BFSSPhysicalDomainD2AClosedPhysicalGraphProbe
            SU2BFSSPhysicalDomainD2B1SourceHaarEquivariantAverageProbe
            SU2BFSSPhysicalDomainD2B2HaarAverageContinuitySupportProbe
            SU2BFSSPhysicalDomainD2B3SmoothHaarReductionProbe
            SU2BFSSPhysicalDomainD2B3JJointOperatorSmoothHaarProbe
            SU2BFSSPhysicalDomainD2B4SourceSmoothInvariantCoreProbe
            SU2BFSSPhysicalDomainD2B5SourceProjectionAlgebraProbe
            SU2BFSSPhysicalDomainD2B6SourceFullL2GaugeActionProbe
            SU2BFSSPhysicalDomainD2B7SourceFullL2GaugeIsometryAndFixednessProbe
          )
          after=(
            SU2BFSSPhysicalDomainD2B8AFixedPointSpaceProbe
            SU2BFSSPhysicalDomainD2B8BFermionContinuousReductionProbe
            SU2BFSSPhysicalDomainD2B8CBosonStrongContinuityProbe
            SU2BFSSPhysicalDomainD2B9AFullL2HaarExistenceBoundProbe
            SU2BFSSPhysicalDomainD2B9BFullL2HaarCLMProbe
            SU2BFSSPhysicalDomainD2B9CGenuineGaugeHaarProjectionProbe
            SU2BFSSPhysicalDomainD2B10AProjectedSmoothCoreDensityProbe
            SU2BFSSPhysicalDomainD2B10B1JointHaarFubiniIntegrabilityProbe
            SU2BFSSPhysicalDomainD2B10B2SmoothTestInnerFubiniProbe
            SU2BFSSPhysicalDomainD2B10CFullHaarCoreCompatibilityAndDensityProbe
          )
          test "${#before[@]}" -eq 12
          test "${#after[@]}" -eq 10
          for stem in "${before[@]}"; do
            p="experiments/openai-math-su2-physical-domain/$stem.lean"
            test "$(git hash-object "$p")" = "$(git rev-parse "$qualified28:$p")" || {
              echo "GATE28_ACCEPTED_SOURCE_DRIFT=$p"
              exit 1
            }
          done
          for stem in "${after[@]}"; do
            p="experiments/openai-math-su2-physical-domain/$stem.lean"
            test "$(git hash-object "$p")" = "$(git rev-parse "$qualified47:$p")" || {
              echo "GATE47_ACCEPTED_SOURCE_DRIFT=$p"
              exit 1
            }
          done
          original=upstream-math/lean/.lake/build/lib/lean
          test -s "$original/SU2BFSSG4K10ASourceClosedJointChargeGraphProbe.olean" || {
            echo PINNED_G4K10A_ACCEPTED_DEPENDENCY_NOT_IN_L6_CACHE
            exit 1
          }
          test -s "$original/SU2BFSSG4K9DSourcePotentialMultiplierProbe.olean"
          test -s "$original/OAI/MathematicalPhysics/BFSS/ClosedProfiles.olean"
          echo GATE28_AND_GATE47_EXACT_SOURCE_HASHES_AND_G4K_DEPS_PASS
          mkdir -p /tmp/bfss-unconditional-domain-density
          for stem in "${before[@]}" "${after[@]}"; do
            cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          done
          if ! test -s "$original/OAI/Analysis/VlasovMaxwell/Regularity/SmoothIntegral.olean"; then
