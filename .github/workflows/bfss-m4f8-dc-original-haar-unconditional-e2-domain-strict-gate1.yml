          r=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          ax={n:{t.strip() for t in a.split(',') if t.strip()} for n,a in r}
          assert len(r)==len(ax)==2 and set(ax)==names,('DC_UNEXPECTED_ROOTS',r)
          assert all(a <= {'propext','Classical.choice','Quot.sound'} for a in ax.values()),('DC_FORBIDDEN_AXIOMS',ax)
          assert 'sorryAx' not in s and 'error:' not in s
          warns=[v for v in s.splitlines() if 'warning:' in v and not re.fullmatch(r"warning: [A-Za-z0-9_-]+: repository '[^']+' has local changes",v)]
          assert not warns,('DC_UNEXPECTED_WARNINGS',warns)
          print('M4F8_DC_GATE1_ACTUAL_INDEPENDENT_E2_UNCONDITIONAL_HAAR_PHYSICAL_DOMAIN_DENSITY_TWO_SUPPORT_THEOREMS_STRICT_PASS',ax)
          PY
          cat "/tmp/bfss-unconditional-domain-density/$stem.resource"

