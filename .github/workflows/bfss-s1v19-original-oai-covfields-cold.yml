name: BFSS S1V19 Original OAI CovariantFields Cold Layer (NO PROOF)

# Only pinned original OAI source prerequisites. No BFSS theorem is claimed.
on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v19-original-oai-covfields-cold.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v19-oai-covfields-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-covariant-fields:
    runs-on: ubuntu-latest
    timeout-minutes: 39
    steps:
      - name: Checkout isolated research
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout independent original OAI Lean source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Enforce original mathematical source and compiler pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v19-covfields
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          d=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in d['packages'] if p['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V19OriginalSourceZQuarterAdjointCoefficientBridgeProbe.lean)" = 5d77be869b4df35462af4c66bd5452e5ab908198
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V20OriginalSourceQuarter48RealMatrixEqualityProbe.lean)" = 1fc67e04118d15dedc23543415488e1919958d65
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2BFSSG3AAdjointColorRepresentationProbe.lean)" = c8bbd59782c3116fb514d6aa20d91c607a11c3e7
          echo EXACT_ORIGINAL_OAI_G3A_COLOR_IMPORTS_PINNED__NO_NEW_LEMMA

      - name: Reclaim runner space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Obtain exact pinned Lean/Mathlib
        shell: bash
        timeout-minutes: 23
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v19-covfields/lean-install.log; then
              ok=true; break
            fi
            echo PINNED_TOOLCHAIN_DOWNLOAD_RETRY_$attempt | tee -a /tmp/bfss-s1v19-covfields/lean-install.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo PINNED_TOOLCHAIN_INSTALL_FAILED; exit 1; }
          cd upstream-math/lean
          timeout 1030s lake exe cache get 2>&1 | tee /tmp/bfss-s1v19-covfields/mathlib-cache.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo EXACT_PINNED_MATHLIB_AVAILABLE

      - name: Restore accepted ORIGINAL GaugeCore OAI source layer
        id: core
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: upstream-math/lean/.lake/build/lib/lean/OAI
          key: bfss-s1v19-isolated-oai-gaugecore-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed on OAI GaugeCore cache provenance
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.core.outputs.cache-hit }}" = true || { echo ORIGINAL_OAI_GAUGECORE_CACHE_INACCESSIBLE; exit 1; }
          test -s upstream-math/lean/.lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GaugeCore.olean
          test -s upstream-math/lean/.lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Core.olean
          echo ORIGINAL_GAUGECORE_OLEAN_RESTORED_FROM_EXACT_PINNED_CACHE

      - name: Build only original OAI CovariantFields target and transitive imports
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          timeout 660s lake build OAI.MathematicalPhysics.BFSS.CovariantFields 2>&1 | tee /tmp/bfss-s1v19-covfields/oai-covariant-build.log
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/CovariantFields.olean
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GaugeCore.olean
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo ORIGINAL_OAI_COVARIANTFIELDS_TRANSITIVE_IMPORTS_COMPILED__NO_NEW_BFSS_THEOREM

      - name: Save exact combined GaugeCore and CovariantFields OAI source layer
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: upstream-math/lean/.lake/build/lib/lean/OAI
          key: bfss-s1v19-isolated-oai-covfields-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve first causal errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v19-original-covariant-${{ github.run_id }}
          path: /tmp/bfss-s1v19-covfields/
          if-no-files-found: warn
          retention-days: 14
