name: Post FWPM K9 reconciliation

on:
  push:
    branches:
      - maintenance/post-fwpm-k9-routing-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/post-fwpm-k9-routing-reconciliation
          fetch-depth: 0

      - name: Apply exact replacements
        run: python tools/post_fwpm_k9_reconcile.py

      - name: Verify bounded diff
        run: |
          set -euo pipefail
          git diff --check
          rm .github/workflows/post-fwpm-k9-reconcile.yml tools/post_fwpm_k9_reconcile.py
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected=$'.github/workflows/post-fwpm-k9-reconcile.yml\nCURRENT_STATE.md\nFRAMEWORK_REGISTER.md\nhandoffs/POST_FW_PROCESS_MATRIX_K9_ROUTING_AND_NAVIGATION_RECONCILIATION_HANDOFF_0_1_0.md\ntools/post_fwpm_k9_reconcile.py'
          test "$changed" = "$expected" || { echo "Unexpected changed paths:"; printf '%s\n' "$changed"; exit 1; }
          grep -q 'TARGETED_K9_CURRENT_PAIRWISE_E2_COUNT = 4' CURRENT_STATE.md
          grep -q 'TARGETED_K9_PAIRWISE_READJUDICATION = CANONICALLY_COMPLETE' CURRENT_STATE.md
          grep -q 'NEXT_RECOMMENDED_OPERATION = POST_FW_PROCESS_MATRIX_K9_SCIENTIFIC_SEQUENCING_ADJUDICATION' CURRENT_STATE.md
          grep -q '^| `FW-PROCESS-MATRIX` .* `PAIRWISE_COMPARISON_COMPLETE` ' FRAMEWORK_REGISTER.md
          ! grep -q 'TARGETED_K9_PAIRWISE_REANALYSIS_PREREGISTRATION = SELECTED_NOT_STARTED' CURRENT_STATE.md
          ! grep -q 'TARGETED_K9_PAIRWISE_READJUDICATION = NOT_STARTED' CURRENT_STATE.md
          git diff --stat

      - name: Commit reconciliation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reconcile routing after FW-PROCESS-MATRIX K9 reanalysis'
          git push origin HEAD:maintenance/post-fwpm-k9-routing-reconciliation
