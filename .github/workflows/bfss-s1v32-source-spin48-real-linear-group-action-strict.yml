name: BFSS S1V32 Canonical Source Spin48 Real Scalar and Group Action Strict Gate

# Restore accepted S1V31 actual original real-vector action cache.
# Verify REAL scalar compatibility and identity/mul action for EVERY
# genuine source-sized Spin48 element, using its Clifford generator.
# Not yet the SO48 projection, quadratic isometry, topology or lift.
on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v32-source-spin48-real-linear-group-action-strict.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v32-linear-group-action-${{ github.ref }}
  cancel-in-progress: false

jobs:
  all-spin48-real-linear-group-action:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact original source candidates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout immutable original upstream OAI mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Verify all source hashes and toolchain pins before expensive setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v32-linear-group
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          data=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in data['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          r=experiments/openai-math-su2-physical-domain
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V30Real48CliffordGeneratorInjectiveViaExteriorProbe.lean")" = 59d40c5c74cc4803a6a6096cfe5ea87c800bd7f9
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V31CanonicalAllSpin48RealVectorActionProbe.lean")" = d6e025372d9f3a393dbb21ba7700c0bc95fd40f2
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V32AllSpin48CanonicalVectorLinearGroupActionProbe.lean")" = 602f68275bc00df55573a955264e9a8c1190a5ae
          echo S1V32_EXACT_ORIGINAL_SPIN48_REAL_LINEAR_ACTION_SOURCE_PINNED

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore pinned Lean 4.34.1 and exact Mathlib sources
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v32-linear-group/toolchain.log; then
              ok=true; break
            fi
            echo ORIGINAL_PINNED_LEAN_RETRY_$attempt | tee -a /tmp/bfss-s1v32-linear-group/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo PINNED_ORIGINAL_LEAN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v32-linear-group/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo S1V32_PINNED_LEAN_MATHLIB_VERIFIED

      - name: Restore strictly accepted S1V31 canonical actual 48-real Spin vector action cache
        id: accepted_vector
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v31-isolated-canonical-spin48-vector-action-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed unless exact accepted S1V31 canonical vector and S1V30 injectivity artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.accepted_vector.outputs.cache-hit }}" = true || { echo ACCEPTED_S1V31_VECTOR_ACTION_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe SU2BFSSPhysicalDomainS1V30Real48CliffordGeneratorInjectiveViaExteriorProbe SU2BFSSPhysicalDomainS1V31CanonicalAllSpin48RealVectorActionProbe SU2BFSSPhysicalDomainS1MSourceSO48GaugeContinuityProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "S1V32_ACCEPTED_SOURCE_DEPENDENCY_MISSING=$stem"; exit 1; }
          done
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GaugeCore.olean
          echo S1V32_ACCEPTED_ORIGINAL_REAL_SPIN_ACTION_OLEANS_READY

      - name: Compile exact three real scalar identity and multiplication Spin48 source action theorems
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=SU2BFSSPhysicalDomainS1V32AllSpin48CanonicalVectorLinearGroupActionProbe
          cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
          timeout 600s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v32-linear-group/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean" || { echo S1V32_ALL_SPIN48_REAL_SCALAR_GROUP_OLEAN_MISSING; exit 1; }
          python3 - <<'PY'
          import pathlib,re
          stem='SU2BFSSPhysicalDomainS1V32AllSpin48CanonicalVectorLinearGroupActionProbe'
          src=pathlib.Path(stem+'.lean').read_text()
          log=pathlib.Path('/tmp/bfss-s1v32-linear-group',stem+'.log').read_text()
          names=re.findall(r'^#print axioms (\S+)',src,re.M)
          expected=['sourceSpin48VectorAction_smul','sourceSpin48VectorAction_one','sourceSpin48VectorAction_mul']
          assert names==expected,(stem,names)
          assert re.findall(r'^namespace (\S+)',src,re.M)==['FCP.BFSSS1V32']
          reports=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          found={k:{x.strip() for x in v.split(',') if x.strip()} for k,v in reports}
          assert len(reports)==len(found)==3,(stem,reports)
          allowed={'propext','Classical.choice','Quot.sound'}
          for name in expected:
            key='FCP.BFSSS1V32.'+name
            assert key in found and found[key]<=allowed,(stem,key,found)
          assert 'sorryAx' not in log and 'error:' not in log and 'unknownIdentifier' not in log,(stem,log[-9000:])
          print('S1V32_ALL_SOURCE_SPIN48_REAL_SCALAR_IDENTITY_MUL_3_ROOTS_KERNEL_PASS')
          PY

      - name: Save actual real-linear and group action source closure after three qualified roots
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v32-isolated-real-linear-spin48-group-action-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve first causal source and pin logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v32-linear-group-${{ github.run_id }}
          path: /tmp/bfss-s1v32-linear-group/
          if-no-files-found: warn
          retention-days: 14
