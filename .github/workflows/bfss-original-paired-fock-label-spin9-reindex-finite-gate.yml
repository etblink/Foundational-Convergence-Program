name: BFSS Original Paired Fock Majorana Label Spin9 Source-Order Finite Gate

# Strict SOURCE REINDEXING only: no global Spin9 action or new Lean theorem.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-original-paired-fock-label-spin9-reindex-finite-gate.yml
      - experiments/openai-math-su2-physical-domain/bfss_original_paired_majorana_spin9_reindex_2026_10_27.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-original-paired-mode-order:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact BFSS research
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout frozen manuscript
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            preprints/Positive-eigenvalues-of-the-relative-SU-2-BFSS-Hamiltonian-October-5-2026/build
          sparse-checkout-cone-mode: false
      - name: Fail closed on actual G1A Majorana ordering, gamma, source and checker
        shell: bash
        run: |
          set -euxo pipefail
          trap 'echo "SOURCE_REINDEX_PREFLIGHT_FAILED_LINE=$LINENO" >&2' ERR
          test "$(git rev-parse HEAD:experiments/openai-math-su2-concrete-potential/SU2BFSSG1APairedThetaProbe.lean)" = 4f8fb05a35c1d625746931b7ff0361b7ffc2ec4
          test "$(git rev-parse HEAD:experiments/openai-math-su2-concrete-potential/SU2RealGammaProbe.lean)" = 5ec0fcb039fb5c1367f72b2bd0f8c05fcd936587
          test "$(git rev-parse HEAD:experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B36ActualPhysicalClosedFormPauliManuscriptProbe.lean)" = 81dd44eec7c24790d87493496fc6f50eae0a0e8e
          test "$(git rev-parse HEAD:experiments/openai-math-su2-physical-domain/bfss_actual_source_gamma_spin9_center_exact_2026_10_27.py)" = 6430043cadc977e98c6b7cd3d64058f56ee899e2
          test "$(git rev-parse HEAD:experiments/openai-math-su2-physical-domain/bfss_original_paired_majorana_spin9_reindex_2026_10_27.py)" = 30eb22f8d8523a25329a1229adac4cbf9f2cad4a
          test "$(git hash-object --no-filters experiments/openai-math-su2-physical-domain/bfss_original_paired_majorana_spin9_reindex_2026_10_27.py)" = 30eb22f8d8523a25329a1229adac4cbf9f2cad4a
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(git -C upstream-math rev-parse HEAD:preprints/Positive-eigenvalues-of-the-relative-SU-2-BFSS-Hamiltonian-October-5-2026/build/positive-eigenvalues-relative-su2-bfss.tex)" = 12c5fffb5f90b48856f60fb0e93c18e2490c5f1b
          python3 -m py_compile experiments/openai-math-su2-physical-domain/bfss_original_paired_majorana_spin9_reindex_2026_10_27.py
          echo ORIGINAL_PAIRED_FOCK_SOURCE_LABEL_EXACT_PINS_PASS
      - name: Install pinned exact integer matrix engine
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --user 'numpy==2.3.4'
          python3 - <<'PY'
          import numpy
          assert numpy.__version__ == '2.3.4'
          print('ORIGINAL_LABEL_NUMPY_PIN_PASS',numpy.__version__)
          PY
      - name: Test exact paired Fock mode and Spin9 gamma covariance transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -B experiments/openai-math-su2-physical-domain/bfss_original_paired_majorana_spin9_reindex_2026_10_27.py \
            --gamma-source experiments/openai-math-su2-concrete-potential/SU2RealGammaProbe.lean \
            --theta-source experiments/openai-math-su2-concrete-potential/SU2BFSSG1APairedThetaProbe.lean \
            | tee /tmp/bfss-original-paired-reindex.log
          grep -qx 'ORIGINAL_G1A_PAIRED_LABEL_FOCK_MODE_MAJOR_PERMUTATION_PASS 48' /tmp/bfss-original-paired-reindex.log
          grep -q '^UNTRANSPORTED_COLOR_MAJOR_B_FIELD_SOURCE_IDENTITY_FALSIFIED ' /tmp/bfss-original-paired-reindex.log
          grep -qx 'ORIGINAL_MODE_PAIRED_B_SPATIAL_COVARIANCE_PASS 972' /tmp/bfss-original-paired-reindex.log
          grep -qx 'ORIGINAL_MODE_PAIRED_SO9_BRACKETS_PASS 1296' /tmp/bfss-original-paired-reindex.log
          grep -qx 'ORIGINAL_MODE_PAIRED_B_GAUGE_COVARIANCE_PASS 81' /tmp/bfss-original-paired-reindex.log
          grep -qx 'ORIGINAL_MODE_GAUGE_SPIN_GENERATORS_COMMUTE_PASS 108' /tmp/bfss-original-paired-reindex.log
          echo ORIGINAL_PAIRED_FOCK_48_LABEL_SPIN9_B_TRANSPORT_SOURCE_FINITE_PASS
      - name: Preserve exact source-order falsifier
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-original-paired-reindex-${{ github.run_id }}
          path: /tmp/bfss-original-paired-reindex.log
          if-no-files-found: warn
