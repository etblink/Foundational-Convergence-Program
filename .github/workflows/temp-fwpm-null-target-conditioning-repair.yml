name: Clean publish FWPM null control
on:
  push:
    branches: [automation/fwpm-null-target-conditioning-repair]
permissions:
  contents: write
jobs:
  clean-publish-qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: automation/fwpm-null-target-conditioning-repair
      - name: Reconstruct clean result from preregistration
        shell: bash
        run: |
          set -euo pipefail
          PREREG=50332564d2339c8a048e1b44dd06b13f8580f7ff
          SOURCE=7c437aadc24a6f6ed457dbb4c673609af2eaa7d2
          BRANCH=research/fw-process-matrix-null-control
          PATH_RESULT=comparisons/FW_PROCESS_MATRIX_VS_NULL_GRQFTSM_METHOD_0_2_1_0_1_0.md
          git config user.name "FCP Project Lead Null Control"
          git config user.email "etblink@users.noreply.github.com"
          git fetch origin main "$BRANCH"
          test "$(git rev-parse origin/main)" = "$PREREG"
          test "$(git rev-parse origin/$BRANCH)" = "$SOURCE"
          git show "$SOURCE:$PATH_RESULT" > /tmp/result.md
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/result.md')
          s=p.read_text(encoding='utf-8')
          old='All three are bounded below framework-wide identity. The first two are strongly lineage/target conditioned; the third is positive physical-realization evidence at selected-class scope.'
          new='All three are bounded below framework-wide identity. The first two are nonindependent direct-import/lineage relations; the third is positive physical-realization evidence at selected-class scope.'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          assert old not in s
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          git switch -C "$BRANCH" "$PREREG"
          mkdir -p "$(dirname "$PATH_RESULT")"
          cp /tmp/result.md "$PATH_RESULT"
          git add "$PATH_RESULT"
          git diff --cached --check --ignore-space-at-eol
          test "$(git diff --cached --name-only | tr '\n' ' ')" = "$PATH_RESULT "
          git commit -m "Adjudicate FW-PROCESS-MATRIX null control"
          test "$(git rev-parse HEAD^)" = "$PREREG"
          echo "RESULT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RESULT_TREE=$(git show -s --format=%T HEAD)" >> "$GITHUB_ENV"
          echo "RESULT_BLOB=$(git rev-parse HEAD:$PATH_RESULT)" >> "$GITHUB_ENV"
      - name: Qualify clean scientific result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('comparisons/FW_PROCESS_MATRIX_VS_NULL_GRQFTSM_METHOD_0_2_1_0_1_0.md').read_text(encoding='utf-8')
          assert '\r' not in s
          assert '<<<<<<<' not in s and '>>>>>>>' not in s and '\n=======' not in s
          claims=re.findall(r'^CLAIM_ID = (PMNC-[^\n]+)$',s,re.M)
          rels=re.findall(r'^RELATION_STATE = ([A-Z0-9_]+)$',s,re.M)
          assert len(claims)==len(set(claims))==17
          assert len(rels)==17
          assert rels.count('E2_REPRESENTATION')==3
          assert rels.count('NONE_ESTABLISHED')==13
          assert rels.count('UNRESOLVED_UNDER_FROZEN_CORPUS')==1
          assert not any(r.startswith(('E1_','E3_','E4_','E5_')) for r in rels)
          keys=set()
          for x in re.findall(r'^K_KEY = ([^\n]+)$',s,re.M): keys.update(re.findall(r'K(?:10|[1-9])',x))
          assert keys=={f'K{i}' for i in range(1,11)}
          assert len(re.findall(r'^TARGET_CONDITIONED_INCIDENCE = 0$',s,re.M))==2
          assert 'strongly lineage/target conditioned' not in s
          assert 'nonindependent direct-import/lineage relations' in s
          assert 'INDEPENDENCE_STATUS = IND-N_DIRECT_IMPORT' in s
          assert 'PROCESS_MATRIX_SPECIFIC_ADDITIONAL_COMMITMENT_INCIDENCE = 4' in s
          assert 'CORE_PROCESS_MATRIX_SPECIFIC_ADDITIONAL_COMMITMENT_INCIDENCE = 3' in s
          assert 'PROCESS_MATRIX_SPECIFIC_STRUCTURAL_LIMITATION_INCIDENCE = 1' in s
          assert 'NULL_SUBTRACTED_RESIDUE = NONEMPTY' in s
          assert 'RESIDUE_HIGHEST_SCOPE = S3_FRAMEWORK_WIDE' in s
          assert 'UNIVERSAL_PROCESS_MATRIX_REALIZABILITY = NOT_ESTABLISHED' in s
          assert 'DIRECT_FW_PROCESS_MATRIX_EMPIRICAL_DISCRIMINATOR_AFTER_NULL = NO' in s
          assert 'FRAMEWORK_LEVEL_EMPIRICAL_SELECTION_AFTER_NULL = NO' in s
          assert 'FCP27_SELECTED = NO' in s
          print('CLEAN_TOPOLOGY_SCIENTIFIC_QUALIFICATION=PASS')
          PY
          git diff --check --ignore-space-at-eol 50332564d2339c8a048e1b44dd06b13f8580f7ff..HEAD
          test "$(git rev-list --count 50332564d2339c8a048e1b44dd06b13f8580f7ff..HEAD)" = "1"
          test "$(git diff --name-only 50332564d2339c8a048e1b44dd06b13f8580f7ff..HEAD | tr '\n' ' ')" = "comparisons/FW_PROCESS_MATRIX_VS_NULL_GRQFTSM_METHOD_0_2_1_0_1_0.md "
      - name: Race gate and publish clean research branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main research/fw-process-matrix-null-control
          test "$(git rev-parse origin/main)" = "50332564d2339c8a048e1b44dd06b13f8580f7ff"
          test "$(git rev-parse origin/research/fw-process-matrix-null-control)" = "7c437aadc24a6f6ed457dbb4c673609af2eaa7d2"
          git push --force-with-lease=refs/heads/research/fw-process-matrix-null-control:7c437aadc24a6f6ed457dbb4c673609af2eaa7d2 origin HEAD:research/fw-process-matrix-null-control
          echo RESULT_COMMIT="$RESULT_SHA"
          echo RESULT_TREE="$RESULT_TREE"
          echo RESULT_BLOB="$RESULT_BLOB"
