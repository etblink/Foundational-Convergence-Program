name: BFSS SU2 Physical Domain Bridge

on:
  push:
    branches:
      - research/openai-math-su2-concrete-potential
    paths:
      - experiments/openai-math-su2-physical-domain/**
      - .github/workflows/openai-math-su2-physical-domain.yml
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Recompile all accepted physical-domain sources; bypass the domain object cache'
        type: boolean
        required: false
        default: false
      d2b29_trial:
        description: 'Run the unqualified D2B29 trial (not part of accepted cache)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  source-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FCP qualified-cache owner branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check out exact OpenAI Math source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: openai/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Restore pinned dependency environment
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake
            ~/.elan
          key: family270b-bridge-ubuntu-lean4341-openai-adc7f124-deformedcharge-v2

      - name: Verify dependency-cache payload before any proof compilation
        shell: bash
        run: |
          set -euo pipefail
          test -s upstream-math/lean/.lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean || {
            echo 'INFRASTRUCTURE_CACHE_RESTORE_INCOMPLETE: pinned Mathlib.olean missing' >&2
            exit 1
          }
          test -x "$HOME/.elan/toolchains/leanprover--lean4---v4.34.1/bin/lean" || {
            echo 'INFRASTRUCTURE_CACHE_RESTORE_INCOMPLETE: pinned Lean v4.34.1 binary missing' >&2
            exit 1
          }
          echo PINNED_DEPENDENCY_CACHE_PAYLOAD_VERIFIED

      - name: Freeze accepted source and pin compiler
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags --depth=1 origin 6eeb4293abcc1cf3a111ff5c511f708cb5ed320a
          changed="$(git diff --name-only 6eeb4293abcc1cf3a111ff5c511f708cb5ed320a HEAD -- experiments/openai-math-su2-concrete-potential/)"
          if [ -n "$changed" ]; then
            echo "Accepted proof source changed; do not use its cached Lean objects" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          test "$(cat upstream-math/lean/lean-toolchain)" = "leanprover/lean4:v4.34.1"
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD1RestrictedSourceGraphProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD3AKineticGaugeContractionProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD3BFullChargeGaugePreservationProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2AClosedPhysicalGraphProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B1SourceHaarEquivariantAverageProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B2HaarAverageContinuitySupportProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B3SmoothHaarReductionProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B3JJointOperatorSmoothHaarProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B4SourceSmoothInvariantCoreProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B5SourceProjectionAlgebraProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B6SourceFullL2GaugeActionProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B7SourceFullL2GaugeIsometryAndFixednessProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainGate28AcceptedCacheSmoke.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B8AFixedPointSpaceProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B8BFermionContinuousReductionProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B8CBosonStrongContinuityProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B9AFullL2HaarExistenceBoundProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B9BFullL2HaarCLMProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B9CGenuineGaugeHaarProjectionProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B10AProjectedSmoothCoreDensityProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B10B1JointHaarFubiniIntegrabilityProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B10B2SmoothTestInnerFubiniProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B10CFullHaarCoreCompatibilityAndDensityProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainGate47AcceptedCacheSmoke.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B11OriginalPhysicalClosedChargeColumnProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B12OriginalPhysicalChargeLinearPMapProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B13OriginalSmoothCoreChargeGraphClosureProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B14ExactClosedChargeQuadraticEnergyProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B15ClosedPhysicalEnergyFormLimitProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B16PhysicalHilbertRebasedChargeOperatorProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B17TruePhysicalChargeAdjointProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B18NaturalChargeAdjointSquareProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B19NaturalChargeSquarePositiveProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B20VonNeumannGraphSurjectivityProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B21SelfAdjointChargeSquareProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B22ExactHilbertEnergyFormTransportProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B23ExactFormGraphNormEquivalenceProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B24WeightedClosedFormGraphProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B25WeightedFormDomainExactnessProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B26WeakFormAssociatedOperatorProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B27NormalizedHamiltonianSelfAdjointProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B28ConcretePairedSU2HamiltonianProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B29ConcretePositiveSourceFormTrialProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1ASchurScalarCommutantProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1BRelativeGaugeImplementerProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1COneParticleSpecialUnitaryProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS2ASpatialWedgePotentialProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS2BPotentialChargeEnergyBridgeProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS2CCoreFormLinearFermionBoundProbe.lean upstream-math/lean/
          cp experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS2DTransverseSliceWedgeProbe.lean upstream-math/lean/

      - name: Restore exact Gate 174 warm-qualified proof chain
        id: accepted_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: upstream-math/lean/.lake/build
          key: bfss-su2-accepted-g4k10a-v1-6eeb4293abcc1cf3a111ff5c511f708cb5ed320a-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/openai-math-su2-concrete-potential/*.lean', 'upstream-math/lean/lean-toolchain', 'upstream-math/lean/lake-manifest.json') }}

      - name: Reject cache miss or stale accepted proof objects
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.accepted_cache.outputs.cache-hit }}" = "true"
          test -s upstream-math/lean/.lake/build/lib/lean/SU2BFSSG4K9DSourcePotentialMultiplierProbe.olean
          test -s upstream-math/lean/.lake/build/lib/lean/SU2BFSSG4K10ASourceClosedJointChargeGraphProbe.olean
          test -s upstream-math/lean/.lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/ClosedProfiles.olean
          echo ACCEPTED_K10A_CACHE_RESTORED_AND_CHECKED

      - name: Freeze exact Gate 28 accepted twelve-source baseline
        shell: bash
        run: |
          set -euo pipefail
          # Cache acceptance is controlled by the exact kernel-qualified
          # Gate #28 source commit, NOT by a changeable head or test claim.
          baseline=b3f22a8dd3edea0d68436b20bcdc63e0dbac56ab
          git fetch --quiet --no-tags --depth=1 origin "$baseline"
          mapfile -t accepted < <(git ls-tree -r --name-only "$baseline" -- experiments/openai-math-su2-physical-domain/ | grep -E '\.lean$')
          test "${#accepted[@]}" -eq 12
          for p in "${accepted[@]}"; do
            test -f "$p"
            expected="$(git rev-parse "$baseline:$p")"
            actual="$(git hash-object "$p")"
            if [ "$expected" != "$actual" ]; then
              echo "ACCEPTED_GATE28_SOURCE_DRIFT $p expected=$expected actual=$actual" >&2
              exit 1
            fi
          done
          echo GATE28_TWELVE_ACCEPTED_SOURCES_IMMUTABLE

      - name: Freeze exact Gate 47 ten-module accepted extension
        shell: bash
        run: |
          set -euo pipefail
          qualified=d50fe847096df7cf981173cd69787392d8d3d268
          git fetch --quiet --no-tags --depth=1 origin "$qualified"
          mapfile -t accepted < <(git ls-tree -r --name-only "$qualified" -- experiments/openai-math-su2-physical-domain/ | grep -E 'SU2BFSSPhysicalDomainD2B(8[ABC]|9[ABC]|10(A|B1|B2|C))' | grep -E '\.lean$')
          test "${#accepted[@]}" -eq 10
          for p in "${accepted[@]}"; do
            test -f "$p"
            expected="$(git rev-parse "$qualified:$p")"
            actual="$(git hash-object "$p")"
            if [ "$expected" != "$actual" ]; then
              echo "GATE47_QUALIFIED_SOURCE_DRIFT $p expected=$expected actual=$actual" >&2
              exit 1
            fi
          done
          echo GATE47_TEN_ACCEPTED_SOURCES_IMMUTABLE

      - name: Restore exact accepted Gate 28 physical-domain compiled modules
        id: domain_proof_cache
        if: ${{ inputs.clean_build != true }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: upstream-math/lean/.lake/build
          key: bfss-su2-domain-gate28-v1-b3f22a8dd3edea0d68436b20bcdc63e0dbac56ab-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainGate28AcceptedCacheSmoke.lean', 'experiments/openai-math-su2-concrete-potential/*.lean', 'upstream-math/lean/lean-toolchain', 'upstream-math/lean/lake-manifest.json') }}

      - name: Reject incomplete or stale Gate 28 physical-domain cache
        if: ${{ steps.domain_proof_cache.outputs.cache-hit == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          baseline=b3f22a8dd3edea0d68436b20bcdc63e0dbac56ab
          mapfile -t accepted < <(git ls-tree -r --name-only "$baseline" -- experiments/openai-math-su2-physical-domain/ | grep -E '\.lean$')
          test "${#accepted[@]}" -eq 12
          for p in "${accepted[@]}"; do
            module="$(basename "$p" .lean)"
            test -s "upstream-math/lean/.lake/build/lib/lean/${module}.olean" || {
              echo "INCOMPLETE_GATE28_ACCEPTED_OLEAN $module" >&2
              exit 1
            }
          done
          test -s upstream-math/lean/.lake/build/lib/lean/OAI/Analysis/VlasovMaxwell/Regularity/SmoothIntegral.olean
          test -s upstream-math/lean/.lake/build/lib/lean/SU2BFSSG4K10ASourceClosedJointChargeGraphProbe.olean
          echo GATE28_TWELVE_OLEANS_AND_PINNED_PREREQUISITES_PRESENT

      - name: Restore qualified immutable Gate 47 extension cache
        id: gate47_cache
        if: ${{ inputs.clean_build != true }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: upstream-math/lean/.lake/build
          key: bfss-su2-domain-gate47-d2b10c-v1-d50fe847096df7cf981173cd69787392d8d3d268-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B8*.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B9*.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B10*.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainGate47AcceptedCacheSmoke.lean', 'experiments/openai-math-su2-concrete-potential/*.lean', 'upstream-math/lean/lean-toolchain', 'upstream-math/lean/lake-manifest.json') }}

      - name: Verify complete exact Gate 47 cached objects
        if: ${{ steps.gate47_cache.outputs.cache-hit == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          qualified=d50fe847096df7cf981173cd69787392d8d3d268
          mapfile -t accepted < <(git ls-tree -r --name-only "$qualified" -- experiments/openai-math-su2-physical-domain/ | grep -E 'SU2BFSSPhysicalDomainD2B(8[ABC]|9[ABC]|10(A|B1|B2|C))' | grep -E '\.lean$')
          test "${#accepted[@]}" -eq 10
          for p in "${accepted[@]}"; do
            module="$(basename "$p" .lean)"
            test -s "upstream-math/lean/.lake/build/lib/lean/${module}.olean" || {
              echo "INCOMPLETE_GATE47_QUALIFIED_OLEAN $module" >&2
              exit 1
            }
          done
          test -s upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainD2B7SourceFullL2GaugeIsometryAndFixednessProbe.olean
          test -s upstream-math/lean/.lake/build/lib/lean/SU2BFSSG4K10ASourceClosedJointChargeGraphProbe.olean
          echo GATE47_TEN_ACCEPTED_OLEANS_PRESENT

      - name: Compile D1 original gauge-restricted source-graph bridge
        if: ${{ steps.domain_proof_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          lake env lean -o .lake/build/lib/lean/SU2BFSSPhysicalDomainD1RestrictedSourceGraphProbe.olean SU2BFSSPhysicalDomainD1RestrictedSourceGraphProbe.lean 2>&1 | tee /tmp/bfss-su2-domain-d1-axioms.log
          python3 - <<'PY'
          import re
          text = open('/tmp/bfss-su2-domain-d1-axioms.log').read()
          found = re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", text)
          expected = [
              'sourceGaugeRestrictedGraphMap_equal',
              'sourceGaugeRestrictedClosedGraph_equal',
              'sourceGaugeRestrictedClosedDomain_iff',
              'sourceGaugeRestrictedCoreForm_equal',
              'sourceGaugeRestrictedGraph_le_full',
          ]
          assert len(found) == len(expected), found
          for (name, axioms), suffix in zip(found, expected):
              assert name.endswith('.' + suffix), (name, suffix)
              assert {part.strip() for part in axioms.split(',')} == {
                  'propext', 'Classical.choice', 'Quot.sound'
              }, (name, axioms)
          assert 'sorryAx' not in text and 'error:' not in text
          print('D1_EXACT_FIVE_STANDARD_AXIOM_REPORTS_PASS')
          PY

      - name: Recompile accepted D3A kinetic gauge contraction and emit importable module
        if: ${{ steps.domain_proof_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          lake env lean -o .lake/build/lib/lean/SU2BFSSPhysicalDomainD3AKineticGaugeContractionProbe.olean SU2BFSSPhysicalDomainD3AKineticGaugeContractionProbe.lean 2>&1 | tee /tmp/bfss-su2-d3a-axioms.log
          python3 - <<'PY'
          import re
          text = open('/tmp/bfss-su2-d3a-axioms.log').read()
          found = re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", text)
          required = [
              'sourceKineticSkewContraction_basisInvariant',
              'sourceContractedKinetic_gaugeCovariant',
          ]
          assert len(found) == len(required), found
          for (name, axioms), suffix in zip(found, required):
              assert name.endswith('.' + suffix), (name, suffix)
              assert {a.strip() for a in axioms.split(',')} == {
                  'propext', 'Classical.choice', 'Quot.sound'
              }, (name, axioms)
          assert 'sorryAx' not in text and 'error:' not in text
          print('D3A_EXACT_TWO_STANDARD_AXIOM_REPORTS_PASS')
          PY

      - name: Recompile accepted D3B original supercharge physical-space preservation
        if: ${{ steps.domain_proof_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainD3AKineticGaugeContractionProbe.olean
          lake env lean -o .lake/build/lib/lean/SU2BFSSPhysicalDomainD3BFullChargeGaugePreservationProbe.olean SU2BFSSPhysicalDomainD3BFullChargeGaugePreservationProbe.lean 2>&1 | tee /tmp/bfss-su2-d3b-axioms.log
          python3 - <<'PY'
          import re
          text = open('/tmp/bfss-su2-d3b-axioms.log').read()
          found = re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", text)
          required = [
              'sourceDeformedCoreCharge_contracted',
              'sourceDeformedCoreCharge_pointwiseGaugeCovariant',
              'sourceOriginalCoreCharge_pointwiseGaugeCovariant',
              'sourceOriginalCoreCharge_mem_physicalSpace',
              'sourceOriginalCoreCharge_mem_invariantCore',
          ]
          assert len(found) == len(required), found
          for (name, axioms), suffix in zip(found, required):
              assert name.endswith('.' + suffix), (name, suffix)
              assert {a.strip() for a in axioms.split(',')} == {
                  'propext', 'Classical.choice', 'Quot.sound'
              }, (name, axioms)
          assert 'sorryAx' not in text and 'error:' not in text
          print('D3B_EXACT_FIVE_STANDARD_AXIOM_REPORTS_PASS')
          PY

      - name: Recompile accepted D2A physical closed graph bridge
        if: ${{ steps.domain_proof_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainD1RestrictedSourceGraphProbe.olean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainD3BFullChargeGaugePreservationProbe.olean
          lake env lean -o .lake/build/lib/lean/SU2BFSSPhysicalDomainD2AClosedPhysicalGraphProbe.olean SU2BFSSPhysicalDomainD2AClosedPhysicalGraphProbe.lean 2>&1 | tee /tmp/bfss-su2-d2a-axioms.log
          python3 - <<'PY'
          import re
          text = open('/tmp/bfss-su2-d2a-axioms.log').read()
          found = re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", text)
          required = [
              'sourceCoreNormClosure_le_physicalSpace',
              'sourceClosedGaugeGraph_input_physical',
              'sourceClosedGaugeGraph_output_physical',
              'sourceOriginalRestrictedClosedGraph_all_physical',
          ]
          assert len(found) == len(required), found
          for (name, axioms), suffix in zip(found, required):
              assert name.endswith('.' + suffix), (name, suffix)
              assert {a.strip() for a in axioms.split(',')} == {
                  'propext', 'Classical.choice', 'Quot.sound'
              }, (name, axioms)
          assert 'sorryAx' not in text and 'error:' not in text
          print('D2A_EXACT_FOUR_STANDARD_AXIOM_REPORTS_PASS')
          PY

      - name: Recompile accepted D2B1 source Haar fermion average equivariance
        if: ${{ steps.domain_proof_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainD2AClosedPhysicalGraphProbe.olean
          # Reuse the existing upstream SU(2) compactness and normalized
          # Haar probability measure. No surrogate group/measure allowed.
          lake env lean -o .lake/build/lib/lean/SU2BFSSPhysicalDomainD2B1SourceHaarEquivariantAverageProbe.olean SU2BFSSPhysicalDomainD2B1SourceHaarEquivariantAverageProbe.lean 2>&1 | tee /tmp/bfss-su2-d2b1-axioms.log
          python3 - <<'PY'
          import re
          text = open('/tmp/bfss-su2-d2b1-axioms.log').read()
          found = re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", text)
          expected = [
              'sourceHaarIntegrand_continuous',
              'sourceHaarIntegrand_integrable',
              'sourceHaarAverageRaw_equivariant',
              'sourceHaarAverageRaw_fixed',
          ]
          assert len(found) == len(expected), found
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for (name, axioms), suffix in zip(found, expected):
              assert name.endswith('.' + suffix), (name, suffix)
              assert {a.strip() for a in axioms.split(',')} <= allowed, (name, axioms)
          assert 'sorryAx' not in text and 'error:' not in text
