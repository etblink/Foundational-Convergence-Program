          lake env lean -o .lake/build/lib/lean/SU2BFSSPhysicalDomainD2B4SourceSmoothInvariantCoreProbe.olean SU2BFSSPhysicalDomainD2B4SourceSmoothInvariantCoreProbe.lean 2>&1 | tee /tmp/bfss-su2-d2b4-axioms.log
          python3 - <<'PY'
