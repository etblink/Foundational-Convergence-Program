          found = re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", text)
          expected = [
              'sourceHaarIntegrand_jointContinuous',
              'sourceHaarAverageRaw_continuous',
              'sourceHaarAverageRaw_hasCompactSupport',
          ]
          assert len(found) == len(expected), found
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for (name, axioms), suffix in zip(found, expected):
              assert name.endswith('.' + suffix), (name, suffix)
              assert {a.strip() for a in axioms.split(',')} <= allowed, (name, axioms)
          assert 'sorryAx' not in text and 'error:' not in text
          print('D2B2_THREE_HAAR_CONTINUITY_SUPPORT_REPORTS_PASS')
          PY

      - name: Recompile accepted D2B3 true-source smooth gauge slices and explicit all-jet reduction
        shell: bash
        run: |
          set -euxo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainD2B2HaarAverageContinuitySupportProbe.olean
          # The accepted warm G4-K10A cache does NOT include this
          # unrelated original-source RVM module. Compile its exact
          # pinned source before importing it into D2B3.
          test -s OAI/Analysis/VlasovMaxwell/Regularity/SmoothIntegral.lean
          mkdir -p .lake/build/lib/lean/OAI/Analysis/VlasovMaxwell/Regularity
          lake env lean -o .lake/build/lib/lean/OAI/Analysis/VlasovMaxwell/Regularity/SmoothIntegral.olean OAI/Analysis/VlasovMaxwell/Regularity/SmoothIntegral.lean 2>&1 | tee /tmp/bfss-su2-pinned-rvm-analytic-dependency.log
          test -s .lake/build/lib/lean/OAI/Analysis/VlasovMaxwell/Regularity/SmoothIntegral.olean
          echo PINNED_RVM_SMOOTH_INTEGRAL_COMPILED
          # No new assumed property of BFSS GaugeData is admitted.
          lake env lean -o .lake/build/lib/lean/SU2BFSSPhysicalDomainD2B3SmoothHaarReductionProbe.olean SU2BFSSPhysicalDomainD2B3SmoothHaarReductionProbe.lean 2>&1 | tee /tmp/bfss-su2-d2b3-axioms.log
          python3 - <<'PY'
          import re
          text = open('/tmp/bfss-su2-d2b3-axioms.log').read()
          found = re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", text)
          expected = [
              'sourceHaarSpatialSlice_contDiff',
              'sourceHaarAverageRaw_contDiff_of_jointJets',
          ]
          assert len(found) == len(expected), found
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for (name, axioms), suffix in zip(found, expected):
              assert name.endswith('.' + suffix), (name, suffix)
              assert {a.strip() for a in axioms.split(',')} <= allowed, (name, axioms)
          assert 'sorryAx' not in text and 'error:' not in text
          print('D2B3_SMOOTH_SLICES_AND_CONDITIONAL_ANALYTIC_REDUCTION_PASS')
          PY

      - name: Recompile accepted D2B3J original gauge operator continuity and unconditional smooth Haar average
        shell: bash
        run: |
          set -euxo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainD2B3SmoothHaarReductionProbe.olean
          lake env lean -o .lake/build/lib/lean/SU2BFSSPhysicalDomainD2B3JJointOperatorSmoothHaarProbe.olean SU2BFSSPhysicalDomainD2B3JJointOperatorSmoothHaarProbe.lean 2>&1 | tee /tmp/bfss-su2-d2b3j-axioms.log
