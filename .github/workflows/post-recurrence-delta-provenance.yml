name: Post recurrence delta provenance reconciliation

on:
  push:
    branches:
      - maintenance/post-recurrence-delta-provenance

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message == 'Run formatted post-recurrence provenance reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/post-recurrence-delta-provenance
          fetch-depth: 0
      - name: Apply bounded reconciliation
        run: python .github/scripts/post_recurrence_delta_reconcile.py
      - name: Normalize newly written formatting
        shell: bash
        run: |
          sed -i 's/[[:space:]]\+$//' audits/POST_RECURRENCE_DELTA_DURABLE_PROVENANCE_AND_ROUTING_RECONCILIATION_0_1_0.md
          python -c "from pathlib import Path; p=Path('CLAIM_LEDGER.md'); t=p.read_text(encoding='utf-8'); p.write_text(t.rstrip(chr(10))+chr(10), encoding='utf-8', newline=chr(10))"
      - name: Validate and publish clean candidate
        shell: bash
        run: |
          git config user.name 'Evan Kotler'
          git config user.email 'etblink@users.noreply.github.com'
          git rm .github/scripts/post_recurrence_delta_reconcile.py
          git rm .github/workflows/post-recurrence-delta-provenance.yml
          git add CLAIM_LEDGER.md CURRENT_STATE.md audits/POST_RECURRENCE_DELTA_DURABLE_PROVENANCE_AND_ROUTING_RECONCILIATION_0_1_0.md
          git diff --cached --check
          CHANGED=$(git diff --cached --name-only | sort | paste -sd ',' -)
          EXPECTED='.github/scripts/post_recurrence_delta_reconcile.py,.github/workflows/post-recurrence-delta-provenance.yml,CLAIM_LEDGER.md,CURRENT_STATE.md,audits/POST_RECURRENCE_DELTA_DURABLE_PROVENANCE_AND_ROUTING_RECONCILIATION_0_1_0.md'
          test "$CHANGED" = "$EXPECTED"
          grep -q 'CLAIM_LEDGER_DURABLE_ROW_COUNT = 100' CURRENT_STATE.md
          grep -q 'CURRENT_EFFECTIVE_PAIRWISE_SLOT_COUNT = 15' CURRENT_STATE.md
          grep -q '## FCP-RECDELTA-001' CLAIM_LEDGER.md
          git commit -m 'Reconcile recurrence delta durable provenance'
          git push origin HEAD:maintenance/post-recurrence-delta-provenance
