name: BFSS S1V23 Original L6G6X Historical Source Gauge Curve Strict Gate

# Historical source Stage C1: only genuine L6G6A-D/U-X modules, no new S1V23 bridge.
# Requires strictly green accepted L6G5W cache; saves L6G6X independently.
on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v23-original-l6g6x-actual-source-curve-strict.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v23-original-l6g6x-curve-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-actual-l6g6x:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact original source candidates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout immutable original upstream OAI mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Verify all source hashes and toolchain pins before expensive setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v23-l6g6x
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          data=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in data['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          r=experiments/openai-math-su2-physical-domain
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G5WOriginalOrbitalGaugeTangentProbe.lean")" = aa54963516214f89fa7bd07eaf8007796b133c89
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G6AOriginalFermionicResponsePointwiseProbe.lean")" = f1ac38ca25c177c6147a24217f279ac53d185d7a
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G6BOriginalFermionicFierzColorContractionProbe.lean")" = c70eb79c72b23e83bb74db30c3e17d2ef015bec8
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G6COriginalFermionResponseKroneckerSelectorProbe.lean")" = e6174f3f6f5d4dd38d3de5c575192953b491be08
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G6DOriginalFermionResponseSymmetricLegsProbe.lean")" = 7bd088faad5c678063b56678285c6ed3be7d382c
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G6UOriginalAdjointColorTangentProbe.lean")" = 712585ea481a41d2bd02384444a4690e798d89c4
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G6VOriginalPlusIConjugationDerivativeProbe.lean")" = eca3be7fef1c5844b0713284a64befcec0a749f1
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G6WAmbientAdjointCoefficientDerivativeProbe.lean")" = 5f73e148a9c4b2abf6afb7d6204271ec12b00f4f
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G6XOriginalSU2GaugeCurveProbe.lean")" = b4aff5ae8e55e506d6850765ec661d777b63a58e
          echo ORIGINAL_L6G6X_8_UNMODIFIED_SOURCE_BLOBS_VERIFIED

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore pinned Lean 4.34.1 and exact Mathlib sources
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v23-l6g6x/toolchain.log; then
              ok=true; break
            fi
            echo ORIGINAL_PINNED_LEAN_RETRY_$attempt | tee -a /tmp/bfss-s1v23-l6g6x/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo PINNED_ORIGINAL_LEAN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v23-l6g6x/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo ORIGINAL_L6G6X_PINNED_LEAN_MATHLIB_VERIFIED

      - name: Restore exactly accepted Stage B L6G5W physical source suffix cache
        id: stage_b
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v23-isolated-l6g5w-original-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed unless Stage B L6G5W source cache and prerequisites exist
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.stage_b.outputs.cache-hit }}" = true || { echo ACCEPTED_L6G5W_SOURCE_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in SU2BFSSG4MOriginalPairedSourceZExponentialQuarterProbe SU2BFSSG3CComplexOneParticleUnitaryProbe SU2BFSSPhysicalDomainL6G5HSourceCenteredGammaGramProbe SU2BFSSPhysicalDomainL6G5WOriginalOrbitalGaugeTangentProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "MISSING_ACCEPTED_L6G5W_SOURCE=$stem"; exit 1; }
          done
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GaugeCore.olean
          echo ACCEPTED_L6G5W_ORIGINAL_SOURCE_CACHE_RECOVERED

      - name: Check immutable OAI GaugeGeometry original dependency
        shell: bash
        timeout-minutes: 19
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          if [ ! -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GaugeGeometry.olean ]; then
            timeout 1000s lake build OAI.MathematicalPhysics.BFSS.GaugeGeometry 2>&1 | tee /tmp/bfss-s1v23-l6g6x/upstream-gauge-geometry.log
          fi
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GaugeGeometry.olean
          echo ORIGINAL_GAUGE_GEOMETRY_DEPENDENCY_READY

      - name: Compile original historical L6G6A-D/U-X and audit all 35 axiom roots
        shell: bash
        timeout-minutes: 28
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          for stem in SU2BFSSPhysicalDomainL6G6AOriginalFermionicResponsePointwiseProbe SU2BFSSPhysicalDomainL6G6BOriginalFermionicFierzColorContractionProbe SU2BFSSPhysicalDomainL6G6COriginalFermionResponseKroneckerSelectorProbe SU2BFSSPhysicalDomainL6G6DOriginalFermionResponseSymmetricLegsProbe SU2BFSSPhysicalDomainL6G6UOriginalAdjointColorTangentProbe SU2BFSSPhysicalDomainL6G6VOriginalPlusIConjugationDerivativeProbe SU2BFSSPhysicalDomainL6G6WAmbientAdjointCoefficientDerivativeProbe SU2BFSSPhysicalDomainL6G6XOriginalSU2GaugeCurveProbe; do
            cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
            echo "ORIGINAL_STAGE_C1_SOURCE_COMPILE_BEGIN=$stem"
            timeout 430s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v23-l6g6x/$stem.log"
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "MISSING_ORIGINAL_STAGE_OLEAN=$stem"; exit 1; }
            STEM="$stem" python3 - <<'PY'
          import os,pathlib,re
          stem=os.environ['STEM']
          src=pathlib.Path(stem+'.lean').read_text()
          s=pathlib.Path('/tmp/bfss-s1v23-l6g6x',stem+'.log').read_text()
          nsm=re.findall(r'^namespace (\S+)',src,re.M)
          assert len(nsm)>=1,(stem,'namespace missing')
          namespace=nsm[0]
          names=re.findall(r'^#print axioms (\S+)',src,re.M)
          assert len(names)>0,(stem,'no original axiom printouts')
          raw=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          found={name:{a.strip() for a in ax.split(',') if a.strip()} for name,ax in raw}
          assert len(raw)==len(found)==len(names),(stem,names,list(found))
          for root in names:
            # An original #print axioms may explicitly name an external
            # upstream OAI constant; never add this file's namespace to it.
            # Plain local roots still require this file's exact namespace.
            k=root if '.' in root else namespace+'.'+root
            suffix=re.compile(r'_private\.'+re.escape(stem)+r'\.[0-9]+\.'+re.escape(k))
            hits=[n for n in found if n==k or suffix.fullmatch(n)]
            assert len(hits)==1,(stem,root,hits,list(found))
            assert found[hits[0]]<={'propext','Classical.choice','Quot.sound'},(stem,root,found[hits[0]])
          assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,(stem,s[-4000:])
          print('HISTORICAL_ORIGINAL_L6G6X_CURVE_ROOTS_PASS',stem,len(names))
          PY
          done
          python3 - <<'PY'
          import pathlib,re
          logs=list(pathlib.Path('/tmp/bfss-s1v23-l6g6x').glob('SU2BFSSPhysicalDomainL6G6*.log'))
          counts=[]
          for log in logs:
            src=pathlib.Path('upstream-math/lean',log.stem+'.lean')
            if not src.exists():
              src=pathlib.Path(log.stem+'.lean')
            counts.append(len(re.findall(r'^#print axioms ',src.read_text(),re.M)))
          assert len(logs)==8 and sum(counts)==35,(len(logs),counts)
          print('ORIGINAL_L6G6X_ACTUAL_SOURCE_8_MODULES_35_ROOTS_KERNEL_PASS')
          PY

      - name: Save historical L6G6X source curve cache only after 35 clean roots
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v23-isolated-l6g6x-original-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve first causal source and pin logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v23-l6g5h-${{ github.run_id }}
          path: /tmp/bfss-s1v23-l6g6x/
          if-no-files-found: warn
          retention-days: 14
