      - name: Compile S3L5J5 original-source kinetic response additive split
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS3L5J5SourceKineticResponseSplitProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainS3L5J4SourceFermionSumCompositionProbe.olean
          timeout 140s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee /tmp/s3l5j5-axioms.log
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import re
          s=open('/tmp/s3l5j5-axioms.log').read()
          pat=re.compile(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          matches=pat.findall(s)
          expected=[
            'FCP.BFSSSU2PhysicalDomainS3L5J5.kineticResponseTerm_eq_parts',
            'FCP.BFSSSU2PhysicalDomainS3L5J5.sourceWeightedThreeSum_add',
            'FCP.BFSSSU2PhysicalDomainS3L5J5.sourceKineticWeightedResponse_split']
          assert [n for n,_ in matches]==expected,matches
          for n,ax in matches:
            assert {v.strip() for v in ax.split(',') if v.strip()} <= {'propext','Classical.choice','Quot.sound'},(n,ax)
          assert 'sorryAx' not in s and 'error:' not in s,s[-4000:]
          print('S3L5J5_ORIGINAL_KINETIC_RESPONSE_SPLIT_PASS')
          PY

