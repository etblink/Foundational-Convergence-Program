name: BFSS S3L Source Rotation Coefficients

# Qualified S3L0–S3L4D; this gate tests exact source charge/kinetic monomial S3L5A; failed S3L4A stays excluded.
# Gate #31 repeated S3L4A's known concrete elaboration failure; this run MUST NOT compile S3L4A.
# Gate #33 checks only the generic, exact AlgebraData.fermionAction interface; no concrete Fock elaboration.
# Gate #34 checks the separately accepted S3E 48-Majorana specialization using S3L4C; no S3L4A replay.
# Gate #39 found definitional and concrete elaboration bottlenecks; S3L5A now checks ONLY the source-parametric kinetic monomial transport.
# S3L5C independent source orbital-fermionAction commutation: trigger one isolated qualification run.
# S3L5D original orbital kinetic monomial: trigger one isolated proof qualification.
# S3L5E concrete specialization remains UNQUALIFIED (#45); S3L5F tests only the parametric additive transport.
# S3L5F launch: source-parametric M/K, explicit fiber premise, no concrete S3L5E expansion.
# S3L5G launch: qualify ONLY the named concrete specialization of accepted S3L5F; do not compile S3L5E.
# S3L5H: first isolate source finite-sum transport and exact S3L0 gamma entry; freeze qualified 3B–5G oleans into exact source-checked cache.
# S3L5H #48: invoke one pinned gate; no S3L5E replay or full charge elaboration.
# S3L5H repair #50: use accepted 3B-5G cache; fix namespace and preserve matrix entry as direct S3L0 extraction.
# S3L5I: contract commutators over the literal original 9x3x16 kinetic charge; defer final gamma/J coefficient contraction.
# S3L5I #51 one-gate pinned qualification; reuse accepted Gate #47 cache and S3L5H #50.
# S3L5I #51 diagnostic RED: only direct concrete specialization exhausted Lean recursion. S3L5I1 isolates two CLEAN compiled triple-sum source identities.
# S3L5I1 #52: pinned isolated green-boundary qualification; preserve source I #51 diagnostic.
# S3L5I2: source-parametric full kinetic charge expansion, with explicit fiber covariance; no concrete paired unfolding.
# S3L5I2 #53: qualify actual original source-syntax kinetic sum over M:AlgebraData2; fiber premise explicit.
# #53/#54 unqualified at whole-expression elaboration; S3L5I2A tests only exact named full weighted sums and visible fiber premise.
# S3L5I2A #55: one cached qualification; no changes to axioms, physical operators, or budgets.
# S3L5I2B: frozen 5H/I1/I2A source cache and exact original sourceKineticCharge bridge; no new axioms.
# S3L5I2B #56: qualify exact definition bridge; cache must verify accepted Gate 55 source before reuse.
# S3L5I3: discharge entire actual paired source kinetic charge fiber premise via accepted S3L4D; no final gamma/J contraction.
# S3L5I3 #57: single exact pinned paired specialization after qualified B source-definition bridge.
# S3L5J1: spatial derivative-index reindex and REAL gamma/J source sign, no full-sum expansion.
# S3L5J1 #58: one pinned run with Gate57 acceptance cache and strict exact theorem/axiom check.
# S3L5J1 #59: repair only two Finset singleton-filter reductions after #58 diagnostics.
# S3L5J2: complexify accepted J1 coefficient and preserve original -Complex.I multiplier.
# S3L5J2 #60: exact scalar gate with source-qualified J1 import and axiom review.
# S3L5J2 #61: direct congrArg real-to-complex cast, no change to original source gamma signs.
# S3L5J2 #62: present orbital conditional as the direct cast seen in Lean #61 diagnostics.
# S3L5J2 #63: explicit k=i/k=j spatial branch simplification; keep exact expanded complex statement.
# S3L5J2 #64: discharge exact missing j-ne-i condition in k=j branch from CI #63.
# S3L5J3: double spinor finite-sum transport on original source operators; J1/J2 Gate #64 immutable cache.
# S3L5J3 #65: one-gate pinned spinor source reindex, provenance-checked accepted J1/J2 cache.
# S3L5J3 #66: general double sum compiled in #65; repair only missing S3A open for paired specialization.
# S3L5J4: qualify original source fermion-sum composition and paired fixed-index response; J3 Gate66 accepted.
# S3L5J4 #67: single cache-aware source composition qualification, no Fock expansion.
# S3L5J4 #68: repair exact AlgebraData.coordinateDerivative namespace missing in #67; no theorem change.
# S3L5J5: exact source kinetic response orbital/fiber split; new accepted J3/J4 source-checked cache.
# S3L5J5 #69: one isolated original response split; verify frozen Gate68 modules before caching.
# Cache consolidation qualification: first-fill fallback uses six known-green snapshots; test new merged restore separately.
# S3L5J6: first consolidated cache HIT audit plus exact original orbital source reindex; no full charge expansion.
# J6 Gate71: verify consolidated 26-module snapshot, skip all legacy restores, then compile source orbital reindex.
# J6 Gate72: close only the implicit i-ne-j branch from Gate71; merged cache remains frozen and qualified.
# J7: original source three-index coefficient transport and finite-sum coefficient regroup; no full Fock expansion.
# Gate73 qualification: source J7 all-index transport, with qualified consolidated cache and axiom gate.
# J8: contract actual scalar -i gamma/J coefficient; keep final source operator spinor sum separate.
# Gate74: pinned J8 scalar coefficient proof with strict exact-name and axiom checks.
# S3L5K1: start separate original cubic potential, source-paired position pair Leibniz rotation.
# S3L5K1 Gate77: original position-pair derivation, actual paired fiber source, strict axioms.
# J9: original paired 48-Majorana source kinetic charge negative free-spinor covariance, not Hamiltonian or cubic.
# Gate75: one pinned source kinetic-sector covariance theorem and four small finite-sum lemmas.
# J9 Gate76: isolate literal named weighted sum; avoid expensive global simpa and open exact S3L5F source.
# Gate76: pinned one-run source kinetic free-spinor covariance, explicit named intermediary.
# S3L5I2 #54: Gate #53 whnf heartbeat at final change; source-syntax simpa only, no increased compiler budgets.
# Pinned S3L5I2 source qualification launch after cache/source preflight.
# S3L5B: exact actual paired SU2 specialization from green S3L4D and S3L5A; source and workflow were prepared while PR base was stacked.

# Qualification is run in a PR against the original cache-owning BFSS research base.
# After qualification the review PR may return to its stacked S3K base.

on:
  pull_request:
    branches:
      - research/openai-math-su2-concrete-potential
    paths:
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L0SourceKineticSpinorCoefficientProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L1SourceOrbitalSmoothCoreProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L2SourceGammaTwoSpatialCovarianceProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L3ASourcePositionDerivativeCommutatorProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L3BSourceOperatorHeisenbergProbe.lean
