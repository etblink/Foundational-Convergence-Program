name: BFSS S3L Source Rotation Coefficients

# Qualified S3L0–S3L4C plus exact specialized S3L4D; failed monolithic S3L4A remains excluded.
# Gate #31 repeated S3L4A's known concrete elaboration failure; this run MUST NOT compile S3L4A.
# Gate #33 checks only the generic, exact AlgebraData.fermionAction interface; no concrete Fock elaboration.

# Qualification is run in a PR against the original cache-owning BFSS research base.
# After qualification the review PR may return to its stacked S3K base.

on:
  pull_request:
    branches:
      - research/openai-math-su2-concrete-potential
    paths:
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L0SourceKineticSpinorCoefficientProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L1SourceOrbitalSmoothCoreProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L2SourceGammaTwoSpatialCovarianceProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L3ASourcePositionDerivativeCommutatorProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L3BSourceOperatorHeisenbergProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L3CSourceOrbitalPositionCommutatorProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L3DSourceMixedDerivativeCommutatorProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L3ESourceOrbitalDerivativeCommutatorProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L4BOriginalSmoothCorePostcompCalculusProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L4CSourceAlgebraDataFermionActionInterfaceProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L4DConcreteSourceFockSpinCovarianceProbe.lean
      - .github/workflows/bfss-s3l-source-kinetic-coefficient.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-kinetic-coefficient:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out isolated S3L research source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check out exact pinned OpenAI Math dependency source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: openai/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Reclaim proven runner headroom before pinned large cache restore
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: Restore exact pinned Lean and Mathlib build environment
        id: dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake
            ~/.elan
          key: family270b-bridge-ubuntu-lean4341-openai-adc7f124-deformedcharge-v2

      - name: Fail closed on dependency cache miss or wrong pins
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.dependencies.outputs.cache-hit }}" = "true"
          test "$(cat upstream-math/lean/lean-toolchain)" = "leanprover/lean4:v4.34.1"
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' upstream-math/lean/lake-manifest.json
          test -x "$HOME/.elan/toolchains/leanprover--lean4---v4.34.1/bin/lean"
          test -s upstream-math/lean/.lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      - name: Restore exact qualified Gate 136 source-Clifford and fermionic proofs
        id: accepted_s3e
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: upstream-math/lean/.lake/build
          key: bfss-su2-accepted-s3e-v1-5ab0ee08dfca4565-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/openai-math-su2-concrete-potential/*.lean', 'upstream-math/lean/lean-toolchain', 'upstream-math/lean/lake-manifest.json') }}

      - name: Reject missing or wrong accepted source theorem dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.accepted_s3e.outputs.cache-hit }}" = "true"
          for m in SU2BFSSPhysicalDomainS3AActualGammaPlaneRotationProbe SU2BFSSPhysicalDomainS3BFullPlaneSpinVectorCovarianceProbe SU2BFSSPhysicalDomainS3EActualFermionSpinRotationLawProbe; do
            test -s "upstream-math/lean/.lake/build/lib/lean/$m.olean"
          done
          frozen=5ab0ee08dfca456574dcf3d877a9a9035d4be39f
          git fetch --quiet --no-tags --depth=1 origin "$frozen"
          for m in SU2BFSSPhysicalDomainS3AActualGammaPlaneRotationProbe SU2BFSSPhysicalDomainS3BFullPlaneSpinVectorCovarianceProbe; do
            p="experiments/openai-math-su2-physical-domain/$m.lean"
            test "$(git rev-parse "$frozen:$p")" = "$(git hash-object "$p")"
          done
          echo ACCEPTED_S3A_S3B_SOURCE_AND_OBJECTS_EXACT

      - name: Restore exact S3L0–S3L3A qualified Lean proof objects
        id: accepted_s3l3a_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainS3L0SourceKineticSpinorCoefficientProbe.olean
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainS3L1SourceOrbitalSmoothCoreProbe.olean
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainS3L2SourceGammaTwoSpatialCovarianceProbe.olean
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainS3L3ASourcePositionDerivativeCommutatorProbe.olean
          key: bfss-s3l3a-source-objects-v1-3012fa8a6f5c1d59-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L0*.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L1*.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L2*.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L3A*.lean', 'upstream-math/lean/lean-toolchain', 'upstream-math/lean/lake-manifest.json') }}

      - name: Kernel-check cached S3L0–S3L3A modules and immutable source
        if: ${{ steps.accepted_s3l3a_cache.outputs.cache-hit == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          git fetch --quiet --no-tags --depth=1 origin 3012fa8a6f5c1d599af47d1fc7204d1703a062c0
          frozen=3012fa8a6f5c1d599af47d1fc7204d1703a062c0
          for m in \
            SU2BFSSPhysicalDomainS3L0SourceKineticSpinorCoefficientProbe \
            SU2BFSSPhysicalDomainS3L1SourceOrbitalSmoothCoreProbe \
            SU2BFSSPhysicalDomainS3L2SourceGammaTwoSpatialCovarianceProbe \
            SU2BFSSPhysicalDomainS3L3ASourcePositionDerivativeCommutatorProbe
          do
            p="experiments/openai-math-su2-physical-domain/$m.lean"
            test "$(git rev-parse "$frozen:$p")" = "$(git hash-object "$p")"
            test -s "upstream-math/lean/.lake/build/lib/lean/$m.olean"
          done
          cd upstream-math/lean
          cat > S3LAcceptedCacheSmoke.lean <<'LEAN'
          import SU2BFSSPhysicalDomainS3L0SourceKineticSpinorCoefficientProbe
          import SU2BFSSPhysicalDomainS3L1SourceOrbitalSmoothCoreProbe
          import SU2BFSSPhysicalDomainS3L2SourceGammaTwoSpatialCovarianceProbe
          import SU2BFSSPhysicalDomainS3L3ASourcePositionDerivativeCommutatorProbe
          #print axioms FCP.BFSSSU2PhysicalDomainS3L0.pairedKineticSpinorCoefficient_exact
          #print axioms FCP.BFSSSU2PhysicalDomainS3L1.pairedSourceOrbitalPlaneGenerator_apply
          #print axioms FCP.BFSSSU2PhysicalDomainS3L2.pairedGammaTwo_source_spatial_commutator
          #print axioms FCP.BFSSSU2PhysicalDomainS3L2.pairedGammaTwo_potential_spinor_coefficient_exact
          #print axioms FCP.BFSSSU2PhysicalDomainS3L3A.sourceCoordinateDerivative_position_commutator_apply
          LEAN
          timeout 90s lake env lean S3LAcceptedCacheSmoke.lean 2>&1 | tee /tmp/s3l-cache-axioms.log
          python3 - <<'PY'
          import re
          s=open('/tmp/s3l-cache-axioms.log').read()
          a=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",s)
          assert len(a)==5, a
          for name,ax in a:
            assert {x.strip() for x in ax.split(',')} <= {'propext','Classical.choice','Quot.sound'},(name,ax)
          assert 'sorryAx' not in s and 'error:' not in s,s[-4000:]
          print('S3L3A_IMMUTABLE_SOURCE_OBJECTS_KERNEL_REQUALIFIED')
          PY
      - name: Compile exact S3L0 coefficient and reject nonstandard axioms
        if: ${{ steps.accepted_s3l3a_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS3L0SourceKineticSpinorCoefficientProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          timeout 140s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee /tmp/s3l0-axioms.log
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import re
          s=open('/tmp/s3l0-axioms.log').read()
          names=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",s)
          assert [n for n,_ in names]==[
            'FCP.BFSSSU2PhysicalDomainS3L0.pairedKineticSpinorCoefficient_exact'], names
          allowed={'propext','Classical.choice','Quot.sound'}
          for n,axioms in names:
            assert {v.strip() for v in axioms.split(',')} <= allowed,(n,axioms)
          assert 'sorryAx' not in s and 'error:' not in s, s[-4000:]
          print('S3L0_PINNED_SOURCE_KINETIC_COEFFICIENT_PASS')
          PY

      - name: Compile source S3L1 genuine orbital SmoothCore generator
        if: ${{ steps.accepted_s3l3a_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS3L1SourceOrbitalSmoothCoreProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          timeout 140s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee /tmp/s3l1-axioms.log
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import re
          s=open('/tmp/s3l1-axioms.log').read()
          names=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",s)
          assert [n for n,_ in names]==[
            'FCP.BFSSSU2PhysicalDomainS3L1.pairedSourceOrbitalPlaneGenerator_apply'], names
          allowed={'propext','Classical.choice','Quot.sound'}
          for n,axioms in names:
            assert {v.strip() for v in axioms.split(',')} <= allowed,(n,axioms)
          assert 'sorryAx' not in s and 'error:' not in s, s[-4000:]
          print('S3L1_ORIGINAL_SMOOTH_CORE_ORBITAL_GENERATOR_PASS')
          PY

      - name: Compile S3L2 literal cubic gammaTwo spatial covariance
        if: ${{ steps.accepted_s3l3a_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS3L2SourceGammaTwoSpatialCovarianceProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainS3L0SourceKineticSpinorCoefficientProbe.olean
          timeout 140s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee /tmp/s3l2-axioms.log
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import re
          s=open('/tmp/s3l2-axioms.log').read()
          names=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",s)
          assert [n for n,_ in names]==[
            'FCP.BFSSSU2PhysicalDomainS3L2.pairedGammaTwo_source_spatial_commutator',
            'FCP.BFSSSU2PhysicalDomainS3L2.pairedGammaTwo_potential_spinor_coefficient_exact'], names
          allowed={'propext','Classical.choice','Quot.sound'}
          for n,axioms in names:
            assert {v.strip() for v in axioms.split(',')} <= allowed,(n,axioms)
          assert 'sorryAx' not in s and 'error:' not in s, s[-4000:]
          print('S3L2_ACTUAL_GAMMATWO_SPATIAL_COVARIANCE_PASS')
          PY

      - name: Compile S3L3A original SmoothCore derivative-position commutator
        if: ${{ steps.accepted_s3l3a_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS3L3ASourcePositionDerivativeCommutatorProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainS3L1SourceOrbitalSmoothCoreProbe.olean
          timeout 140s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee /tmp/s3l3a-axioms.log
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import re
          s=open('/tmp/s3l3a-axioms.log').read()
          names=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",s)
          assert [n for n,_ in names]==['FCP.BFSSSU2PhysicalDomainS3L3A.sourceCoordinateDerivative_position_commutator_apply'],names
          for n,axioms in names:
            assert {v.strip() for v in axioms.split(',')} <= {'propext','Classical.choice','Quot.sound'},(n,axioms)
          assert 'sorryAx' not in s and 'error:' not in s,s[-4000:]
          print('S3L3A_SOURCE_POSITION_DERIVATIVE_CANONICAL_COMMUTATOR_PASS')
          PY

      - name: Save immutable qualified S3L0–S3L3A Lean proof objects
        if: ${{ steps.accepted_s3l3a_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainS3L0SourceKineticSpinorCoefficientProbe.olean
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainS3L1SourceOrbitalSmoothCoreProbe.olean
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainS3L2SourceGammaTwoSpatialCovarianceProbe.olean
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainS3L3ASourcePositionDerivativeCommutatorProbe.olean
          key: bfss-s3l3a-source-objects-v1-3012fa8a6f5c1d59-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L0*.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L1*.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L2*.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L3A*.lean', 'upstream-math/lean/lean-toolchain', 'upstream-math/lean/lake-manifest.json') }}

      - name: Compile S3L3B exact source operator-level Heisenberg commutator
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS3L3BSourceOperatorHeisenbergProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainS3L3ASourcePositionDerivativeCommutatorProbe.olean
          timeout 140s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee /tmp/s3l3b-axioms.log
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import re
          s=open('/tmp/s3l3b-axioms.log').read()
          names=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",s)
          assert [n for n,_ in names]==['FCP.BFSSSU2PhysicalDomainS3L3B.sourceCoordinateDerivative_position_commutator_operator'],names
          for n,ax in names:
            assert {v.strip() for v in ax.split(',')} <= {'propext','Classical.choice','Quot.sound'},(n,ax)
          assert 'sorryAx' not in s and 'error:' not in s,s[-4000:]
          print('S3L3B_GENUINE_ENDOMORPHISM_COMMUTATOR_PASS')
          PY

      - name: Compile S3L3C exact orbital-position rotation commutator
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS3L3CSourceOrbitalPositionCommutatorProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainS3L3BSourceOperatorHeisenbergProbe.olean
          timeout 180s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee /tmp/s3l3c-axioms.log
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import re
          s=open('/tmp/s3l3c-axioms.log').read()
          names=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",s)
          expected=['FCP.BFSSSU2PhysicalDomainS3L3C.sourcePosition_comp_comm',
                    'FCP.BFSSSU2PhysicalDomainS3L3C.pairedSourceOrbital_comm_position']
          assert [n for n,_ in names]==expected,names
          for n,ax in names:
            assert {v.strip() for v in ax.split(',')} <= {'propext','Classical.choice','Quot.sound'},(n,ax)
          assert 'sorryAx' not in s and 'error:' not in s,s[-4000:]
          print('S3L3C_SOURCE_ORBITAL_POSITION_COVARIANCE_PASS')
          PY

      - name: Compile S3L3D mixed coordinate derivatives on original SmoothCore
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS3L3DSourceMixedDerivativeCommutatorProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainS3L3CSourceOrbitalPositionCommutatorProbe.olean
          timeout 180s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee /tmp/s3l3d-axioms.log
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import re
          s=open('/tmp/s3l3d-axioms.log').read()
          names=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",s)
          assert [n for n,_ in names]==['FCP.BFSSSU2PhysicalDomainS3L3D.sourceCoordinateDerivative_comp_comm'],names
          for n,ax in names:
            assert {v.strip() for v in ax.split(',')} <= {'propext','Classical.choice','Quot.sound'},(n,ax)
          assert 'sorryAx' not in s and 'error:' not in s,s[-4000:]
          print('S3L3D_SOURCE_MIXED_DERIVATIVES_COMMUTE_PASS')
          PY

      - name: Compile S3L3E exact orbital-derivative covariance
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS3L3ESourceOrbitalDerivativeCommutatorProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainS3L3DSourceMixedDerivativeCommutatorProbe.olean
          timeout 180s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee /tmp/s3l3e-axioms.log
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import re
          s=open('/tmp/s3l3e-axioms.log').read()
          names=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",s)
          assert [n for n,_ in names]==['FCP.BFSSSU2PhysicalDomainS3L3E.pairedSourceOrbital_comm_derivative'],names
          for n,ax in names:
            assert {v.strip() for v in ax.split(',')} <= {'propext','Classical.choice','Quot.sound'},(n,ax)
          assert 'sorryAx' not in s and 'error:' not in s,s[-4000:]
          print('S3L3E_SOURCE_ORBITAL_DERIVATIVE_COVARIANCE_PASS')
          PY

      - name: Compile S3L4B generic original-source postcomp calculus only
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS3L4BOriginalSmoothCorePostcompCalculusProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainS3L3ESourceOrbitalDerivativeCommutatorProbe.olean
          timeout 180s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee /tmp/s3l4b-axioms.log
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import re
          s=open('/tmp/s3l4b-axioms.log').read()
          expected=[
            'FCP.BFSSSU2PhysicalDomainS3L4B.sourcePostcomp_apply',
            'FCP.BFSSSU2PhysicalDomainS3L4B.sourcePostcomp_comm',
            'FCP.BFSSSU2PhysicalDomainS3L4B.sourcePostcomp_sum',
            'FCP.BFSSSU2PhysicalDomainS3L4B.sourcePostcomp_comm_position',
            'FCP.BFSSSU2PhysicalDomainS3L4B.sourcePostcomp_comm_derivative',
            'FCP.BFSSSU2PhysicalDomainS3L4B.sourcePostcomp_covariance']
          pat=re.compile(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)")
          matches=pat.findall(s)
          assert [n for n,_ in matches]==expected,matches
          for n,ax in matches:
            assert {v.strip() for v in ax.split(',') if v.strip()} <= {'propext','Classical.choice','Quot.sound'},(n,ax)
          assert 'sorryAx' not in s and 'error:' not in s,s[-4000:]
          print('S3L4B_ORIGINAL_SMOOTHCORE_POSTCOMP_CALCULUS_PASS')
          PY

      - name: Compile S3L4C exact source AlgebraData fermionAction interface
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS3L4CSourceAlgebraDataFermionActionInterfaceProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainS3L4BOriginalSmoothCorePostcompCalculusProbe.olean
          timeout 180s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee /tmp/s3l4c-axioms.log
