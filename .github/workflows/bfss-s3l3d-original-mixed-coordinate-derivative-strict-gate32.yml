name: BFSS S3L3D Original Mixed Coordinate Derivatives Strict Gate 32

# Independently test unchanged original S3L3D mixed-derivative source theorem.
# Qualified Gate31 C cache preferred, or fully rebuild S3L1/A/B/C from accepted Gate23 source cache.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s3l3d-original-mixed-coordinate-derivative-strict-gate32.yml
permissions:
  contents: read
concurrency:
  group: bfss-s3l3d-gate32-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-source-coefficient:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - name: Checkout research source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout pinned original BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: Pin canonical R4A ancestry and next original S3L3C D source blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s3l3d-gate32
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json,pathlib,subprocess
          manifest=json.loads(pathlib.Path("upstream-math/lean/lake-manifest.json").read_text())
          assert next(p["rev"] for p in manifest["packages"] if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          pinned={"experiments/openai-math-su2-physical-domain/BFSS_S3L3D_PROOF_ONLY_SIMPA_COMPAT_V14_2026_10_25.py":"0ccf27c9bc63c39f8899494665e6bc9153a5133a","experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L5K2R4AThreeIndexOriginalSourceSumTransportProbe.lean":"ef803c1b5c62a819e568c5a645c5e622ec1a0d6f","experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L3ASourcePositionDerivativeCommutatorProbe.lean":"aa47f20d0c14374659aee0bf24c6361e464386ad","experiments/openai-math-su2-physical-domain/recovery/S3L3AOriginalSourceProofOnlyDeprecationGate28V4.lean":"a1586fdcbadd829ac7d57cfb4f8c2dab7ae655c1","experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L3BSourceOperatorHeisenbergProbe.lean":"19a7eb6a710fe6d4b531dc0eefba7ee27ed21dca","experiments/openai-math-su2-physical-domain/recovery/S3L3BOriginalSourceIsolatedConditionSimpGate29V8.lean":"77e1f88788981fa0a34134e5e0670be624d5ba61","experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L3CSourceOrbitalPositionCommutatorProbe.lean":"25b4c92b94b6d2e1f708eeb446ec5fda094400f1","experiments/openai-math-su2-physical-domain/recovery/S3L3COriginalSourceExplicitReverseInequalityGate31V12.lean":"2c12dd05f737836456983548c7393088d23fec3b","experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3L3DSourceMixedDerivativeCommutatorProbe.lean":"dc3badcb9731872359d457dfd7c91cebb5aaff25","experiments/openai-math-su2-physical-domain/recovery/S3L3DOriginalSourceUnnecessarySimpaGate32V14.lean":"c44c8b4f18e8ea7ef5b3b7b1a99b6df76a3f4298"}
          for path,sha in pinned.items():
              assert subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip()==sha,("BAD_SOURCE_GIT_BLOB",path)
              assert subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()==sha,("MUTATED_WORKTREE",path)
          print("GATE28_CANONICAL_WALKER_AND_R4A_SOURCE_BLOBS_IMMUTABLE")
          PY
      - name: Reclaim runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
      - name: Restore frozen Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true
          cd upstream-math/lean
          timeout 1080s lake exe cache get > /tmp/bfss-s3l3d-gate32/mathlib.log 2>&1 || {
            tail -n 100 /tmp/bfss-s3l3d-gate32/mathlib.log
            exit 1
          }
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
