      - name: Verify both qualified native and original source parent graphs and rebuild exact H2D2B if cache unavailable
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          test "${{ steps.nativeAncestor.outputs.cache-hit }}" = true || { echo H3A_ACCEPTED_H2D2A_NATIVE_HILBERT_PARENT_ARCHIVE_MISSING; exit 1; }
          base=upstream-math/lean/.lake/build/lib/lean
          for stem in SU2BFSSPhysicalDomainL6H5E8AYOriginalPhysicalHilbertChargeGraphProbe SU2BFSSPhysicalDomainL6H5E8BFOriginalSourceGraphAndPairedHamiltonianProbe SU2BFSSPhysicalDomainL6H5E8BHOriginalHistoricalPairedHamiltonianEqualityProbe FCPM4F9H2D2ANativeHilbertE2ContinuityAndDensity FCPM4F8IndependentActualE2FullPhysicalDomainDE2B FCPM4F9H2D1ActualE2HilbertOutputDomainEquivalence FCPM4F9H2CActualE2NativeHilbertChargeColumn FCPM4F9H2BPhysicalHilbertE2GraphRebase FCPM4F9H2APhysicalHilbertOutputUnitary FCPM4F8OriginalNamedFullPhysicalGraphDE4; do
            test -s "$base/$stem.olean" || { echo "H3A_QUALIFIED_PARENT_MISSING=$stem"; exit 1; }
          done
          if test "${{ steps.parent.outputs.cache-hit }}" = true && test -s "$base/FCPM4F9H2D2BNativeHilbertE2ClosedGraph.olean"; then
            echo H3A_ORIGINAL_H2D2B_CACHE_RESTORED
          else
            echo H3A_H2D2B_SAVED_ARCHIVE_UNAVAILABLE__REBUILD_UNMODIFIED_ACCEPTED_SOURCE
            source "$HOME/.elan/env"
            python3 - <<'PY'
          import subprocess
          p='experiments/openai-math-su2-physical-domain/FCPM4F9H2D2BNativeHilbertE2ClosedGraph.lean'
          expect='c61be772168804578f978990fdd8527b41d64610'
          actual=subprocess.check_output(['git','hash-object','--no-filters',p],text=True).strip()
          assert actual==expect,(actual,expect)
          print('H3A_H2D2B_REBUILD_LITERAL_ACCEPTED_BLOB_PASS')
          PY
            cp "experiments/openai-math-su2-physical-domain/FCPM4F9H2D2BNativeHilbertE2ClosedGraph.lean" upstream-math/lean/
            cd upstream-math/lean
            timeout 200s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/FCPM4F9H2D2BNativeHilbertE2ClosedGraph.olean" FCPM4F9H2D2BNativeHilbertE2ClosedGraph.lean 2>&1 | tee /tmp/bfss-m4f9-h3b1-gate1/FCPM4F9H2D2BNativeHilbertE2ClosedGraph.recompile.log
            test -s ".lake/build/lib/lean/FCPM4F9H2D2BNativeHilbertE2ClosedGraph.olean"
            python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/bfss-m4f9-h3b1-gate1/FCPM4F9H2D2BNativeHilbertE2ClosedGraph.recompile.log').read_text()
          name='FCP.M4F9H2D2BNativeHilbertE2ClosedGraph.independentActualE2NativeHilbertChargeColumn_isClosed'
          reports=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          got={n:{t.strip() for t in a.split(',') if t.strip()} for n,a in reports}
          assert len(reports)==1 and set(got)=={name},reports
          assert got[name] <= {'propext','Classical.choice','Quot.sound'},got
          assert 'sorryAx' not in s and 'error:' not in s, s[-6000:]
          print('H3A_H2D2B_ORIGINAL_ACCEPTED_THEOREM_RECOMPILED_STRICT_PASS')
          PY
            cd ../..
          fi
          test -s "$base/FCPM4F9H2D2BNativeHilbertE2ClosedGraph.olean" || { echo H3A_CLOSED_E2_GRAPH_MISSING_AFTER_REBUILD; exit 1; }
          echo M4F9_H3A_QUALIFIED_SOURCE_AND_NATIVE_CLOSED_OPERATOR_ANCESTRY_PASS

      - name: Recompile immutable accepted original AY paired H3A physical-output constraint
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=FCPM4F9H3AOriginalPairedPhysicalChargeOutputConstraint
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          timeout 240s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-m4f9-h3b1-gate1/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/bfss-m4f9-h3b1-gate1/FCPM4F9H3AOriginalPairedPhysicalChargeOutputConstraint.log').read_text()
          name='FCP.M4F9H3AOriginalPairedPhysicalChargeOutputConstraint.pairedOriginalMinimalPhysicalHilbertChargeGraph_outputs_physical'
          reports=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          got={n:{t.strip() for t in a.split(',') if t.strip()} for n,a in reports}
          assert len(reports)==len(got)==1 and set(got)=={name},('H3A_WRONG_ROOTS',reports)
          for n,axioms in got.items():
              assert axioms<={'propext','Classical.choice','Quot.sound'},(n,axioms)
          known={'belyi','formal-schemes','elliptic-curves',
                 'tempered-fundamental-groups','oka','orbicurve-cores',
                 'pi1','heights','genl','tate-curves-theta','iut'}
          checked=[]
          removed=0
          for line in s.splitlines():
              m=re.fullmatch(r"warning: ([a-z0-9-]+): repository '([^']+)' has local changes",line)
              if m:
                  package,path=m.groups()
                  if package in known and path.endswith('/upstream-math/lean/.lake/packages/'+package):
                      removed+=1
                      continue
              checked.append(line)
          checked='\n'.join(checked)
          assert not any(t in checked for t in ('sorryAx','error:','warning:','unknownIdentifier')),checked[-5000:]
          print('M4F9_H3A_LAKE_WARNINGS_EXACTLY_CLASSIFIED',removed)
          print('M4F9_H3A_ORIGINAL_AY_PHYSICAL_OUTPUT_CONSTRAINT_ONE_ROOT_STRICT_PASS')
          PY


