name: BFSS S1V37 Original48 Clifford Generator Rank-One Determinant Strict Gate

# Deliberate branch-isolated single candidate; source/audit edits do not
# cause CI. The workflow itself is the only push trigger.
on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v37-original48-generator-rankone-determinant-strict.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v37-source-generator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source48-generator-rankone:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout original FCP research sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout immutable original upstream BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Strict original source, SHA and toolchain preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v37
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          data=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in data['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          r=experiments/openai-math-su2-physical-domain
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.lean")" = 22f3101b243a7b7857d9597b547322174d9281c8
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V37Original48CliffordGeneratorRankOneDeterminantProbe.lean")" = 2d3d40134e4eaba80751c62a160d1803f22c828b
          echo S1V37_ORIGINAL_SOURCE_AND_TOOLCHAIN_PINS_PASS

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore immutable original Lean and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v37/toolchain.log; then
              ok=true; break
            fi
            echo ORIGINAL_PINNED_LEAN_RETRY_$attempt | tee -a /tmp/bfss-s1v37/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo PINNED_ORIGINAL_LEAN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v37/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo S1V37_PINNED_LEAN_MATHLIB_VERIFIED

      - name: Restore strictly accepted S1V36 source determinant character cache
        id: cache36
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v36-isolated-source48-real-spin-determinant-character-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed without qualified original source geometry
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.cache36.outputs.cache-hit }}" = true || { echo S1V36_ACCEPTED_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe SU2BFSSPhysicalDomainS1V35ActualSpin48RealAutomorphismGroupHomProbe SU2BFSSPhysicalDomainS1V36ActualSpin48OriginalRealDeterminantCharacterProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "S1V37_ACCEPTED_OLEAN_MISSING=$stem"; exit 1; }
          done
          echo S1V37_ACCEPTED_ORIGINAL_GEOMETRY_DEPENDENCIES_READY

      - name: Compile and strictly audit three independent original 48-real source roots
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=SU2BFSSPhysicalDomainS1V37Original48CliffordGeneratorRankOneDeterminantProbe
          cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
          timeout 600s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v37/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean" || { echo S1V37_ORIGINAL_ROOT_OLEAN_MISSING; exit 1; }
          python3 - <<'PY'
          import pathlib,re
          stem='SU2BFSSPhysicalDomainS1V37Original48CliffordGeneratorRankOneDeterminantProbe'
          src=pathlib.Path(stem+'.lean').read_text()
          log=pathlib.Path('/tmp/bfss-s1v37',stem+'.log').read_text()
          names=re.findall(r'^#print axioms (\S+)',src,re.M)
          expected=['source48_polar_inverse_self',
                    'source48_clifford_generator_conjugation',
                    'source48_rankOneConjugationMatrix_det']
          assert names==expected, names
          assert re.findall(r'^namespace (\S+)',src,re.M)==['FCP.BFSSS1V37']
          reports=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          found={k:{x.strip() for x in v.split(',') if x.strip()} for k,v in reports}
          assert len(reports)==len(found)==3,reports
          allowed={'propext','Classical.choice','Quot.sound'}
          for name in expected:
            key='FCP.BFSSS1V37.'+name
            assert key in found and found[key]<=allowed,(key,found)
          assert 'sorryAx' not in log and 'error:' not in log and 'unknownIdentifier' not in log,log[-9000:]
          print('S1V37_ORIGINAL_SOURCE48_GENERATOR_RANKONE_3_ROOTS_KERNEL_PASS')
          PY

      - name: Save qualified S1V37 cache only after strict green
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v37-isolated-source48-generator-rankone-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve source logs for failure diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v37-rankone-${{ github.run_id }}
          path: /tmp/bfss-s1v37/
          if-no-files-found: warn
