name: BFSS S4B35 Paired Genuine Source Smooth Core Energy Fast Strict

# First production consumer of separately qualified accepted Gate122 parent cache.
# New original-source statements must still compile fresh with approved axioms.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s4b35-paired-source-core-energy-fast-strict.yml
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B35PairedSourceSmoothCoreEnergyProbe.lean
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bfss-s4b35-paired-source-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  first-cached-leaf-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout pinned BFSS research
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout immutable upstream BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: Enforce exact original mathematics and new theorem source
        shell: bash
        run: |
          set -euo pipefail
          accepted="4d0738f4c00cad9e0e5e314df3680ff1647080a7"
          git merge-base --is-ancestor "$accepted" HEAD
          # Preserve every source that contributed to accepted Gate122.
          git diff --quiet "$accepted" HEAD -- \
            experiments/openai-math-su2-physical-domain \
            experiments/openai-math-su2-concrete-potential \
            ':(exclude)experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B35PairedSourceSmoothCoreEnergyProbe.lean'
          test "$(git rev-parse HEAD:experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B35PairedSourceSmoothCoreEnergyProbe.lean)" = "77a1a79f12a7cfdf68f47b6a2420633c1958731f"
          test "$(git hash-object --no-filters experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B35PairedSourceSmoothCoreEnergyProbe.lean)" = "77a1a79f12a7cfdf68f47b6a2420633c1958731f"
          test "$(git rev-parse HEAD:experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B34ConcretePauliPairedManuscriptBProbe.lean)" = "299c3a52dac98e4e6c78884935c14a8744644174"
          test "$(git -C upstream-math rev-parse HEAD)" = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
          test "$(cat upstream-math/lean/lean-toolchain)" = "leanprover/lean4:v4.34.1"
          python3 - <<'PY'
          import pathlib,json,re
          manifest=json.loads(pathlib.Path("upstream-math/lean/lake-manifest.json").read_text())
          assert next(p["rev"] for p in manifest["packages"] if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          src=pathlib.Path("experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B35PairedSourceSmoothCoreEnergyProbe.lean").read_text()
          assert re.findall(r"^theorem (\w+)",src,re.M)==[
            "pairedBosonicPotential_eq_wedge",
            "pairedOriginalSmoothCoreEnergy_eq_manuscript"]
          assert re.findall(r"^#print axioms (\w+)",src,re.M)==[
            "pairedBosonicPotential_eq_wedge",
            "pairedOriginalSmoothCoreEnergy_eq_manuscript"]
          assert "sorry" not in src
          print("FCP_BFSS_S4B35_EXACT_TWO_ROOTS_AND_SOURCES_PASS")
          PY
      - name: Require independently green parent checkpoint producer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s4b35
          # Bounded readiness check solely because this first experimental
          # fast gate may begin while the checkpoint qualification finishes.
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/etblink/Foundational-Convergence-Program/actions/runs/40464747798" > /tmp/bfss-s4b35/accepted-checkpoint-run.json
            if python3 - <<'PY'
          import json,sys
          x=json.load(open("/tmp/bfss-s4b35/accepted-checkpoint-run.json"))
          good=(x["id"]==40464747798 and x["run_attempt"]==1 and
             x["head_sha"]=="4b4b5dc7802458ad54e586debca057b31b62eadc" and
             x["status"]=="completed" and x["conclusion"]=="success")
          sys.exit(0 if good else 1)
          PY
            then
              echo FCP_BFSS_S4B34_INDEPENDENT_CACHE_PRODUCER_ACCEPTED
              exit 0
            fi
            sleep 15
          done
          echo FCP_BFSS_S4B34_CHECKPOINT_NOT_GREEN_FAIL_CLOSED
          exit 1
      - name: Restore exactly pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 19
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true
          cd upstream-math/lean
          timeout 920s lake exe cache get > /tmp/bfss-s4b35/mathlib-cache.log 2>&1 || {
            tail -n 60 /tmp/bfss-s4b35/mathlib-cache.log; exit 1;
          }
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
      - name: Restore exact qualified historical G4K9A/B/C source ancestry
        id: g4k9ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM3*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependent*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4E5*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentFullSmoothCharge.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentChargeVectorL2.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentFullCoreGraph.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentFullCoreGraphImage.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentGraphTransportHomeomorph.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentFullCoreGraphClosure.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7FullClosedGraphVerticalB4CoeAlign.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7GenericOpaqueClosedRelationBridgeImports.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentFullClosedChargeOperatorE1.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentPhysicalInputCutOperatorE2.olean
            upstream-math/lean/.lake/build/lib/lean/FCPRestrictedGraphInputCut.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F6PairedSourceGraphInputCut.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F6IndependentLiteralAliasBoundary.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F6GenericNamedAliasInputCut.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F6IndependentGraphInputCutNamedAlias.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentLiteralRestrictedGraphBridgeE3.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentClosedChargePhysicalInputE6.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F1PairedSourceSpecialization.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F1TypedIndependentInvariantCharge.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentChargeOutputTypedE7A.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7GenericClosedRangeOutputsE7G.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7OpaqueLiteralGraphInterfaceE7D.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentNamedSmoothGraphMapsE7K.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7NamedSmoothGraphIdentityE7K2.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7NamedClosedSmoothGraphIdentityE7K3.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7GenericOpaqueOutputConstraintE7H.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentPhysicalOutputPredicateE7I.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7NamedConditionalPhysicalOutputBridgeE7L.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentLiteralClosedPhysicalOutputsE7M.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentActualClosedGraphNamedBridgeE7N1.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentActualClosedPhysicalOutputsE7N2.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentInvariantCoreL2ImageDA.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentConditionalPhysicalCoreDensityDB.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentE2ConditionalPhysicalDomainDenseDD.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentE2UnconditionalPhysicalDomainDenseDC.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentActualE2PhysicalInputRebaseDE1.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentActualE2PhysicalInputRebaseDE1B.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentActualE2PhysicalInputRebaseDE1C.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentActualE2FullPhysicalGraphRebaseDE2.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentActualE2FullPhysicalDomainDE2B.olean
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSG4K9ASourceChargeCoefficientCrosswalkProbe.olean
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSG4K9BSourcePairAndChargeReductionProbe.olean
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSG4K9COrderedPairCoefficientProbe.olean
          key: bfss-fcp-m4f8-de3b-g4k9bc-source-unchanged-b3bc2712-gate1-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}
      - name: Restore independently qualified Gate122 real Pauli-Fock combined parents
        id: acceptedS4B34
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/BFSSAcceptedS4B34ParentCacheConsumer.olean
          key: bfss-fcp-s4b34-accepted-gate122-source-4d0738f4-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}
      - name: Fail closed on cache and import all genuine accepted parents
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          test "${{ steps.g4k9ccache.outputs.cache-hit }}" = true
          test "${{ steps.acceptedS4B34.outputs.cache-hit }}" = true
          for stem in OAI/MathematicalPhysics/BFSS/ClosedProfiles \
            SU2BFSSG4K9COrderedPairCoefficientProbe \
            SU2BFSSPhysicalDomainS4B7OriginalRealFockFieldPolynomialProbe \
            SU2BFSSPhysicalDomainS4B33OriginalManuscriptBCoordinateOperatorBridgeProbe \
            SU2BFSSPhysicalDomainS4B34ConcretePauliPairedManuscriptBProbe \
            SU2BFSSG1APairedThetaProbe \
            BFSSAcceptedS4B34ParentCacheConsumer; do
            test -s "upstream-math/lean/.lake/build/lib/lean/$stem.olean"
          done
          source "$HOME/.elan/env"
          cd upstream-math/lean
          cat > BFSSS4B35ExactAcceptedParentImport.lean <<'LEAN'
          import SU2BFSSPhysicalDomainS4B34ConcretePauliPairedManuscriptBProbe
          #print axioms FCP.BFSSSU2PhysicalDomainS4B34.concretePauliPairedRealFockField_eq_B
          LEAN
          timeout 100s lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/BFSSS4B35ExactAcceptedParentImport.olean \
            BFSSS4B35ExactAcceptedParentImport.lean > /tmp/bfss-s4b35/imported-accepted-parent.log 2>&1 || {
              tail -n 80 /tmp/bfss-s4b35/imported-accepted-parent.log; exit 1;
            }
          grep -q "'FCP.BFSSSU2PhysicalDomainS4B34.concretePauliPairedRealFockField_eq_B' depends on axioms:" /tmp/bfss-s4b35/imported-accepted-parent.log
          echo FCP_BFSS_S4B35_QUALIFIED_ACCEPTED_PARENTS_IMPORTED
      - name: Freshly compile two original-source paired smooth-core theorem candidates
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          python3 - <<'PY'
          import pathlib,re,subprocess
          stem="SU2BFSSPhysicalDomainS4B35PairedSourceSmoothCoreEnergyProbe"
          work=pathlib.Path("upstream-math/lean")
          src=pathlib.Path("experiments/openai-math-su2-physical-domain")/(stem+".lean")
          (work/(stem+".lean")).write_bytes(src.read_bytes())
          obj=work/".lake/build/lib/lean"/(stem+".olean")
          if obj.exists(): obj.unlink()
          log=pathlib.Path("/tmp/bfss-s4b35/strict-b35-candidate.log")
          with log.open("w") as out:
            run=subprocess.run(["timeout","270s","lake","env","lean","-DwarningAsError=true",
              "-o",".lake/build/lib/lean/"+stem+".olean",stem+".lean"],
              cwd=work,stdout=out,stderr=subprocess.STDOUT)
          data=log.read_text()
          reported=re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",data)
          expected=[
            "FCP.BFSSSU2PhysicalDomainS4B35.pairedBosonicPotential_eq_wedge",
            "FCP.BFSSSU2PhysicalDomainS4B35.pairedOriginalSmoothCoreEnergy_eq_manuscript"
          ]
          allowed={"propext","Classical.choice","Quot.sound"}
          notices=re.compile(r"warning: (?P<package>[a-z0-9-]+): repository '[^']*/upstream-math/lean/[.]lake/packages/(?P=package)' has local changes")
          warnings=[l for l in data.splitlines() if "warning:" in l and not notices.fullmatch(l)]
          print("FCP_BFSS_S4B35_COMPILER_EXIT",run.returncode,"REPORTS",reported,"WARNINGS",warnings,flush=True)
          verified=(run.returncode==0 and [n for n,_ in reported]==expected and
            all({s.strip() for s in ax.split(",") if s.strip()}<=allowed for _,ax in reported) and
            not warnings and "sorryAx" not in data and "error:" not in data and
            obj.is_file() and obj.stat().st_size>0)
          if not verified:
            print("FCP_BFSS_S4B35_TWO_ROOTS_STRICT_RED",data[-7000:],flush=True)
            raise SystemExit(1)
          print("FCP_BFSS_S4B35_PAIRED_SMOOTH_CORE_TWO_ROOTS_STRICT_PASS",flush=True)
          PY
      - name: Save newly accepted S4B35 original-source leaf only
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainS4B35PairedSourceSmoothCoreEnergyProbe.olean
          key: bfss-fcp-s4b35-paired-source-energy-77a1a79f12a7cfdf68f47b6a2420633c1958731f-v2-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}
      - name: Preserve full fast leaf compile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s4b35-candidate-strict-${{ github.run_id }}
          path: |
            /tmp/bfss-s4b35/*.log
            /tmp/bfss-s4b35/*.json
          if-no-files-found: warn
