            upstream-math/lean/.lake/build/lib/lean/SU2BFSSG4K9COrderedPairCoefficientProbe.olean
          key: bfss-fcp-m4f8-de3b-g4k9bc-source-unchanged-b3bc2712-gate1-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed on accepted parent archive and imported source objects
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.sourcebc.outputs.cache-hit }}" = true || { echo M4F8_DE3C_GATE1_QUALIFIED_K9BC_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in OAI/MathematicalPhysics/BFSS/ClosedProfiles SU2BFSSG4K9ASourceChargeCoefficientCrosswalkProbe SU2BFSSG4K9BSourcePairAndChargeReductionProbe SU2BFSSG4K9COrderedPairCoefficientProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo M4F8_DE3C_GATE1_REQUIRED_PARENT_OLEAN_MISSING=$stem; exit 1; }
          done

      - name: Compile unchanged original G4K9D then G4K10A then D1 and validate fourteen axiom reports
        shell: bash
        timeout-minutes: 14
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          for stem in SU2BFSSG4K9DSourcePotentialMultiplierProbe SU2BFSSG4K10ASourceClosedJointChargeGraphProbe SU2BFSSPhysicalDomainD1RestrictedSourceGraphProbe; do
            if [ "$stem" = SU2BFSSPhysicalDomainD1RestrictedSourceGraphProbe ]; then
              orig="$GITHUB_WORKSPACE/experiments/openai-math-su2-physical-domain/$stem.lean"
            else
              orig="$GITHUB_WORKSPACE/experiments/openai-math-su2-concrete-potential/$stem.lean"
            fi
            cp "$orig" "$stem.lean"
            /usr/bin/time -f 'DE3C_RESOURCE_TIME %e CPU %P MAX_RSS_KB %M' -o "/tmp/bfss-de3c-original-k9d-k10a-d1-gate1/$stem.resource" \
              timeout --signal=TERM --kill-after=5s 240s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" >"/tmp/bfss-de3c-original-k9d-k10a-d1-gate1/$stem.log" 2>&1 || {
              code=$?
              echo M4F8_DE3C_GATE1_FRESH_LEAN_EXIT=$code
              grep -n 'error:' "/tmp/bfss-de3c-original-k9d-k10a-d1-gate1/$stem.log" | head -n 30 || true
              tail -n 100 "/tmp/bfss-de3c-original-k9d-k10a-d1-gate1/$stem.log"
              cat "/tmp/bfss-de3c-original-k9d-k10a-d1-gate1/$stem.resource" || true
              exit "$code"
            }
            test -s ".lake/build/lib/lean/$stem.olean"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          specs=[{"dir":"experiments/openai-math-su2-concrete-potential/","name":"SU2BFSSG4K9DSourcePotentialMultiplierProbe.lean","sha":"0695420e4e1d6fbe8accdc4aee9df6dd2d52d1ca","imports":["SU2BFSSG4K9COrderedPairCoefficientProbe"],"publicNames":["sourcePotentialMultipliers_equal","sourceUnconditionalCoreCharge_equal","sourceUnconditionalCoreForm_equal"],"privateNames":["sourcePotentialCoefficientExpanded"],"ns":"FCP.BFSSSU2GaugeG4K9D."},{"dir":"experiments/openai-math-su2-concrete-potential/","name":"SU2BFSSG4K10ASourceClosedJointChargeGraphProbe.lean","sha":"65d86984f7c216950fbc96812bd011d9d09e968e","imports":["SU2BFSSG4K9DSourcePotentialMultiplierProbe","OAI.MathematicalPhysics.BFSS.ClosedProfiles"],"publicNames":["sourceChargeMap_equal","sourceChargeVector_equal","sourceCoreGraph_equal","sourceClosedJointChargeGraph_equal","sourceClosedJointChargeDomain_iff"],"privateNames":[],"ns":"FCP.BFSSSU2GaugeG4K10A."},{"dir":"experiments/openai-math-su2-physical-domain/","name":"SU2BFSSPhysicalDomainD1RestrictedSourceGraphProbe.lean","sha":"c601d5888e24d0a9bc8f62f2bff368fc29299b5d","imports":["SU2BFSSG4K10ASourceClosedJointChargeGraphProbe","OAI.MathematicalPhysics.BFSS.ClosedProfiles"],"publicNames":["sourceGaugeRestrictedGraphMap_equal","sourceGaugeRestrictedClosedGraph_equal","sourceGaugeRestrictedClosedDomain_iff","sourceGaugeRestrictedCoreForm_equal","sourceGaugeRestrictedGraph_le_full"],"privateNames":[],"ns":"FCP.BFSSSU2PhysicalDomainD1."}]
          all_reports={}
          for spec in specs:
              stem=spec['name'].removesuffix('.lean')
              log=(Path('/tmp/bfss-de3c-original-k9d-k10a-d1-gate1')/(stem+'.log')).read_text()
              reports=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
              ax={n:{z.strip() for z in raw.split(',') if z.strip()} for n,raw in reports}
              required={spec['ns']+name for name in spec['publicNames']}
              private={('_private.'+stem+'.0.'+spec['ns']+name) for name in spec['privateNames']}
              required |= private
              assert len(reports)==len(ax)==len(required) and set(ax)==required,('EXACT_ORIGINAL_ROOTS',stem,reports)
              assert all(a <= {'propext','Classical.choice','Quot.sound'} for a in ax.values()),('FORBIDDEN_AX',ax)
              assert 'sorryAx' not in log and 'error:' not in log,('SORRY_OR_ERROR',stem)
              known=r"warning: [A-Za-z0-9_-]+: repository '[^']*/upstream-math/lean/\.lake/packages/[A-Za-z0-9_-]+' has local changes"
              bad=[line for line in log.splitlines() if 'warning:' in line and not re.fullmatch(known,line)]
              assert not bad,('UNKNOWN_WARNINGS',stem,bad)
              all_reports.update(ax)
          assert len(all_reports)==14,('EXPECTED_14',len(all_reports))
          print('M4F8_DE3C_GATE1_ORIGINAL_K9D_K10A_D1_FOURTEEN_STRICT_REPORTS_PASS',all_reports)
          PY
          cat /tmp/bfss-de3c-original-k9d-k10a-d1-gate1/*.resource

