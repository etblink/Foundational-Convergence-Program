name: BFSS M4F8 DE3C Original Source G4K9D G4K10A D1 Strict Gate 1

# Qualified original-source ancestry before named E5; self-path trigger only.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-m4f8-de3c-original-source-g4k9d-g4k10a-d1-strict-gate1.yml

permissions:
  contents: read

concurrency:
  group: bfss-m4f8-de3-physical-source-graph-source-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-source-ancestry:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - name: Checkout isolated research sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout immutable original BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Fail-closed frozen source G4K9D G4K10A D1 and exact theorem identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-de3c-original-k9d-k10a-d1-gate1
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,re
          d=json.loads(Path('upstream-math/lean/lake-manifest.json').read_text())
          assert next(x['rev'] for x in d['packages'] if x['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          cfg=[{"dir":"experiments/openai-math-su2-concrete-potential/","name":"SU2BFSSG4K9DSourcePotentialMultiplierProbe.lean","sha":"0695420e4e1d6fbe8accdc4aee9df6dd2d52d1ca","imports":["SU2BFSSG4K9COrderedPairCoefficientProbe"],"publicNames":["sourcePotentialMultipliers_equal","sourceUnconditionalCoreCharge_equal","sourceUnconditionalCoreForm_equal"],"privateNames":["sourcePotentialCoefficientExpanded"],"ns":"FCP.BFSSSU2GaugeG4K9D."},{"dir":"experiments/openai-math-su2-concrete-potential/","name":"SU2BFSSG4K10ASourceClosedJointChargeGraphProbe.lean","sha":"65d86984f7c216950fbc96812bd011d9d09e968e","imports":["SU2BFSSG4K9DSourcePotentialMultiplierProbe","OAI.MathematicalPhysics.BFSS.ClosedProfiles"],"publicNames":["sourceChargeMap_equal","sourceChargeVector_equal","sourceCoreGraph_equal","sourceClosedJointChargeGraph_equal","sourceClosedJointChargeDomain_iff"],"privateNames":[],"ns":"FCP.BFSSSU2GaugeG4K10A."},{"dir":"experiments/openai-math-su2-physical-domain/","name":"SU2BFSSPhysicalDomainD1RestrictedSourceGraphProbe.lean","sha":"c601d5888e24d0a9bc8f62f2bff368fc29299b5d","imports":["SU2BFSSG4K10ASourceClosedJointChargeGraphProbe","OAI.MathematicalPhysics.BFSS.ClosedProfiles"],"publicNames":["sourceGaugeRestrictedGraphMap_equal","sourceGaugeRestrictedClosedGraph_equal","sourceGaugeRestrictedClosedDomain_iff","sourceGaugeRestrictedCoreForm_equal","sourceGaugeRestrictedGraph_le_full"],"privateNames":[],"ns":"FCP.BFSSSU2PhysicalDomainD1."}]
          for s in cfg:
              p=Path(s['dir'])/s['name']
              assert subprocess.check_output(['git','rev-parse','HEAD:'+str(p)],text=True).strip()==s['sha'],('GIT_PIN',p)
              assert subprocess.check_output(['git','hash-object','--no-filters',str(p)],text=True).strip()==s['sha'],('FILE_PIN',p)
              code=p.read_text()
              assert code.startswith(''.join('import '+x+'\n' for x in s['imports'])),('ORIGINAL_IMPORTS',p)
              assert re.findall(r'^#print axioms (\S+)',code,re.M)==s['privateNames']+s['publicNames'],('EXACT_AXIOM_DECLARATIONS',p)
              assert not re.search(r'(?m)^[ \t]*(?:sorry|admit|axiom)\b|\bsorryAx\b',code.split('noncomputable section',1)[1]),('UNAPPROVED_SOURCE',p)
          print('M4F8_DE3C_GATE1_ORIGINAL_K9D_K10A_D1_SOURCE_BLOBS_EXACT_PASS')
          PY

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore pinned original Lean and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true
          cd upstream-math/lean
          timeout 1080s lake exe cache get > /tmp/bfss-de3c-original-k9d-k10a-d1-gate1/mathlib.log 2>&1 || {
            tail -n 100 /tmp/bfss-de3c-original-k9d-k10a-d1-gate1/mathlib.log
            exit 1
          }
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

