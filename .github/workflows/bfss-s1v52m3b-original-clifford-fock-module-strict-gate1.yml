name: BFSS S1V52M3B Exact Original Clifford Fock Module Strict Gate 1

# Explicit, single-path triggering only. Candidate lives at immutable sibling commit.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s1v52m3b-original-clifford-fock-module-strict-gate1.yml

permissions:
  contents: read

concurrency:
  group: bfss-m3b-original-clifford-module-gate1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-complex-clifford-module:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact qualified M3A research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout immutable source mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Pin source parents and fetch exact isolated M3B candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v52m3b
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          d=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in d['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          test "$(git rev-parse 'HEAD:experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52M3AOriginalComplexCliffordActionImageIrreducibilityProbe.lean')" = ca640e2667a1574cca750a76fb8eaab34f5e59a0
          test "$(git rev-parse 'HEAD:experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52M2OriginalComplexifiedCliffordFockRepresentationProbe.lean')" = fa67dfde6cb6a21a97180797bdf5e917e0b417d2
          test "$(git rev-parse 'HEAD:experiments/openai-math-su2-concrete-potential/SU2BFSSG1APairedThetaProbe.lean')" = 4f8fbf05a35c1d625746931b7ff0361b7ffc2ec4
          git fetch --no-tags --depth=1 origin research/fcp-m3b-clifford-module-20261021
          test "$(git rev-parse FETCH_HEAD)" = a886b954032b36bd4eee4a4847c46d29d210255e
          git show "FETCH_HEAD:experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52M3BOriginalComplexCliffordSimpleModuleProbe.lean" > /tmp/bfss-s1v52m3b/SU2BFSSPhysicalDomainS1V52M3BOriginalComplexCliffordSimpleModuleProbe.lean
          test "$(git hash-object --no-filters /tmp/bfss-s1v52m3b/SU2BFSSPhysicalDomainS1V52M3BOriginalComplexCliffordSimpleModuleProbe.lean)" = b215719469244884aa0a60c3cab9c95a448fa5f6
          echo M3B_EXACT_BRANCH_PARENT_TOOLCHAIN_AND_SOURCE_BLOB_PINS_PASS

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Install pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v52m3b/toolchain.log; then
              ok=true; break
            fi
            echo M3B_PINNED_LEAN_RETRY_$attempt | tee -a /tmp/bfss-s1v52m3b/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo M3B_PINNED_LEAN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v52m3b/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo M3B_PINNED_LEAN_MATHLIB_PASS

      - name: Restore exact accepted M3A qualified source cache
        id: cacheM3A
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v52m3a-original-clifford-fock-image-irreducible-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed on accepted M3A cache and source Fock modules
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.cacheM3A.outputs.cache-hit }}" = true || { echo M3B_M3A_QUALIFIED_PARENT_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for root in OAI/MathematicalPhysics/BFSS/Core SU2BFSSG1APairedThetaProbe SU2BFSSPhysicalDomainS1V52M2OriginalComplexifiedCliffordFockRepresentationProbe SU2BFSSPhysicalDomainS1V52M3AOriginalComplexCliffordActionImageIrreducibilityProbe; do
            test -s ".lake/build/lib/lean/$root.olean" || { echo "M3B_REQUIRED_QUALIFIED_OLEAN_MISSING: $root"; exit 1; }
          done
          echo M3B_M3A_QUALIFIED_CACHE_READY

      - name: Compile true M3B source and strict-check every new theorem
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=SU2BFSSPhysicalDomainS1V52M3BOriginalComplexCliffordSimpleModuleProbe
          cp "/tmp/bfss-s1v52m3b/$stem.lean" "$stem.lean"
          timeout 660s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v52m3b/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean" || { echo M3B_FRESH_SOURCE_OLEAN_MISSING; exit 1; }
          python3 - <<'PY'
          import pathlib,re
          stem="SU2BFSSPhysicalDomainS1V52M3BOriginalComplexCliffordSimpleModuleProbe"
          ns="FCP.BFSSS1V52M3B"
          roots=["originalComplexCliffordFockModule_smul",
                 "originalComplexCliffordFockModule_scalarTower",
                 "originalComplexCliffordFockModule_simple"]
          defs=["originalComplexCliffordFockModule"]
          src=pathlib.Path(stem+'.lean').read_text()
          log=pathlib.Path('/tmp/bfss-s1v52m3b',stem+'.log').read_text()
          assert re.findall(r'^namespace (\S+)',src,re.M)==[ns]
          assert re.findall(r'^theorem (\S+)',src,re.M)==roots
          assert re.findall(r'^noncomputable def (\S+)',src,re.M)==defs
          assert re.findall(r'^#print axioms (\S+)',src,re.M)==defs+roots
          rr=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          report={k:{x.strip() for x in v.split(',') if x.strip()} for k,v in rr}
          assert len(rr)==len(report)==4,rr
          for root in defs+roots:
            ax=report[ns+'.'+root]
            assert ax <= {'propext','Classical.choice','Quot.sound'},(root,ax)
          assert 'error:' not in log and 'sorryAx' not in log and 'unknownIdentifier' not in log,log[-9000:]
          print('M3B_ACTUAL_SOURCE_CLIFFORD_FOCK_MODULE_THREE_ROOTS_STRICT_PASS')
          PY

      - name: Save qualified M3B source action cache
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-fcp-m3b-original-clifford-simple-module-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve M3B original-source diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m3b-gate1-${{ github.run_id }}
          path: /tmp/bfss-s1v52m3b
          if-no-files-found: ignore
