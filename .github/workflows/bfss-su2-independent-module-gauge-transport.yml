name: BFSS SU2 Independent Module Gauge Transport

# New conditional relative-character theorem, NOT paper Spin48 equivalence.
# Gate #9: frozen Euler import closure rebuilt and audited (59 modules);
# S1G candidate had only duplicated post-simp and quarter-turn rw tactics.
# Gate #10 was launched at the exact source pin below. Manual-only prevents
# stale PR25 source diff from repeatedly replaying this expensive check.
on:
  pull_request:
    branches:
      - research/openai-math-su2-s3k-physical-spin-flow
    paths:
      - .github/workflows/bfss-su2-independent-module-gauge-transport.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-su2-independent-module-gauge-transport-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-exact-relative-gauge-character:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out frozen BFSS source and toolchain
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Verify original sources, proof blobs and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-su2-relative-character
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          python3 - <<'PY'
          import json
          d=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(x['rev'] for x in d['packages'] if x['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1ASchurScalarCommutantProbe.lean)" = fd5f9e0f3d36a52e3a0222116022a11a83c387d7
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1BRelativeGaugeImplementerProbe.lean)" = 2f508daa4e09989987d7d30000d4853671962621
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1DRelativeGaugeCharacterProbe.lean)" = 99ab414fc5d8d24157a6694c70c3f339b5947aa3
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2BFSSG4BFermionLinearTransportProbe.lean)" = c6270243d0f61e8ee415e378c0865d2954958472
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2BFSSG4HExactThetaCovarianceProbe.lean)" = 3ee402e49bbca8d90a232ddf5d34f578814549eb
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1ESourceRelativeGaugeCharacterReductionProbe.lean)" = cfee82b7531b00acfcdad4229cefe292c1ed9ca1
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1FSourceGaugeCurveHalvingProbe.lean)" = 79f34a8d5dc8c7d2ebcf605f709f4d9f2c6b2b14
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1GExactSourceRelativeCharacterTrivialityProbe.lean)" = e1fe07f84e4a1427b5b4d2b534bb32644e87b203
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1HSourceGaugeCovariantImplementerUniquenessProbe.lean)" = f4c02e412e06d93841696dc9b36e926ee93c33bb
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1IConditionalCliffordModuleGaugeTransportProbe.lean)" = 8fb5e258df5862c111a93241befe3da21f58dde6
          echo RELATIVE_CHARACTER_S1E_TO_S1I_SOURCE_BLOBS_PINNED

      - name: Reclaim disposable space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore exact accepted Lean Mathlib
        id: pinned
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake
            ~/.elan
          key: bfss-l6-pinned-env-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Restore accepted original SU2 Fock and gauge source closure
        id: accepted
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-l6g7w-accepted-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G[1-6]*Probe.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G7[A-W]*Probe.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1[A-B]*Probe.lean', 'experiments/openai-math-su2-concrete-potential/SU2*.lean') }}

      - name: Fail closed on compiler provenance and source artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.pinned.outputs.cache-hit }}" = true || { echo PINNED_LEAN_CACHE_MISSING; exit 1; }
          test "${{ steps.accepted.outputs.cache-hit }}" = true || { echo ACCEPTED_SOURCE_FOCK_CACHE_MISSING; exit 1; }
          source "$HOME/.elan/env"
          test "$(git -C upstream-math/lean/.lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          cd upstream-math/lean
          lake env lean --version | tee /tmp/bfss-su2-relative-character/compiler.txt
          grep -q 'version 4.34.1' /tmp/bfss-su2-relative-character/compiler.txt
          for stem in SU2BFSSG1APairedThetaProbe SU2BFSSG4BFermionLinearTransportProbe SU2BFSSG4HExactThetaCovarianceProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "QUALIFIED_UPSTREAM_GAUGE_OLEAN_MISSING=$stem"; exit 1; }
          done
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Core.olean

      - name: Rebuild S1A and S1B exact scalar commutant prerequisites
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          for stem in SU2BFSSPhysicalDomainS1ASchurScalarCommutantProbe SU2BFSSPhysicalDomainS1BRelativeGaugeImplementerProbe; do
            cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          done
          cd upstream-math/lean
          for stem in SU2BFSSPhysicalDomainS1ASchurScalarCommutantProbe SU2BFSSPhysicalDomainS1BRelativeGaugeImplementerProbe; do
            timeout 120s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 |
              tee "/tmp/bfss-su2-relative-character/$stem.log"
            test -s ".lake/build/lib/lean/$stem.olean"
          done
          python3 - <<'PY'
          import pathlib,re
          base=pathlib.Path('/tmp/bfss-su2-relative-character')
          for stem in ['SU2BFSSPhysicalDomainS1ASchurScalarCommutantProbe',
                       'SU2BFSSPhysicalDomainS1BRelativeGaugeImplementerProbe']:
              s=(base/(stem+'.log')).read_text()
              m=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
              assert len(m)==1,(stem,m)
              for name,axes in m:
                  assert {x.strip() for x in axes.split(',') if x.strip()}<={'propext','Classical.choice','Quot.sound'},(stem,name,axes)
              assert 'error:' not in s and 'sorryAx' not in s and 'unknownIdentifier' not in s,stem
          print('S1A_S1B_EXACT_SCALAR_IMPLEMENTER_CONDITIONAL_PREREQUISITES_KERNEL_PASS')
          PY

      - name: Strictly test source relative scalar group character
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS1DRelativeGaugeCharacterProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          timeout 190s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 |
            tee "/tmp/bfss-su2-relative-character/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/bfss-su2-relative-character/SU2BFSSPhysicalDomainS1DRelativeGaugeCharacterProbe.log').read_text()
          roots=['relativeGaugeScalar','relativeGaugeScalar_apply','relativeGaugeScalar_one',
                 'relativeGaugeScalar_mul','relativeGaugeScalar_ne_zero']
          m=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          got={name:{a.strip() for a in ax.split(',') if a.strip()} for name,ax in m}
          assert len(m)==len(roots),(got,roots)
          for x in roots:
              key='FCP.BFSSSU2PhysicalDomainS1D.'+x
              assert key in got,(key,got)
              assert got[key]<={'propext','Classical.choice','Quot.sound'},(key,got[key])
          assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,s[-3500:]
          print('S1D_SOURCE_SU2_RELATIVE_GAUGE_SCALAR_CHARACTER_5_ROOTS_KERNEL_PASS')
          PY

      - name: Strictly test S1E source relative gauge character reduction
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS1ESourceRelativeGaugeCharacterReductionProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainL6G6XOriginalSU2GaugeCurveProbe.olean || { echo EXACT_SOURCE_GAUGE_CURVE_OLEAN_MISSING; exit 1; }
          timeout 190s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 |
            tee "/tmp/bfss-su2-relative-character/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/bfss-su2-relative-character/SU2BFSSPhysicalDomainS1ESourceRelativeGaugeCharacterReductionProbe.log').read_text()
          roots=['scalar_character_conjugation_invariant','scalar_character_rooted_curve_trivial',
                 'scalar_character_trivial_of_zyz','sourceZ','sourceY',
                 'original_relativeGaugeScalar_one_of_curve_relations']
          m=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          got={name:{a.strip() for a in ax.split(',') if a.strip()} for name,ax in m}
          assert len(m)==len(roots),(got,roots)
          for x in roots:
              key='FCP.BFSSSU2PhysicalDomainS1E.'+x
              assert key in got,(key,got)
              assert got[key]<={'propext','Classical.choice','Quot.sound'},(key,got[key])
          assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,s[-3500:]
          print('S1E_SOURCE_RELATIVE_CHARACTER_CONDITIONAL_REDUCTION_6_ROOTS_KERNEL_PASS')
          PY

      - name: Strictly test original positive-i SU2 gauge curve identities
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS1FSourceGaugeCurveHalvingProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          timeout 190s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 |
            tee "/tmp/bfss-su2-relative-character/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/bfss-su2-relative-character/SU2BFSSPhysicalDomainS1FSourceGaugeCurveHalvingProbe.log').read_text()
          roots=['original_source_curve_half','original_source_curve_neg_eq_inv',
                 'original_source_z_half','original_source_y_half',
                 'original_source_z_neg_eq_inv','original_source_y_neg_eq_inv']
          m=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          got={name:{a.strip() for a in ax.split(',') if a.strip()} for name,ax in m}
          assert len(m)==len(roots),(got,roots)
          for x in roots:
              key='FCP.BFSSSU2PhysicalDomainS1F.'+x
              assert key in got,(key,got)
              assert got[key]<={'propext','Classical.choice','Quot.sound'},(key,got[key])
          assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,s[-3500:]
          print('S1F_SOURCE_SU2_PLUS_I_CURVE_HALF_INVERSE_6_ROOTS_KERNEL_PASS')
          PY

      - name: Restore frozen original Euler source import closure
        id: euler_accepted
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1g-euler-source-v1-adc7f124-lean4341-f0683ba2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E*.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G7*.lean') }}

      - name: Recover historical source Euler closure with exact frozen baseline
        if: steps.euler_accepted.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 46
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          git fetch --quiet --no-tags --depth=1 origin f0683ba298a2c1109677f7bc7a8393265e0e8cda
          python3 - <<'PY'
          import pathlib, re, subprocess, sys, shutil
          base='f0683ba298a2c1109677f7bc7a8393265e0e8cda'
          target='SU2BFSSPhysicalDomainL6H5E8YOriginalSU2ExactSourceEulerFactorizationProbe'
          root=pathlib.Path('upstream-math/lean')
          obj=root/'.lake/build/lib/lean'
          out=pathlib.Path('/tmp/bfss-su2-relative-character')
          out.mkdir(exist_ok=True)
          dirs=[pathlib.Path('experiments/openai-math-su2-physical-domain'),
                pathlib.Path('experiments/openai-math-su2-concrete-potential')]
          sources={}
          for folder in dirs:
              for path in sorted(folder.glob('SU2*.lean')):
                  if path.stem in sources:
                      raise RuntimeError(f'DUPLICATE_SOURCE_MODULE={path.stem}')
                  sources[path.stem]=path
          visited=set()
          active=set()
          plan=[]
          immutable={}
          def check_source(module, path):
              rel=str(path)
              expected=subprocess.run(['git','rev-parse','--verify',f'{base}:{rel}'],
                  text=True,capture_output=True)
              if expected.returncode:
                  raise RuntimeError(f'NONFROZEN_EULER_IMPORT={module} {rel} missing in {base}')
              current=subprocess.check_output(['git','hash-object',rel],text=True).strip()
              if current!=expected.stdout.strip():
                  raise RuntimeError(f'CHANGED_ACCEPTED_EULER_IMPORT={module} {rel}')
              immutable[module]=current
          def visit(module):
              if not module.startswith('SU2'):
                  return
              if module in visited:
                  return
              if module in active:
                  raise RuntimeError(f'CYCLIC_LEAN_IMPORT={module}')
              path=sources.get(module)
              ole=obj/(module+'.olean')
              if path is None:
                  if not ole.is_file():
                      raise RuntimeError(f'MISSING_UNAVAILABLE_SOURCE_IMPORT={module}')
                  visited.add(module)
                  return
              check_source(module,path)
              # Existing pin- and source-qualified closure cache may be
              # used, but never repair a missing import with an axiom.
              if ole.is_file():
                  visited.add(module)
                  return
              active.add(module)
              for imp in re.findall(r'^import\s+([A-Za-z0-9_.]+)',path.read_text(),re.M):
                  visit(imp)
              active.remove(module)
              visited.add(module)
              plan.append(module)
          visit(target)
          (out/'euler-source-plan.txt').write_text(
              'ACCEPTED_SOURCE_BASELINE='+base+'\n'+
              '\n'.join(f'{module} {immutable[module]}' for module in immutable)+'\n'+
              'COMPILE_ORDER\n'+'\n'.join(plan)+'\n')
          print(f'EULER_SOURCE_FROZEN_BLOB_CHECKED={len(immutable)}')
          print(f'EULER_RECOVER_MODULES_TO_COMPILE={len(plan)}',flush=True)
          for i,module in enumerate(plan):
              path=sources[module]
              shutil.copy2(path,root/(module+'.lean'))
              log=out/(module+'.log')
              cmd=['timeout','220s','lake','env','lean','-o',
                    str(pathlib.Path('.lake/build/lib/lean')/(module+'.olean')),
                    module+'.lean']
              result=subprocess.run(cmd,cwd=root,text=True,
                                    stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              log.write_text(result.stdout)
              if result.returncode or 'error:' in result.stdout or 'sorryAx' in result.stdout or not (obj/(module+'.olean')).is_file():
                  print(f'EULER_IMPORT_FIRST_FAILURE={module} STEP={i+1}/{len(plan)} EXIT={result.returncode}')
                  print(result.stdout[-9000:],flush=True)
                  sys.exit(1)
              print(f'EULER_ACCEPTED_IMPORT_PASS={module} STEP={i+1}/{len(plan)}',flush=True)
          if not (obj/(target+'.olean')).is_file():
              raise RuntimeError('ORIGINAL_EULER_OLEAN_NOT_BUILT')
          logfile=out/(target+'.log')
          if logfile.exists():
              data=logfile.read_text()
              pat=r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
              got={k:{a.strip() for a in v.split(',') if a.strip()}
                   for k,v in re.findall(pat,data)}
              for name in ['originalSU2_eq_of_firstRow','original_source_zyz_exact_euler',
                           'original_source_zyz_exists']:
                  key='FCP.BFSSSU2PhysicalDomainL6H5E8Y.'+name
                  if key not in got or not got[key]<={'propext','Classical.choice','Quot.sound'}:
                      raise RuntimeError(f'EULER_AXIOM_AUDIT_FAILED={key} GOT={got.get(key)}')
          print('EXACT_HISTORICAL_ORIGINAL_SU2_EULER_IMPORT_CLOSURE_KERNEL_PASS',flush=True)
          PY

      - name: Cache only rebuilt and qualified original Euler source closure
        if: steps.euler_accepted.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1g-euler-source-v1-adc7f124-lean4341-f0683ba2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E*.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G7*.lean') }}

      - name: Strictly test original SU2 YZ conjugation and source character triviality
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS1GExactSourceRelativeCharacterTrivialityProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainL6H5E8YOriginalSU2ExactSourceEulerFactorizationProbe.olean || { echo EXACT_ACCEPTED_SOURCE_EULER_OLEAN_MISSING; exit 1; }
          timeout 220s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 |
            tee "/tmp/bfss-su2-relative-character/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/bfss-su2-relative-character/SU2BFSSPhysicalDomainS1GExactSourceRelativeCharacterTrivialityProbe.log').read_text()
          roots=['source_quarter_angle','source_quarter_y_matrix','source_quarter_z_matrix',
                 'source_z_diag_neg_zero','source_z_diag_neg_one','source_y_angle_neg',
                 'original_source_yquarter_z_swap','original_source_zquarter_y_swap',
                 'original_source_z_flip','original_source_y_flip',
                 'original_relativeGaugeScalar_trivial']
          m=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          got={name:{a.strip() for a in ax.split(',') if a.strip()} for name,ax in m}
          assert len(m)==len(roots),(got,roots)
          for x in roots:
              key='FCP.BFSSSU2PhysicalDomainS1G.'+x
              assert key in got,(key,got)
              assert got[key]<={'propext','Classical.choice','Quot.sound'},(key,got[key])
          assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,s[-3500:]
          print('S1G_EXACT_SOURCE_SU2_CHARACTER_TRIVIALITY_11_ROOTS_KERNEL_PASS')
          PY

      - name: Strictly test complete original source SU2 gauge representation uniqueness
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS1HSourceGaugeCovariantImplementerUniquenessProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainS1GExactSourceRelativeCharacterTrivialityProbe.olean || { echo ACCEPTED_S1G_SOURCE_CHARACTER_OLEAN_MISSING; exit 1; }
          timeout 180s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 |
            tee "/tmp/bfss-su2-relative-character/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/bfss-su2-relative-character/SU2BFSSPhysicalDomainS1HSourceGaugeCovariantImplementerUniquenessProbe.log').read_text()
          roots=['original_source_implementer_unique_apply',
                 'original_source_implementer_unique',
                 'original_source_gauge_representation_unique']
          m=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          got={name:{a.strip() for a in ax.split(',') if a.strip()} for name,ax in m}
          assert len(m)==len(roots),(got,roots)
          for x in roots:
              key='FCP.BFSSSU2PhysicalDomainS1H.'+x
              assert key in got,(key,got)
              assert got[key]<={'propext','Classical.choice','Quot.sound'},(key,got[key])
          assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,s[-4000:]
          print('S1H_ORIGINAL_SOURCE_SU2_GAUGE_REPRESENTATION_UNIQUENESS_3_ROOTS_KERNEL_PASS')
          PY

      - name: Strictly test conditional independent Clifford-module gauge transport
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS1IConditionalCliffordModuleGaugeTransportProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainS1HSourceGaugeCovariantImplementerUniquenessProbe.olean || { echo ACCEPTED_S1H_SOURCE_UNIQUENESS_OLEAN_MISSING; exit 1; }
          timeout 200s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 |
            tee "/tmp/bfss-su2-relative-character/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/bfss-su2-relative-character/SU2BFSSPhysicalDomainS1IConditionalCliffordModuleGaugeTransportProbe.log').read_text()
          roots=['transportedGaugeHom','transportedGaugeHom_covariant',
                 'transportedGaugeHom_eq_source','independent_gauge_intertwines_source']
          m=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          got={name:{a.strip() for a in ax.split(',') if a.strip()} for name,ax in m}
          assert len(m)==len(roots),(got,roots)
          for x in roots:
              key='FCP.BFSSSU2PhysicalDomainS1I.'+x
              assert key in got,(key,got)
              assert got[key]<={'propext','Classical.choice','Quot.sound'},(key,got[key])
          assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,s[-4000:]
          print('S1I_CONDITIONAL_INDEPENDENT_CLIFFORD_MODULE_GAUGE_TRANSPORT_4_ROOTS_KERNEL_PASS')
          PY

      - name: Retain first causal errors and exact source-pinned evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-su2-independent-module-gauge-transport-${{ github.run_id }}
          path: /tmp/bfss-su2-relative-character/
          if-no-files-found: warn
          retention-days: 14
