name: BFSS S1V19 Native G4L SU2 Quarter Gauge Witness Strict Gate

# Constructs an actual original GaugeGroup 2 quarter witness and its theta sign.
# NOT equality to the historical L6G6X sourcePlusIGaugeCurve.
on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v19-original-g4l-native-su2-quarter-witness-strict.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v19-original-g4l-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-g4l-quarter-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 49
    steps:
      - name: Checkout unchanged isolated original source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout actual pinned OAI math
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Verify exact G4K original cache and newly authored G4L source hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v19-g4l-quarter
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          j=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in j['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          r=experiments/openai-math-su2-concrete-potential
          test "$(git hash-object "$r/SU2BFSSG4KOriginalGaugeDataQuarterConditionalProbe.lean")" = c34a1568fee5656c77205849c583b86dfdd77d27
          test "$(git hash-object "$r/SU2BFSSG4LNativeQuarterSourceGaugeWitnessProbe.lean")" = 037c2c9882bf4096988a1439ec6a7d6cba5507d9
          echo EXACT_G4L_SOURCE_AND_PINNED_MATH_VERIFIED

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore immutable Lean 4.34.1 and pinned Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v19-g4l-quarter/toolchain.log; then
              ok=true; break
            fi
            echo PINNED_LEAN_TLS_RETRY_$attempt | tee -a /tmp/bfss-s1v19-g4l-quarter/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo PINNED_LEAN_TOOLCHAIN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v19-g4l-quarter/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo ORIGINAL_PINNED_G4L_LEAN_MATHLIB_VERIFIED

      - name: Restore accepted G4K original conditional quarter and native OAI source cache
        id: accepted
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v19-isolated-g4k-original-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed unless G4K and original G4J G3A cache modules present
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.accepted.outputs.cache-hit }}" = true || { echo ACCEPTED_G4K_SOURCE_CACHE_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          for stem in SU2BFSSG1APairedThetaProbe SU2BFSSG3AAdjointColorRepresentationProbe SU2BFSSG4HExactThetaCovarianceProbe SU2BFSSG4JExactGaugeDataAssemblyProbe SU2BFSSG4KOriginalGaugeDataQuarterConditionalProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "ORIGINAL_G4K_CACHE_MISSING=$stem"; exit 1; }
          done
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GaugeCore.olean
          echo ORIGINAL_G4K_NATIVE_SU2_CONDITIONAL_READY

      - name: Compile native OAI source SU2 quarter witness and strictly validate six roots
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=SU2BFSSG4LNativeQuarterSourceGaugeWitnessProbe
          cp "../../experiments/openai-math-su2-concrete-potential/$stem.lean" "$stem.lean"
          timeout 480s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v19-g4l-quarter/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean" || { echo ORIGINAL_G4L_NEW_OLEAN_MISSING; exit 1; }
          python3 - <<'PY'
          import pathlib,re
          stem='SU2BFSSG4LNativeQuarterSourceGaugeWitnessProbe'
          s=pathlib.Path('/tmp/bfss-s1v19-g4l-quarter',stem+'.log').read_text()
          names=[
            'originalZQuarterMatrix_det_one','originalZQuarterMatrix_unitary',
            'originalZQuarterMatrix_specialUnitary','actualQuarterGauge',
            'actualQuarterGauge_coe','actualQuarterGauge_fermion_theta_sign']
          pattern=r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
          hits=re.findall(pattern,s)
          allowed={'propext','Classical.choice','Quot.sound'}
          got={name:{v.strip() for v in axioms.split(',') if v.strip()} for name,axioms in hits}
          assert len(got)==len(hits)==len(names),(hits,names)
          for n in names:
            key='FCP.BFSSSU2GaugeG4L.'+n
            assert key in got and got[key]<=allowed,(key,got)
          assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,s[-5500:]
          print('ORIGINAL_SOURCE_G4L_SU2_QUARTER_GAUGE_WITNESS_6_ROOTS_KERNEL_PASS')
          PY

      - name: Save G4L original native quarter group witness source cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v19-isolated-g4l-original-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve full first causal source diagnostics for negative knowledge
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v19-g4l-quarter-${{ github.run_id }}
          path: /tmp/bfss-s1v19-g4l-quarter/
          if-no-files-found: warn
          retention-days: 14
