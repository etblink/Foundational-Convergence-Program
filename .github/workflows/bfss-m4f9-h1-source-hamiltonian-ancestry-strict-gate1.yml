name: BFSS M4F9 H1 Original Source Paired Hamiltonian Strict Ancestry Gate 1

# Isolated source-pinned joint D2B10C and AZ gate. Do not infer success
# from a conditional theorem or from an inaccessible historical cache.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-m4f9-h1-source-hamiltonian-ancestry-strict-gate1.yml
      - tools/bfss_m4f9_hamiltonian_preflight.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-m4f9-h1-source-hamiltonian-ancestry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-unconditional-physical-charge-domain-density:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Check out exact candidate sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out exact original OpenAI Lean source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: Fail closed on original upstream and candidate pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-physical-charge-domain-density-reduction
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          python3 - <<'PY'
          import json
          d=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in d['packages'] if p['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2BFSSG1APairedThetaProbe.lean)" = 4f8fbf05a35c1d625746931b7ff0361b7ffc2ec4
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AFOriginalSmoothParityInvolutionProbe.lean)" = c9f71c6929121226788181ce3547979dcfe6afef
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AGOriginalSmoothParityDerivativeProbe.lean)" = 0e96b538f3a3eb63a3aaa24772a4d0e883bdb141
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8ADOppositeGammaOrientationProbe.lean)" = f699d1a814c1646cfb819089356a64c3f5a169bc
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AEOriginalChargeGammaOrientationSplitProbe.lean)" = 82fd9226043d059f78a79e64ad8de016729c9246
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AHOriginalSourceChargeParityConjugationProbe.lean)" = c2e280e5ae1d541f21ef870b86dbea01f7253f99
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AIOriginalFullL2ParityLiftProbe.lean)" = 4832b4bdf140adaefa3271bea2325a05fde7d1be
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AMOriginalSourceChargeVectorParityProbe.lean)" = 0c42f5111fd9ff58ba9410f31047a2e922b28d76
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AKOriginalFullL2ParityBosonGaugeProbe.lean)" = fc298c8d2236d4294992577d08d30072c1777bf9
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8ALOriginalFullL2PhysicalParityProbe.lean)" = 15cf6c8a2ea0f2da7f210e41efd5d0c249d3fbe1
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8ANOriginalOppositeGammaGaugeDataProbe.lean)" = d5c3f7d6d2314bd28e9e15ec023a3a80ce303131
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AOOriginalPhysicalCoreGraphGeneratorParityProbe.lean)" = 8ed162109704a1bee07869dab8d60fc70446d484
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AJOriginalFullL2ParityUnitaryProbe.lean)" = 23bce6337e42dffb530339d54eef95378d9230b1
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8APOriginalPhysicalClosedGraphParityProbe.lean)" = 148cb78c918f9ab6836e3bc49acc7d60e356b817
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AQOriginalPhysicalClosedChargeDomainParityProbe.lean)" = 12c245924eb0e5ba4b1a1f9b7b10c34d29402995
