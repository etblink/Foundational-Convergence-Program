            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentActualClosedGraphNamedBridgeE7N1.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentActualClosedPhysicalOutputsE7N2.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentInvariantCoreL2ImageDA.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentConditionalPhysicalCoreDensityDB.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentE2ConditionalPhysicalDomainDenseDD.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentE2UnconditionalPhysicalDomainDenseDC.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentActualE2PhysicalInputRebaseDE1.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentActualE2PhysicalInputRebaseDE1B.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentActualE2PhysicalInputRebaseDE1C.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentActualE2FullPhysicalGraphRebaseDE2.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentActualE2FullPhysicalDomainDE2B.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentActualPhysicalGraphSourceTransportDE3.olean
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSG4K9ASourceChargeCoefficientCrosswalkProbe.olean
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSG4K9BSourcePairAndChargeReductionProbe.olean
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSG4K9COrderedPairCoefficientProbe.olean
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSG4K9DSourcePotentialMultiplierProbe.olean
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSG4K10ASourceClosedJointChargeGraphProbe.olean
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainD1RestrictedSourceGraphProbe.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8OriginalNamedFullPhysicalGraphDE4.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8DE4SourceSetClosureDiagnostic.olean
          key: bfss-fcp-m4f8-de4-named-original-source-graph-027ede18-gate5-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Check source original and DE4 compiled ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.qualified.outputs.cache-hit }}" = true || { echo M4F9_H1_DE4_EXACT_ACCEPTED_CACHE_MISSING; exit 1; }
          source "$HOME/.elan/env"
          base=upstream-math/lean/.lake/build/lib/lean
          for stem in SU2BFSSG1APairedThetaProbe SU2FermionFockProbe SU2BFSSG4JExactGaugeDataAssemblyProbe FCPM4F8OriginalNamedFullPhysicalGraphDE4 SU2BFSSPhysicalDomainD1RestrictedSourceGraphProbe; do
            test -s "$base/$stem.olean" || { echo "M4F9_H1_MISSING_PARENT_IMPORT=$stem"; exit 1; }
          done
          test -s "$base/OAI/MathematicalPhysics/BFSS/Core.olean"
          echo M4F9_H1_EXACT_SOURCE_AND_DE4_PARENT_OLEANS_PASS

      - name: Compile original physical Hilbert charge domain density reduction
        shell: bash
        timeout-minutes: 13
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stems="SU2BFSSPhysicalDomainL6H5E8ADOppositeGammaOrientationProbe SU2BFSSPhysicalDomainL6H5E8AEOriginalChargeGammaOrientationSplitProbe SU2BFSSPhysicalDomainL6H5E8AFOriginalSmoothParityInvolutionProbe SU2BFSSPhysicalDomainL6H5E8AGOriginalSmoothParityDerivativeProbe SU2BFSSPhysicalDomainL6H5E8AHOriginalSourceChargeParityConjugationProbe SU2BFSSPhysicalDomainL6H5E8AIOriginalFullL2ParityLiftProbe SU2BFSSPhysicalDomainL6H5E8AJOriginalFullL2ParityUnitaryProbe SU2BFSSPhysicalDomainL6H5E8AKOriginalFullL2ParityBosonGaugeProbe SU2BFSSPhysicalDomainL6H5E8ALOriginalFullL2PhysicalParityProbe SU2BFSSPhysicalDomainL6H5E8AMOriginalSourceChargeVectorParityProbe SU2BFSSPhysicalDomainL6H5E8ANOriginalOppositeGammaGaugeDataProbe SU2BFSSPhysicalDomainL6H5E8AOOriginalPhysicalCoreGraphGeneratorParityProbe SU2BFSSPhysicalDomainL6H5E8APOriginalPhysicalClosedGraphParityProbe SU2BFSSPhysicalDomainL6H5E8AQOriginalPhysicalClosedChargeDomainParityProbe SU2BFSSPhysicalDomainL6H5E8ASOriginalPhysicalClosedChargeGraphEnergyParityProbe SU2BFSSPhysicalDomainL6H5E8ATOriginalPiLp16OutputParityUnitaryProbe SU2BFSSPhysicalDomainL6H5E8AUOriginalMinimalClosedChargeLinearPMapProbe SU2BFSSPhysicalDomainL6H5E8AVOriginalMinimalChargeOperatorActionParityProbe SU2BFSSPhysicalDomainL6H5E8AWOriginalMinimalChargeHilbertFormParityProbe SU2BFSSPhysicalDomainL6H5E8AXOriginalPhysicalHilbertParityUnitaryProbe SU2BFSSPhysicalDomainL6H5E8AYOriginalPhysicalHilbertChargeGraphProbe SU2BFSSPhysicalDomainL6H5E8AZOriginalPhysicalChargeDomainDensityReductionProbe"
          for stem in $stems; do
            cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          done
          cd upstream-math/lean
          for stem in $stems; do
            echo "COMPILING_EXACT_SOURCE=$stem"
            timeout 180s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" \
              2>&1 | tee "/tmp/bfss-physical-charge-domain-density-reduction/$stem.log"
            test -s ".lake/build/lib/lean/$stem.olean"
          done
          python3 - <<'PY'
          import pathlib,re
          d=pathlib.Path('/tmp/bfss-physical-charge-domain-density-reduction')
          logs=list(d.glob('*.log'))
          assert len(logs)==22,len(logs)
          for path in logs:
              txt=path.read_text()
              assert 'sorryAx' not in txt and 'error:' not in txt,path.name
          s=(d/'SU2BFSSPhysicalDomainL6H5E8AZOriginalPhysicalChargeDomainDensityReductionProbe.log').read_text()
          prefix='FCP.BFSSSU2PhysicalDomainL6H5E8AZ.'
          names=['originalMinimalPhysicalHilbertChargeColumn_core_mem_domain','originalMinimalPhysicalHilbertChargeColumn_domain_dense_of_coreNormClosure_eq']
          m=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          got={name:{v.strip() for v in ax.split(',') if v.strip()} for name,ax in m}
          allowed={'propext','Classical.choice','Quot.sound'}
          for n in names:
              root=prefix+n
              assert root in got,(root,got)
              assert got[root] <= allowed,(root,got[root])
          print('L6H5E8AZ_PHYSICAL_CHARGE_DENSITY_CONDITIONAL_REDUCTION_TWO_ROOTS_CLEAN_PASS')
          PY

      - name: Rebuild historical qualified G4K9D and G4K10A dependency closure from exact sources
        shell: bash
        timeout-minutes: 36
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          qualified9d=1fbd0db2af96914d20b8750bfbbeb3af6770a491
          qualified10a=6eeb4293abcc1cf3a111ff5c511f708cb5ed320a
          git fetch --quiet --no-tags --depth=1 origin "$qualified9d"
          git fetch --quiet --no-tags --depth=1 origin "$qualified10a"
          base=upstream-math/lean/.lake/build/lib/lean
          test -s "$base/SU2BFSSG4JExactGaugeDataAssemblyProbe.olean" || {
            echo SOURCE_G4J_ACCEPTED_PREREQUISITE_MISSING
            exit 1
          }
          stems=(
            SU2BFSSG4K1PhysicalSpaceCoreProbe
            SU2BFSSG4K2ANonzeroVacuumRadialProfileProbe
            SU2BFSSG4K2BNonzeroPhysicalL2Probe
            SU2BFSSG4K3NonzeroSmoothInvariantCoreProbe
            SU2BFSSG4K4ClosedChargeGraphProbe
            SU2BFSSG4K5ConcreteEnergyDensityProbe
            SU2BFSSG4K6PhysicalTrialEnergyLowerProbe
            SU2BFSSG4K7EnergySumOfSquaresCorrectionProbe
            SU2BFSSG4K8ANonzeroDerivativeProbe
            SU2BFSSG4K8BNonzeroCoordinateL2Probe
            SU2BFSSG4K8CZeroParameterChargeProbe
            SU2BFSSG4K8DPositiveCouplingAlternativeProbe
            SU2BFSSG4K8E1MasslessPotentialParityProbe
            SU2BFSSG4K8E2KineticOddParityProbe
            SU2BFSSG4K8E3CoreNoncancellationProbe
            SU2BFSSG4K9ASourceChargeCoefficientCrosswalkProbe
            SU2BFSSG4K9BSourcePairAndChargeReductionProbe
            SU2BFSSG4K9COrderedPairCoefficientProbe
            SU2BFSSG4K9DSourcePotentialMultiplierProbe
            SU2BFSSG4K10ASourceClosedJointChargeGraphProbe
          )
          test "${#stems[@]}" -eq 20
          for stem in "${stems[@]}"; do
            p="experiments/openai-math-su2-concrete-potential/$stem.lean"
            expected="$qualified9d"
            if [ "$stem" = SU2BFSSG4K10ASourceClosedJointChargeGraphProbe ]; then
              expected="$qualified10a"
            fi
            test "$(git hash-object "$p")" = "$(git rev-parse "$expected:$p")" || {
              echo "PINNED_G4K_ACCEPTED_SOURCE_DRIFT=$p"
              exit 1
            }
            cp "$p" upstream-math/lean/
          done
          mkdir -p /tmp/bfss-unconditional-domain-density
          cd upstream-math/lean
          for module in OAI.MathematicalPhysics.BFSS.KineticMeasures OAI.MathematicalPhysics.BFSS.CovariantFields OAI.MathematicalPhysics.BFSS.ProfileEnergy; do
            dest=".lake/build/lib/lean/$(printf '%s' "$module" | tr . /).olean"
            if ! test -s "$dest"; then
              echo "REBUILDING_PINNED_ORIGINAL_SOURCE=$module"
              timeout 480s lake build "$module" 2>&1 | tee "/tmp/bfss-unconditional-domain-density/upstream-$(basename "$dest").log"
              test -s "$dest"
            fi
          done
          for stem in "${stems[@]}"; do
            echo "REBUILDING_EXACT_ACCEPTED_G4K_SOURCE=$stem"
            timeout 240s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 |
              tee "/tmp/bfss-unconditional-domain-density/$stem.log"
            test -s ".lake/build/lib/lean/$stem.olean"
          done
          python3 - <<'PY'
          import pathlib,re
          d=pathlib.Path('/tmp/bfss-unconditional-domain-density')
          stems='''SU2BFSSG4K1PhysicalSpaceCoreProbe
          SU2BFSSG4K2ANonzeroVacuumRadialProfileProbe
          SU2BFSSG4K2BNonzeroPhysicalL2Probe
          SU2BFSSG4K3NonzeroSmoothInvariantCoreProbe
          SU2BFSSG4K4ClosedChargeGraphProbe
          SU2BFSSG4K5ConcreteEnergyDensityProbe
          SU2BFSSG4K6PhysicalTrialEnergyLowerProbe
          SU2BFSSG4K7EnergySumOfSquaresCorrectionProbe
          SU2BFSSG4K8ANonzeroDerivativeProbe
          SU2BFSSG4K8BNonzeroCoordinateL2Probe
          SU2BFSSG4K8CZeroParameterChargeProbe
          SU2BFSSG4K8DPositiveCouplingAlternativeProbe
          SU2BFSSG4K8E1MasslessPotentialParityProbe
          SU2BFSSG4K8E2KineticOddParityProbe
          SU2BFSSG4K8E3CoreNoncancellationProbe
