          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AUOriginalMinimalClosedChargeLinearPMapProbe.lean)" = 5e6300e7db8d292b6766f5800e20c9a394cc0d69
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AVOriginalMinimalChargeOperatorActionParityProbe.lean)" = 9a975f56b2810a08683347ff6a2200bef922cbce
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AWOriginalMinimalChargeHilbertFormParityProbe.lean)" = 9ab1f89e31330ec4f1d1e4da26de355b126026cc
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AXOriginalPhysicalHilbertParityUnitaryProbe.lean)" = 54c236414f053d70b12036b40c8473160ca16a1a
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AYOriginalPhysicalHilbertChargeGraphProbe.lean)" = 050f744b3d00b0424fd59192340b98ed2b51406c
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AZOriginalPhysicalChargeDomainDensityReductionProbe.lean)" = cd900c47e2bcbccd0c8761df1beb69553430b68a
          echo PHYSICAL_CHARGE_DOMAIN_DENSITY_REDUCTION_FROZEN_SOURCE_AND_CANDIDATE_PINS_PASS
      - name: Python fail-closed exact Hamiltonian dependency DAG and 1/16 normalization preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bfss_m4f9_hamiltonian_preflight.py --output-json /tmp/bfss-physical-charge-domain-density-reduction/m4f9_python_hamiltonian_plan.json
          test -s /tmp/bfss-physical-charge-domain-density-reduction/m4f9_python_hamiltonian_plan.json

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
      - name: Restore frozen Lean 4.34.1 and exact Mathlib
Restore frozen Lean 4.34.1 and exact Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true
          cd upstream-math/lean
          timeout 1080s lake exe cache get > /tmp/bfss-m4f9-h1-source-ancestry-gate1/mathlib.log 2>&1 || {
            tail -n 100 /tmp/bfss-m4f9-h1-source-ancestry-gate1/mathlib.log
            exit 1
          }
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612


      - name: Restore exact accepted DE4 named physical 16-charge source graph ancestry
