      - name: Verify original S3C D E1 compiled cache closure
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.parent.outputs.cache-hit }}" = "true" || { echo GATE23_PARENT_CACHE_MISS; exit 1; }
          prefix=upstream-math/lean/.lake/build/lib/lean
          for stem in SU2BFSSPhysicalDomainS3CActualMajoranaQuadraticCommutatorProbe SU2BFSSPhysicalDomainS3DActualFermionSpinQuadraticGeneratorProbe SU2BFSSPhysicalDomainS3E1ActualSameColorFermionicBilinearCommSourceProbe; do
            test -s "$prefix/$stem.olean" || { echo GATE23_PARENT_OLEAN_MISSING:$stem; exit 1; }
          done
      - name: Fresh source S3E2 three-root Lean kernel and axiom validation
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS3E2SameColorActualGammaCoefficientContractionProbe
          cp "experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3E2SameColorActualGammaCoefficientContractionProbeV7SelectorBridge.lean" "upstream-math/lean/$stem.lean"
          cd upstream-math/lean
          timeout --signal=TERM --kill-after=5s 260s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee /tmp/bfss-s3e2-source-gate23/lean.log
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path("/tmp/bfss-s3e2-source-gate23/lean.log").read_text()
          prefix="FCP.BFSSSU2PhysicalDomainS3E2."
          expected=[prefix+n for n in ("pairedFermionSpinQuadraticColor_delta_beta","pairedFermionSpinQuadraticColor_delta_alpha","pairedFermionSpinQuadraticColor_comm_same_color_coefficient")]
          actual=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          assert [n for n,a in actual]==expected,("MISSING_ORIGINAL_THREE_ROOTS",actual)
          for n,raw in actual:
              axioms={a.strip() for a in raw.split(",") if a.strip()}
              assert axioms <= {"propext","Classical.choice","Quot.sound"},("UNAUTHORIZED_SOURCE_AXIOM",n,axioms)
          package_warning=re.compile(r"warning: ([a-z0-9-]+): repository '([^']+)' has local changes")
          for line in s.splitlines():
              match=package_warning.fullmatch(line)
              if match and match.group(2).endswith("/upstream-math/lean/.lake/packages/"+match.group(1)):
                  continue
              assert "warning:" not in line,("UNAPPROVED_LEAN_OR_TOOLCHAIN_WARNING",line)
          assert not any(t in s for t in ("sorryAx","error:","unknownIdentifier")),("BAD_STRICT_SOURCE_LOG",s[-3500:])
          print("GATE23_KNOWN_LAKE_LOCAL_PACKAGE_WARNINGS_ONLY")
          print("GATE23_THREE_REAL_SOURCE_COEFFICIENT_ROOTS_STRICT_COMPILED")
          PY
