name: BFSS S3E2 Native Source Fock Coefficient Strict Gate 23

# Actual original J(alpha,gamma)-J(gamma,alpha) coefficient.
# Only an all-green source/axiom/cache gate establishes three principal roots.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s3l-s3e2-native-selector-source-coefficient-strict-gate23.yml
permissions:
  contents: read
concurrency:
  group: bfss-s3e2-native-source23-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-source-coefficient:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - name: Checkout research source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout pinned original BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: Validate exact three source declarations and qualified Gate21 helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s3e2-source-gate23
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import pathlib,re,subprocess,json
          manifest=json.loads(pathlib.Path("upstream-math/lean/lake-manifest.json").read_text())
          assert next(x["rev"] for x in manifest["packages"] if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          pinned={"experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3E2SameColorActualGammaCoefficientContractionProbeV7SelectorBridge.lean":"c6942d34650e83be8d2d380057816234a3004060","experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3E2SameColorActualGammaCoefficientContractionProbe.lean":"d7a784e0679b279e5ca3c71206cd7d1994e70959","experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3E2SameColorActualGammaCoefficientContractionProbeV6.lean":"84d94e0b0f534cbc8e5d9f4da59f18d8a4439836","experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3E2NativeFockSelectorDiagnosticGate20V2.lean":"3c31ad597a9f6f5dc52ac6a5276e78ebad82361e"}
          for p,h in pinned.items():
              assert subprocess.check_output(["git","rev-parse","HEAD:"+p],text=True).strip()==h,("BAD_GIT_BLOB",p)
              assert subprocess.check_output(["git","hash-object","--no-filters",p],text=True).strip()==h,("BAD_WORKTREE_BLOB",p)
          assert subprocess.check_output(["git","rev-parse","HEAD:.github/workflows/bfss-s3l-s3e2-native-selector-source-coefficient-strict-gate22.yml"],text=True).strip()=="197898d97d1eee7cd32b22f9d21ef4b34ade87d3",("ORIGINAL_GATE22_WORKFLOW_CHANGED")
          current=pathlib.Path("experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3E2SameColorActualGammaCoefficientContractionProbeV7SelectorBridge.lean").read_text()
          first=pathlib.Path("experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3E2SameColorActualGammaCoefficientContractionProbe.lean").read_text()
          prev=pathlib.Path("experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3E2SameColorActualGammaCoefficientContractionProbeV6.lean").read_text()
          diagnostic=pathlib.Path("experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3E2NativeFockSelectorDiagnosticGate20V2.lean").read_text()
          statements=lambda s:re.findall(r"(?ms)^theorem .*? := by",s)
          assert len(statements(first))==3 and statements(current)==statements(first)==statements(prev),"SOURCE_STATEMENTS_ALTERED"
          names=["pairedFermionSpinQuadraticColor_delta_beta","pairedFermionSpinQuadraticColor_delta_alpha","pairedFermionSpinQuadraticColor_comm_same_color_coefficient"]
          assert re.findall(r"(?m)^#print axioms (\S+)",current)==names
          a=diagnostic[diagnostic.index("/-- The very CLM carrier"):diagnostic.index("#print axioms")]
          b=current[current.index("/-- The very CLM carrier"):current.index("/-- The first actual CAR delta selector")]
          b=b.replace("private theorem ","theorem ").replace("private abbrev ","abbrev ")
          assert a.strip()==b.strip(),"QUALIFIED_NATIVE_FOCK_HELPER_NOT_PRESERVED"
          assert current.count("exact actualFockCLM_selector")==2
          assert "rw [pairedFermionSpinQuadraticColor_comm_same_color_raw]" in current
          assert "J α γ" in current and "J γ α" in current
          assert not re.search(r"(?m)^[ \t]*(?:axiom|sorry|admit)(?:\s|$)|\bsorryAx\b",current)
          print("GATE23_EXACT_SOURCE_MATH_THEOREMS_AND_GATE21_PROOF_PINNED")
          PY
      - name: Reclaim runner disk
        shell: bash
