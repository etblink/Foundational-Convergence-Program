      - name: Fail-closed all four accepted archives and original named source graph imports
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.e4cache.outputs.cache-hit }}" = true || { echo M4F8_DE4_GATE5_EXACT_QUALIFIED_E4_CACHE_MISSING; exit 1; }
          test "${{ steps.d1closurecache.outputs.cache-hit }}" = true || { echo M4F8_DE4_GATE5_EXACT_QUALIFIED_SOURCE_ONLY_CLOSURE_CACHE_MISSING; exit 1; }
          test "${{ steps.de3cache.outputs.cache-hit }}" = true || { echo M4F8_DE4_GATE5_EXACT_QUALIFIED_DE3_CACHE_MISSING; exit 1; }
          test "${{ steps.de3ccache.outputs.cache-hit }}" = true || { echo M4F8_DE4_GATE5_EXACT_QUALIFIED_DE3C_CACHE_MISSING; exit 1; }
          for stem in OAI/MathematicalPhysics/BFSS/ClosedProfiles FCPM4F6RestrictedGraphImageC3 FCPM4F6RestrictedGraphClosureC4 FCPM4F7IndependentLiteralRestrictedGraphBridgeE3 FCPM4F8DE4SourceSetClosureDiagnostic FCPM4F8IndependentActualPhysicalGraphSourceTransportDE3 FCPM4F8IndependentActualE2FullPhysicalDomainDE2B FCPM4F7PhysicalGraphTransportE4 SU2BFSSG4K9ASourceChargeCoefficientCrosswalkProbe SU2BFSSG4K9BSourcePairAndChargeReductionProbe SU2BFSSG4K9COrderedPairCoefficientProbe SU2BFSSG4K9DSourcePotentialMultiplierProbe SU2BFSSG4K10ASourceClosedJointChargeGraphProbe SU2BFSSPhysicalDomainD1RestrictedSourceGraphProbe; do
            test -s "upstream-math/lean/.lake/build/lib/lean/$stem.olean" || { echo M4F8_DE4_GATE5_MISSING_PARENT_IMPORT=$stem; exit 1; }
          done
          echo M4F8_DE4_GATE5_ALL_EXACT_QUALIFIED_E4_DE3_DE3C_AND_SOURCE_ONLY_D1_CLOSURE_PARENT_OLEANS_PASS

      - name: Fresh strict DE4 actual original named source and J-free physical E2 graph equality
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=FCPM4F8OriginalNamedFullPhysicalGraphDE4
          cp "$GITHUB_WORKSPACE/experiments/openai-math-su2-physical-domain/$stem.lean" "upstream-math/lean/$stem.lean"
          cd upstream-math/lean
          /usr/bin/time -f 'DE4_RESOURCE_TIME %e CPU %P MAX_RSS_KB %M' -o "/tmp/bfss-m4f8-de4-named-physical-source-gate5/$stem.resource" \
            timeout --signal=TERM --kill-after=5s 240s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" >"/tmp/bfss-m4f8-de4-named-physical-source-gate5/$stem.log" 2>&1 || {
              code=$?
              echo M4F8_DE4_GATE5_FRESH_LEAN_EXIT=$code
              grep -n 'error:' "/tmp/bfss-m4f8-de4-named-physical-source-gate5/$stem.log" | head -n 30 || true
              tail -n 125 "/tmp/bfss-m4f8-de4-named-physical-source-gate5/$stem.log"
              cat "/tmp/bfss-m4f8-de4-named-physical-source-gate5/$stem.resource" || true
              exit "$code"
            }
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          from pathlib import Path
          import re
          log=Path('/tmp/bfss-m4f8-de4-named-physical-source-gate5/FCPM4F8OriginalNamedFullPhysicalGraphDE4.log').read_text()
          reports=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          axioms={name:{v.strip() for v in raw.split(',') if v.strip()} for name,raw in reports}
          fullname='FCP.M4F8OriginalNamedFullPhysicalGraphDE4.pairedSourceNamedClosedGraph_eq_actualIndependentFullPhysicalGraph_image'
          assert len(reports)==len(axioms)==1 and set(axioms)=={fullname},('DE4_NOT_EXACTLY_ONE_ROOT',reports)
          assert all(a <= {'propext','Classical.choice','Quot.sound'} for a in axioms.values()),('FORBIDDEN_AXIOMS',axioms)
          assert 'error:' not in log and 'sorryAx' not in log,('LEAN_ERROR_OR_SORRY',)
          known=r"warning: [A-Za-z0-9_-]+: repository '[^']*/upstream-math/lean/\.lake/packages/[A-Za-z0-9_-]+' has local changes"
          bad=[line for line in log.splitlines() if 'warning:' in line and not re.fullmatch(known,line)]
          assert not bad,('UNEXPECTED_WARNINGS',bad)
          print('M4F8_DE4_GATE5_ACTUAL_SOURCE_NAMED_PHYSICAL_SIXTEEN_GRAPH_EQ_INDEPENDENT_E2_ONE_STRICT_ROOT_PASS',axioms)
          PY
          cat "/tmp/bfss-m4f8-de4-named-physical-source-gate5/$stem.resource"

