name: BFSS M4F8 DE4 Original Named Source Full Physical E2 Graph Strict Gate 5

# Research branch only; exact self-path trigger. No main/PR/source change.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-m4f8-de4-named-source-full-physical-e2-graph-strict-gate5.yml

permissions:
  contents: read

concurrency:
  group: bfss-m4f8-de4-original-named-physical-source-graph-${{ github.ref }}
  cancel-in-progress: false

jobs:
  named-physical-operator-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - name: Checkout isolated research sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout immutable original BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Exact pinned mathematics and DE3 DE3C DE4 unchanged source preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-m4f8-de4-named-physical-source-gate5
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess,re
          root=Path('experiments/openai-math-su2-physical-domain')
          manifest=json.loads(Path('upstream-math/lean/lake-manifest.json').read_text())
          assert next(a['rev'] for a in manifest['packages'] if a['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          pins={
            root/'FCPM4F8OriginalNamedFullPhysicalGraphDE4.lean':'027ede181b22a638515dffc17ca92266af7805f4',
            root/'FCPM4F8DE4SourceSetClosureDiagnostic.lean':'a848d68ef8258945671f68e973660d2dbca8e843',
            root/'FCPM4F8IndependentActualPhysicalGraphSourceTransportDE3.lean':'96ccf49549c5a313546b24e3577b6bc6110b78eb',
            root/'FCPM4F8IndependentActualE2FullPhysicalDomainDE2B.lean':'fc5f27b4ec66fa5d0b2d5b50a5e3b8a9ecd00d23',
            root/'FCPM4F7PhysicalGraphTransportE4.lean':'75f06cc35fa60166b0f29e10b08ca37c8780bc1a',
            root/'SU2BFSSPhysicalDomainD1RestrictedSourceGraphProbe.lean':'c601d5888e24d0a9bc8f62f2bff368fc29299b5d',
            Path('experiments/openai-math-su2-concrete-potential/SU2BFSSG4K9DSourcePotentialMultiplierProbe.lean'):'0695420e4e1d6fbe8accdc4aee9df6dd2d52d1ca',
            Path('experiments/openai-math-su2-concrete-potential/SU2BFSSG4K10ASourceClosedJointChargeGraphProbe.lean'):'65d86984f7c216950fbc96812bd011d9d09e968e',
          }
          for path,sha in pins.items():
              assert subprocess.check_output(['git','rev-parse','HEAD:'+str(path)],text=True).strip()==sha,('TREE_PIN',path)
              assert subprocess.check_output(['git','hash-object','--no-filters',str(path)],text=True).strip()==sha,('WORKTREE_PIN',path)
          s=(root/'FCPM4F8OriginalNamedFullPhysicalGraphDE4.lean').read_text()
          assert s.startswith('import FCPM4F8IndependentActualPhysicalGraphSourceTransportDE3\nimport FCPM4F8DE4SourceSetClosureDiagnostic\n')
          assert re.findall(r'^namespace (\S+)',s,re.M)==['FCP.M4F8OriginalNamedFullPhysicalGraphDE4']
          assert re.findall(r'^theorem (\S+)',s,re.M)==['pairedSourceNamedClosedGraph_eq_actualIndependentFullPhysicalGraph_image']
          assert re.findall(r'^#print axioms (\S+)',s,re.M)==['pairedSourceNamedClosedGraph_eq_actualIndependentFullPhysicalGraph_image']
          assert 'pairedGaugeData.deformedModelGraph 1 0' in s
          assert 'pairedSourceNamedGraph_eq_explicitRestrictedClosure' in s
          assert 'sourceRestrictedClosure_eq_actualFullPhysicalE2Graph_image' in s
          assert not re.search(r'(?m)^[ \t]*(?:sorry|admit|axiom)\b|\bsorryAx\b',s.split('noncomputable section',1)[1])
          print('M4F8_DE4_GATE5_EXACT_ORIGINAL_SOURCE_AND_TRUE_JFREE_E2_PROVENANCE_PASS')
          PY

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore frozen Lean 4.34.1 and exact Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true
          cd upstream-math/lean
          timeout 1080s lake exe cache get > /tmp/bfss-m4f8-de4-named-physical-source-gate5/mathlib.log 2>&1 || {
            tail -n 100 /tmp/bfss-m4f8-de4-named-physical-source-gate5/mathlib.log
            exit 1
          }
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

