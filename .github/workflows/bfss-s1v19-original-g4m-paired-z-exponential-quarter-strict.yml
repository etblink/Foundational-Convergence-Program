name: BFSS S1V19 G4M Genuine Paired Pauli Z Exponential Quarter Strict Gate

# Narrow actual original source paired AlgebraData exponential, NOT historical L6G6X import.
on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v19-original-g4m-paired-z-exponential-quarter-strict.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v19-g4m-paired-z-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired-pauli-z-exp-quarter:
    runs-on: ubuntu-latest
    timeout-minutes: 49
    steps:
      - name: Checkout isolated exact original paired source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout original upstream pinned mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Validate exact source and immutable Lean Mathlib pins before preparation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v19-g4m
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          m=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in m['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          r=experiments/openai-math-su2-concrete-potential
          test "$(git hash-object "$r/SU2BFSSG4KOriginalGaugeDataQuarterConditionalProbe.lean")" = c34a1568fee5656c77205849c583b86dfdd77d27
          test "$(git hash-object "$r/SU2BFSSG4LNativeQuarterSourceGaugeWitnessProbe.lean")" = 037c2c9882bf4096988a1439ec6a7d6cba5507d9
          test "$(git hash-object "$r/SU2BFSSG4MOriginalPairedSourceZExponentialQuarterProbe.lean")" = 8f1b853916529b0260bc4edb47b1a11076c680cf
          echo ORIGINAL_G4M_PAIRED_Z_SOURCE_PINS_VERIFIED

      - name: Reclaim disposable disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore exact Lean 4.34.1 and pinned Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v19-g4m/toolchain.log; then
              ok=true; break
            fi
            echo PINNED_TOOLCHAIN_TLS_RETRY_$attempt | tee -a /tmp/bfss-s1v19-g4m/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo PINNED_LEAN_TOOLCHAIN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v19-g4m/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo G4M_PINNED_LEAN_MATHLIB_VERIFIED

      - name: Restore accepted G4L native SU2 group quarter witness cache
        id: accepted
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v19-isolated-g4l-original-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed if actual G4L G4K G4J source prerequisites absent
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.accepted.outputs.cache-hit }}" = true || { echo ORIGINAL_G4L_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in SU2BFSSG1APairedThetaProbe SU2BFSSG4JExactGaugeDataAssemblyProbe SU2BFSSG4KOriginalGaugeDataQuarterConditionalProbe SU2BFSSG4LNativeQuarterSourceGaugeWitnessProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "MISSING_ORIGINAL_ACCEPTED_MODULE=$stem"; exit 1; }
          done
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GaugeCore.olean
          echo G4M_ACTUAL_ORIGINAL_G4L_SOURCE_CACHE_READY

      - name: Compile exact original paired +i Pauli-z exponential and strictly audit eleven roots
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=SU2BFSSG4MOriginalPairedSourceZExponentialQuarterProbe
          cp "../../experiments/openai-math-su2-concrete-potential/$stem.lean" "$stem.lean"
          timeout 600s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v19-g4m/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean" || { echo G4M_FRESH_OLEAN_MISSING; exit 1; }
          python3 - <<'PY'
          import pathlib,re
          stem='SU2BFSSG4MOriginalPairedSourceZExponentialQuarterProbe'
          s=pathlib.Path('/tmp/bfss-s1v19-g4m',stem+'.log').read_text()
          names=["originalZDiagonal","originalPairedZExponential","originalZQuarterTime","originalZAngle","original_z_tangent_diagonal","originalPairedZExponential_diagonal","original_zquarter_angle","original_z_exp_zero","original_z_exp_one","originalPairedZExponential_quarter_matrix","originalPairedZExponential_quarter_eq_actualGauge"]
          pattern=r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
          hits=re.findall(pattern,s)
          allowed={'propext','Classical.choice','Quot.sound'}
          got={name:{v.strip() for v in axioms.split(',') if v.strip()} for name,axioms in hits}
          assert len(hits)==len(got)==len(names)==11,(hits,names)
          for n in names:
            key='FCP.BFSSSU2GaugeG4M.'+n
            assert key in got and got[key]<=allowed,(key,got)
          assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,(s[-6500:])
          print('ORIGINAL_G4M_PAIRED_SOURCE_Z_QUARTER_EXP_11_ROOTS_KERNEL_PASS')
          PY

      - name: Cache accepted Pauli-z source exponent quarter and native SU2 gauge equality
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v19-isolated-g4m-original-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Retain exact Lean failure diagnostics and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v19-g4m-${{ github.run_id }}
          path: /tmp/bfss-s1v19-g4m/
          if-no-files-found: warn
          retention-days: 14
