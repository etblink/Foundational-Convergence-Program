name: BFSS S1V19 Original G3C to G4B Fermion Transport Strict Gate

# Isolated, exact workflow-path trigger; excludes main and PR25.
on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v19-original-g3c-g4b-fermion-transport-strict.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v19-original-g3c-g4b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-g3c-g4b:
    runs-on: ubuntu-latest
    timeout-minutes: 49
    steps:
      - name: Checkout exact isolated original source candidates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout immutable original OAI math revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Enforce pinned original Mathlib and three unchanged original G3C G4A G4B sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v19-g3c-g4b
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          j=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in j['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          root=experiments/openai-math-su2-concrete-potential
          test "$(git hash-object "$root/SU2BFSSG3CComplexOneParticleUnitaryProbe.lean")" = e555823155d5ce348843acb9eaa9ea6762f636ac
          test "$(git hash-object "$root/SU2BFSSG4AExteriorGaugeActionProbe.lean")" = 1b1c1099dfa486f76ede75a082f84c19b29155b5
          test "$(git hash-object "$root/SU2BFSSG4BFermionLinearTransportProbe.lean")" = c6270243d0f61e8ee415e378c0865d2954958472
          test "$(git hash-object "$root/SU2BFSSG3B24ModeOrthogonalLiftProbe.lean")" = c90b25156ec4d81ee16e5939cd888cc12cdc33a3
          echo ORIGINAL_G3C_G4B_SOURCE_PINS_VERIFIED

      - name: Reclaim disposable runner storage
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore immutable Lean and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v19-g3c-g4b/toolchain.log; then
              ok=true; break
            fi
            echo PINNED_LEAN_TLS_RETRY_$attempt | tee -a /tmp/bfss-s1v19-g3c-g4b/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo PINNED_LEAN_INSTALL_FAILED; exit 1; }
          cd upstream-math/lean
          timeout 1070s lake exe cache get 2>&1 | tee /tmp/bfss-s1v19-g3c-g4b/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo ORIGINAL_PINNED_LEAN_MATHLIB_VERIFIED

      - name: Restore full accepted G3B gauge and genuine OAI caches
        id: accepted
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v19-isolated-g3b-original-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed on genuine accepted G3B original-source cache
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.accepted.outputs.cache-hit }}" = true || { echo ACCEPTED_ORIGINAL_G3B_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in SU2BFSSG1APairedThetaProbe SU2BFSSG3AAdjointColorRepresentationProbe SU2BFSSG3B24ModeOrthogonalLiftProbe SU2FermionF3C2ThetaFieldsProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "MISSING_ACCEPTED_ORIGINAL_MODULE=$stem"; exit 1; }
          done
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/CovariantFields.olean
          echo ACCEPTED_ORIGINAL_G3B_FULL_DEPENDENCY_CACHE_RESTORED

      - name: Qualify genuine pinned original exterior SpinAction prerequisites
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          timeout 600s lake build OAI.Analysis.Laughlin.Exterior.SpinAction 2>&1 | tee /tmp/bfss-s1v19-g3c-g4b/oai-spin-action.log
          test -s .lake/build/lib/lean/OAI/Analysis/Laughlin/Exterior/SpinAction.olean
          echo ORIGINAL_OAI_SPINACTION_KERNEL_MODULE_READY

      - name: Strictly qualify original G3C complex one-particle G4A exterior and G4B fermion linear transport
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          for stem in SU2BFSSG3CComplexOneParticleUnitaryProbe SU2BFSSG4AExteriorGaugeActionProbe SU2BFSSG4BFermionLinearTransportProbe; do
            cp "../../experiments/openai-math-su2-concrete-potential/$stem.lean" "$stem.lean"
            timeout 200s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v19-g3c-g4b/$stem.log"
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "NO_FRESH_G3C_G4B_ORIGINAL_OLEAN=$stem"; exit 1; }
          done
          python3 - <<'PY'
          import pathlib,re
          roots={
            'SU2BFSSG3CComplexOneParticleUnitaryProbe':('FCP.BFSSSU2GaugeG3C.',[
              'complexOneParticleMatrix_block','complexOneParticleMatrix_one','complexOneParticleMatrix_mul',
              'complexOneParticleMatrix_conjTranspose','complexOneParticleMatrix_left_unitary',
              'complexOneParticleMatrix_adjoint_inv','complexOneParticleMatrix_right_unitary',
              'complexOneParticleUnitary','complexOneParticleUnitaryHom']),
            'SU2BFSSG4AExteriorGaugeActionProbe':('FCP.BFSSSU2GaugeG4A.',[
              'orbitalGauge_one','orbitalGauge_mul','exteriorGauge_one','exteriorGauge_mul',
              'exteriorGauge_inv','exteriorGauge_vacuum','projection_orbitalGauge',
              'annihilate_exteriorGauge','create_exteriorGauge']),
            'SU2BFSSG4BFermionLinearTransportProbe':('FCP.BFSSSU2GaugeG4B.',[
              'exteriorGaugeLinearEquiv','exteriorGaugeLinearEquiv_apply',
              'fockAlgebraToBFSS','fermionGaugeLinearEquiv',
              'fermionGaugeLinearEquiv_intertwine','fermionGaugeLinearEquiv_vacuum',
              'fermionGaugeLinearHom'])
          }
          allowed={'propext','Classical.choice','Quot.sound'}
          pattern=r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
          for stem,(ns,names) in roots.items():
            s=pathlib.Path('/tmp/bfss-s1v19-g3c-g4b',stem+'.log').read_text()
            hits=re.findall(pattern,s)
            got={n:{v.strip() for v in axioms.split(',') if v.strip()} for n,axioms in hits}
            assert len(hits)==len(names),(stem,hits,names)
            for name in names:
              fq=ns+name
              assert fq in got and got[fq]<=allowed,(stem,fq,got)
            assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,(stem,s[-4500:])
            print(stem,'ORIGINAL_G3C_G4B_AXIOM_CLEAN_PASS',len(names))
          print('ORIGINAL_SOURCE_G3C_G4B_25_ROOTS_KERNEL_PASS')
          PY

      - name: Save accepted original G3C complex unitary G4A exterior G4B fermion transport cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v19-isolated-g4b-original-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve first-causal Lean environment and proof diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v19-g3c-g4b-${{ github.run_id }}
          path: /tmp/bfss-s1v19-g3c-g4b/
          if-no-files-found: warn
          retention-days: 14
