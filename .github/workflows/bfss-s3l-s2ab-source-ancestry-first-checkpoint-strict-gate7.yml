name: BFSS S3L S2AB Genuine Source Ancestry First Checkpoint Strict Gate 7

# Requalify two ORIGINAL historical S2A and S2B proofs individually.
# Never conflate G4 historical accepted source vs warning-free recovery.
# Inspect recovered G4 cache by lookup-only: never overlay incompatible
# K9A import profiles onto modern accepted H4G1B proof objects.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s3l-s2ab-source-ancestry-first-checkpoint-strict-gate7.yml
permissions:
  contents: read
concurrency:
  group: bfss-s3l-s2ab-real-source-gate7-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-s2a-s2b:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout frozen FCP research source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout immutable BFSS source mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: Frozen original source, names and immutable Git blob checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s3l-s2ab-gate7
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json,pathlib,subprocess,re
          d=json.loads(pathlib.Path("upstream-math/lean/lake-manifest.json").read_text())
          assert next(p['rev'] for p in d['packages'] if p['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          basedir=pathlib.Path("experiments/openai-math-su2-physical-domain")
          entries=[
            ("SU2BFSSPhysicalDomainS2ASpatialWedgePotentialProbe","2574f86c7e0c99a1275ef55b51bb0c19a217cd5b",4),
            ("SU2BFSSPhysicalDomainS2BPotentialChargeEnergyBridgeProbe","0c72a36548d116344bb5138fb9076393aceb9781",5),
          ]
          for stem,sha,n in entries:
              path=basedir/(stem+".lean")
              assert subprocess.check_output(["git","rev-parse","HEAD:"+str(path)],text=True).strip()==sha
              assert subprocess.check_output(["git","hash-object","--no-filters",str(path)],text=True).strip()==sha
              s=path.read_text()
              assert len(re.findall(r"(?m)^#print axioms \S+",s))==n
              assert not re.search(r"(?m)^[ \t]*(?:axiom|sorry|admit)(?:\s|$)|\bsorryAx\b",s)
          print("BFSS_S3L_S2AB_GATE7_PINNED_TWO_REAL_SOURCE_FILES_PASS")
          PY
      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
      - name: Restore frozen Lean and exact Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true
          cd upstream-math/lean
          timeout 1080s lake exe cache get > /tmp/bfss-s3l-s2ab-gate7/mathlib.log 2>&1 || {
            tail -n 100 /tmp/bfss-s3l-s2ab-gate7/mathlib.log
            exit 1
          }
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
