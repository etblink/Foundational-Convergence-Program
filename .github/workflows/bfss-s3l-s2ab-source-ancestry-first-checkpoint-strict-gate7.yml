            test -s ".lake/build/lib/lean/$stem.olean"
          done
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path("/tmp/bfss-s3l-s2ab-gate7")
          cases=[
           ("SU2BFSSPhysicalDomainS2ASpatialWedgePotentialProbe","FCP.BFSSSU2PhysicalDomainS2A",["sourceSpatialWedgeSq_nonneg","pairedPotential_eq_spatialWedges","pairedPotential_ge_two_spatialWedges","pairedPotential_nonneg"]),
