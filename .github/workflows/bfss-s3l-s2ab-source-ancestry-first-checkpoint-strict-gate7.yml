          ]
          allowed={"propext","Classical.choice","Quot.sound"}
          package_status=re.compile(r"warning: ([a-z0-9-]+): repository '([^']+)' has local changes")
          for stem,ns,names in cases:
              s=(root/(stem+".log")).read_text()
              reports=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
              got=[n for n,a in reports]
              want=[ns+"."+n for n in names]
              assert got==want,("WRONG_SOURCE_AXIOM_ROOTS",stem,got,want)
              for full,raw in reports:
                  axioms={a.strip() for a in raw.split(",") if a.strip()}
                  assert axioms<=allowed,("UNAUTHORIZED_AXIOMS",full,axioms)
              unexpected=[]
              for line in s.splitlines():
                  m=package_status.fullmatch(line)
                  if m and m.group(2).endswith("/upstream-math/lean/.lake/packages/"+m.group(1)):
                      continue
                  if "warning:" in line:unexpected.append(line)
              assert not unexpected,("UNAUTHORIZED_LEAN_SOURCE_WARNING",stem,unexpected)
              assert not any(tok in s for tok in ("sorryAx","error:","unknownIdentifier")),("FAILED_LEAN",stem,s[-2500:])
              print("BFSS_S3L_S2AB_GENUINE_ORIGINAL_SOURCE_STRICT_PASS",stem,len(reports))
          PY
