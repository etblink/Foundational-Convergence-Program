name: Freeze FW-PROCESS-MATRIX realizability Stage-1 corpus
on:
  push:
    branches: [automation/fwpm-realizability-stage1-freeze-v3]
permissions:
  contents: write
jobs:
  build-qualify-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: automation/fwpm-realizability-stage1-freeze-v3
      - name: Preserve builder and verify race gates
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/build_fwpm_realizability_stage1.py /tmp/build.py
          git fetch origin main research/fw-process-matrix-realizability-source-strengthening-stage1
          test "$(git rev-parse origin/main)" = "ee0a3776a08221361e3c0eb3bb4747e92ded7aa4"
          test "$(git rev-parse origin/research/fw-process-matrix-realizability-source-strengthening-stage1)" = "5e5e028100801a2da49ed18075fd3b577ea3ffdd"
      - name: Build frozen Stage-1 scientific candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FCP Project Lead"
          git config user.email "etblink@users.noreply.github.com"
          git switch -C research/fw-process-matrix-realizability-source-strengthening-stage1 origin/research/fw-process-matrix-realizability-source-strengthening-stage1
          python /tmp/build.py
          EXPECT='SOURCE_REGISTER.md frameworks/causal_process/FW_PROCESS_MATRIX_TARGETED_REALIZABILITY_SOURCE_INTAKE_STAGE1_0_1_0.md frameworks/causal_process/FW_PROCESS_MATRIX_TARGETED_REALIZABILITY_SOURCE_SELECTION_AUDIT_STAGE1_0_1_0.md frameworks/causal_process/FW_PROCESS_MATRIX_TARGETED_REALIZABILITY_STAGE1_SEARCH_EXECUTION_LOG_0_1_0.md handoffs/FW_PROCESS_MATRIX_TARGETED_REALIZABILITY_SOURCE_STRENGTHENING_STAGE1_HANDOFF_0_1_0.md '
          GOT="$(git status --short | awk '{print $2}' | sort | tr '\n' ' ')"
          test "$GOT" = "$EXPECT" || { echo "PATH_SCOPE_FAIL=$GOT"; exit 1; }
      - name: Machine qualification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          log=Path('frameworks/causal_process/FW_PROCESS_MATRIX_TARGETED_REALIZABILITY_STAGE1_SEARCH_EXECUTION_LOG_0_1_0.md').read_text()
          intake=Path('frameworks/causal_process/FW_PROCESS_MATRIX_TARGETED_REALIZABILITY_SOURCE_INTAKE_STAGE1_0_1_0.md').read_text()
          audit=Path('frameworks/causal_process/FW_PROCESS_MATRIX_TARGETED_REALIZABILITY_SOURCE_SELECTION_AUDIT_STAGE1_0_1_0.md').read_text()
          hand=Path('handoffs/FW_PROCESS_MATRIX_TARGETED_REALIZABILITY_SOURCE_STRENGTHENING_STAGE1_HANDOFF_0_1_0.md').read_text()
          sr=Path('SOURCE_REGISTER.md').read_text()
          assert log.count('| PASS_1;PASS_2;PASS_3 |') == 208
          assert 'TOPICAL_QUERY_COUNT_S1_S4 = 208' in log
          assert 'SEARCH_SATURATION = PASS_AT_DECLARED_SCOPE' in log
          assert 'TOTAL_FROZEN_TARGETED_SOURCE_COUNT = 27' in intake
          assert 'REUSED_CANONICAL_SOURCE_COUNT = 16' in intake
          assert 'NEW_EXTERNAL_SOURCE_COUNT = 11' in intake
          assert 'MEANINGFUL_REJECTED_COUNT = 12' in intake
          assert 'DEFERRED_COUNT = 1' in intake
          for i in range(1,14): assert f'D{i} = PASS' in intake
          for i in range(1,13): assert f'P{i} = ADEQUATE_COVERAGE' in intake
          for token in ['SOURCE_SELECTION_AUDIT = PASS','COUNTEREVIDENCE_COVERAGE = PASS','REALIZABILITY_LAYER_COVERAGE = PASS','LEGACY_NEW_SOURCE_INDEPENDENCE_AUDIT = PASS','IDENTITY_VERSION_DUPLICATE_AUDIT = PASS','PROPOSITION_REDUNDANCY_AUDIT = PASS','P1_P12_READINESS_COVERAGE = PASS','CORPUS_SUFFICIENT_FOR_LATER_PHYSICAL_SELECTION_ADJUDICATION = YES_AT_CURRENT_DECLARED_SEARCH_SCOPE']:
              assert token in intake, token
          new_ids = re.findall(r'`(SRC-FWPM-REAL-[A-Z0-9-]+)`', intake.split('## 3.')[0])
          assert len(set(new_ids)) == 11, (len(new_ids),len(set(new_ids)))
          for sid in set(new_ids): assert sr.count(f'`{sid}`') == 1, sid
          assert 'erratum DOI `10.1103/2j5m-7n6p`' in sr
          assert 'PHYSICAL_SELECTION_ADJUDICATION = NOT_STARTED' in intake
          assert 'PHYSICAL_SELECTION_VERDICT = NOT_ADJUDICATED' in hand
          assert 'FCP27_SELECTED = NO' in intake and 'FCP27_SELECTED = NO' in hand
          assert audit.count('| NEW_EXTERNAL | PASS | ADMIT;') == 11
          assert audit.count('| REUSED_CANONICAL | PASS | ADMIT;') == 16
          assert audit.count('`PROPOSITION_REDUNDANT') >= 2
          for p in ['CURRENT_STATE.md','FRAMEWORK_REGISTER.md','CLAIM_LEDGER.md','COMPARISON_PROTOCOL.md']:
              # untouched by candidate build
              pass
          for p in [log,intake,audit,hand,sr]: assert '\r' not in p
          print('SEARCH_LOG_208=PASS')
          print('SOURCE_COUNTS_16_11_27=PASS')
          print('D1_D13=PASS')
          print('P1_P12=PASS')
          print('SOURCE_REGISTER_NEW_IDS=PASS')
          print('STAGE1_SCOPE_FIREWALL=PASS')
          PY
      - name: Commit clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git add SOURCE_REGISTER.md frameworks/causal_process/FW_PROCESS_MATRIX_TARGETED_REALIZABILITY_SOURCE_INTAKE_STAGE1_0_1_0.md frameworks/causal_process/FW_PROCESS_MATRIX_TARGETED_REALIZABILITY_SOURCE_SELECTION_AUDIT_STAGE1_0_1_0.md frameworks/causal_process/FW_PROCESS_MATRIX_TARGETED_REALIZABILITY_STAGE1_SEARCH_EXECUTION_LOG_0_1_0.md handoffs/FW_PROCESS_MATRIX_TARGETED_REALIZABILITY_SOURCE_STRENGTHENING_STAGE1_HANDOFF_0_1_0.md
          git commit -m "Freeze FW-PROCESS-MATRIX realizability Stage-1 corpus"
          CAND=$(git rev-parse HEAD)
          TREE=$(git show -s --format=%T HEAD)
          PARENT=$(git show -s --format=%P HEAD)
          test "$PARENT" = "5e5e028100801a2da49ed18075fd3b577ea3ffdd"
          echo "CANDIDATE_COMMIT=$CAND"
          echo "CANDIDATE_TREE=$TREE"
          echo "CANDIDATE_PARENT=$PARENT"
          echo "CANDIDATE=$CAND" >> "$GITHUB_ENV"
      - name: Recheck canonical race and publish research candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main research/fw-process-matrix-realizability-source-strengthening-stage1
          test "$(git rev-parse origin/main)" = "ee0a3776a08221361e3c0eb3bb4747e92ded7aa4"
          test "$(git rev-parse origin/research/fw-process-matrix-realizability-source-strengthening-stage1)" = "5e5e028100801a2da49ed18075fd3b577ea3ffdd"
          git push origin HEAD:research/fw-process-matrix-realizability-source-strengthening-stage1
          test "$(git ls-remote --heads origin refs/heads/research/fw-process-matrix-realizability-source-strengthening-stage1 | awk '{print $1}')" = "$CANDIDATE"
          echo "STAGE1_RESEARCH_CANDIDATE_PUBLISHED=PASS"
