name: BFSS M4E5 Named Transport Bounded Diagnostic 3

# Exactly one push path on the isolated research branch triggers this gate.
# Source/audit-only commits do not trigger CI.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-m4e5-named-transport-diag3.yml

permissions:
  contents: read

concurrency:
  group: bfss-m4e5-named-transport-diag3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  independent-full-l2-gauge:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - name: Checkout isolated research sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout immutable original BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Fail-closed original source and candidate provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-m4e5-named-transport-diag3
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY_PRE'
          import pathlib,subprocess,hashlib,json
          d=json.loads(pathlib.Path('upstream-math/lean/lake-manifest.json').read_text())
          assert next(p['rev'] for p in d['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          root=pathlib.Path('experiments/openai-math-su2-physical-domain')
          accepted={
            'FCPIndependentOriginalGaugeBridge.lean':'f0258c3b68d3a64dab300ce3c32b1d3a5ab23e35',
            'FCPIndependentOriginalCliffordBridge.lean':'193c41c4437c413a87db7442ba725230afdf39ec',
            'FCPIndependentFullL2GaugeTransport.lean':'5e34611df34e14358c3d0509931ecd1f9cf555b7',
            'FCPIndependentFullL2Unitary.lean':'12ee07bf3b189c252fa54867e60f71cba532c574',
            'FCPIndependentPhysicalSpace.lean':'795f4cbcb15e1c86f5adabbf5cc8cc93c1f0a890',
            'FCPIndependentPhysicalUnitary.lean':'5dc225ed1e9433451ba1aeda11fc50ba9feb110f',
            'FCPIndependentSmoothCore.lean':'0041e511625bee6cb72e3896e97c99d7f722efd5',
            'FCPIndependentInvariantSmoothEquiv.lean':'5083f0ce9bfb43f616a9c3e5dc286887bd073de4',
            'FCPIndependentGaugePointwise.lean':'3b6edba2ab7bd2c3757f9d2d4b191478521d5c2c',
            'FCPIndependentSmoothSuperchargeFermion.lean':'425f5187324d3b7a7d67f54af0f0ff51b7b661e4',
            'FCPIndependentCoordinateDerivative.lean':'3c0e4fd84bb473e75a01fb6cadfd9e3aaf7f73f5',
            'FCPIndependentKineticCharge.lean':'175acf89e2f540927423d1776802f5bc673ccce2',
            'FCPIndependentPosition.lean':'4e75da8f49c9d752445cd1fc09b33861674ab088',
            'FCPIndependentCubicCharge.lean':'fd1526cddf92845adf004c6b4fbb4a052d6e1746',
            'SU2BFSSPhysicalDomainS1V52M3JIndependentUnitaryExistenceProbe.lean':'1cd42b286a18abf6e7f8c2348949f8de3748151c',
          }
          for name,sha in accepted.items():
            got=subprocess.check_output(['git','rev-parse','HEAD:'+str(root/name)],text=True).strip()
            assert got==sha,('ACCEPTED_PARENT_SOURCE_PIN_CHANGED',name,got)
          g4j='experiments/openai-math-su2-concrete-potential/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean'
          assert subprocess.check_output(['git','rev-parse','HEAD:'+g4j],text=True).strip() == 'dd82ff793918e448a2d91781edb84d273a664cd4'
          diagnostic_files={
            'FCPM4E5SourceParts.lean':'c1cd2114780ceeb8a8933fc9de90c4c63e762ef8',
            'FCPM4E5SourceOuterEquality.lean':'5651f5b06167635501536f997c51608a4b777226',
            'FCPM4E5NamedKineticBridge.lean':'4612931a4be22b64829710e62a3012e0882abd9f',
            'FCPM4E5NamedCubicBridge.lean':'8bc13b10970080e5b3c1c25876b1f0c4af38831c',
          }
          for name,expected in diagnostic_files.items():
            candidate=root/name
            assert subprocess.check_output(['git','rev-parse','HEAD:'+str(candidate)],text=True).strip()==expected
            assert subprocess.check_output(['git','hash-object','--no-filters',str(candidate)],text=True).strip()==expected
            src=candidate.read_text()
            assert 'sorry' not in src and 'admit' not in src and 'axiom ' not in src
          print('M4E5_NAMED_DIAG3_FROZEN_SOURCE_PINS_PASS')
          PY_PRE

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore original Lean 4.34.1 and pinned Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-m4e5-named-transport-diag3/toolchain.log; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo M4E5_NAMED_DIAG3_PINNED_LEAN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-m4e5-named-transport-diag3/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo M4E5_NAMED_DIAG3_PINNED_TOOLCHAIN_PASS

      - name: Restore immutable qualified M4E5 source outer cache
        id: cacheM4E5SourceOuter
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM3*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependent*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4E5*.olean
          key: bfss-fcp-m4e5-source-outer-diag1-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Confirm immutable qualified M4E5 source outer cache closure
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.cacheM4E5SourceOuter.outputs.cache-hit }}" = true || { echo M4E5_NAMED_DIAG3_SOURCE_OUTER_CACHE_MISS; exit 1; }
          cd upstream-math/lean
          for stem in \
            OAI/MathematicalPhysics/BFSS/Core \
            OAI/MathematicalPhysics/BFSS/GaugeCore \
            SU2BFSSG4JExactGaugeDataAssemblyProbe \
            SU2BFSSPhysicalDomainS1V52M3JIndependentUnitaryExistenceProbe \
            FCPIndependentCliffordIntertwining \
            FCPIndependentSpinRealization \
            FCPIndependentMajoranaAction \
            FCPIndependentOriginalCliffordBridge \
            FCPIndependentOriginalGaugeBridge \
            FCPIndependentFullL2GaugeTransport \
            FCPIndependentFullL2Unitary \
            FCPIndependentPhysicalSpace \
            FCPIndependentPhysicalUnitary \
            FCPIndependentSmoothCore \
            FCPIndependentInvariantSmoothEquiv \
            FCPIndependentGaugePointwise \
            FCPIndependentSmoothSuperchargeFermion \
            FCPIndependentCoordinateDerivative \
            FCPIndependentKineticCharge \
            FCPIndependentPosition \
            FCPIndependentCubicCharge \
            FCPM4E5SourceParts \
            FCPM4E5SourceOuterEquality; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "M4E5_REQUIRED_OLEAN_MISSING=$stem"; exit 1; }
          done
          echo M4E5_NAMED_DIAG3_QUALIFIED_ORIGINAL_OLEAN_CLOSURE_PASS
      - name: Strictly compile FCPM4E5NamedKineticBridge (105-second bounded stage)
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=FCPM4E5NamedKineticBridge
          cp "$GITHUB_WORKSPACE/experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
          echo "M4E5_NAMED_DIAG3_C_KINETIC_BEGIN $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a /tmp/bfss-m4e5-named-transport-diag3/stages.log
          /usr/bin/time -f 'DIAG_RESOURCE_TIME %e CPU %P MAX_RSS_KB %M' -o "/tmp/bfss-m4e5-named-transport-diag3/$stem.resource" \
            timeout --signal=TERM --kill-after=5s 105s lake env lean -DwarningAsError=true \
              -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" \
              >"/tmp/bfss-m4e5-named-transport-diag3/$stem.log" 2>&1 || {
            code=$?
            echo "M4E5_NAMED_DIAG3_C_KINETIC_FAILED_EXIT_$code $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a /tmp/bfss-m4e5-named-transport-diag3/stages.log
            tail -n 40 "/tmp/bfss-m4e5-named-transport-diag3/$stem.log"
            exit "$code"
          }
          test -s ".lake/build/lib/lean/$stem.olean"
          cat "/tmp/bfss-m4e5-named-transport-diag3/$stem.resource"
          python3 - <<'PY_AXIOM'
          from pathlib import Path
          import re
          stem='FCPM4E5NamedKineticBridge'
          expected=['independentKinetic_named_source_intertwining']
          src=Path(stem+'.lean').read_text()
          log=Path('/tmp/bfss-m4e5-named-transport-diag3/'+stem+'.log').read_text()
          ns='FCP.IndependentSmoothSupercharge'
          assert re.findall(r'^namespace (\S+)',src,re.M)==[ns]
          assert re.findall(r'^(?:def|theorem|abbrev) (\S+)',src,re.M)==expected
          assert re.findall(r'^#print axioms (\S+)',src,re.M)==expected
          reports=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          actual={k:{x.strip() for x in v.split(',') if x.strip()} for k,v in reports}
          assert len(reports)==len(actual)==len(expected),('REPORT_COUNT',reports)
          assert set(actual)=={ns+'.'+n for n in expected},('NAME_MISMATCH',actual)
          assert all(v <= {'propext','Classical.choice','Quot.sound'} for v in actual.values()),('FORBIDDEN_AXIOMS',actual)
          assert 'error:' not in log and 'sorryAx' not in log and 'unknownIdentifier' not in log
          unexpected=[line for line in log.splitlines() if 'warning:' in line and not re.fullmatch(r"warning: [A-Za-z0-9_-]+: repository '[^']+' has local changes",line)]
          assert not unexpected,('UNEXPECTED_WARNINGS',unexpected)
          print('M4E5_NAMED_DIAG3_C_KINETIC_STRICT_AXIOMS_PASS')
          PY_AXIOM
          echo "M4E5_NAMED_DIAG3_C_KINETIC_PASS $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a /tmp/bfss-m4e5-named-transport-diag3/stages.log

      - name: Strictly compile FCPM4E5NamedCubicBridge (105-second bounded stage)
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=FCPM4E5NamedCubicBridge
          cp "$GITHUB_WORKSPACE/experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
          echo "M4E5_NAMED_DIAG3_D_CUBIC_BEGIN $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a /tmp/bfss-m4e5-named-transport-diag3/stages.log
          /usr/bin/time -f 'DIAG_RESOURCE_TIME %e CPU %P MAX_RSS_KB %M' -o "/tmp/bfss-m4e5-named-transport-diag3/$stem.resource" \
            timeout --signal=TERM --kill-after=5s 105s lake env lean -DwarningAsError=true \
              -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" \
              >"/tmp/bfss-m4e5-named-transport-diag3/$stem.log" 2>&1 || {
            code=$?
            echo "M4E5_NAMED_DIAG3_D_CUBIC_FAILED_EXIT_$code $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a /tmp/bfss-m4e5-named-transport-diag3/stages.log
            tail -n 40 "/tmp/bfss-m4e5-named-transport-diag3/$stem.log"
            exit "$code"
          }
          test -s ".lake/build/lib/lean/$stem.olean"
          cat "/tmp/bfss-m4e5-named-transport-diag3/$stem.resource"
          python3 - <<'PY_AXIOM'
          from pathlib import Path
          import re
          stem='FCPM4E5NamedCubicBridge'
          expected=['independentCubic_named_source_intertwining']
          src=Path(stem+'.lean').read_text()
          log=Path('/tmp/bfss-m4e5-named-transport-diag3/'+stem+'.log').read_text()
          ns='FCP.IndependentSmoothSupercharge'
          assert re.findall(r'^namespace (\S+)',src,re.M)==[ns]
          assert re.findall(r'^(?:def|theorem|abbrev) (\S+)',src,re.M)==expected
          assert re.findall(r'^#print axioms (\S+)',src,re.M)==expected
          reports=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          actual={k:{x.strip() for x in v.split(',') if x.strip()} for k,v in reports}
          assert len(reports)==len(actual)==len(expected),('REPORT_COUNT',reports)
          assert set(actual)=={ns+'.'+n for n in expected},('NAME_MISMATCH',actual)
          assert all(v <= {'propext','Classical.choice','Quot.sound'} for v in actual.values()),('FORBIDDEN_AXIOMS',actual)
          assert 'error:' not in log and 'sorryAx' not in log and 'unknownIdentifier' not in log
          unexpected=[line for line in log.splitlines() if 'warning:' in line and not re.fullmatch(r"warning: [A-Za-z0-9_-]+: repository '[^']+' has local changes",line)]
          assert not unexpected,('UNEXPECTED_WARNINGS',unexpected)
          print('M4E5_NAMED_DIAG3_D_CUBIC_STRICT_AXIOMS_PASS')
          PY_AXIOM
          echo "M4E5_NAMED_DIAG3_D_CUBIC_PASS $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a /tmp/bfss-m4e5-named-transport-diag3/stages.log

      - name: Save qualified named transport diagnostic compilation cache
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM3*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependent*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4E5*.olean
          key: bfss-fcp-m4e5-named-transport-diag3-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve M4E5 bounded named-transport diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4e5-named-transport-diag3-${{ github.run_id }}
          path: /tmp/bfss-m4e5-named-transport-diag3
          if-no-files-found: ignore
