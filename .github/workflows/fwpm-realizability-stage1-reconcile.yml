name: Reconcile FW-PROCESS-MATRIX realizability Stage-1
on:
  push:
    branches: [automation/fwpm-realizability-stage1-reconcile]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: automation/fwpm-realizability-stage1-reconcile
      - name: Verify exact scientific baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "5675f75621125bdbac3755d88e57768afcc949c9"
          test "$(git show -s --format=%T origin/main)" = "1cb2403c2ad84f050ed451a69ddbdfee0f3f7637"
      - name: Build semantic reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FCP Project Lead"
          git config user.email "etblink@users.noreply.github.com"
          git switch -C maintenance/fwpm-realizability-stage1-reconcile origin/main
          python - <<'PY'
          from pathlib import Path
          cs=Path('CURRENT_STATE.md')
          s=cs.read_text(encoding='utf-8')
          replacements={
          'LATEST_CANONICAL_SCIENTIFIC_OPERATION = FW_PROCESS_MATRIX_NULL_CONTROL':'LATEST_CANONICAL_SCIENTIFIC_OPERATION = FW_PROCESS_MATRIX_TARGETED_REALIZABILITY_AND_PHYSICAL_SELECTION_SOURCE_STRENGTHENING_STAGE1',
          'LATEST_CANONICAL_SCIENTIFIC_COMMIT = c391b42d3aa4043045d7e3a566a26b9f3aac6070':'LATEST_CANONICAL_SCIENTIFIC_COMMIT = 5675f75621125bdbac3755d88e57768afcc949c9',
          'LATEST_CANONICAL_SCIENTIFIC_TREE = e8c7af0932cb0e4557edf258aa1396094509a63d':'LATEST_CANONICAL_SCIENTIFIC_TREE = 1cb2403c2ad84f050ed451a69ddbdfee0f3f7637',
          'LATEST_CANONICAL_MAINTENANCE_OPERATION = POST_FW_PROCESS_MATRIX_REALIZABILITY_PHYSICAL_SELECTION_STAGE1_PREREGISTRATION_ROUTING_AND_NAVIGATION_RECONCILIATION':'LATEST_CANONICAL_MAINTENANCE_OPERATION = POST_FW_PROCESS_MATRIX_TARGETED_REALIZABILITY_STAGE1_ROUTING_AND_NAVIGATION_RECONCILIATION',
          'TARGETED_REALIZABILITY_SOURCE_STRENGTHENING_STAGE1_STATUS = PREREGISTERED_STAGE1_ONLY__EXTERNAL_SEARCH_NOT_STARTED':'TARGETED_REALIZABILITY_SOURCE_STRENGTHENING_STAGE1_STATUS = CANONICALLY_COMPLETE',
          'FW_PROCESS_MATRIX_TARGETED_REALIZABILITY_AND_PHYSICAL_SELECTION_SOURCE_STRENGTHENING_STAGE1 = PREREGISTERED_STAGE1_ONLY__EXTERNAL_SEARCH_NOT_STARTED':'FW_PROCESS_MATRIX_TARGETED_REALIZABILITY_AND_PHYSICAL_SELECTION_SOURCE_STRENGTHENING_STAGE1 = CANONICALLY_COMPLETE',
          'TARGETED_REALIZABILITY_NEW_EXTERNAL_SOURCE_SEARCH_STARTED = NO':'TARGETED_REALIZABILITY_NEW_EXTERNAL_SOURCE_SEARCH_STARTED = YES__COMPLETE',
          'TARGETED_REALIZABILITY_SOURCE_ADMISSION_STARTED = NO':'TARGETED_REALIZABILITY_SOURCE_ADMISSION_STARTED = YES__COMPLETE',
          'TARGETED_REALIZABILITY_SOURCE_REGISTER_MUTATED = NO':'TARGETED_REALIZABILITY_SOURCE_REGISTER_MUTATED = YES__11_NEW_SOURCE_BOUND_ROWS',
          'TARGETED_REALIZABILITY_TARGETED_CORPUS_FROZEN = NO':'TARGETED_REALIZABILITY_TARGETED_CORPUS_FROZEN = YES__27_SOURCES',
          'NEXT_EXECUTION_STEP = FIRST_EXTERNAL_SOURCE_SEARCH_REQUIRES_SEPARATE_AUTHORIZATION':'NEXT_EXECUTION_STEP = PROSPECTIVELY_FREEZE_STAGE2_PHYSICAL_SELECTION_ADJUDICATION_RULES_BEFORE_CORPUS_APPLICATION',
          'NEXT_RECOMMENDED_OPERATION = FW_PROCESS_MATRIX_TARGETED_REALIZABILITY_AND_PHYSICAL_SELECTION_SOURCE_STRENGTHENING_STAGE1':'NEXT_RECOMMENDED_OPERATION = FW_PROCESS_MATRIX_TARGETED_REALIZABILITY_AND_PHYSICAL_SELECTION_STAGE2_PREREGISTRATION',
          'NEXT_OPERATION_CLASS = TARGETED_SOURCE_STRENGTHENING_STAGE1':'NEXT_OPERATION_CLASS = PHYSICAL_SELECTION_ADJUDICATION_PREREGISTRATION',
          'NEXT_OPERATION_AUTHORIZED = NO\nNEXT_OPERATION_AUTHORIZATION_BOUNDARY = FIRST_EXTERNAL_SOURCE_SEARCH':'NEXT_OPERATION_AUTHORIZED = YES__CURRENT_EXECUTIVE_DELEGATION\nNEXT_OPERATION_AUTHORIZATION_BOUNDARY = FREEZE_STAGE2_RULES_BEFORE_APPLYING_FROZEN_27_SOURCE_CORPUS',
          'NEXT_SCIENTIFIC_PHASE = NONE__FIRST_EXTERNAL_SEARCH_AUTHORIZATION_REQUIRED':'NEXT_SCIENTIFIC_PHASE = FW_PROCESS_MATRIX_TARGETED_REALIZABILITY_AND_PHYSICAL_SELECTION_STAGE2_PREREGISTRATION',
          }
          for a,b in replacements.items():
              if a not in s: raise SystemExit(f'missing CURRENT_STATE token: {a}')
              s=s.replace(a,b,1)
          old='''`LATEST_NUMBERED_PHASE` remains FCP-26 because the later FW-CAT, causal-process, method-audit, process-matrix admission-audit, sequencing, null-control, and targeted-source-strengthening preregistration operations are unnumbered and FCP-27 has not been selected. The latest substantive scientific operation remains the completed `FW_PROCESS_MATRIX_NULL_CONTROL`. The selected targeted realizability / physical-selection Stage 1 is now prospectively preregistered with a 2026-08-29 publication cutoff, D1–D13 discovery lanes, S1–S6 search surfaces, Q1–Q13 fixed query families, three search passes, mandatory adverse-search targets, explicit corpus-sufficiency rules and a no-post-hoc-expansion firewall. No external literature query, source admission, Source Register mutation, targeted corpus freeze, or physical-selection adjudication has started. The present maintenance operation records that exact first-search authorization boundary. Exact enclosing maintenance identities remain recoverable from Git rather than embedded self-referentially.'''
          new='''`LATEST_NUMBERED_PHASE` remains FCP-26 because the later FW-CAT, causal-process, method-audit, process-matrix admission-audit, sequencing, null-control, and targeted realizability source-strengthening operations are unnumbered and FCP-27 has not been selected. The latest substantive scientific operation is now the completed `FW_PROCESS_MATRIX_TARGETED_REALIZABILITY_AND_PHYSICAL_SELECTION_SOURCE_STRENGTHENING_STAGE1`: all frozen Q1–Q13 searches were executed across S1–S4, S5/S6 stayed within their preregistered identity/bibliographic roles, and a counterevidence-aware 27-source targeted corpus (16 reused canonical + 11 new external) is frozen as sufficient for later physical-selection adjudication at the declared scope. Physical-selection adjudication itself has not started. The next epistemic task is to prospectively freeze Stage-2 adjudication rules before applying the frozen corpus. Exact enclosing maintenance identities remain recoverable from Git rather than embedded self-referentially.'''
