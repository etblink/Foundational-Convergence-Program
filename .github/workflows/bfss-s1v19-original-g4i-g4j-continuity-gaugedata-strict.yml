name: BFSS S1V19 Original G4I to G4J Continuity and Exact GaugeData Strict Gate

# Only this precise workflow-path mutation on the isolated branch can trigger this test.
on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v19-original-g4i-g4j-continuity-gaugedata-strict.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v19-original-g4i-g4j-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-source-g4i-g4j:
    runs-on: ubuntu-latest
    timeout-minutes: 52
    steps:
      - name: Checkout isolated original candidate sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout immutable original upstream mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Fail closed on original source version and all seven unchanged G4I G4J file hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v19-g4i-g4j
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          j=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in j['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          r=experiments/openai-math-su2-concrete-potential
          test "$(git hash-object "$r/SU2BFSSG4HExactThetaCovarianceProbe.lean")" = 3ee402e49bbca8d90a232ddf5d34f578814549eb
          test "$(git hash-object "$r/SU2BFSSG2BBosonGaugeContinuityProbe.lean")" = $(git hash-object "$r/SU2BFSSG2BBosonGaugeContinuityProbe.lean")
          test "$(git hash-object "$r/SU2BFSSG4IAOneParticleContinuityProbe.lean")" = f8dcadce8b6c3183da6c0170966ff59410b15f7d
          test "$(git hash-object "$r/SU2BFSSG4IB1ExteriorFockSeedContinuityProbe.lean")" = 0658557712a78f40a4a8eeb3192d8c643033d929
          test "$(git hash-object "$r/SU2BFSSG4IB2ExteriorFockTwoWedgeContinuityProbe.lean")" = 0579e38a9f2c2fcceee69a06c4526e430b320e38
          test "$(git hash-object "$r/SU2BFSSG4IB3ExteriorFockAllContinuityProbe.lean")" = 6a508c0f7fd7e1b36ee75094c6ec520a625c7a3a
          test "$(git hash-object "$r/SU2BFSSG4IC1FermionParameterContinuityProbe.lean")" = 8167fa4698a75cc95467cfb02732280b1207e284
          test "$(git hash-object "$r/SU2BFSSG4IC2FermionJointContinuityProbe.lean")" = a90f8799cae1c6752993ba554476037c39b3168d
          test "$(git hash-object "$r/SU2BFSSG4JExactGaugeDataAssemblyProbe.lean")" = dd82ff793918e448a2d91781edb84d273a664cd4
          echo ORIGINAL_G4I_G4J_SEVEN_UNCHANGED_SOURCE_PINS_VERIFIED

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore exact original Lean and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v19-g4i-g4j/toolchain.log; then
              ok=true; break
            fi
            echo PINNED_LEAN_INSTALL_RETRY_$attempt | tee -a /tmp/bfss-s1v19-g4i-g4j/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo ORIGINAL_PINNED_TOOLCHAIN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v19-g4i-g4j/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo G4I_G4J_PINNED_ORIGINAL_LEAN_MATHLIB_VERIFIED

      - name: Restore already accepted original G4H and genuine OAI dependencies
        id: accepted
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v19-isolated-g4h-original-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed unless original accepted G4H and boson G2B cache are intact
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.accepted.outputs.cache-hit }}" = true || { echo ACCEPTED_ORIGINAL_G4H_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in SU2BFSSG1APairedThetaProbe SU2BFSSG2BBosonGaugeContinuityProbe SU2BFSSG4EFermionHilbertUnitaryProbe SU2BFSSG4FRealColorAnnihilatorForwardProbe SU2BFSSG4GMajoranaModeCovarianceProbe SU2BFSSG4HExactThetaCovarianceProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "MISSING_ACCEPTED_SOURCE_MODULE=$stem"; exit 1; }
          done
          test -s .lake/build/lib/lean/OAI/Analysis/Laughlin/Exterior/SpinUnitary.olean
          echo G4I_G4J_ACCEPTED_ORIGINAL_FERMION_THETA_AND_BOSON_GAUGE_READY

      - name: Compile exact seven original G4I to G4J files and strictly audit 24 kernel axiom roots
        shell: bash
        timeout-minutes: 23
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          for stem in SU2BFSSG4IAOneParticleContinuityProbe SU2BFSSG4IB1ExteriorFockSeedContinuityProbe SU2BFSSG4IB2ExteriorFockTwoWedgeContinuityProbe SU2BFSSG4IB3ExteriorFockAllContinuityProbe SU2BFSSG4IC1FermionParameterContinuityProbe SU2BFSSG4IC2FermionJointContinuityProbe SU2BFSSG4JExactGaugeDataAssemblyProbe; do
            cp "../../experiments/openai-math-su2-concrete-potential/$stem.lean" "$stem.lean"
            timeout 270s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v19-g4i-g4j/$stem.log"
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "MISSING_FRESH_SOURCE_MODULE=$stem"; exit 1; }
          done
          python3 - <<'PY'
          import pathlib,re
          roots={
            'SU2BFSSG4IAOneParticleContinuityProbe':('FCP.BFSSSU2GaugeG4IA.',["adjointColorMatrix_entry_continuous","complexOneParticleMatrix_continuous"]),
            'SU2BFSSG4IB1ExteriorFockSeedContinuityProbe':('FCP.BFSSSU2GaugeG4IB1.',["orbitalGauge_parameter_continuous","fockSeedCoordinateLinear","fockSeedCoordinateLinear_apply","fockSeedCoordinateLinear_continuous","exteriorGauge_seedCoordinate_continuous","exteriorGauge_vacuum_coordinates_continuous","exteriorGauge_singleton_coordinates_continuous"]),
            'SU2BFSSG4IB2ExteriorFockTwoWedgeContinuityProbe':('FCP.BFSSSU2GaugeG4IB2.',["wedgePairCoordinate","wedgePairCoordinate_expansion","exteriorGauge_wedgePair_coordinates_continuous","exteriorGauge_modePair_coordinates_continuous"]),
            'SU2BFSSG4IB3ExteriorFockAllContinuityProbe':('FCP.BFSSSU2GaugeG4IB3.',["fockProductBasisCoordinate","fockProductCoordinates_expansion","fockCoordinateProduct","fockCoordinateProduct_jointContinuous","exteriorGauge_allCoordinates_continuous"]),
            'SU2BFSSG4IC1FermionParameterContinuityProbe':('FCP.BFSSSU2GaugeG4IC1.',["fermionGauge_parameter_continuous"]),
            'SU2BFSSG4IC2FermionJointContinuityProbe':('FCP.BFSSSU2GaugeG4IC2.',["fermionGauge_jointContinuous"]),
            'SU2BFSSG4JExactGaugeDataAssemblyProbe':('FCP.BFSSSU2GaugeG4J.',["pairedGaugeData","pairedGaugeData_boson_exact","pairedGaugeData_fermion_exact","pairedGaugeData_fermion_jointContinuous"]),
          }
          allowed={'propext','Classical.choice','Quot.sound'}
          pattern=r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
          count=0
          for stem,(namespace,names) in roots.items():
            s=pathlib.Path('/tmp/bfss-s1v19-g4i-g4j',stem+'.log').read_text()
            hits=re.findall(pattern,s)
            got={name:{v.strip() for v in axioms.split(',') if v.strip()} for name,axioms in hits}
            assert len(hits)==len(names)==len(got),(stem,hits,names)
            for name in names:
              fq=namespace+name
              assert fq in got and got[fq]<=allowed,(stem,fq,got)
            assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,(stem,s[-5500:])
            count+=len(names)
            print(stem,'ORIGINAL_G4I_G4J_AXIOM_CLEAN_PASS',len(names))
          assert count==24,count
          print('ORIGINAL_SOURCE_G4I_G4J_24_ROOTS_EXACT_GAUGEDATA_KERNEL_PASS')
          PY

      - name: Save accepted actual original G4J full GaugeData module cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v19-isolated-g4j-original-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve first causal Lean diagnostics and source audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v19-g4i-g4j-${{ github.run_id }}
          path: /tmp/bfss-s1v19-g4i-g4j/
          if-no-files-found: warn
          retention-days: 14
