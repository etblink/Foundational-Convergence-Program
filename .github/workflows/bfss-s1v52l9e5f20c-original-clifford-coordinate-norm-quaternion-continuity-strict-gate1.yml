name: BFSS S1V52L9E5F20C Original Clifford PBW Norm Quaternion Continuity Strict Gate 1

# Research branch isolated, single shot; only workflow file addition triggers.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s1v52l9e5f20c-original-clifford-coordinate-norm-quaternion-continuity-strict-gate1.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v52l9e5f20c-original-source-clifford-pbw-norm-gate1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-native-clifford-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact research source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout immutable upstream mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Verify exact original source pins and source manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v52l9e5f20c
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          data=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in data['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52L9E5F20COriginalSourceCliffordCoordinateNormQuaternionContinuityProbe.lean)" = 68b9eeeb662b282b9915856a28dedb233c965a0e || { echo F20C_ORIGINAL_SOURCE_PIN_MISMATCH=SU2BFSSPhysicalDomainS1V52L9E5F20COriginalSourceCliffordCoordinateNormQuaternionContinuityProbe; exit 1; }
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52L9E5F20BOriginalSource48CliffordPBWBasisFiniteDimensionalProbe.lean)" = 6e4c78fd31f9781267659313a8a0edfedd65e9ad || { echo F20C_ORIGINAL_SOURCE_PIN_MISMATCH=SU2BFSSPhysicalDomainS1V52L9E5F20BOriginalSource48CliffordPBWBasisFiniteDimensionalProbe; exit 1; }
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52L9E5F20AOriginalNativeQuaternionCoordinateContinuityProbe.lean)" = f76b71b1b47227bd75727b997064e381f016e913 || { echo F20C_ORIGINAL_SOURCE_PIN_MISMATCH=SU2BFSSPhysicalDomainS1V52L9E5F20AOriginalNativeQuaternionCoordinateContinuityProbe; exit 1; }
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52L7C7OriginalNativeEulerWitnessAndSpinHomProbe.lean)" = 581dd3f565f4b32260470f51bf240deac057c1a8 || { echo F20C_ORIGINAL_SOURCE_PIN_MISMATCH=SU2BFSSPhysicalDomainS1V52L7C7OriginalNativeEulerWitnessAndSpinHomProbe; exit 1; }
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52B2Original48CliffordQuaternionPolynomialMulProbe.lean)" = 164add0b3a17b9d5417aa3595de841ad5eee33f4 || { echo F20C_ORIGINAL_SOURCE_PIN_MISMATCH=SU2BFSSPhysicalDomainS1V52B2Original48CliffordQuaternionPolynomialMulProbe; exit 1; }
          target=experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52L9E5F20COriginalSourceCliffordCoordinateNormQuaternionContinuityProbe.lean
          expected=68b9eeeb662b282b9915856a28dedb233c965a0e
          committed="$(git rev-parse "HEAD:$target")"
          filtered="$(git hash-object --path="$target" "$target")"
          raw="$(git hash-object --no-filters "$target")"
          echo "F20C_SOURCE_SHA expected=$expected committed=$committed filtered=$filtered raw=$raw"
          test "$expected" = "$committed" && test "$expected" = "$filtered" && test "$expected" = "$raw"
          echo F20C_EXACT_SOURCE_AND_TOOLCHAIN_PIN_PASS

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v52l9e5f20c/toolchain.log; then
              ok=true; break
            fi
            echo F20C_LEAN_RETRY_$attempt | tee -a /tmp/bfss-s1v52l9e5f20c/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo F20C_PINNED_LEAN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v52l9e5f20c/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo F20C_PINNED_LEAN_MATHLIB_PASS

      - name: Restore strictly accepted source Clifford F20B basis cache
        id: cacheF20B
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v52l9e5f20b-source-clifford-pbw-finite-dim-v2-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed on qualified exact original dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.cacheF20B.outputs.cache-hit }}" = true || { echo F20C_ACCEPTED_F20B_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Core.olean || { echo F20C_ORIGINAL_OAI_CORE_MISSING; exit 1; }
          for stem in SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe SU2BFSSPhysicalDomainS1V52L9E5F20AOriginalNativeQuaternionCoordinateContinuityProbe SU2BFSSPhysicalDomainS1V52L9E5F20BOriginalSource48CliffordPBWBasisFiniteDimensionalProbe SU2BFSSPhysicalDomainS1V52L7C7OriginalNativeEulerWitnessAndSpinHomProbe SU2BFSSPhysicalDomainS1V52B2Original48CliffordQuaternionPolynomialMulProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "F20C_REQUIRED_ACTUAL_SOURCE_OLEAN_MISSING=$stem"; exit 1; }
          done
          echo F20C_QUALIFIED_F20B_AND_NATIVE_CLIFFORD_DEPS_READY

      - name: Compile original Clifford norm and two quaternion continuity roots
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=SU2BFSSPhysicalDomainS1V52L9E5F20COriginalSourceCliffordCoordinateNormQuaternionContinuityProbe
          cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
          timeout 660s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v52l9e5f20c/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean" || { echo F20C_NEW_SOURCE_OLEAN_MISSING; exit 1; }
          python3 - <<'PY'
          import pathlib,re
          stem="SU2BFSSPhysicalDomainS1V52L9E5F20COriginalSourceCliffordCoordinateNormQuaternionContinuityProbe"
          ns="FCP.BFSSS1V52L9E5F20C"
          instances=["originalSourceCliffordNormedGroup","originalSourceCliffordNormedSpace"]
          roots=["originalSourceCliffordQuaternion_continuous",
                 "originalNativeGaugeSpinHom_clifford_coe_continuous"]
          src=pathlib.Path(stem+'.lean').read_text()
          log=pathlib.Path('/tmp/bfss-s1v52l9e5f20c',stem+'.log').read_text()
          assert re.findall(r'^namespace (\S+)',src,re.M)==[ns]
          assert re.findall(r'^noncomputable instance (\S+)',src,re.M)==instances
          assert re.findall(r'^theorem (\S+)',src,re.M)==roots
          assert re.findall(r'^#print axioms (\S+)',src,re.M)==instances+roots
          rr=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          found={k:{t.strip() for t in v.split(',') if t.strip()} for k,v in rr}
          assert len(rr)==len(found)==len(instances+roots),rr
          allowed={'propext','Classical.choice','Quot.sound'}
          for name in instances+roots:
            k=ns+'.'+name
            assert k in found and found[k]<=allowed,(k,found)
          assert 'error:' not in log and 'sorryAx' not in log and 'unknownIdentifier' not in log, log[-9000:]
          print('F20C_TRUE_ORIGINAL_CLIFFORD_PBW_NORM_TWO_NATIVE_QUATERNION_CONTINUITY_ROOTS_AXIOMS_PASS')
          PY

      - name: Save qualified source Clifford coordinate norm cache
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v52l9e5f20c-source-clifford-pbw-norm-quaternion-continuity-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve true source Clifford norm diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v52l9e5f20c-norm-${{ github.run_id }}
          path: /tmp/bfss-s1v52l9e5f20c
          if-no-files-found: ignore
