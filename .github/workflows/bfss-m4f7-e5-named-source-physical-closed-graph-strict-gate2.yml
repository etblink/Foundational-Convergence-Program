name: BFSS M4F7 E5 Named Source Physical Closed Operator Graph Strict Gate 2

# Isolated research branch, exact self-path trigger only.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-m4f7-e5-named-source-physical-closed-graph-strict-gate2.yml

permissions:
  contents: read

concurrency:
  group: bfss-m4f7-e5-named-source-physical-closed-graph-strict-gate2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restricted-core-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - name: Checkout isolated research sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout immutable original BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Fail-closed exact original and candidate source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-m4f7-e5-named-source-physical-closed-graph-strict-gate2
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import pathlib,subprocess,json,re
          d=json.loads(pathlib.Path('upstream-math/lean/lake-manifest.json').read_text())
          assert next(p['rev'] for p in d['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          p=pathlib.Path('experiments/openai-math-su2-physical-domain')
          blobs={
            'FCPIndependentFullSmoothCharge.lean':'4fa31d97ddfbb80e3258070caccd7b0a6b0bc874',
            'FCPIndependentChargeVectorL2.lean':'6492f4b08181020f611f7d7d4b751394805420d2',
            'FCPIndependentFullCoreGraph.lean':'2139e7fc9e7b9d5bf99ec57d096686078b8ffdf7',
            'FCPIndependentFullCoreGraphImage.lean':'06e98a1b867f21577b5b74033e411d27ba688985',
            'FCPIndependentGraphTransportHomeomorph.lean':'8455a6c42f23b2d08f7945188fe5b8ca9e75ac4b',
            'FCPIndependentFullCoreGraphClosure.lean':'a6aacf285206ba79f331bf2c6818fc0b7df1a6e4',
            'FCPIndependentInvariantSmoothEquiv.lean':'5083f0ce9bfb43f616a9c3e5dc286887bd073de4',
            'FCPM4F6PairedSourceGraphInputCut.lean':'c217d66cf9e8ccf39b64aab6488fe62b11447beb',
            'FCPM4F6IndependentGraphInputCut.lean':'4db1bbd1685555a3c00efd836577186782ff08bb',
            'FCPM4F6IndependentLiteralAliasBoundary.lean':'88a0cfdf5c5a4e407906462a56f62b9df9281ea0',
            'FCPM4F6GenericNamedAliasInputCut.lean':'b826575e5c39739a49e2797c02b79024c9f7e692',
            'FCPM4F6IndependentGraphInputCutNamedAlias.lean':'976ca4ed439f63566d49611566299d66d33a5fd1',
            'FCPM4F6RestrictedGraphImageC3.lean':'b9d707d8a9ca1100fda35872ebbfeb83c56dbd2a',
            'FCPM4F6RestrictedGraphClosureC4.lean':'7a248ff92d8f1d3e7ee7cbf9e94b7addf5db5e0d',
            'FCPM4F7IndependentRestrictedClosedGraphVertical.lean':'6b607a8276fa5f787e94473ca47f874c3b69d7b8',
            'FCPM4F7IndependentRestrictedClosedGraphVerticalC1Cut.lean':'71a0b11174a1c5beef4ad674a0ac1666ec35347c',
            'FCPM4F7IndependentClosedChargeOperatorV2.lean':'571890437e52ce1a0e2de7267862a8a69f5f00be',
            'FCPM4F7IndependentClosedGraphAliasA2.lean':'87c3804ed5602bc2e3365489d556bb8314138780',
            'FCPM4F7IndependentClosedGraphAliasA3.lean':'f38ff58df7afe69562c3059c71b7c2f7d7a28e60',
            'FCPM4F7FullClosedGraphVerticalB4.lean':'03a51889a1060e7407bdecab607b4bfa2e7b3070',
            'FCPM4F7FullClosedGraphVerticalB4CoeAlign.lean':'2b485db6576f37cd13acd861eb9549d26f49bc51',
            'FCPRestrictedGraphInputCut.lean':'cbcb667d15fccd67eaa185a69eb8b476546d977d',
          }
          for name,sha in blobs.items():
            file=p/name
            assert subprocess.check_output(['git','rev-parse','HEAD:'+str(file)],text=True).strip() == sha,(name,'git source pin')
            assert subprocess.check_output(['git','hash-object','--no-filters',str(file)],text=True).strip() == sha,(name,'working source pin')
          def lean_code_only(text):
            # Lean nested block comments, including documentation, are NOT code.
            out=[]
            depth=0
            i=0
            while i < len(text):
              if text.startswith('/-',i):
                depth+=1
                i+=2
              elif depth and text.startswith('-/',i):
                depth-=1
                i+=2
              else:
                c=text[i]
                if depth==0 or c=='\n':
                  out.append(c)
                i+=1
            assert depth==0,('UNTERMINATED_LEAN_COMMENT',)
            return '\n'.join(line.split('--',1)[0] for line in ''.join(out).splitlines())
          for candidate in ['FCPRestrictedGraphInputCut.lean','FCPM4F6PairedSourceGraphInputCut.lean','FCPM4F6IndependentGraphInputCut.lean','FCPM4F6IndependentLiteralAliasBoundary.lean','FCPM4F6GenericNamedAliasInputCut.lean','FCPM4F6IndependentGraphInputCutNamedAlias.lean','FCPM4F6RestrictedGraphImageC3.lean','FCPM4F6RestrictedGraphClosureC4.lean','FCPM4F7IndependentRestrictedClosedGraphVertical.lean','FCPM4F7IndependentRestrictedClosedGraphVerticalC1Cut.lean','FCPM4F7IndependentClosedChargeOperatorV2.lean','FCPM4F7IndependentClosedGraphAliasA2.lean','FCPM4F7IndependentClosedGraphAliasA3.lean','FCPM4F7FullClosedGraphVerticalB4.lean','FCPM4F7FullClosedGraphVerticalB4CoeAlign.lean']:
            source=(p/candidate).read_text()
            code=lean_code_only(source)
            assert not re.search(r'(?m)^[ \t]*(?:sorry|admit|axiom)\b|\bsorryAx\b',code),('UNAPPROVED_LEAN_CODE',candidate)
          print('M4F7_E5_GATE2_COMMENT_AWARE_EXACT_SOURCE_PASS')
          PY

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-m4f7-e5-named-source-physical-closed-graph-strict-gate2/toolchain.log; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-m4f7-e5-named-source-physical-closed-graph-strict-gate2/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo M4F7_E5_GATE2_PINNED_TOOLCHAIN_PASS






      - name: Restore strictly qualified E4 source graph and J-free E2 operator ancestry
        id: e4cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM3*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependent*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4E5*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentFullSmoothCharge.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentChargeVectorL2.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentFullCoreGraph.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentFullCoreGraphImage.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentGraphTransportHomeomorph.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentFullCoreGraphClosure.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7FullClosedGraphVerticalB4CoeAlign.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7GenericOpaqueClosedRelationBridgeImports.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentFullClosedChargeOperatorE1.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentPhysicalInputCutOperatorE2.olean
            upstream-math/lean/.lake/build/lib/lean/FCPRestrictedGraphInputCut.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F6PairedSourceGraphInputCut.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F6IndependentLiteralAliasBoundary.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F6GenericNamedAliasInputCut.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F6IndependentGraphInputCutNamedAlias.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F6RestrictedGraphImageC3.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F6RestrictedGraphClosureC4.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentLiteralRestrictedGraphBridgeE3.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7PhysicalGraphTransportE4.olean
          key: bfss-fcp-m4f7-e4-physical-closed-graph-transport-75f06cc3-gate2-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail-closed E4 and historical D1 exact ancestor availability plus frozen E5 source
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.e4cache.outputs.cache-hit }}" = true || { echo M4F7_E5_QUALIFIED_E4_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in OAI/MathematicalPhysics/BFSS/ClosedProfiles OAI/MathematicalPhysics/BFSS/Core SU2BFSSG4K9DSourcePotentialMultiplierProbe SU2BFSSG4K10ASourceClosedJointChargeGraphProbe FCPM4F7PhysicalGraphTransportE4 FCPM4F7IndependentPhysicalInputCutOperatorE2; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo M4F7_E5_D1_ANCESTOR_IMPORT_MISSING=$stem; exit 1; }
          done
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import pathlib,subprocess,re
          root=pathlib.Path("experiments/openai-math-su2-physical-domain")
          original=root/"SU2BFSSPhysicalDomainD1RestrictedSourceGraphProbe.lean"
          e5=root/"FCPM4F7NamedSourcePhysicalGraphTransportE5.lean"
          e4=root/"FCPM4F7PhysicalGraphTransportE4.lean"
          pins={original:'c601d5888e24d0a9bc8f62f2bff368fc29299b5d',
                e5:'83c27984274d4fe0590fcaefbf44908683af086d',
                e4:'75f06cc35fa60166b0f29e10b08ca37c8780bc1a'}
          for path,sha in pins.items():
            name=str(path)
            assert subprocess.check_output(["git","rev-parse","HEAD:"+name],text=True).strip()==sha,(name,"PINNED_GIT_BLOB")
            assert subprocess.check_output(["git","hash-object","--no-filters",name],text=True).strip()==sha,(name,"PINNED_WORKING_BLOB")
          d=original.read_text();s=e5.read_text()
          assert d.startswith("import SU2BFSSG4K10ASourceClosedJointChargeGraphProbe\nimport OAI.MathematicalPhysics.BFSS.ClosedProfiles\n")
          assert s.startswith("import FCPM4F7PhysicalGraphTransportE4\nimport SU2BFSSPhysicalDomainD1RestrictedSourceGraphProbe\n")
          assert re.findall(r"^namespace (\S+)",s,re.M)==["FCP.M4F7NamedSourcePhysicalGraphTransportE5"]
          assert re.findall(r"^theorem (\S+)",s,re.M)==["pairedSourceNamedPhysicalClosedGraph_eq_independentOperatorGraph_image"]
          assert re.findall(r"^#print axioms (\S+)",s,re.M)==["pairedSourceNamedPhysicalClosedGraph_eq_independentOperatorGraph_image"]
          dnames=["sourceGaugeRestrictedGraphMap_equal","sourceGaugeRestrictedClosedGraph_equal",
                  "sourceGaugeRestrictedClosedDomain_iff","sourceGaugeRestrictedCoreForm_equal",
                  "sourceGaugeRestrictedGraph_le_full"]
          assert re.findall(r"^#print axioms (\S+)",d,re.M)==dnames
          assert "FCP.BFSSSU2PhysicalDomainD1.sourceGaugeRestrictedClosedGraph_equal" in s
          assert "FCP.M4F7PhysicalGraphTransportE4.sourceRestrictedCoreClosure_eq_independentPhysicalOperatorGraph_image" in s
          assert "Submodule.topologicalClosure_coe" in s
          assert "pairedGaugeData.deformedModelGraph 1 0" in s
          assert "sourceClosedPhysicalChargeColumn" not in s.split("noncomputable section",1)[1]
          for item in (s,d):
            code=item.split("noncomputable section",1)[1]
            assert not re.search(r"(?m)^[ \t]*(sorry|admit|axiom)\b|\bsorryAx\b",code)
          assert not re.search(r"(?m)^[ \t]*set_option[ \t]+maxRecDepth",s)
          print("M4F7_E5_GATE2_FROZEN_D1_AND_E5_IMMUTABLE_SOURCE_EXACT_PRECHECK_PASS")
          PY

      - name: Recompile the historically accepted original D1 theorem and all five axiom reports
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainD1RestrictedSourceGraphProbe
          cp "$GITHUB_WORKSPACE/experiments/openai-math-su2-physical-domain/$stem.lean" "upstream-math/lean/$stem.lean"
          cd upstream-math/lean
          mkdir -p .lake/build/lib/lean
          /usr/bin/time -f 'D1_RESOURCE_TIME %e CPU %P MAX_RSS_KB %M' -o "/tmp/bfss-m4f7-e5-named-source-physical-closed-graph-strict-gate2/$stem.resource" \
            timeout --signal=TERM --kill-after=5s 105s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" >"/tmp/bfss-m4f7-e5-named-source-physical-closed-graph-strict-gate2/$stem.log" 2>&1 || {
              code=$?
              echo M4F7_E5_GATE2_D1_FRESH_LEAN_EXIT=$code
              grep -n 'error:' "/tmp/bfss-m4f7-e5-named-source-physical-closed-graph-strict-gate2/$stem.log" | head -n 20 || true
              tail -n 85 "/tmp/bfss-m4f7-e5-named-source-physical-closed-graph-strict-gate2/$stem.log"
              cat "/tmp/bfss-m4f7-e5-named-source-physical-closed-graph-strict-gate2/$stem.resource" || true
              exit "$code"
            }
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          from pathlib import Path
          import re
          log=Path('/tmp/bfss-m4f7-e5-named-source-physical-closed-graph-strict-gate2/SU2BFSSPhysicalDomainD1RestrictedSourceGraphProbe.log').read_text()
          names=["sourceGaugeRestrictedGraphMap_equal","sourceGaugeRestrictedClosedGraph_equal",
                 "sourceGaugeRestrictedClosedDomain_iff","sourceGaugeRestrictedCoreForm_equal",
                 "sourceGaugeRestrictedGraph_le_full"]
          ns='FCP.BFSSSU2PhysicalDomainD1.'
          reports=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          ax={n:{x.strip() for x in atom.split(',') if x.strip()} for n,atom in reports}
          assert len(reports)==len(ax)==5,('D1_REPORT_COUNT',reports)
          assert set(ax)=={ns+n for n in names},('D1_SOURCE_ROOTS',ax)
          assert all(v <= {'propext','Classical.choice','Quot.sound'} for v in ax.values()),('D1_FORBIDDEN_AXIOMS',ax)
          assert 'error:' not in log and 'sorryAx' not in log
          unexpected=[x for x in log.splitlines() if 'warning:' in x and not re.fullmatch(r"warning: [A-Za-z0-9_-]+: repository '[^']+' has local changes",x)]
          assert not unexpected,('D1_UNEXPECTED_WARNING',unexpected)
          print('M4F7_E5_GATE2_CURRENT_BRANCH_ORIGINAL_D1_FIVE_ROOTS_REQUALIFIED_ANCESTRY_PASS',ax)
          PY
          cat "/tmp/bfss-m4f7-e5-named-source-physical-closed-graph-strict-gate2/$stem.resource"

      - name: Fresh strict E5 actual named source physical closed graph equality
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=FCPM4F7NamedSourcePhysicalGraphTransportE5
          cp "$GITHUB_WORKSPACE/experiments/openai-math-su2-physical-domain/$stem.lean" "upstream-math/lean/$stem.lean"
          cd upstream-math/lean
          mkdir -p .lake/build/lib/lean
          /usr/bin/time -f 'E5_RESOURCE_TIME %e CPU %P MAX_RSS_KB %M' -o "/tmp/bfss-m4f7-e5-named-source-physical-closed-graph-strict-gate2/$stem.resource" \
            timeout --signal=TERM --kill-after=5s 105s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" >"/tmp/bfss-m4f7-e5-named-source-physical-closed-graph-strict-gate2/$stem.log" 2>&1 || {
              code=$?
              echo M4F7_E5_GATE2_E5_FRESH_LEAN_EXIT=$code
              grep -n 'error:' "/tmp/bfss-m4f7-e5-named-source-physical-closed-graph-strict-gate2/$stem.log" | head -n 20 || true
              tail -n 95 "/tmp/bfss-m4f7-e5-named-source-physical-closed-graph-strict-gate2/$stem.log"
              cat "/tmp/bfss-m4f7-e5-named-source-physical-closed-graph-strict-gate2/$stem.resource" || true
              exit "$code"
            }
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          from pathlib import Path
          import re
          log=Path('/tmp/bfss-m4f7-e5-named-source-physical-closed-graph-strict-gate2/FCPM4F7NamedSourcePhysicalGraphTransportE5.log').read_text()
          fullname='FCP.M4F7NamedSourcePhysicalGraphTransportE5.pairedSourceNamedPhysicalClosedGraph_eq_independentOperatorGraph_image'
          reports=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          ax={n:{x.strip() for x in atom.split(',') if x.strip()} for n,atom in reports}
          assert len(reports)==len(ax)==1,('E5_REPORT_COUNT',reports)
          assert set(ax)=={fullname},('E5_SOURCE_ROOT',ax)
          assert all(v <= {'propext','Classical.choice','Quot.sound'} for v in ax.values()),('E5_FORBIDDEN_AXIOM',ax)
          assert 'error:' not in log and 'sorryAx' not in log
          unexpected=[x for x in log.splitlines() if 'warning:' in x and not re.fullmatch(r"warning: [A-Za-z0-9_-]+: repository '[^']+' has local changes",x)]
          assert not unexpected,('E5_UNEXPECTED_WARNING',unexpected)
          print('M4F7_E5_GATE2_REAL_ORIGINAL_NAMED_CLOSED_PHYSICAL_SOURCE_GRAPH_EQ_INDEPENDENT_JFREE_OPERATOR_TRANSPORT_ONE_PRINCIPAL_STRICT_PASS',ax)
          PY
          cat "/tmp/bfss-m4f7-e5-named-source-physical-closed-graph-strict-gate2/$stem.resource"

      - name: Save current-branch accepted D1 and E5 imported source only after complete strict gate
        if: success()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM3*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependent*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4E5*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPRestrictedGraphInputCut.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F6PairedSourceGraphInputCut.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F6IndependentLiteralAliasBoundary.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F6GenericNamedAliasInputCut.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F6IndependentGraphInputCutNamedAlias.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F6RestrictedGraphImageC3.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F6RestrictedGraphClosureC4.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7FullClosedGraphVerticalB4CoeAlign.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7GenericOpaqueClosedRelationBridgeImports.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentFullClosedChargeOperatorE1.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentPhysicalInputCutOperatorE2.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentLiteralRestrictedGraphBridgeE3.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7PhysicalGraphTransportE4.olean
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainD1RestrictedSourceGraphProbe.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7NamedSourcePhysicalGraphTransportE5.olean
          key: bfss-fcp-m4f7-e5-named-physical-closed-graph-83c27984-gate2-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve original D1 and E5 compiler/resource evidence on all outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4f7-e5-named-original-source-graph-${{ github.run_id }}
          path: /tmp/bfss-m4f7-e5-named-source-physical-closed-graph-strict-gate2
          if-no-files-found: warn
