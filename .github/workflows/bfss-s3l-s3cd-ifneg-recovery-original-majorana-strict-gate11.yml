name: BFSS S3L S3CD IfNeg Recovery Original Majorana Strict Gate 11

# Source exact original GammaWords + actual Majorana quadratic CAR and color locality identities.
# Does not assert the global Spin(9) representation or spectral eigenvectors.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s3l-s3cd-ifneg-recovery-original-majorana-strict-gate11.yml
permissions:
  contents: read
concurrency:
  group: bfss-s3l-s3cd-ifneg-recovery-gate11-${{ github.ref }}
  cancel-in-progress: false
jobs:
  genuine-original-spin9-gamma:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout immutable FCP mathematical candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout frozen original BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: Verify original S3C and exact one-line deprecated-tactic recovery S3C plus original S3D
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s3l-s3cd-gate11
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json,pathlib,re,subprocess
          d=json.loads(pathlib.Path("upstream-math/lean/lake-manifest.json").read_text())
          assert next(x["rev"] for x in d["packages"] if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          base=pathlib.Path("experiments/openai-math-su2-physical-domain")
          original=[
            ("SU2BFSSPhysicalDomainS3BFullPlaneSpinVectorCovarianceProbe","6e382a0ae639416f74196ffc15bbb95bd8dfe94d",2),
            ("SU2BFSSPhysicalDomainS3CActualMajoranaQuadraticCommutatorProbe","2eaaffa5e3554d3af2cc694c10dd9ac4e1b0f69f",3),
            ("SU2BFSSPhysicalDomainS3DActualFermionSpinQuadraticGeneratorProbe","14fa985ddd24f4fd37db229f7fc87f4303cce4be",1)
          ]
          for stem,sha,n in original:
              path=base/(stem+".lean")
              assert subprocess.check_output(["git","rev-parse","HEAD:"+str(path)],text=True).strip()==sha
              assert subprocess.check_output(["git","hash-object","--no-filters",str(path)],text=True).strip()==sha
              s=path.read_text()
              assert len(re.findall(r"(?m)^#print axioms \S+",s))==n
              assert not re.search(r"(?m)^[ \t]*(?:sorry|admit|axiom)(?:\s|$)|\bsorryAx\b",s)
          c=(base/(original[1][0]+".lean")).read_text()
          e=(base/(original[2][0]+".lean")).read_text()
          assert c.startswith("import SU2BFSSPhysicalDomainS3BFullPlaneSpinVectorCovarianceProbe")
          assert e.startswith("import SU2BFSSPhysicalDomainS3CActualMajoranaQuadraticCommutatorProbe")
          assert "pairedTheta_CAR" in c and "pairedTheta_quadratic_commutator_other_color" in e
          original_text=(base/(original[1][0]+".lean")).read_text()
          adapter=base/"recovery"/(original[1][0]+".lean")
          adapter_sha="7d3ad2bdce570e4d3b2d7e56fba47f1e81a4b2d6"
          adapter_git="experiments/openai-math-su2-physical-domain/recovery/"+original[1][0]+".lean"
          assert subprocess.check_output(["git","rev-parse","HEAD:"+adapter_git],text=True).strip()==adapter_sha
          assert subprocess.check_output(["git","hash-object","--no-filters",str(adapter)],text=True).strip()==adapter_sha
          old="simp only [if_neg hnot, if_neg hnot', sub_zero] at h"
          new="simp only [ite_eq_right hnot, ite_eq_right hnot', sub_zero] at h"
          assert original_text.count(old)==1
          assert original_text.replace(old,new)==adapter.read_text(),("SOURCE_ADAPTER_NOT_ONE_LINE",adapter_git)
          assert len(re.findall(r"(?m)^#print axioms \S+",adapter.read_text()))==3
          print("BFSS_S3L_S3CD_GATE11_REAL_SOURCE_EXACT_PREFLIGHT_PASS")
          print("BFSS_S3L_S3CD_GATE11_EXACT_ONE_LINE_IF_NEG_TO_ITE_EQ_RIGHT_ADAPTER_PINNED")
          PY
      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
      - name: Restore frozen Lean and exact Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
