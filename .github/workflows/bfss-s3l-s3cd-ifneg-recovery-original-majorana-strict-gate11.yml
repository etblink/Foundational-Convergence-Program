      - name: Verify historical source object ancestry for Majorana CAR
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.parent.outputs.cache-hit }}" = true || { echo BFSS_S3L_S3CD_GATE11_QUALIFIED_S3AB_CACHE_MISS; exit 1; }
          dir=upstream-math/lean/.lake/build/lib/lean
          for stem in SU2BFSSPhysicalDomainS3AActualGammaPlaneRotationProbe SU2BFSSPhysicalDomainS3BFullPlaneSpinVectorCovarianceProbe SU2BFSSPhysicalDomainS2DTransverseSliceWedgeProbe; do
            test -s "$dir/$stem.olean" || { echo BFSS_S3L_S3CD_GATE11_MISSING_ORIGINAL_PARENT=$stem; exit 1; }
          done
          echo BFSS_S3L_S3CD_GATE11_EXACT_ORIGINAL_SPIN9_GAMMA_IMPORTS_READY
      - name: Fresh recovered S3C and unchanged original S3D proof with strict axiom reports
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          src=experiments/openai-math-su2-physical-domain
          root=upstream-math/lean
          for stem in SU2BFSSPhysicalDomainS3CActualMajoranaQuadraticCommutatorProbe SU2BFSSPhysicalDomainS3DActualFermionSpinQuadraticGeneratorProbe; do
            if [ "$stem" = "SU2BFSSPhysicalDomainS3CActualMajoranaQuadraticCommutatorProbe" ]; then
              cp "$src/recovery/$stem.lean" "$root/$stem.lean"
              echo "BFSS_S3L_S3CD_GATE11_EXACT_PINNED_IFNEG_RECOVERY_SOURCE_USED $stem"
            else
              cp "$src/$stem.lean" "$root/$stem.lean"
              echo "BFSS_S3L_S3CD_GATE11_UNCHANGED_ORIGINAL_SOURCE_USED $stem"
            fi
          done
          cd "$root"
          for stem in SU2BFSSPhysicalDomainS3CActualMajoranaQuadraticCommutatorProbe SU2BFSSPhysicalDomainS3DActualFermionSpinQuadraticGeneratorProbe; do
            echo "BFSS_S3L_S3CD_ACTUAL_MAJORANA_SOURCE_COMPILING=$stem"
            timeout --signal=TERM --kill-after=5s 190s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s3l-s3cd-gate11/$stem.log"
            test -s ".lake/build/lib/lean/$stem.olean"
          done
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path("/tmp/bfss-s3l-s3cd-gate11")
          cases=[
            ("SU2BFSSPhysicalDomainS3CActualMajoranaQuadraticCommutatorProbe","FCP.BFSSSU2PhysicalDomainS3C",["pairedTheta_quadratic_commutator","pairedTheta_quadratic_commutator_other_color","pairedTheta_quadratic_commutator_same_color"]),
            ("SU2BFSSPhysicalDomainS3DActualFermionSpinQuadraticGeneratorProbe","FCP.BFSSSU2PhysicalDomainS3D",["pairedFermionSpinQuadraticColor_comm_other_color"])
          ]
          allowed={"propext","Classical.choice","Quot.sound"}
          pkg=re.compile(r"warning: ([a-z0-9-]+): repository '([^']+)' has local changes")
          for stem,ns,names in cases:
              s=(root/(stem+".log")).read_text()
              reports=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
              assert [name for name,_ in reports]==[ns+"."+name for name in names],("SOURCE_THEOREM_ROOT_MISMATCH",stem,reports)
              for name,raw in reports:
                  axioms={x.strip() for x in raw.split(",") if x.strip()}
                  assert axioms<=allowed,("UNAPPROVED_AXIOMS",name,axioms)
              for line in s.splitlines():
                  m=pkg.fullmatch(line)
                  if m and m.group(2).endswith("/upstream-math/lean/.lake/packages/"+m.group(1)): continue
                  assert "warning:" not in line,("SOURCE_WARNING",stem,line)
              assert not any(t in s for t in ("sorryAx","error:","unknownIdentifier")),("LEAN_ERROR",stem,s[-3500:])
              print("BFSS_S3L_S3CD_ACTUAL_MAJORANA_SOURCE_STRICT_PASS",stem,len(reports))
          PY
      - name: Save recovered S3C one-line compatibility and original S3D qualified objects
        if: success()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM3*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependent*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4E5*.olean
