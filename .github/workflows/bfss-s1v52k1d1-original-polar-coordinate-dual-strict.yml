name: BFSS K1D1 Actual Original Polar Coordinate Exterior Contraction Strict
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s1v52k1d1-original-polar-coordinate-dual-strict.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  k1d1-polar-coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - name: Checkout research source exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout original frozen mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: Source blob and two-root preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-k1d1
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          for entry in \
            "experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52K1D1OriginalPolarCoordinateExteriorContractionProbe.lean:8bfca13f5ba81e77773c391de6114273023f0bb1" \
            "experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52K1D0OriginalCliffordExteriorContractionTransportProbe.lean:c3a96cb1abd32e3cfaa82ed515224bb958e2c4eb" \
            "experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V38Original48PolarCoefficientBridgeProbe.lean:27ed1e4933499c108ee614b4731a3479a318aa8b"; do
            f="${entry%%:*}"; expected="${entry#*:}"
            test "$(git rev-parse "HEAD:$f")" = "$expected" || { echo "K1D1_SOURCE_BLOB_MISMATCH=$f"; exit 1; }
            test "$(git hash-object --no-filters "$f")" = "$expected" || { echo "K1D1_SOURCE_WORKTREE_MISMATCH=$f"; exit 1; }
          done
          python3 - <<'PY'
          import pathlib,re,json
          m=json.loads(pathlib.Path('upstream-math/lean/lake-manifest.json').read_text())
          assert next(x['rev'] for x in m['packages'] if x['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          x=pathlib.Path('experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52K1D1OriginalPolarCoordinateExteriorContractionProbe.lean').read_text()
          roots=['originalSourcePolar_halfSingle_eq_coordinateDual','originalSourceSpin48_trivialAction_exteriorCoordinateContractions_zero']
          assert re.findall(r'^namespace (\S+)',x,re.M)==['FCP.BFSSS1V52K1D1']
          assert re.findall(r'^theorem (\S+)',x,re.M)==roots
          assert re.findall(r'^#print axioms (\S+)',x,re.M)==roots
          assert not re.search(r'^\s*(?:sorry|native_decide|axiom)\b',x,re.M) and 'sorryAx' not in x
          print('K1D1_ORIGINAL_POLAR_COORDINATE_PRECHECK_PASS')
          PY
      - name: Restore K1D0 strictly accepted source cache
        id: d0
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-k1d0-original-clifford-exterior-transport-c3a96cb1abd32e3cfaa82ed515224bb958e2c4eb-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}
      - name: Restore S1V38 historically accepted original source polar cache
        id: s38
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v38-isolated-source48-polar-coefficient-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}
      - name: Reject missing actual ancestry before expensive Lean restoration
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.d0.outputs.cache-hit }}" = true || { echo K1D1_K1D0_CACHE_MISSING; exit 1; }
          echo K1D1_S1V38_DEDICATED_CACHE_HIT=${{ steps.s38.outputs.cache-hit }}
          for stem in \
            SU2BFSSPhysicalDomainS1V52K1D0OriginalCliffordExteriorContractionTransportProbe \
            SU2BFSSPhysicalDomainS1V52K1COriginalSpin48CliffordPolarContractionProbe \
            SU2BFSSPhysicalDomainS1V52L9E5F20BOriginalSource48CliffordPBWBasisFiniteDimensionalProbe \
            SU2BFSSPhysicalDomainS1V38Original48PolarCoefficientBridgeProbe \
            SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe; do
            test -s "upstream-math/lean/.lake/build/lib/lean/$stem.olean" || { echo "K1D1_ACTUAL_SOURCE_OLEAN_MISSING=$stem"; exit 1; }
          done
          echo K1D1_TWO_ACCEPTED_SOURCE_OLEANS_PRESENT
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-k1d1/toolchain.log; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo K1D1_TOOLCHAIN_MISSING; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-k1d1/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo K1D1_PINNED_SOURCE_ENV_PASS
      - name: Compile literal original dual source two roots
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=SU2BFSSPhysicalDomainS1V52K1D1OriginalPolarCoordinateExteriorContractionProbe
          cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
          set +e
          timeout 540s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" > /tmp/bfss-k1d1/lean.log 2>&1
          rc=$?
          set -e
          cat /tmp/bfss-k1d1/lean.log
          COMPILER_EXIT="$rc" python3 - <<'PY'
          import os,re,pathlib
          roots=['originalSourcePolar_halfSingle_eq_coordinateDual','originalSourceSpin48_trivialAction_exteriorCoordinateContractions_zero']
          expected=['FCP.BFSSS1V52K1D1.'+x for x in roots]
          log=pathlib.Path('/tmp/bfss-k1d1/lean.log').read_text()
          reports=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          allowed={'propext','Classical.choice','Quot.sound'}
          warnings=[x for x in log.splitlines() if '.lean:' in x and ': warning:' in x]
          obj=pathlib.Path('.lake/build/lib/lean/SU2BFSSPhysicalDomainS1V52K1D1OriginalPolarCoordinateExteriorContractionProbe.olean')
          valid=(int(os.environ['COMPILER_EXIT'])==0 and [name for name,_ in reports]==expected
            and all({a.strip() for a in v.split(',') if a.strip()}<=allowed for _,v in reports)
            and not warnings and 'sorryAx' not in log and 'error:' not in log
            and obj.is_file() and obj.stat().st_size>0)
          print('K1D1_EXIT',os.environ['COMPILER_EXIT'],'REPORTS',reports,'WARNINGS',warnings)
          if not valid: raise SystemExit('K1D1_ORIGINAL_POLAR_COORDINATE_DUAL_STRICT_RED')
          print('K1D1_ORIGINAL_POLAR_COORDINATE_DUAL_TWO_ROOTS_STRICT_PASS')
          PY
      - name: Save correct two-ancestry K1D1 source binary on success only
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-k1d1-original-polar-coordinate-dual-8bfca13f5ba81e77773c391de6114273023f0bb1-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}
      - name: Preserve diagnostics for successor
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-k1d1-original-polar-${{ github.run_id }}
          path: /tmp/bfss-k1d1
          if-no-files-found: warn
