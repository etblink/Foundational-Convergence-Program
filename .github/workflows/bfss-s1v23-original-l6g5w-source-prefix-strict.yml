name: BFSS S1V23 Original L6G5I-W Historical Physical Source Strict Gate

# Source stage B: exact original historical physical module import suffix.
# Require Stage A saved source cache, immutable source SHA checks, strict axiom audit.
on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v23-original-l6g5w-source-prefix-strict.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v23-original-l6g5w-suffix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-actual-l6g5w:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact original source candidates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout immutable original upstream OAI mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Verify all source hashes and toolchain pins before expensive setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v23-l6g5w
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          data=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in data['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          r=experiments/openai-math-su2-physical-domain
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G5HSourceCenteredGammaGramProbe.lean")" = 74938c1316159f9af40b6d3ed7b2260e1462ab7a
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G5IOriginalQuadraticRealAndGammaRowProbe.lean")" = bbb1c4424b5c0b93c2568c35f1934fc6310d00c8
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G5JSourceGammaTwoBivectorTransportProbe.lean")" = e89aef1c48fe77b76c5238c7c769737eb52dd7af
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G5KSourceQuadraticBracketRegroupProbe.lean")" = 6a2aa5b3237d86327dcf07f9bb87f84bc9430277
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G5LSourcePauliCyclicCoefficientProbe.lean")" = ddf76c64d5d3fc2b2ed0bb05ae509f3ef4208a13
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G5MSourceColorWedgeEnergyProbe.lean")" = 178da71e4ba8326790e5422599d3c154a19c6e71
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G5NOriginalFiniteQuarticContractionProbe.lean")" = b8096ee158a04f557071e07f570b5f163941db20
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G5OOriginalComplexQuarticOperatorProbe.lean")" = 3b96bc44b26848359c5bd8bc0b779639537bfecc
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G5POriginalScalarMixedRemainderProbe.lean")" = ed3db2d988c6f06c1ced6c55f95a5f5d3ffd9966
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G5QOriginalDiagonalMixedCommutatorProbe.lean")" = 6ed394bcc807c022ec8862882eb9295012287aef
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G5ROriginalGammaBivectorCommutatorProbe.lean")" = cc73c94c092524546976541790eba0a8b968e1ee
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G5SOriginalSignedRowGammaContractionProbe.lean")" = 6e48fbb5397876d6b42bf1ad609a65376895770a
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G5TOriginalMixedBracketReindexProbe.lean")" = 58eab0a4b55dbb8150d00e4f23caab38b9188d0e
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G5UOriginalMixedPointCoefficientProbe.lean")" = a140f9bb3faad092fe6a5d34ce4f2c65f4a4a9b7
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G5VOriginalRightOrderedMixedOperatorProbe.lean")" = 663cbc4d00307f78e5327ffc8cb517cf59e19b6d
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainL6G5WOriginalOrbitalGaugeTangentProbe.lean")" = aa54963516214f89fa7bd07eaf8007796b133c89
          echo ORIGINAL_L6G5W_15_SOURCE_IMMUTABLE_BLOBS_VERIFIED

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore pinned Lean 4.34.1 and exact Mathlib sources
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v23-l6g5w/toolchain.log; then
              ok=true; break
            fi
            echo ORIGINAL_PINNED_LEAN_RETRY_$attempt | tee -a /tmp/bfss-s1v23-l6g5w/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo PINNED_ORIGINAL_LEAN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v23-l6g5w/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo ORIGINAL_L6G5W_PINNED_LEAN_MATHLIB_VERIFIED

      - name: Restore exact accepted Stage A L6G5H physical source prefix cache
        id: stage_a
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v23-isolated-l6g5h-original-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed unless actual accepted Stage A L6G5H source is available
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.stage_a.outputs.cache-hit }}" = true || { echo ACCEPTED_L6G5H_SOURCE_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in SU2BFSSG4MOriginalPairedSourceZExponentialQuarterProbe SU2BFSSPhysicalDomainL6G1OriginalUpstreamSpinIdentityProbe SU2BFSSPhysicalDomainL6G5GOriginalSU2QuarticJacobiProbe SU2BFSSPhysicalDomainL6G5HSourceCenteredGammaGramProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "MISSING_ACCEPTED_L6G5H_SOURCE=$stem"; exit 1; }
          done
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GaugeCore.olean
          echo ACCEPTED_L6G5H_ORIGINAL_SOURCE_CACHE_RECOVERED

      - name: Compile original pinned NormalLinearization upstream prerequisite if absent
        shell: bash
        timeout-minutes: 19
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          if [ ! -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/NormalLinearization.olean ]; then
            timeout 1000s lake build OAI.MathematicalPhysics.BFSS.NormalLinearization 2>&1 | tee /tmp/bfss-s1v23-l6g5w/upstream-normal-linearization.log
          fi
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/NormalLinearization.olean
          echo EXACT_ORIGINAL_OAI_NORMAL_LINEARIZATION_READY

      - name: Compile fifteen original L6G5I-W source modules and check every axiom root
        shell: bash
        timeout-minutes: 28
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          for stem in SU2BFSSPhysicalDomainL6G5IOriginalQuadraticRealAndGammaRowProbe SU2BFSSPhysicalDomainL6G5JSourceGammaTwoBivectorTransportProbe SU2BFSSPhysicalDomainL6G5KSourceQuadraticBracketRegroupProbe SU2BFSSPhysicalDomainL6G5LSourcePauliCyclicCoefficientProbe SU2BFSSPhysicalDomainL6G5MSourceColorWedgeEnergyProbe SU2BFSSPhysicalDomainL6G5NOriginalFiniteQuarticContractionProbe SU2BFSSPhysicalDomainL6G5OOriginalComplexQuarticOperatorProbe SU2BFSSPhysicalDomainL6G5POriginalScalarMixedRemainderProbe SU2BFSSPhysicalDomainL6G5QOriginalDiagonalMixedCommutatorProbe SU2BFSSPhysicalDomainL6G5ROriginalGammaBivectorCommutatorProbe SU2BFSSPhysicalDomainL6G5SOriginalSignedRowGammaContractionProbe SU2BFSSPhysicalDomainL6G5TOriginalMixedBracketReindexProbe SU2BFSSPhysicalDomainL6G5UOriginalMixedPointCoefficientProbe SU2BFSSPhysicalDomainL6G5VOriginalRightOrderedMixedOperatorProbe SU2BFSSPhysicalDomainL6G5WOriginalOrbitalGaugeTangentProbe; do
            cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
            echo "ORIGINAL_STAGE_B_SOURCE_COMPILE_BEGIN=$stem"
            timeout 430s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v23-l6g5w/$stem.log"
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "MISSING_ORIGINAL_STAGE_OLEAN=$stem"; exit 1; }
            STEM="$stem" python3 - <<'PY'
          import os,pathlib,re
          stem=os.environ['STEM']
          src=pathlib.Path(stem+'.lean').read_text()
          s=pathlib.Path('/tmp/bfss-s1v23-l6g5w',stem+'.log').read_text()
          nsm=re.findall(r'^namespace (\S+)',src,re.M)
          assert len(nsm)>=1,(stem,'namespace missing')
          namespace=nsm[0]
          names=re.findall(r'^#print axioms (\S+)',src,re.M)
          assert len(names)>0,(stem,'no original axiom printouts')
          raw=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          found={name:{a.strip() for a in ax.split(',') if a.strip()} for name,ax in raw}
          assert len(raw)==len(found)==len(names),(stem,names,list(found))
          for root in names:
            # An original #print axioms may explicitly name an external
            # upstream OAI constant; never add this file's namespace to it.
            # Plain local roots still require this file's exact namespace.
            k=root if '.' in root else namespace+'.'+root
            suffix=re.compile(r'_private\.'+re.escape(stem)+r'\.[0-9]+\.'+re.escape(k))
            hits=[n for n in found if n==k or suffix.fullmatch(n)]
            assert len(hits)==1,(stem,root,hits,list(found))
            assert found[hits[0]]<={'propext','Classical.choice','Quot.sound'},(stem,root,found[hits[0]])
          assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,(stem,s[-4000:])
          print('HISTORICAL_ORIGINAL_L6G5W_SUFFIX_ROOTS_PASS',stem,len(names))
          PY
          done
          python3 - <<'PY'
          import pathlib,re
          logs=list(pathlib.Path('/tmp/bfss-s1v23-l6g5w').glob('SU2BFSSPhysicalDomainL6G5*.log'))
          counts=[]
          for log in logs:
            src=pathlib.Path('upstream-math/lean',log.stem+'.lean')
            if not src.exists():
              src=pathlib.Path(log.stem+'.lean')
            counts.append(len(re.findall(r'^#print axioms ',src.read_text(),re.M)))
          assert len(logs)==15 and sum(counts)==42,(len(logs),counts)
          print('ORIGINAL_L6G5W_STAGE_B_15_MODULES_42_ROOTS_KERNEL_PASS')
          PY

      - name: Save accepted L6G5W source suffix on complete strict success only
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v23-isolated-l6g5w-original-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve first causal source and pin logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v23-l6g5h-${{ github.run_id }}
          path: /tmp/bfss-s1v23-l6g5w/
          if-no-files-found: warn
          retention-days: 14
