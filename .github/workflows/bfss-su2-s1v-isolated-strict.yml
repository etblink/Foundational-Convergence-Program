          hits=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          got={k:{x.strip() for x in v.split(',') if x.strip()} for k,v in hits}
          assert len(hits)==len(roots),(got,roots)
          for name in roots:
              key='FCP.BFSSSU2PhysicalDomainS1K.'+name
              assert key in got,(key,got)
              assert got[key]<={'propext','Classical.choice','Quot.sound'},(key,got[key])
          assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,s[-4000:]
          print('S1K_ORIGINAL_SU2_TO_REAL_SO48_GROUP_HOM_3_ROOTS_KERNEL_PASS')
          PY

      - name: Strictly prove original normalized 48-real quadratic baseline
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS1P0NormalizedSourceQuadraticActionProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainS1KActualSO48SourceGaugeHomProbe.olean || { echo SOURCE_SO48_OLEAN_MISSING; exit 1; }
          timeout 180s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 |
            tee "/tmp/bfss-spin48-phase/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
