          reports=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          got={k:{x.strip() for x in v.split(',') if x.strip()} for k,v in reports}
          assert len(reports)==len(roots),(got,roots)
          for n in roots:
              key='FCP.BFSSSU2PhysicalDomainS1P0.'+n
              assert key in got and got[key]<={'propext','Classical.choice','Quot.sound'},(key,got)
          assert 'error:' not in s and 'sorryAx' not in s and 'unknownIdentifier' not in s,s[-4000:]
          print('S1P0_ACTUAL_48_REAL_QUADRATIC_SOURCE_5_ROOTS_KERNEL_PASS')
          PY

      - name: Strictly prove universal original Clifford48 algebra hom and generator action
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS1P1SourceCliffordUniversalHomProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainS1P0NormalizedSourceQuadraticActionProbe.olean || { echo QUALIFIED_SOURCE_QUADRATIC_P0_OLEAN_MISSING; exit 1; }
          timeout 200s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 |
            tee "/tmp/bfss-spin48-phase/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
