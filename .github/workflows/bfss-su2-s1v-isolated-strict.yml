          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainS1TSourceSpin48FullRotorActionProbe.olean || { echo ACCEPTED_S1T_FULL_PLANE_OLEAN_MISSING; exit 1; }
          timeout 210s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 |
            tee "/tmp/bfss-spin48-phase/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          stem='SU2BFSSPhysicalDomainS1USourceSpin48PlaneLinearCombinationProbe'
          s=pathlib.Path('/tmp/bfss-spin48-phase',stem+'.log').read_text()
          roots=['sourceSpinPair_conjugates_plane_combination']
          hits=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          got={k:{x.strip() for x in v.split(',') if x.strip()} for k,v in hits}
          assert len(hits)==len(roots),(got,roots)
          for name in roots:
              key='FCP.BFSSSU2PhysicalDomainS1U.'+name
              assert key in got and got[key]<={'propext','Classical.choice','Quot.sound'},(key,got)
          assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,s[-5000:]
          print('S1U_SOURCE_SPIN48_ARBITRARY_PLANE_LINEAR_COMBINATION_1_ROOT_KERNEL_PASS')
          PY

