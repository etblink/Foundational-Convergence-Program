          roots=['sourceRealMajoranaMatrix','sourceRealMajoranaMatrix_entry',
                 'sourceRealMajoranaMatrix_one','sourceRealMajoranaMatrix_mul',
                 'sourceRealMajoranaMatrix_transpose',
                 'sourceRealMajoranaMatrix_orthogonal',
                 'sourceRealMajoranaMatrix_det_one','sourceRealMajoranaMatrixHom']
          hits=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          got={k:{x.strip() for x in v.split(',') if x.strip()} for k,v in hits}
          assert len(hits)==len(roots),(got,roots)
          for name in roots:
              key='FCP.BFSSSU2PhysicalDomainS1J.'+name
              assert key in got,(key,got)
              assert got[key]<={'propext','Classical.choice','Quot.sound'},(key,got[key])
          assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,s[-4000:]
          print('S1J_ACTUAL_ORIGINAL_SOURCE_48_REAL_MAJORANA_SO48_MATRIX_8_ROOTS_KERNEL_PASS')
          PY

      - name: Strictly prove actual original SU2 to SO48 typed group homomorphism
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS1KActualSO48SourceGaugeHomProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
