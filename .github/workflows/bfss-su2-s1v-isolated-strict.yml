          print('S1P1_ACTUAL_REAL_CLIFFORD48_UNIVERSAL_HOM_2_ROOTS_KERNEL_PASS')
          PY

      - name: Strictly prove original source Clifford48 SU2 composition and inverses
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS1QOriginalClifford48GroupLawProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
