name: BFSS S1V29 Universal Source Spin48 Clifford Generator Action Strict Gate

# Restore accepted S1V28 historical SO48 and independent Spin48 cache.
# Verify source-typed arbitrary Spin48 Clifford-generator image preservation,
# full real vector subspace invariance and central-sign blindness.
# NOT a continuous Spin-to-SO covering or source SU2 global lift.
on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v29-source-spin48-universal-generator-conjugation-strict.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v29-spin48-generator-action-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-spin48-generator-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact original source candidates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout immutable original upstream OAI mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Verify all source hashes and toolchain pins before expensive setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v29-generator
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          data=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in data['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          r=experiments/openai-math-su2-physical-domain
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1MSourceSO48GaugeContinuityProbe.lean")" = bed1023e4bfb6b48ee866fdad79cb88a880bcfbc
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V18QuarterFlipRealMajoranaDiagonalMatrixProbe.lean")" = 980109459761da5438ce48aa347d3dacbcf3c82d
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V29AllSpin48CliffordGeneratorConjugationProbe.lean")" = 2483cb5646b8df2b5958cee2d02769de2018ab7f
          echo S1V29_ACTUAL_GENERIC_SPIN48_SOURCE_BLOB_PINS_VERIFIED

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore pinned Lean 4.34.1 and exact Mathlib sources
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v29-generator/toolchain.log; then
              ok=true; break
            fi
            echo ORIGINAL_PINNED_LEAN_RETRY_$attempt | tee -a /tmp/bfss-s1v29-generator/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo PINNED_ORIGINAL_LEAN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v29-generator/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo S1V29_PINNED_LEAN_MATHLIB_VERIFIED

      - name: Restore strictly accepted S1V28 original SO48 continuity plus independent Spin48 joint cache
        id: accepted_so48
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v28-isolated-source-su2-so48-continuous-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed unless exact S1V28 source SO48 and Spin48 originals are compiled
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.accepted_so48.outputs.cache-hit }}" = true || { echo ACCEPTED_S1V28_ORIGINAL_SOURCE_SO48_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe SU2BFSSPhysicalDomainS1V18QuarterFlipRealMajoranaDiagonalMatrixProbe SU2BFSSPhysicalDomainS1V27HistoricalOriginalQuarterVsIndependentSpin48MatrixProbe SU2BFSSPhysicalDomainS1MSourceSO48GaugeContinuityProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "S1V29_ACCEPTED_SOURCE_DEPENDENCY_MISSING=$stem"; exit 1; }
          done
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GaugeCore.olean
          echo S1V29_ACCEPTED_HISTORICAL_AND_SPIN48_SOURCE_OLEANS_READY

      - name: Compile exactly three new source-sized universal Spin48 action and sign roots
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=SU2BFSSPhysicalDomainS1V29AllSpin48CliffordGeneratorConjugationProbe
          cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
          timeout 600s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v29-generator/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean" || { echo "S1V29_GENERIC_SPIN48_SOURCE_OLEAN_MISSING"; exit 1; }
          python3 - <<'PY'
          import pathlib,re
          stem='SU2BFSSPhysicalDomainS1V29AllSpin48CliffordGeneratorConjugationProbe'
          source=pathlib.Path(stem+'.lean').read_text()
          log=pathlib.Path('/tmp/bfss-s1v29-generator',stem+'.log').read_text()
          roots=re.findall(r'^#print axioms (\S+)',source,re.M)
          expected=[
            'all_sourceSpin48_generators_stay_real',
            'all_sourceSpin48_real_generator_space_preserved',
            'sourceSpin48_conjugation_central_sign_invariant',
          ]
          assert roots==expected,(stem,roots)
          assert re.findall(r'^namespace (\S+)',source,re.M)==['FCP.BFSSS1V29']
          raw=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          found={k:{a.strip() for a in v.split(',') if a.strip()} for k,v in raw}
          assert len(raw)==len(found)==3,(stem,raw)
          allowed={'propext','Classical.choice','Quot.sound'}
          for root in roots:
            fullname='FCP.BFSSS1V29.'+root
            assert fullname in found and found[fullname]<=allowed,(stem,fullname,found)
          assert 'sorryAx' not in log and 'error:' not in log and 'unknownIdentifier' not in log,(stem,log[-7500:])
          print('S1V29_SOURCE_SIZED_GENERIC_SPIN48_CLIFFORD_GENERATOR_AND_CENTRAL_SIGN_3_ROOTS_KERNEL_PASS')
          PY

      - name: Save universal source-sized Spin48 Clifford generator interface after all three strict roots
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v29-isolated-universal-spin48-clifford-generator-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve first causal source and pin logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v29-generator-${{ github.run_id }}
          path: /tmp/bfss-s1v29-generator/
          if-no-files-found: warn
          retention-days: 14
