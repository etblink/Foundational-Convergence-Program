            upstream-math/lean/.lake/build/lib/lean/FCPM4F7GenericClosedRangeOutputsE7G.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7OpaqueLiteralGraphInterfaceE7D.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentNamedSmoothGraphMapsE7K.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7NamedSmoothGraphIdentityE7K2.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7NamedClosedSmoothGraphIdentityE7K3.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7GenericOpaqueOutputConstraintE7H.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentPhysicalOutputPredicateE7I.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7NamedConditionalPhysicalOutputBridgeE7L.olean
          key: bfss-fcp-m4f7-e7l-named-conditional-a627c0ce-gate1-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Verify accepted E7L-E7A-E6 dependencies and exact native closed output source
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.e7l.outputs.cache-hit }}" = true || { echo E7M_GATE1_ACCEPTED_E7L_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in OAI/MathematicalPhysics/BFSS/Core OAI/MathematicalPhysics/BFSS/GaugeCore FCPIndependentPhysicalSpace FCPIndependentSmoothCore FCPM4F7IndependentClosedChargePhysicalInputE6 FCPM4F7IndependentChargeOutputTypedE7A FCPM4F7OpaqueLiteralGraphInterfaceE7D FCPM4F7IndependentNamedSmoothGraphMapsE7K FCPM4F7NamedSmoothGraphIdentityE7K2 FCPM4F7NamedClosedSmoothGraphIdentityE7K3 FCPM4F7GenericOpaqueOutputConstraintE7H FCPM4F7IndependentPhysicalOutputPredicateE7I FCPM4F7NamedConditionalPhysicalOutputBridgeE7L; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo E7M_GATE1_MISSING_QUALIFIED_IMPORT=$stem; exit 1; }
          done
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          d=Path('experiments/openai-math-su2-physical-domain')
          pins={
            'FCPM4F7IndependentLiteralClosedPhysicalOutputsE7M.lean':'e6f7883d8f7c02692eb59b504e11f0a787da7f69',
            'FCPM4F7NamedConditionalPhysicalOutputBridgeE7L.lean':'a627c0ce495b3f05faaec0b438d45c3ffca704a0',
            'FCPM4F7IndependentChargeOutputTypedE7A.lean':'7ae8775e59277aee4cee68754c4d59b11d15b744',
            'FCPM4F7IndependentClosedChargePhysicalInputE6.lean':'b5ab912afb3beeab47c113bc24e6cdd1f5e8a1c4'
          }
          for name,sha in pins.items():
            p=str(d/name)
            assert subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()==sha,(name,'ORIGINAL_SOURCE_BLOB')
            assert subprocess.check_output(['git','hash-object','--no-filters',p],text=True).strip()==sha,(name,'CHECKOUT_SOURCE_BLOB')
          s=(d/'FCPM4F7IndependentLiteralClosedPhysicalOutputsE7M.lean').read_text()
          assert s.startswith('import FCPM4F7NamedConditionalPhysicalOutputBridgeE7L\n')
          assert re.findall(r'^namespace (\S+)',s,re.M)==['FCP.M4F7IndependentLiteralClosedPhysicalOutputsE7M']
          root='independentLiteralRestrictedClosedGraph_subset_allPhysicalOutputs'
          assert re.findall(r'^theorem (\S+)',s,re.M)==[root]
          assert re.findall(r'^#print axioms (\S+)',s,re.M)==[root]
          assert 'independentPhysicalSpace_isClosed' in s
          assert 'independentChargeVector_comp_invariantCore_output_physical' in s
          assert 'independentInvariantCoreOutputMap_eq' in s
          assert 'originalNamedClosedGraph_subset_nativeSixteenPhysicalOutputs_of_core' in s
          code=s.split('noncomputable section',1)[1]
          assert not re.search(r'(?m)^[ \t]*(?:sorry|admit|axiom)\b|\bsorryAx\b',code)
          assert 'deformedModelGraph' not in code
          print('E7M_GATE1_EXACT_REAL_ORIGINAL_NATIVE_COVARIANCE_AND_CLOSEDNESS_PRECHECK_PASS')
          PY

      - name: Fresh strict E7M original unconditional independent literal closed outputs physical
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=FCPM4F7IndependentLiteralClosedPhysicalOutputsE7M
          cp "$GITHUB_WORKSPACE/experiments/openai-math-su2-physical-domain/$stem.lean" "upstream-math/lean/$stem.lean"
          cd upstream-math/lean
          mkdir -p .lake/build/lib/lean
          /usr/bin/time -f 'E7M_RESOURCE_TIME %e CPU %P MAX_RSS_KB %M' -o "/tmp/bfss-m4f7-e7m-unconditional-literal-closed-physical-outputs-strict-gate1/$stem.resource" \
            timeout --signal=TERM --kill-after=5s 105s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" >"/tmp/bfss-m4f7-e7m-unconditional-literal-closed-physical-outputs-strict-gate1/$stem.log" 2>&1 || {
              ec=$?
              echo E7M_GATE1_FRESH_LEAN_EXIT=$ec
              grep -n 'error:' "/tmp/bfss-m4f7-e7m-unconditional-literal-closed-physical-outputs-strict-gate1/$stem.log" | head -n 25 || true
              tail -n 100 "/tmp/bfss-m4f7-e7m-unconditional-literal-closed-physical-outputs-strict-gate1/$stem.log"
              cat "/tmp/bfss-m4f7-e7m-unconditional-literal-closed-physical-outputs-strict-gate1/$stem.resource" || true
              exit "$ec"
            }
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/bfss-m4f7-e7m-unconditional-literal-closed-physical-outputs-strict-gate1/FCPM4F7IndependentLiteralClosedPhysicalOutputsE7M.log').read_text()
          root='FCP.M4F7IndependentLiteralClosedPhysicalOutputsE7M.independentLiteralRestrictedClosedGraph_subset_allPhysicalOutputs'
          rs=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",t)
          ax={n:{q.strip() for q in a.split(',') if q.strip()} for n,a in rs}
          assert len(rs)==len(ax)==1,('EXACT_SINGLE_SOURCE_ROOT_REPORT',rs)
          assert set(ax)=={root},('SOURCE_ROOT_NAME',ax)
          assert all(v <= {'propext','Classical.choice','Quot.sound'} for v in ax.values()),('UNAUTHORIZED_AXIOMS',ax)
          assert 'error:' not in t and 'sorryAx' not in t
          warnings=[x for x in t.splitlines() if 'warning:' in x and not re.fullmatch(r"warning: [A-Za-z0-9_-]+: repository '[^']+' has local changes",x)]
          assert not warnings,('UNEXPECTED_WARNINGS',warnings)
          print('E7M_GATE1_ACTUAL_INDEPENDENT_LITERAL_CLOSED_GRAPH_ALL_SIXTEEN_OUTPUTS_UNCONDITIONALLY_PHYSICAL_STRICT_SUPPORT_PASS',ax)
          PY
          cat "/tmp/bfss-m4f7-e7m-unconditional-literal-closed-physical-outputs-strict-gate1/$stem.resource"

