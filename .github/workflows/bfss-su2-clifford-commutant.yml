name: BFSS SU2 Clifford Scalar Commutant

# Bounded successor to Gate #361. A missing cache is an infrastructure red;
# do not substitute unchecked objects or silently change source/toolchain.
on:
  pull_request:
    branches:
      - research/openai-math-su2-s3k-physical-spin-flow
    paths:
      - .github/workflows/bfss-su2-clifford-commutant.yml
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8ACPairedThetaScalarCommutantProbe.lean
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-su2-clifford-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired-theta-scalar-commutant:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check out frozen OpenAI mathematical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Verify immutable source and compiler pins before any import
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-su2-clifford
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          python3 - <<'PY'
          import json
          d=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in d['packages'] if p['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2BFSSG1APairedThetaProbe.lean)" = 4f8fbf05a35c1d625746931b7ff0361b7ffc2ec4
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8ACPairedThetaScalarCommutantProbe.lean)" = 75e85e6adad644d6174320bc5e217c045eac5551
          echo FROZEN_BFSS_MAJORANA_SOURCE_PINS_VERIFIED

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore exact accepted Lean and Mathlib dependencies
        id: dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake
            ~/.elan
          key: bfss-l6-pinned-env-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Verify compiler, Mathlib and accepted dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.dependencies.outputs.cache-hit }}" = true || { echo PINNED_LEAN_CACHE_MISSING; exit 1; }
          source "$HOME/.elan/env"
          test -s upstream-math/lean/.lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean
          test "$(git -C upstream-math/lean/.lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          cd upstream-math/lean
          lake env lean --version | tee /tmp/bfss-su2-clifford/compiler.txt
          grep -q 'version 4.34.1' /tmp/bfss-su2-clifford/compiler.txt

      - name: Restore frozen accepted L6G7W Clifford source closure
        id: accepted_l6g7w
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-l6g7w-accepted-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G[1-6]*Probe.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G7[A-W]*Probe.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1[A-B]*Probe.lean', 'experiments/openai-math-su2-concrete-potential/SU2*.lean') }}

      - name: Require exact accepted G1A and Fock compiled objects
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.accepted_l6g7w.outputs.cache-hit }}" = true || { echo ACCEPTED_L6G7W_CACHE_MISSING; exit 1; }
          base=upstream-math/lean/.lake/build/lib/lean
          for stem in \
            SU2BFSSG1APairedThetaProbe \
            SU2BFSSG4JExactGaugeDataAssemblyProbe \
            SU2FermionFockProbe \
            SU2BFSSPhysicalDomainL6G7WActualSourceFullL2GaugeIsometryProbe; do
            test -s "$base/$stem.olean" || { echo "QUALIFIED_OBJECT_MISSING=$stem"; exit 1; }
          done
          test -s "$base/OAI/MathematicalPhysics/BFSS/Core.olean"
          echo ORIGINAL_PAIRED_THETA_IRREDUCIBILITY_IMPORTS_VERIFIED

      - name: Compile and audit real paired Majorana scalar commutant
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainL6H5E8ACPairedThetaScalarCommutantProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          echo L6H5E8AC_SOURCE_SCALAR_COMMUTANT_BEGIN
          timeout 240s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" \
            2>&1 | tee /tmp/bfss-su2-clifford/l6h5e8ac.log
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/bfss-su2-clifford/l6h5e8ac.log').read_text()
          root='FCP.BFSSSU2PhysicalDomainL6H5E8AC.pairedTheta_commutant_scalar'
          got={n:{x.strip() for x in v.split(',') if x.strip()} for n,v in
               re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",s)}
          assert root in got,(root,got)
          assert got[root] <= {'propext','Classical.choice','Quot.sound'},got[root]
          assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s
          print('L6H5E8AC_REAL_PAIRED_SCALAR_COMMUTANT_AXIOM_CLEAN_PASS')
          PY

      - name: Preserve inspectable CI logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-su2-clifford-commutant-${{ github.run_id }}
          path: /tmp/bfss-su2-clifford/
          if-no-files-found: warn
          retention-days: 14
