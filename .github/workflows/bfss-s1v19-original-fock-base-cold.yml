name: BFSS S1V19 Original Fock CAR Base Pinned Qualification

# The first four ORIGINAL SU2 Fock modules; strict root + axiom tests.
# Pushes to any other path do not trigger this workflow.
on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v19-original-fock-base-cold.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v19-original-fock-base-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-fock-base:
    runs-on: ubuntu-latest
    timeout-minutes: 49
    steps:
      - name: Checkout isolated original source proof repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout pinned independent OAI library
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Verify original Fock source and immutable environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v19-fock-base
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          python3 - <<'PY'
          import json
          d=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(x['rev'] for x in d['packages'] if x['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2FermionFockProbe.lean)" = dd6881b3394372bbcbb143ba8606916f0206c166
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2FermionF2Probe.lean)" = abe847c82da672274ce1852de892b3fcbb348579
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2FermionF2BProbe.lean)" = b8218829e576c3c94800dffaeeb74f1211a9740c
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2FermionF2B2Probe.lean)" = 128ee450affa00167ceb38011f407349323ff0dd
          echo PINNED_ORIGINAL_FOCK_CAR_BASE_SOURCE_BLOBS_VERIFIED

      - name: Free disposable space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Bootstrap exact Lean and original Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v19-fock-base/toolchain.log; then
              ok=true; break
            fi
            echo PINNED_LEAN_TLS_RETRY_$attempt | tee -a /tmp/bfss-s1v19-fock-base/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo PINNED_LEAN_INSTALL_FAILED; exit 1; }
          cd upstream-math/lean
          timeout 1060s lake exe cache get 2>&1 | tee /tmp/bfss-s1v19-fock-base/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo PINNED_LEAN_MATHLIB_SOURCE_READY

      - name: Restore qualified original OAI CovariantFields cache
        id: cov
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: upstream-math/lean/.lake/build/lib/lean/OAI
          key: bfss-s1v19-isolated-oai-covfields-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed on original CovariantFields accepted cache
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.cov.outputs.cache-hit }}" = true || { echo ACCEPTED_ORIGINAL_OAI_COVFIELDS_CACHE_NOT_ACCESSIBLE; exit 1; }
          test -s upstream-math/lean/.lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/CovariantFields.olean
          test -s upstream-math/lean/.lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GaugeCore.olean
          echo ACCEPTED_PINNED_ORIGINAL_OAI_SOURCE_RESTORED

      - name: Build original FockNorm import root and transitive modules
        shell: bash
        timeout-minutes: 13
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          timeout 710s lake build OAI.MathematicalPhysics.ContinuumCoulomb.ManyBody.FockNorm 2>&1 | tee /tmp/bfss-s1v19-fock-base/focknorm.log
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/ContinuumCoulomb/ManyBody/FockNorm.olean
          echo ORIGINAL_FOCKNORM_TRANSITIVE_IMPORTS_BUILT

      - name: Strictly compile original F1 F2 F2B F2B2 with exact axiom roots
        shell: bash
        timeout-minutes: 9
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          for stem in SU2FermionFockProbe SU2FermionF2Probe SU2FermionF2BProbe SU2FermionF2B2Probe; do
            cp "../../experiments/openai-math-su2-concrete-potential/$stem.lean" "$stem.lean"
            timeout 110s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v19-fock-base/$stem.log"
            test -s ".lake/build/lib/lean/$stem.olean" || { echo SOURCE_FOCK_OLEAN_MISSING_$stem; exit 1; }
          done
          python3 - <<'PY'
          import pathlib,re
          roots={
            'SU2FermionFockProbe':['fockBFSSUnitary','creator_annihilator_car','creator_adjoint','majorana0_selfAdjoint','majorana0_car'],
            'SU2FermionF2Probe':['creator_creator_car','annihilator_annihilator_car','annihilator_creator_car','majorana1_selfAdjoint','thetaLabelEquiv','thetaCandidate_selfAdjoint'],
            'SU2FermionF2BProbe':['majorana1_car'],
            'SU2FermionF2B2Probe':['majorana0_car_all']
          }
          pattern=r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
          for stem,rr in roots.items():
            s=pathlib.Path('/tmp/bfss-s1v19-fock-base',stem+'.log').read_text()
            hits=re.findall(pattern,s)
            got={k:{y.strip() for y in v.split(',') if y.strip()} for k,v in hits}
            assert len(hits)==len(rr),(stem,hits,rr)
            for n in rr:
              matches=[(name,axioms) for name,axioms in got.items() if name.split('.')[-1]==n]
              assert len(matches)==1 and matches[0][1]<={'propext','Classical.choice','Quot.sound'},(stem,n,matches)
            assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,(stem,s[-4500:])
            print(stem,'PINNED_SOURCE_FOCK_AXIOM_CLEAN_PASS',len(rr))
          print('ORIGINAL_FOCK_F1_F2_F2B_F2B2_TOTAL_13_AXIOM_ROOTS_KERNEL_PASS')
          PY

      - name: Cache proven original Fock base and OAI modules
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2Fermion*.olean
          key: bfss-s1v19-isolated-fock-base-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve first causal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v19-original-fock-base-${{ github.run_id }}
          path: /tmp/bfss-s1v19-fock-base/
          if-no-files-found: warn
          retention-days: 14
