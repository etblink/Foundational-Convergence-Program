name: BFSS M4F1 D3B Historical Suffix Warning Inventory Diagnostic 1

# Exploration only. No strict acceptance gate, no qualified cache saves.
# Trigger only when this workflow file itself changes, on one research branch.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-m4f1-d3b-historical-suffix-warning-inventory-diag1.yml

permissions:
  contents: read

concurrency:
  group: bfss-m4f1-historical-suffix-warning-inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exploratory-historical-suffix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout immutable original BFSS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Fail-closed original and historical source pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-m4f1-d3b-warning-inventory-diag1
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import pathlib,subprocess,json,re
          manifest=json.loads(pathlib.Path('upstream-math/lean/lake-manifest.json').read_text())
          assert next(x['rev'] for x in manifest['packages'] if x['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          rows=[
            - ["SU2BFSSG4K8DPositiveCouplingAlternativeProbe","experiments/openai-math-su2-concrete-potential","6b2402e1c1364ae7cc48b908fccfee01ee741972"]
            - ["SU2BFSSG4K8E1MasslessPotentialParityProbe","experiments/openai-math-su2-concrete-potential","12b85a0d3e6b09f6a166a5fa12ce693ec1e8415c"]
            - ["SU2BFSSG4K8E2KineticOddParityProbe","experiments/openai-math-su2-concrete-potential","1b20b65c53d116ab4193fd968c0b559c7afce346"]
            - ["SU2BFSSG4K8E3CoreNoncancellationProbe","experiments/openai-math-su2-concrete-potential","819d6f26f43bdce221482feb0d48b2a62042665a"]
            - ["SU2BFSSG4K9ASourceChargeCoefficientCrosswalkProbe","experiments/openai-math-su2-concrete-potential","5e5f10f4c79f45f4b2bb4d6cdf1dbe71573616dd"]
            - ["SU2BFSSG4K9BSourcePairAndChargeReductionProbe","experiments/openai-math-su2-concrete-potential","3bc2712a1c56e86e9e996dcee3052409e23a2e73"]
            - ["SU2BFSSG4K9COrderedPairCoefficientProbe","experiments/openai-math-su2-concrete-potential","de0c447a73990b1beb271fb2afc14dc5b4e20318"]
            - ["SU2BFSSG4K9DSourcePotentialMultiplierProbe","experiments/openai-math-su2-concrete-potential","0695420e4e1d6fbe8accdc4aee9df6dd2d52d1ca"]
            - ["SU2BFSSG4K10ASourceClosedJointChargeGraphProbe","experiments/openai-math-su2-concrete-potential","65d86984f7c216950fbc96812bd011d9d09e968e"]
            - ["SU2BFSSPhysicalDomainD3AKineticGaugeContractionProbe","experiments/openai-math-su2-physical-domain","32b525602dd6c0266f8b78b2349fc62639e577c2"]
            - ["SU2BFSSPhysicalDomainD3BFullChargeGaugePreservationProbe","experiments/openai-math-su2-physical-domain","1aedd8b251c8b04f02f9d71e35594a8cc482d79b"]
            - ["FCPIndependentInvariantCharge","experiments/openai-math-su2-physical-domain","d04d0fcd08a01e7797d4fffee8fcef9666641976"]
          ]
          assert len(rows)==len({r[0] for r in rows})==12
          for stem,dir,sha in rows:
              p=pathlib.Path(dir)/(stem+'.lean')
              assert subprocess.check_output(['git','rev-parse','HEAD:'+str(p)],text=True).strip()==sha,('source pin',stem)
              assert subprocess.check_output(['git','hash-object','--no-filters',str(p)],text=True).strip()==sha,('working pin',stem)
              src=p.read_text()
              assert not re.search(r'(?m)^\s*(sorry|admit|axiom\s)',src),('proof hole/extra axiom',stem)
              assert 'sorryAx' not in src,('sorryAx',stem)
          print('M4F1_WARNING_INVENTORY_ORIGINAL_SOURCE_AND_NO_HOLES_PASS')
          PY

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-m4f1-d3b-warning-inventory-diag1/toolchain.log; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-m4f1-d3b-warning-inventory-diag1/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Restore accepted M4F5 source and independent graph artifacts
        id: m4f5cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM3*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependent*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4E5*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentFullSmoothCharge.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentChargeVectorL2.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentFullCoreGraph.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentFullCoreGraphImage.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentGraphTransportHomeomorph.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentFullCoreGraphClosure.olean
          key: bfss-fcp-m4f5-unrestricted-graph-closure-gate1-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Require exact M4F5 qualified prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.m4f5cache.outputs.cache-hit }}" = true
          cd upstream-math/lean
          for stem in OAI/MathematicalPhysics/BFSS/Core OAI/MathematicalPhysics/BFSS/GaugeCore SU2BFSSG4JExactGaugeDataAssemblyProbe SU2BFSSPhysicalDomainS1V52M3JIndependentUnitaryExistenceProbe FCPIndependentFullSmoothCharge FCPIndependentSmoothCore FCPIndependentInvariantSmoothEquiv FCPIndependentFullCoreGraphClosure; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "PARENT_MISSING=$stem"; exit 1; }
          done
          echo M4F1_WARNING_INVENTORY_M4F5_PARENT_PASS

      - name: Restore independently qualified historical G4K8C checkpoint
        id: k8ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM3*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependent*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4E5*.olean
          key: bfss-fcp-m4f1-qualified-g4k8c-994e89ee-cf0736c8-9f802fdf-gate4-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Validate G4K1 through G4K8C saved import closure
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.k8ccache.outputs.cache-hit }}" = true || { echo QUALIFIED_G4K8C_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in SU2BFSSG4K1PhysicalSpaceCoreProbe SU2BFSSG4K2ANonzeroVacuumRadialProfileProbe SU2BFSSG4K2BNonzeroPhysicalL2Probe SU2BFSSG4K3NonzeroSmoothInvariantCoreProbe SU2BFSSG4K4ClosedChargeGraphProbe SU2BFSSG4K5ConcreteEnergyDensityProbe SU2BFSSG4K6PhysicalTrialEnergyLowerProbe SU2BFSSG4K7EnergySumOfSquaresCorrectionProbe SU2BFSSG4K8ANonzeroDerivativeProbe SU2BFSSG4K8BNonzeroCoordinateL2Probe SU2BFSSG4K8CZeroParameterChargeProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo QUALIFIED_G4K8C_PARENT_MISSING=$stem; exit 1; }
          done
          echo M4F1_WARNING_INVENTORY_QUALIFIED_K8C_IMPORT_CLOSURE_PASS

      - name: Stage untouched historical modules from the pinned research tree
        shell: bash
        run: |
          set -euo pipefail
          for stem in SU2BFSSG4K8DPositiveCouplingAlternativeProbe SU2BFSSG4K8E1MasslessPotentialParityProbe SU2BFSSG4K8E2KineticOddParityProbe SU2BFSSG4K8E3CoreNoncancellationProbe SU2BFSSG4K9ASourceChargeCoefficientCrosswalkProbe SU2BFSSG4K9BSourcePairAndChargeReductionProbe SU2BFSSG4K9COrderedPairCoefficientProbe SU2BFSSG4K9DSourcePotentialMultiplierProbe SU2BFSSG4K10ASourceClosedJointChargeGraphProbe; do
            cp "experiments/openai-math-su2-concrete-potential/$stem.lean" "upstream-math/lean/$stem.lean"
          done
          for stem in SU2BFSSPhysicalDomainD3AKineticGaugeContractionProbe SU2BFSSPhysicalDomainD3BFullChargeGaugePreservationProbe FCPIndependentInvariantCharge; do
            cp "experiments/openai-math-su2-physical-domain/$stem.lean" "upstream-math/lean/$stem.lean"
          done
          echo M4F1_WARNING_INVENTORY_UNALTERED_HISTORICAL_CANDIDATES_STAGED

      - name: Explore every remaining import with warning promotion OFF, never accept roots
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          for stem in SU2BFSSG4K8DPositiveCouplingAlternativeProbe SU2BFSSG4K8E1MasslessPotentialParityProbe SU2BFSSG4K8E2KineticOddParityProbe SU2BFSSG4K8E3CoreNoncancellationProbe SU2BFSSG4K9ASourceChargeCoefficientCrosswalkProbe SU2BFSSG4K9BSourcePairAndChargeReductionProbe SU2BFSSG4K9COrderedPairCoefficientProbe SU2BFSSG4K9DSourcePotentialMultiplierProbe SU2BFSSG4K10ASourceClosedJointChargeGraphProbe SU2BFSSPhysicalDomainD3AKineticGaugeContractionProbe SU2BFSSPhysicalDomainD3BFullChargeGaugePreservationProbe FCPIndependentInvariantCharge; do
            echo "EXPLORATORY_SOURCE_BEGIN=$stem" | tee -a /tmp/bfss-m4f1-d3b-warning-inventory-diag1/stages.log
            /usr/bin/time -f 'DIAG_WALL_SEC %e CPU %P MAX_RSS_KB %M' -o "/tmp/bfss-m4f1-d3b-warning-inventory-diag1/$stem.resource" \
              timeout --signal=TERM --kill-after=5s 150s lake env lean -DwarningAsError=false -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" >"/tmp/bfss-m4f1-d3b-warning-inventory-diag1/$stem.log" 2>&1 || {
                code=$?
                echo "EXPLORATORY_REAL_COMPILATION_FAILURE=$stem CODE=$code" | tee -a /tmp/bfss-m4f1-d3b-warning-inventory-diag1/stages.log
                grep -n "error:" "/tmp/bfss-m4f1-d3b-warning-inventory-diag1/$stem.log" | head -n 20 || true
                tail -n 50 "/tmp/bfss-m4f1-d3b-warning-inventory-diag1/$stem.log"
                exit "$code"
              }
            test -s ".lake/build/lib/lean/$stem.olean"
            STEM="$stem" python3 - <<'PY'
          import os,re,pathlib
          stem=os.environ['STEM']
          source=pathlib.Path(stem+'.lean').read_text()
          log=pathlib.Path('/tmp/bfss-m4f1-d3b-warning-inventory-diag1',stem+'.log').read_text()
          expected=re.findall(r'^#print axioms (\S+)',source,re.M)
          reports=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          seen={n:{a.strip() for a in v.split(',') if a.strip()} for n,v in reports}
          assert expected and len(reports)==len(expected)==len(seen),('AXIOM_REPORT_INCOMPLETE',stem,expected,reports)
          allowed={'propext','Classical.choice','Quot.sound'}
          assert all(s <= allowed for s in seen.values()),('UNAUTHORIZED_AXIOMS',stem,seen)
          assert all(any(n==x or n.endswith('.'+x) for n in seen) for x in expected),('MISSING_DECLARATION',stem)
          assert 'sorryAx' not in log and 'error:' not in log,('COMPILATION_ERROR_OR_PROOF_HOLE',stem)
          warnings=[line for line in log.splitlines() if 'warning:' in line and not re.fullmatch(r"warning: [A-Za-z0-9_-]+: repository '[^']+' has local changes",line)]
          print('EXPLORATORY_AXIOMS_ONLY_NOT_ACCEPTED',stem,len(reports))
          print('EXPLORATORY_SOURCE_WARNINGS',stem,len(warnings))
          for msg in warnings:
              print('WARN_DETAIL',stem,msg)
          PY
            cat "/tmp/bfss-m4f1-d3b-warning-inventory-diag1/$stem.resource"
            echo "EXPLORATORY_SOURCE_COMPILED_NOT_ACCEPTED=$stem" | tee -a /tmp/bfss-m4f1-d3b-warning-inventory-diag1/stages.log
          done
          echo M4F1_WARNING_INVENTORY_ALL_HISTORICAL_SUFFIX_AND_M4F1_ELABORATED_NO_ACCEPTANCE

      - name: Preserve complete exploratory logs regardless of failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4f1-historical-suffix-warning-inventory-${{ github.run_id }}
          path: /tmp/bfss-m4f1-d3b-warning-inventory-diag1
          if-no-files-found: warn
