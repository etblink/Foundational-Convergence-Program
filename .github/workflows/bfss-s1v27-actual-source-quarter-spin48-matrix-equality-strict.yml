name: BFSS S1V27 Genuine Historical SU2 Quarter Equals Independent Spin48 Real Matrix Strict Gate

# Combine exact independently accepted S1V26 actual Spin48 source cache with
# exact S1V25 original historical curve source, then audit 5 NEW typed roots.
# This tests ONE original SU2 quarter point, never a global Spin48 lift.
on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v27-actual-source-quarter-spin48-matrix-equality-strict.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v27-historical-quarter-spin48-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-source-quarter-spin48-equality:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact original source candidates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout immutable original upstream OAI mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Verify all source hashes and toolchain pins before expensive setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v27-compare
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          data=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in data['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          r=experiments/openai-math-su2-physical-domain
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1JActual48RealMajoranaColorActionProbe.lean")" = 3f845ae219586be47fa76aabc3259027b1bb4bae
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V23OriginalPlusICurveNativeQuarterBridgeProbe.lean")" = cb29eb6261fc50550cc275bceb5b000619d521b7
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V25HistoricalSourceQuarter48BlockEntryProbe.lean")" = e9762e418272c0ad8ed9937a4f837f4c5743b1f2
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V27HistoricalOriginalQuarterVsIndependentSpin48MatrixProbe.lean")" = a735aa6e34b52b9577e46625f39b825fbd01e6df
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V18QuarterFlipRealMajoranaDiagonalMatrixProbe.lean")" = 980109459761da5438ce48aa347d3dacbcf3c82d
          echo S1V27_BOTH_ACTUAL_SOURCE_AND_INDEPENDENT_SPIN48_BLOBS_PINNED

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore pinned Lean 4.34.1 and exact Mathlib sources
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v27-compare/toolchain.log; then
              ok=true; break
            fi
            echo ORIGINAL_PINNED_LEAN_RETRY_$attempt | tee -a /tmp/bfss-s1v27-compare/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo PINNED_ORIGINAL_LEAN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v27-compare/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo S1V27_PINNED_LEAN_MATHLIB_VERIFIED

      - name: Restore strictly accepted S1V26 actual independent 16-rotor source-sized Spin48 cache
        id: rotor
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v26-isolated-original-size-spin48-rotor-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed unless exact accepted S1V26 independent rotor and original source curve coexist
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.rotor.outputs.cache-hit }}" = true || { echo ACCEPTED_INDEPENDENT_SOURCE_SPIN48_ROTOR_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in SU2BFSSPhysicalDomainS1V23OriginalPlusICurveNativeQuarterBridgeProbe SU2BFSSPhysicalDomainL6G6XOriginalSU2GaugeCurveProbe SU2BFSSPhysicalDomainS1JActual48RealMajoranaColorActionProbe SU2BFSSPhysicalDomainS1V11SixteenSourceSpin48CenterParityProbe SU2BFSSPhysicalDomainS1V16GlobalSpin48AllRealSourceVectorActionProbe SU2BFSSPhysicalDomainS1V18QuarterFlipRealMajoranaDiagonalMatrixProbe SU2BFSSG4KOriginalGaugeDataQuarterConditionalProbe SU2BFSSG4LNativeQuarterSourceGaugeWitnessProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "S1V27_ACCEPTED_SOURCE_DEPENDENCY_MISSING=$stem"; exit 1; }
          done
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GaugeCore.olean
          echo ORIGINAL_S1V27_JOINT_SOURCE_SPIN48_OLEANS_READY

      - name: Recompile accepted original S1V25 plus new S1V27 matrix equality and strictly audit seven exact roots
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          for stem in SU2BFSSPhysicalDomainS1V25HistoricalSourceQuarter48BlockEntryProbe SU2BFSSPhysicalDomainS1V27HistoricalOriginalQuarterVsIndependentSpin48MatrixProbe; do
            cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
            echo "S1V27_SOURCE_ORIGINAL_SPIN48_MODULE_BEGIN=$stem"
            timeout 420s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v27-compare/$stem.log"
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "S1V27_TYPED_MODULE_OLEAN_MISSING=$stem"; exit 1; }
            STEM="$stem" python3 - <<'PY'
          import pathlib,os,re
          stem=os.environ['STEM']
          source=pathlib.Path(stem+'.lean').read_text()
          log=pathlib.Path('/tmp/bfss-s1v27-compare',stem+'.log').read_text()
          roots=re.findall(r'^#print axioms (\S+)',source,re.M)
          namespace=re.findall(r'^namespace (\S+)',source,re.M)
          want=(
              ['actualHistoricalQuarter_adjointColorMatrix',
               'actualHistoricalQuarter_sourceRealMajoranaMatrix_entry']
              if 'S1V25' in stem else [
                'standalone_source_label_eq_original',
                'standalone_source_label_eq_paired_original',
                'standalone_quarter_coeff_original',
                'historical_source_quarter_48_matrix_block_entry',
                'historical_source_quarter_48_matrix_eq_independent_spin_quarter'])
          assert roots==want,(stem,roots,want)
          assert namespace==(['FCP.BFSSS1V25'] if 'S1V25' in stem else ['FCP.BFSSS1V27']),(stem,namespace)
          raw=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          found={k:{a.strip() for a in axs.split(',') if a.strip()} for k,axs in raw}
          assert len(raw)==len(found)==len(want),(stem,raw)
          allowed={'propext','Classical.choice','Quot.sound'}
          for root in want:
            key=namespace[0]+'.'+root
            assert key in found and found[key]<=allowed,(stem,root,found)
          assert 'sorryAx' not in log and 'error:' not in log and 'unknownIdentifier' not in log,(stem,log[-7500:])
          print('S1V27_HISTORICAL_SOURCE_AND_INDEPENDENT_SPIN48_MODULE_KERNEL_PASS',stem,len(want))
          PY
          done
          echo S1V27_ACTUAL_HISTORICAL_SU2_QUARTER_EQUALS_INDEPENDENT_SPIN48_7_ROOTS_KERNEL_PASS

      - name: Save exact combined original historical SU2 quarter and independent Spin48 matrix cache after seven roots
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v27-isolated-historical-source-spin48-matrix-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve first causal source and pin logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v27-matrix-${{ github.run_id }}
          path: /tmp/bfss-s1v27-compare/
          if-no-files-found: warn
          retention-days: 14
