      - name: Verify original S3C D E1 E2 compiled cache closure
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.parent.outputs.cache-hit }}" = "true" || { echo GATE25_PARENT_CACHE_MISS; exit 1; }
          prefix=upstream-math/lean/.lake/build/lib/lean
          for stem in SU2BFSSPhysicalDomainS3CActualMajoranaQuadraticCommutatorProbe SU2BFSSPhysicalDomainS3DActualFermionSpinQuadraticGeneratorProbe SU2BFSSPhysicalDomainS3E1ActualSameColorFermionicBilinearCommSourceProbe SU2BFSSPhysicalDomainS3E2SameColorActualGammaCoefficientContractionProbe; do
            test -s "$prefix/$stem.olean" || { echo GATE25_PARENT_OLEAN_MISSING:$stem; exit 1; }
          done
      - name: Fresh actual original S3E three-root plane rotation Lean kernel and axiom validation
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS3EActualFermionSpinRotationLawProbe
          cp "experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3EActualFermionSpinRotationLawProbeV3Gate25PointwiseSub.lean" "upstream-math/lean/$stem.lean"
          cd upstream-math/lean
          timeout --signal=TERM --kill-after=5s 260s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee /tmp/bfss-s3e-original-gate25/lean.log
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path("/tmp/bfss-s3e-original-gate25/lean.log").read_text()
          prefix="FCP.BFSSSU2PhysicalDomainS3E."
          expected=[prefix+n for n in ("pairedSpinQuadraticColor_comm_raw","pairedSpinQuadraticColor_comm_skew","pairedFermionPlaneSpinGenerator_comm_theta")]
          actual=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          assert [n for n,a in actual]==expected,("MISSING_ORIGINAL_THREE_ROOTS",actual)
          for n,raw in actual:
              axioms={a.strip() for a in raw.split(",") if a.strip()}
              assert axioms <= {"propext","Classical.choice","Quot.sound"},("UNAUTHORIZED_SOURCE_AXIOM",n,axioms)
          package_warning=re.compile(r"warning: ([a-z0-9-]+): repository '([^']+)' has local changes")
          for line in s.splitlines():
              match=package_warning.fullmatch(line)
