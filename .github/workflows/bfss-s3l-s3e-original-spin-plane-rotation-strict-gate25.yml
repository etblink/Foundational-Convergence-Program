name: BFSS S3E Original Spin Plane Rotation Strict Gate 25

# Actual original J(alpha,gamma)-J(gamma,alpha) coefficient.
# Only an all-green source/axiom/cache gate establishes three principal roots.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s3l-s3e-original-spin-plane-rotation-strict-gate25.yml
permissions:
  contents: read
concurrency:
  group: bfss-s3e-original-plane25-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-source-coefficient:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - name: Checkout research source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout pinned original BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: Validate original S3E statements and only precise V2 to V3 repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s3e-original-gate25
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import pathlib,re,subprocess,json
          manifest=json.loads(pathlib.Path("upstream-math/lean/lake-manifest.json").read_text())
          assert next(x["rev"] for x in manifest["packages"] if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          pinned={"experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3EActualFermionSpinRotationLawProbeV3Gate25PointwiseSub.lean":"badb08fe0165d1acb1f743c28f413f9c534ca650","experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3EActualFermionSpinRotationLawProbeV2Gate24.lean":"4065094bea59b360acfa1df2c4adf007267e0690","experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3EActualFermionSpinRotationLawProbe.lean":"2066ef5a07f55b20149b4aa9ac45488988719773","experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3E2SameColorActualGammaCoefficientContractionProbeV7SelectorBridge.lean":"c6942d34650e83be8d2d380057816234a3004060"}
          for p,h in pinned.items():
              assert subprocess.check_output(["git","rev-parse","HEAD:"+p],text=True).strip()==h,("BAD_GIT_BLOB",p)
              assert subprocess.check_output(["git","hash-object","--no-filters",p],text=True).strip()==h,("BAD_WORKTREE_BLOB",p)
          assert subprocess.check_output(["git","rev-parse","HEAD:"+".github/workflows/bfss-s3l-s3e2-native-selector-source-coefficient-strict-gate23.yml"],text=True).strip()=="a454ad3eb45ec56b6594d577c8b88d36c4fe4cf6","ORIGINAL_GATE25_WORKFLOW_CHANGED"
          current=pathlib.Path("experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3EActualFermionSpinRotationLawProbeV3Gate25PointwiseSub.lean").read_text()
          previous=pathlib.Path("experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3EActualFermionSpinRotationLawProbeV2Gate24.lean").read_text()
          before="\n".join(["    _ = (∑ α : SpinIndex, ((J α γ : ℝ) : ℂ) • pairedTheta α C) -","        (∑ β : SpinIndex, ((J γ β : ℝ) : ℂ) • pairedTheta β C) := by","      simp only [sub_smul, Finset.sum_sub_distrib]"])
          after="\n".join(["    _ = ∑ α : SpinIndex,","          (((J α γ : ℝ) : ℂ) • pairedTheta α C -","           ((J γ α : ℝ) : ℂ) • pairedTheta α C) := by","      apply Finset.sum_congr rfl","      intro α _","      exact sub_smul (((J α γ : ℝ) : ℂ))","        (((J γ α : ℝ) : ℂ)) (pairedTheta α C)","    _ = (∑ α : SpinIndex, ((J α γ : ℝ) : ℂ) • pairedTheta α C) -","        (∑ β : SpinIndex, ((J γ β : ℝ) : ℂ) • pairedTheta β C) := by","      rw [Finset.sum_sub_distrib]"])
          assert previous.count(before)==1 and current==previous.replace(before,after),"GATE25_PROOF_DIFF_NOT_EXACTLY_TARGETED"
          assert subprocess.check_output(["git","rev-parse","HEAD:"+".github/workflows/bfss-s3l-s3e-original-spin-plane-rotation-strict-gate24.yml"],text=True).strip()=="f0160aa900bfa22ff304c4ce82fb35b79a858bdc","GATE25_NEGATIVE_WORKFLOW_NOT_PRESERVED"
          first=pathlib.Path("experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3EActualFermionSpinRotationLawProbe.lean").read_text()
          ancestor=pathlib.Path("experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3E2SameColorActualGammaCoefficientContractionProbeV7SelectorBridge.lean").read_text()
          statements=lambda t:re.findall(r"(?ms)^theorem .*? := by",t)
          names=["pairedSpinQuadraticColor_comm_raw","pairedSpinQuadraticColor_comm_skew","pairedFermionPlaneSpinGenerator_comm_theta"]
          assert len(statements(first))==3 and statements(current)==statements(first),"ORIGINAL_S3E_STATEMENTS_ALTERED"
          assert re.findall(r"(?m)^#print axioms ([A-Za-z0-9_]+)",current)==names,"ORIGINAL_S3E_AXIOM_ROOT_NAMES_CHANGED"
          assert "import SU2BFSSPhysicalDomainS3E2SameColorActualGammaCoefficientContractionProbe" in current
          assert "pairedFermionSpinQuadraticColor_comm_same_color_coefficient J C γ" in current
          assert "theorem pairedFermionSpinQuadraticColor_comm_same_color_coefficient" in ancestor
          assert "pairedPlaneSpinGenerator_skew" in current and "(1 / 2 : ℂ)" in current
          assert "pairedFermionSpinQuadraticColor_comm_other_color" in current
          assert "sorryAx" not in current and "by sorry" not in current and "by admit" not in current
          print("GATE25_THREE_EXACT_ORIGINAL_S3E_STATEMENTS_AND_S3E2_PARENT_PINNED")
          PY
      - name: Reclaim runner disk
        shell: bash
        run: |
