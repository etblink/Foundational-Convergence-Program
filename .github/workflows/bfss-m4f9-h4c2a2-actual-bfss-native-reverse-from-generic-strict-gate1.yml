name: BFSS M4F9 H4C2A2 Actual BFSS Native Reverse From Generic Strict Gate 1
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-m4f9-h4c2a2-actual-bfss-native-reverse-from-generic-strict-gate1.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bfss-m4f9-h4c2a2-native-from-generic-gate1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-hilbert-coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout pinned original mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: H4C2A1 generic source exact hash, namespace and one root preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-m4f9-h4c2a2-gate1
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json,pathlib,re,subprocess
          d=json.loads(pathlib.Path('upstream-math/lean/lake-manifest.json').read_text())
          assert next(x['rev'] for x in d['packages'] if x['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          p=pathlib.Path('experiments/openai-math-su2-physical-domain/FCPM4F9H4C2A2ActualNativeReverseFromGeneric.lean')
          h='b2553295c98b36322d875c9a514297e27ae30835'
          assert subprocess.check_output(['git','rev-parse','HEAD:'+str(p)],text=True).strip()==h
          assert subprocess.check_output(['git','hash-object','--no-filters',str(p)],text=True).strip()==h
          s=p.read_text()
          assert s.startswith('import FCPM4F9H4C2A1GenericPartialGraphReverse\n')
          assert re.findall(r'(?m)^namespace (\S+)',s)==['FCP.M4F9H4C2A2ActualNativeReverseFromGeneric']
          assert re.findall(r'(?m)^#print axioms (\S+)',s)==['nativeSourceGraph_mem_independentGraph']
          assert 'partialGraph_reverse_of_domain_forward' in s and 'nativeSourceDomain_symm_mem_independentDomain' in s and 'nativeIndependentGraph_mem_sourceGraph' in s
          assert 'pairedOriginalNativePhysicalHilbertChargeColumn' in s and 'independentActualE2NativeHilbertChargeColumn' in s
          assert not re.search(r'(?m)^\s*(?:sorry|admit|axiom)\b|\bsorryAx\b',s)
          print('BFSS_H4C2A2_ACTUAL_NATIVE_ONE_ROOT_PRECHECK_PASS')
          PY
      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
      - name: Restore frozen Lean and exact Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true
          cd upstream-math/lean
          timeout 1080s lake exe cache get > /tmp/bfss-m4f9-h4c2a2-gate1/mathlib.log 2>&1 || {
            tail -n 100 /tmp/bfss-m4f9-h4c2a2-gate1/mathlib.log
            exit 1
          }
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
