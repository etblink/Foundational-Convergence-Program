name: openai-navier-stokes-register-once

on:
  push:
    branches: [maintenance/openai-navier-stokes-source-register]
    paths: [.github/workflows/openai-navier-stokes-register-once.yml]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/openai-navier-stokes-source-register
          fetch-depth: 0
      - name: Append register entry
        run: python3 tools/append_openai_ns_source_register.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- SOURCE_REGISTER.md; then
            echo "No change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE_REGISTER.md
          git commit -m "Register reproduced OpenAI Navier-Stokes sources"
          git push origin HEAD:maintenance/openai-navier-stokes-source-register
