          done
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path("/tmp/bfss-s3l-s3ab-gate9")
          cases=[
            ("SU2BFSSPhysicalDomainS3AActualGammaPlaneRotationProbe","FCP.BFSSSU2PhysicalDomainS3A",["pairedGammaTwo_skew","pairedPlaneSpinGenerator_skew","pairedGammaTwo_eq_mul","pairedPlaneGenerator_comm_gamma_i","pairedPlaneGenerator_comm_gamma_j"]),
