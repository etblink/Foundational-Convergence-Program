          ]
          pkgstatus=re.compile(r"warning: ([a-z0-9-]+): repository '([^']+)' has local changes")
          for stem,ns,names in cases:
              s=(root/(stem+".log")).read_text()
              reports=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
              assert [n for n,a in reports]==[ns+"."+name for name in names],("WRONG_ROOTS",stem,reports)
              for n,a in reports:
                  assert {v.strip() for v in a.split(",") if v.strip()} <= {"propext","Classical.choice","Quot.sound"},("BAD_AX",n,a)
              for line in s.splitlines():
                  m=pkgstatus.fullmatch(line)
                  if m and m.group(2).endswith("/upstream-math/lean/.lake/packages/"+m.group(1)):
                      continue
                  assert "warning:" not in line,("SOURCE_WARNING",stem,line)
              assert not any(t in s for t in ("sorryAx","error:","unknownIdentifier")),("LEAN_ERROR",stem,s[-3500:])
              print("BFSS_S3L_S3AB_ACTUAL_GAMMA_SPIN9_SOURCE_STRICT_PASS",stem,len(reports))
          PY
