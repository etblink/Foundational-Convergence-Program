name: BFSS S3L S3AB Original Spin9 Gamma Plane Strict Gate 9

# Source exact original GammaWords + actual gamma two skew/commutator identities.
# Does not assert the global Spin(9) representation or spectral eigenvectors.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s3l-s3ab-original-spin9-gamma-plane-strict-gate9.yml
permissions:
  contents: read
concurrency:
  group: bfss-s3l-s3ab-original-spin9-gate9-${{ github.ref }}
  cancel-in-progress: false
