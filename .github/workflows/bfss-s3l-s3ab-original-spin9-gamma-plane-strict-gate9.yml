        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout frozen original BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: Verify exact original S3A and S3B and actual Spin9 gamma source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s3l-s3ab-gate9
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json,pathlib,subprocess,re
          d=json.loads(pathlib.Path("upstream-math/lean/lake-manifest.json").read_text())
          assert next(x["rev"] for x in d["packages"] if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          base=pathlib.Path("experiments/openai-math-su2-physical-domain")
          names=[
            ("SU2BFSSPhysicalDomainS2DTransverseSliceWedgeProbe","a5695d5942006a6bd59db3fe621a06d15b3eccf5",5),
            ("SU2BFSSPhysicalDomainS3AActualGammaPlaneRotationProbe","0056f4b890485f28174c19442a60ccdf5cd715e0",5),
            ("SU2BFSSPhysicalDomainS3BFullPlaneSpinVectorCovarianceProbe","6e382a0ae639416f74196ffc15bbb95bd8dfe94d",2),
          ]
          for stem,sha,num in names:
              p=base/(stem+".lean")
              assert subprocess.check_output(["git","rev-parse","HEAD:"+str(p)],text=True).strip()==sha
              assert subprocess.check_output(["git","hash-object","--no-filters",str(p)],text=True).strip()==sha
              assert len(re.findall(r"(?m)^#print axioms \S+",p.read_text()))==num
              assert not re.search(r"(?m)^[ \t]*(?:axiom|sorry|admit)(?:\s|$)|\bsorryAx\b",p.read_text())
          a=(base/(names[1][0]+".lean")).read_text()
          b=(base/(names[2][0]+".lean")).read_text()
          assert "import SU2BFSSPhysicalDomainS2DTransverseSliceWedgeProbe" in a
          assert "import OAI.MathematicalPhysics.BFSS.GammaWords" in a
          assert "import SU2BFSSPhysicalDomainS3AActualGammaPlaneRotationProbe" in b
          print("BFSS_S3L_S3AB_GATE9_IMMUTABLE_ACTUAL_GAMMA_SOURCE_PASS")
          PY
      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
      - name: Restore frozen Lean and exact Mathlib
        shell: bash
        timeout-minutes: 24
