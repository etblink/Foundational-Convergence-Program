name: BFSS S3L R4A Historical Source Ancestry Rebuild Strict Gate 5

# Source EXACT unchanged original cubic R4D. Never fall back to old
# missing family270b cache. Restore independent source-pinned Lean/Mathlib,
# inspect newer accepted H4G1B olean ancestry, compile R4D only if
# all original R4A/C1/C2 and imports are present, else stop honestly.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s3l-r4a-historical-source-rebuild-strict-gate5.yml
permissions:
  contents: read
concurrency:
  group: bfss-s3l-r4a-historical-source-rebuild-gate5-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-original-cubic:
    runs-on: ubuntu-latest
    timeout-minutes: 47
    steps:
      - name: Checkout exact FCP research source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout immutable original mathematical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: Exact R4D physical source and original math preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s3l-r4a-gate5
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json,pathlib,re,subprocess
          d=json.loads(pathlib.Path('upstream-math/lean/lake-manifest.json').read_text())
          assert next(x['rev'] for x in d['packages'] if x['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          base=pathlib.Path('experiments/openai-math-su2-physical-domain')
          blobs={
            'SU2BFSSPhysicalDomainS3L5K2R4AThreeIndexOriginalSourceSumTransportProbe.lean':'ef803c1b5c62a819e568c5a645c5e622ec1a0d6f',
            'SU2BFSSPhysicalDomainS3L5K2R4C1FixedColorFermionSumProbe.lean':'fefc730033cd7445565d40a2a104f1a08f80d07b',
            'SU2BFSSPhysicalDomainS3L5K2R4C2FixedColorSpatialSumProbe.lean':'3cbb14466539d15497adad31305298d87beb624a',
            'SU2BFSSPhysicalDomainS3L5K2R4DNamedSourceAssemblyProbe.lean':'1a56b2055ff4ed3c1a227bce3910e974876c5774',
          }
          for name,sha in blobs.items():
              p=base/name
              assert subprocess.check_output(['git','rev-parse','HEAD:'+str(p)],text=True).strip()==sha
              assert subprocess.check_output(['git','hash-object','--no-filters',str(p)],text=True).strip()==sha
          s=(base/'SU2BFSSPhysicalDomainS3L5K2R4DNamedSourceAssemblyProbe.lean').read_text()
          assert re.findall(r'(?m)^#print axioms (\S+)',s)==['pairedOriginalCubicFixedColorResponse_decompose_named']
          assert all(t in s for t in ['sourceThreeSum_weightedResponse_split',
              'pairedOriginalCubicFixedColor_fermionSum',
              'pairedOriginalCubicFixedColor_spatialSum',
              'sourceCubicFermionVariation',
              'sourcePositionVariation',
              'pairedAlgebraData.fermionAction'])
          assert not re.search(r'(?m)^[ \t]*(?:sorry|admit|axiom)(?:\s|$)|\bsorryAx\b',s)
          print('BFSS_S3L_R4D_GATE3_FROZEN_ORIGINAL_SOURCE_EXACT_PREFLIGHT_PASS')
          PY
      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
      - name: Restore frozen Lean and exact Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true
          cd upstream-math/lean
          timeout 1080s lake exe cache get > /tmp/bfss-s3l-r4a-gate5/mathlib.log 2>&1 || {
            tail -n 100 /tmp/bfss-s3l-r4a-gate5/mathlib.log
            exit 1
          }
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
