name: BFSS F21A Actual Spin48 Source Vector Action Joint Continuity Strict
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s1v52l9e5f21a-source-spin48-action-continuity-strict.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spin48-real-source-action:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact original-source FCP
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout frozen original mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: Strict exact original source and two-root candidate preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-f21a
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          for entry in \
            "experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52L9E5F21AOriginalSpin48SourceVectorActionJointContinuityProbe.lean:b029b35a827e099d000d6966c69a7bb7fc84b2a6" \
            "experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52L9E5F20FOriginalSpin48TopologicalGroupInverseContinuityProbe.lean:c5f863e1948db15cf3d3058b1f5c3be51ee6ae45" \
            "experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V31CanonicalAllSpin48RealVectorActionProbe.lean:d6e025372d9f3a393dbb21ba7700c0bc95fd40f2"; do
            file="${entry%%:*}"; expected="${entry#*:}"
            test "$(git rev-parse "HEAD:$file")" = "$expected" || { echo "F21A_GIT_BLOB_MISMATCH=$file"; exit 1; }
            test "$(git hash-object --no-filters "$file")" = "$expected" || { echo "F21A_RAW_BLOB_MISMATCH=$file"; exit 1; }
          done
          python3 - <<'PY'
          import json,pathlib,re
          m=json.loads(pathlib.Path('upstream-math/lean/lake-manifest.json').read_text())
          assert next(p['rev'] for p in m['packages'] if p['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          s=pathlib.Path('experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52L9E5F21AOriginalSpin48SourceVectorActionJointContinuityProbe.lean').read_text()
          roots=['originalSourceCliffordGenerator_closedEmbedding','originalSourceSpin48VectorAction_joint_continuous']
          assert re.findall(r'^namespace (\S+)',s,re.M)==['FCP.BFSSS1V52L9E5F21A']
          assert re.findall(r'^theorem (\S+)',s,re.M)==roots
          assert re.findall(r'^#print axioms (\S+)',s,re.M)==roots
          assert 'sorry' not in s and 'native_decide' not in s
          print('F21A_ORIGINAL_SOURCE_EXACT_PINS_AND_TWO_ROOTS_PASS')
          PY
      - name: Reclaim runner disk
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-f21a/toolchain.log; then
              ok=true; break
            fi
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo F21A_TOOLCHAIN_MISSING; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-f21a/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo F21A_PINNED_LEAN_MATHLIB_PASS
      - name: Restore qualified original source Spin48 PBW topological group
        id: f20f
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v52l9e5f20f-original-spin48-topological-group-v2-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}
      - name: Restore qualified actual original Spin48 source vector ancestry
        id: s1v35
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v35-isolated-original-spin48-real-gl-group-hom-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}
      - name: Verify genuine accepted source modules with native Lean consumer
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.f20f.outputs.cache-hit }}" = true || { echo F21A_F20F_QUALIFIED_CACHE_MISSING; exit 1; }
          test "${{ steps.s1v35.outputs.cache-hit }}" = true || { echo F21A_S1V35_QUALIFIED_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in SU2BFSSPhysicalDomainS1V52L9E5F20FOriginalSpin48TopologicalGroupInverseContinuityProbe SU2BFSSPhysicalDomainS1V31CanonicalAllSpin48RealVectorActionProbe SU2BFSSPhysicalDomainS1V30Real48CliffordGeneratorInjectiveViaExteriorProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "F21A_ACCEPTED_ANCESTOR_MISSING=$stem"; exit 1; }
          done
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Core.olean
          source "$HOME/.elan/env"
          cat > BFSSF21AOriginalSourceConsumer.lean <<'LEAN'
          import SU2BFSSPhysicalDomainS1V52L9E5F20FOriginalSpin48TopologicalGroupInverseContinuityProbe
          import SU2BFSSPhysicalDomainS1V31CanonicalAllSpin48RealVectorActionProbe
          #check FCP.BFSSS1V52L9E5F20F.originalSourceSpin48IsTopologicalGroup
          #check FCP.BFSSS1V52L9E5F20F.originalSourceClifford_star_continuous
          #check FCP.BFSSS1V30.source48_cliffordGenerator_injective
          #check FCP.BFSSS1V31.sourceSpin48VectorAction_clifford_generator
          LEAN
          timeout 200s lake env lean -DwarningAsError=true BFSSF21AOriginalSourceConsumer.lean | tee /tmp/bfss-f21a/source-consumer.log
          echo F21A_ORIGINAL_SOURCE_SPIN48_NATIVE_IMPORTS_PASS
      - name: Fresh original-source Lean compilation and permitted axioms
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=SU2BFSSPhysicalDomainS1V52L9E5F21AOriginalSpin48SourceVectorActionJointContinuityProbe
          cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
          set +e
          timeout 540s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" > /tmp/bfss-f21a/lean.log 2>&1
          exitcode=$?
          set -e
          cat /tmp/bfss-f21a/lean.log
          COMPILER_EXIT="$exitcode" python3 - <<'PY'
          import os,pathlib,re
          ns='FCP.BFSSS1V52L9E5F21A'
          expected=[ns+'.originalSourceCliffordGenerator_closedEmbedding',ns+'.originalSourceSpin48VectorAction_joint_continuous']
          log=pathlib.Path('/tmp/bfss-f21a/lean.log').read_text()
          reports=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          allowed={'propext','Classical.choice','Quot.sound'}
          warnings=re.findall(r'^.*warning:.*$',log,re.M)
          obj=pathlib.Path('.lake/build/lib/lean/SU2BFSSPhysicalDomainS1V52L9E5F21AOriginalSpin48SourceVectorActionJointContinuityProbe.olean')
          good=(int(os.environ['COMPILER_EXIT'])==0 and [name for name,_ in reports]==expected
            and all({a.strip() for a in v.split(',') if a.strip()}<=allowed for _,v in reports)
            and not warnings and 'error:' not in log and 'sorryAx' not in log
            and obj.is_file() and obj.stat().st_size>0)
          print('F21A_COMPILER_EXIT',os.environ['COMPILER_EXIT'],'REPORTS',reports,'WARNINGS',warnings)
          if not good: raise SystemExit('F21A_TWO_SOURCE_ROOTS_STRICT_RED')
          print('F21A_GENUINE_SPIN48_REAL_VECTOR_JOINT_CONTINUITY_TWO_ROOTS_STRICT_PASS')
          PY
      - name: Save qualified new source-bound F21A binary
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-f21a-original-spin48-vector-continuity-b029b35a827e099d000d6966c69a7bb7fc84b2a6-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}
      - name: Preserve exact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-f21a-source-real-continuity-${{ github.run_id }}
          path: /tmp/bfss-f21a
          if-no-files-found: warn
