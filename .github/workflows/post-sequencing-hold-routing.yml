name: Post sequencing evidence-hold routing reconciliation

on:
  push:
    branches:
      - maintenance/post-sequencing-evidence-hold-routing

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message == 'Run evidence-hold routing reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/post-sequencing-evidence-hold-routing
          fetch-depth: 0
      - name: Apply bounded routing reconciliation
        run: python .github/scripts/post_sequencing_hold_reconcile.py
      - name: Validate and publish clean candidate
        shell: bash
        run: |
          git config user.name 'Evan Kotler'
          git config user.email 'etblink@users.noreply.github.com'
          git rm .github/scripts/post_sequencing_hold_reconcile.py
          git rm .github/workflows/post-sequencing-hold-routing.yml
          git add CURRENT_STATE.md audits/POST_RECURRENCE_DELTA_SCIENTIFIC_SEQUENCING_ROUTING_AND_NAVIGATION_RECONCILIATION_0_1_0.md
          git diff --cached --check
          CHANGED=$(git diff --cached --name-only | sort | paste -sd ',' -)
          EXPECTED='.github/scripts/post_sequencing_hold_reconcile.py,.github/workflows/post-sequencing-hold-routing.yml,CURRENT_STATE.md,audits/POST_RECURRENCE_DELTA_SCIENTIFIC_SEQUENCING_ROUTING_AND_NAVIGATION_RECONCILIATION_0_1_0.md'
          test "$CHANGED" = "$EXPECTED"
          grep -q 'SEQUENCING_SELECTION = EVIDENCE_TRIGGERED_HOLD' CURRENT_STATE.md
          grep -q 'ACTIVE_SCIENTIFIC_OPERATION = NONE' CURRENT_STATE.md
          grep -q 'NEXT_SCIENTIFIC_PHASE = NONE__EVIDENCE_TRIGGERED_HOLD' CURRENT_STATE.md
          grep -q 'CLAIM_LEDGER_DURABLE_ROW_COUNT = 100' CURRENT_STATE.md
          git commit -m 'Reconcile evidence-triggered hold routing'
          git push origin HEAD:maintenance/post-sequencing-evidence-hold-routing
