name: BFSS S1V19 Original F4 and G1A Typed Source Strict Gate

# Isolated, opt-in by exact workflow-path edit; never triggers broad PR25 CI.
on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v19-original-f4-g1a-typed-source.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v19-original-f4-g1a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-original-f4-g1a:
    runs-on: ubuntu-latest
    timeout-minutes: 47
    steps:
      - name: Checkout isolated candidate at triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout immutable original OAI mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Verify original pins and four complete exact source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v19-f4g1a
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          j=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(x['rev'] for x in j['packages'] if x['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          root=experiments/openai-math-su2-concrete-potential
          test "$(git hash-object "$root/SU2ColorCrossProbe.lean")" = 399e9380ba1c679dc173a9dec0ac21e09d7757fd
          test "$(git hash-object "$root/SU2RealGammaProbe.lean")" = 5ec0fcb039fb5c1367f72b2bd0f8c05fcd936587
          test "$(git hash-object "$root/SU2BFSSFullAlgebraDataProbe.lean")" = fe3e0b21bb60d74b54c9faf7c066db9b02939405
          test "$(git hash-object "$root/SU2BFSSG1APairedThetaProbe.lean")" = 4f8fbf05a35c1d625746931b7ff0361b7ffc2ec4
          test "$(git hash-object "$root/SU2FermionF3C2ThetaFieldsProbe.lean")" = 95cf7e3e59990cd4155bc861fef82b13c0b36150
          echo ORIGINAL_F4_G1A_SOURCE_AND_PINS_VERIFIED

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore exact pinned Lean and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v19-f4g1a/toolchain.log; then
              ok=true; break
            fi
            echo PINNED_LEAN_TLS_RETRY_$attempt | tee -a /tmp/bfss-s1v19-f4g1a/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo PINNED_LEAN_TOOLCHAIN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v19-f4g1a/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo EXACT_PINNED_MATHLIB_VERIFIED

      - name: Restore accepted original F3C2 irreducible and OAI source cache
        id: fock
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2Fermion*.olean
          key: bfss-s1v19-isolated-f3c2-irreducible-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed unless accepted original F3C2 cache is present
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.fock.outputs.cache-hit }}" = true || { echo ORIGINAL_F3C2_ACCEPTED_CACHE_MISSING; exit 1; }
          for stem in SU2FermionFockProbe SU2FermionF2Probe SU2FermionF2B2ThetaProbe SU2FermionF3B6NonzeroKetProbe SU2FermionF3C2ThetaFieldsProbe; do
            test -s "upstream-math/lean/.lake/build/lib/lean/$stem.olean" || { echo "MISSING_ACCEPTED_OLEAN=$stem"; exit 1; }
          done
          test -s upstream-math/lean/.lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GaugeCore.olean
          echo ORIGINAL_F3C2_AND_OAI_CACHE_RESTORED

      - name: Build exact original upstream Pauli and color/gamma dependencies
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          timeout 760s lake build OAI.MathematicalPhysics.BFSS.PotentialBasis OAI.Analysis.CharacterCriterion.Pauli OAI.MathematicalPhysics.BFSS.Core 2>&1 | tee /tmp/bfss-s1v19-f4g1a/original-deps.log
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/PotentialBasis.olean
          test -s .lake/build/lib/lean/OAI/Analysis/CharacterCriterion/Pauli.olean
          for stem in SU2ColorCrossProbe SU2RealGammaProbe; do
            cp "../../experiments/openai-math-su2-concrete-potential/$stem.lean" "$stem.lean"
            timeout 280s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v19-f4g1a/$stem.log"
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "FAILED_SOURCE_DEPENDENCY=$stem"; exit 1; }
            if grep -Eq 'error:|sorryAx|unknownIdentifier' "/tmp/bfss-s1v19-f4g1a/$stem.log"; then echo "UNQUALIFIED_SOURCE_DEPENDENCY=$stem"; exit 1; fi
          done
          echo ORIGINAL_COLOR_AND_GAMMA_COMPILED

      - name: Strict F4 AlgebraData and G1A original paired source kernel verification
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          for stem in SU2BFSSFullAlgebraDataProbe SU2BFSSG1APairedThetaProbe; do
            cp "../../experiments/openai-math-su2-concrete-potential/$stem.lean" "$stem.lean"
            timeout 240s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v19-f4g1a/$stem.log"
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "FAILED_ORIGINAL_MODEL_OLEAN=$stem"; exit 1; }
          done
          python3 - <<'PY'
          import pathlib,re
          roots={
            'SU2BFSSFullAlgebraDataProbe':[
              'concreteAlgebraData','concreteAlgebraData_color',
              'concreteAlgebraData_gamma','concreteAlgebraData_theta'],
            'SU2BFSSG1APairedThetaProbe':[
              'pairedLabel_even','pairedLabel_odd','pairedTheta_even','pairedTheta_odd',
              'pairedTheta_selfAdjoint','pairedTheta_CAR','pairedTheta_irreducible',
              'pairedAlgebraData','pairedAlgebraData_color',
              'pairedAlgebraData_gamma','pairedAlgebraData_theta']
          }
          pattern=r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
          expected={'propext','Classical.choice','Quot.sound'}
          namespaces={'SU2BFSSFullAlgebraDataProbe':'FCP.BFSSSU2Full.',
                      'SU2BFSSG1APairedThetaProbe':'FCP.BFSSSU2GaugeG1A.'}
          for stem, rr in roots.items():
            s=pathlib.Path('/tmp/bfss-s1v19-f4g1a',stem+'.log').read_text()
            hits=re.findall(pattern,s)
            got={name:{x.strip() for x in vals.split(',') if x.strip()} for name,vals in hits}
            assert len(hits)==len(rr),(stem,hits,rr)
            for n in rr:
              k=namespaces[stem]+n
              assert k in got and got[k]<=expected,(stem,k,got)
            assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,(stem,s[-4500:])
            print(stem,'ORIGINAL_F4_G1A_AXIOM_CLEAN_PASS',len(rr))
          print('ORIGINAL_F4_G1A_TYPED_ALGEBRADATA_15_ROOTS_KERNEL_PASS')
          PY

      - name: Save qualified original F3 through G1A dependency cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v19-isolated-f4g1a-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve first causal compiler and provenance diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v19-f4g1a-${{ github.run_id }}
          path: /tmp/bfss-s1v19-f4g1a/
          if-no-files-found: warn
          retention-days: 14
