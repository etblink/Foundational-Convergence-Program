name: BFSS L6G5W Original Orbital Gauge Tangent

# Stable PR25 scope. A missing historical cache is recovered from the
# unchanged upstream lockfile; PR bases and accepted source files stay fixed.
on:
  pull_request:
    branches:
      - research/openai-math-su2-s3k-physical-spin-flow
    paths:
      - .github/workflows/bfss-l6g1-original-spin-identity.yml
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G1OriginalUpstreamSpinIdentityProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G2OriginalHomogeneousRowFierzProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G3OriginalChargeNormalOrderProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G4AOriginalCoreCalculusProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G4BOriginalCoefficientCommutatorProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5AOriginalKineticGramProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5BOriginalComplexKineticColorGramProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5COriginalKineticDifferentialSquareProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5DOriginalCoefficientKineticSplitProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5EOriginalScalarCoefficientSquareProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5FSourceQuarticPointwiseProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5GOriginalSU2QuarticJacobiProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5HSourceCenteredGammaGramProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5IOriginalQuadraticRealAndGammaRowProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5JSourceGammaTwoBivectorTransportProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5KSourceQuadraticBracketRegroupProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5LSourcePauliCyclicCoefficientProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5MSourceColorWedgeEnergyProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5NOriginalFiniteQuarticContractionProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5OOriginalComplexQuarticOperatorProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5POriginalScalarMixedRemainderProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5QOriginalDiagonalMixedCommutatorProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5ROriginalGammaBivectorCommutatorProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5SOriginalSignedRowGammaContractionProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5TOriginalMixedBracketReindexProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5UOriginalMixedPointCoefficientProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5VOriginalRightOrderedMixedOperatorProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G5WOriginalOrbitalGaugeTangentProbe.lean

permissions:
  contents: read

concurrency:
  group: bfss-l6g1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-source-spin-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out isolated FCP research source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check out exact pinned mathematical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Verify original source identities before cache or build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-l6g1
          test "$(git -C upstream-math rev-parse HEAD)" = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
          test "$(cat upstream-math/lean/lean-toolchain)" = "leanprover/lean4:v4.34.1"
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2RealGammaProbe.lean)" = "5ec0fcb039fb5c1367f72b2bd0f8c05fcd936587"
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G1OriginalUpstreamSpinIdentityProbe.lean)" = "b3c4cb1b12c64d3e718d2c547ee29ebac2b18a36"
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G2OriginalHomogeneousRowFierzProbe.lean)" = "481df011d2e87b31e58efea2b97f81094fc14918"
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G3OriginalChargeNormalOrderProbe.lean)" = "1c155a708930af50534dc9cb540c48319aeae8b2"
          python3 - <<'PY'
          import json
          d=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p for p in d['packages'] if p['name']=='mathlib')['rev']=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          {
            echo "FCP_HEAD=$(git rev-parse HEAD)"
            echo "UPSTREAM_HEAD=$(git -C upstream-math rev-parse HEAD)"
            echo "GAMMA_SOURCE_BLOB=$(git hash-object experiments/openai-math-su2-concrete-potential/SU2RealGammaProbe.lean)"
            echo "G1_SOURCE_BLOB=$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G1OriginalUpstreamSpinIdentityProbe.lean)"
            echo "G2_SOURCE_BLOB=$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G2OriginalHomogeneousRowFierzProbe.lean)"
            echo "G3_SOURCE_BLOB=$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G3OriginalChargeNormalOrderProbe.lean)"
            echo "G4A_SOURCE_BLOB=$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G4AOriginalCoreCalculusProbe.lean)"
            echo "G4B_SOURCE_BLOB=$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G4BOriginalCoefficientCommutatorProbe.lean)"
            echo "EXACT_SOURCE_PREFLIGHT_PASS"
          } | tee /tmp/bfss-l6g1/source-pins.txt

      - name: Reclaim proven disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: Restore exact PR-scoped pinned dependency environment
        id: dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake
            ~/.elan
          key: bfss-l6-pinned-env-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Recover pinned dependencies using existing cold-bootstrap procedure
        if: steps.dependencies.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          echo L6_PINNED_CACHE_MISS__REPRODUCIBLE_LOCKFILE_BOOTSTRAP
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd upstream-math/lean
          timeout 1500s lake exe cache get
          echo L6_PINNED_COLD_BOOTSTRAP_COMPLETE

      - name: Verify compiler and actual Mathlib checkout
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          test -s upstream-math/lean/.lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean
          test "$(git -C upstream-math/lean/.lake/packages/mathlib rev-parse HEAD)" = "d13f23b723b8a846827a245b89c10fc7d3f11612"
          cd upstream-math/lean
          lake env lean --version | tee /tmp/bfss-l6g1/compiler.txt
          grep -q 'version 4.34.1' /tmp/bfss-l6g1/compiler.txt
          echo L6_PINNED_ENVIRONMENT_VERIFIED

      - name: Save recovered environment before source-proof experiments
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake
            ~/.elan
          key: bfss-l6-pinned-env-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Restore qualified G1 gamma objects by exact frozen source hashes
        id: accepted_g1
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GammaWords.olean
            upstream-math/lean/.lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GammaIdentity.olean
            upstream-math/lean/.lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Core.olean
            upstream-math/lean/.lake/build/lib/lean/SU2RealGammaProbe.olean
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainL6G1OriginalUpstreamSpinIdentityProbe.olean
          key: bfss-l6g1-source-v1-adc7f124-lean4341-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/openai-math-su2-concrete-potential/SU2RealGammaProbe.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G1OriginalUpstreamSpinIdentityProbe.lean') }}

      - name: Compile only three original upstream gamma prerequisites
        if: steps.accepted_g1.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          mkdir -p .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS
          for stem in GammaWords GammaIdentity Core; do
            echo "L6_UPSTREAM_SOURCE_COMPILE_BEGIN=$stem"
            timeout 300s lake env lean -o ".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/$stem.olean" "OAI/MathematicalPhysics/BFSS/$stem.lean" 2>&1 | tee "/tmp/bfss-l6g1/$stem.log"
            test -s ".lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/$stem.olean"
          done

      - name: Compile unchanged original real gamma source and audit its axioms
        if: steps.accepted_g1.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 11
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cp experiments/openai-math-su2-concrete-potential/SU2RealGammaProbe.lean upstream-math/lean/
          cd upstream-math/lean
          timeout 600s lake env lean -o .lake/build/lib/lean/SU2RealGammaProbe.olean SU2RealGammaProbe.lean 2>&1 | tee /tmp/bfss-l6g1/original-gamma.log
          test -s .lake/build/lib/lean/SU2RealGammaProbe.olean
          python3 - <<'PY'
          import re
          s=open('/tmp/bfss-l6g1/original-gamma.log').read()
          allowed={'propext','Classical.choice','Quot.sound'}
          actual={name:{a.strip() for a in ax.split(',') if a.strip()} for name,ax in re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)}
          for short in ['gammaInt_symm_entries','signedPerm_clifford','gammaInt_mul_apply','gamma_symmetric','gamma_clifford','exists_gamma9']:
              matches=[axs for name,axs in actual.items() if name.endswith('.'+short)]
              assert len(matches)==1 and matches[0]<=allowed,(short,actual)
          assert 'sorryAx' not in s and 'error:' not in s,s[-4000:]
          print('L6_ORIGINAL_GAMMA_SOURCE_AXIOMS_PASS')
          PY

      - name: Qualify only L6G1 original source spinor identity
        if: steps.accepted_g1.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainL6G1OriginalUpstreamSpinIdentityProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          timeout 180s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee /tmp/bfss-l6g1/original-spin-identity.log
          test -s ".lake/build/lib/lean/$stem.olean"
          printf '%s\n' 'import SU2BFSSPhysicalDomainL6G1OriginalUpstreamSpinIdentityProbe' '#print axioms OAI.BFSSGamma.spinIdentity' > L6G1UpstreamAxiomAudit.lean
          timeout 90s lake env lean L6G1UpstreamAxiomAudit.lean 2>&1 | tee /tmp/bfss-l6g1/upstream-spin-axioms.log
          python3 - <<'PY'
          import re
          allowed={'propext','Classical.choice','Quot.sound'}
          files=[('/tmp/bfss-l6g1/original-spin-identity.log',[
              'FCP.BFSSSU2PhysicalDomainL6G1.originalGamma_spinIdentity',
              'FCP.BFSSSU2PhysicalDomainL6G1.originalGamma_spinIdentity_apply']),
              ('/tmp/bfss-l6g1/upstream-spin-axioms.log',['OAI.BFSSGamma.spinIdentity'])]
          for path,names in files:
              s=open(path).read()
              actual={name:{a.strip() for a in ax.split(',') if a.strip()} for name,ax in re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)}
              assert all(n in actual and actual[n]<=allowed for n in names),(path,actual)
              assert 'sorryAx' not in s and 'error:' not in s,s[-4000:]
          print('L6G1_ORIGINAL_SOURCE_SPIN_IDENTITY_QUALIFIED')
          PY

      - name: Cache only the qualified source gamma objects
        if: steps.accepted_g1.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GammaWords.olean
            upstream-math/lean/.lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GammaIdentity.olean
            upstream-math/lean/.lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Core.olean
            upstream-math/lean/.lake/build/lib/lean/SU2RealGammaProbe.olean
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainL6G1OriginalUpstreamSpinIdentityProbe.olean
          key: bfss-l6g1-source-v1-adc7f124-lean4341-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/openai-math-su2-concrete-potential/SU2RealGammaProbe.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G1OriginalUpstreamSpinIdentityProbe.lean') }}

      - name: Restore qualified G2 Fierz by exact frozen source hashes
        id: accepted_g2
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainL6G2OriginalHomogeneousRowFierzProbe.olean
          key: bfss-l6g2-source-v1-adc7f124-lean4341-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/openai-math-su2-concrete-potential/SU2RealGammaProbe.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G1OriginalUpstreamSpinIdentityProbe.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G2OriginalHomogeneousRowFierzProbe.lean') }}

      - name: Qualify arbitrary-spinor homogeneity and literal source row Fierz
        if: steps.accepted_g2.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          test -s upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainL6G1OriginalUpstreamSpinIdentityProbe.olean
          stem=SU2BFSSPhysicalDomainL6G2OriginalHomogeneousRowFierzProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          echo L6G2_HOMOGENEOUS_SOURCE_ROW_FIERZ_BEGIN
          timeout 180s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee /tmp/bfss-l6g1/homogeneous-row-fierz.log
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import re
          s=open('/tmp/bfss-l6g1/homogeneous-row-fierz.log').read()
          allowed={'propext','Classical.choice','Quot.sound'}
          actual={name:{a.strip() for a in ax.split(',') if a.strip()} for name,ax in re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)}
          names=['originalGamma_spinIdentity_homogeneous','originalGammaTwo_transpose',
              'originalGamma_row_eq_column','originalGammaTwo_row_eq_neg_column',
              'originalGamma_generalizedRowFierz']
          prefix='FCP.BFSSSU2PhysicalDomainL6G2.'
          assert all(prefix+n in actual and actual[prefix+n]<=allowed for n in names),actual
          assert 'sorryAx' not in s and 'error:' not in s,s[-4000:]
          print('L6G2_ALL_REAL_SPINORS_ORIGINAL_ROW_FIERZ_QUALIFIED')
          PY

      - name: Cache the qualified G2 source theorem object
        if: steps.accepted_g2.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainL6G2OriginalHomogeneousRowFierzProbe.olean
          key: bfss-l6g2-source-v1-adc7f124-lean4341-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/openai-math-su2-concrete-potential/SU2RealGammaProbe.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G1OriginalUpstreamSpinIdentityProbe.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G2OriginalHomogeneousRowFierzProbe.lean') }}

      - name: Restore qualified G3 original normal ordering by frozen source hash
        id: accepted_g3
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainL6G3OriginalChargeNormalOrderProbe.olean
          key: bfss-l6g3-source-v1-adc7f124-lean4341-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G3OriginalChargeNormalOrderProbe.lean') }}

      - name: Qualify literal original smooth-core CAR normal ordering
        if: steps.accepted_g3.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          test -s upstream-math/lean/.lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Core.olean
          test -s upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainL6G2OriginalHomogeneousRowFierzProbe.olean
          stem=SU2BFSSPhysicalDomainL6G3OriginalChargeNormalOrderProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          echo L6G3_ORIGINAL_SMOOTH_CORE_CAR_NORMAL_ORDER_BEGIN
          timeout 180s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee /tmp/bfss-l6g1/original-charge-normal-order.log
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import re
          s=open('/tmp/bfss-l6g1/original-charge-normal-order.log').read()
          allowed={'propext','Classical.choice','Quot.sound'}
          actual={name:{a.strip() for a in ax.split(',') if a.strip()} for name,ax in re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)}
          names=['sourceFermionAction_CAR','sourceCoefficient_comm_fermion',
              'sourceCharge_factorization','sourceAllSpinorCharge_factorization',
              'sourceAllSpinorCoefficient_comm_fermion',
              'sourceCharge_normalOrder','sourceAllSpinorCharge_normalOrder']
          prefix='FCP.BFSSSU2PhysicalDomainL6G3.'
          assert all(prefix+n in actual and actual[prefix+n]<=allowed for n in names),actual
          assert 'sorryAx' not in s and 'error:' not in s,s[-4000:]
          print('L6G3_ORIGINAL_SOURCE_ALL_SPINOR_CAR_NORMAL_ORDER_QUALIFIED')
          PY

      - name: Cache only the qualified original-charge normal-order object
        if: steps.accepted_g3.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainL6G3OriginalChargeNormalOrderProbe.olean
          key: bfss-l6g3-source-v1-adc7f124-lean4341-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G3OriginalChargeNormalOrderProbe.lean') }}

      - name: Restore independently qualified minimal G4A source calculus
        id: accepted_g4a
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/CliffordSymbols.olean
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainL6G4AOriginalCoreCalculusProbe.olean
          key: bfss-l6g4a-calculus-v1-adc7f124-lean4341-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G3OriginalChargeNormalOrderProbe.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G4AOriginalCoreCalculusProbe.lean') }}

      - name: Qualify only upstream multiplier rule and minimal original calculus
        if: steps.accepted_g4a.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 9
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainL6G4AOriginalCoreCalculusProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainL6G3OriginalChargeNormalOrderProbe.olean
          timeout 300s lake env lean -o .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/CliffordSymbols.olean OAI/MathematicalPhysics/BFSS/CliffordSymbols.lean 2>&1 | tee /tmp/bfss-l6g1/upstream-clifford-symbols.log
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/CliffordSymbols.olean
          echo L6G4A_LITERAL_SOURCE_CALCULUS_BEGIN
          timeout 180s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee /tmp/bfss-l6g1/original-core-calculus.log
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import re
          s=open('/tmp/bfss-l6g1/original-core-calculus.log').read()
