name: BFSS S4B36 Original Physical Closed Form Pauli B Strict

# Reuse independently qualified original-source parent caches.
# Compile only a novel two-root source-exact physical form bridge;
# strict cache miss/import failure is a RED, never a theorem claim.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s4b36-closed-physical-form-pauli-b-strict.yml
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B36ActualPhysicalClosedFormPauliManuscriptProbe.lean
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bfss-s4b36-physical-closed-pauli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  strict-genuine-closed-physical-source-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout pinned BFSS research
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout immutable upstream BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: Fail closed on exact accepted prior source and proposed proof
        shell: bash
        run: |
          set -euo pipefail
          accepted="4d0738f4c00cad9e0e5e314df3680ff1647080a7"
          git merge-base --is-ancestor "$accepted" HEAD
          git diff --quiet "$accepted" HEAD -- \
            experiments/openai-math-su2-physical-domain \
            experiments/openai-math-su2-concrete-potential \
            ':(exclude)experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B35PairedSourceSmoothCoreEnergyProbe.lean' \
            ':(exclude)experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B36ActualPhysicalClosedFormPauliManuscriptProbe.lean'
          test "$(git rev-parse HEAD:experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B36ActualPhysicalClosedFormPauliManuscriptProbe.lean)" = "81dd44eec7c24790d87493496fc6f50eae0a0e8e"
          test "$(git hash-object --no-filters experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B36ActualPhysicalClosedFormPauliManuscriptProbe.lean)" = "81dd44eec7c24790d87493496fc6f50eae0a0e8e"
          test "$(git rev-parse HEAD:experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B35PairedSourceSmoothCoreEnergyProbe.lean)" = "77a1a79f12a7cfdf68f47b6a2420633c1958731f"
          test "$(git rev-parse HEAD:experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainD2B14ExactClosedChargeQuadraticEnergyProbe.lean)" = "e7f22ea071bfe87b3afa8cb65a5dcd598334ae8a"
          test "$(git -C upstream-math rev-parse HEAD)" = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
          test "$(cat upstream-math/lean/lean-toolchain)" = "leanprover/lean4:v4.34.1"
          python3 - <<'PY'
          import pathlib,json,re
          m=json.loads(pathlib.Path("upstream-math/lean/lake-manifest.json").read_text())
          assert next(p["rev"] for p in m["packages"] if p["name"]=="mathlib") == "d13f23b723b8a846827a245b89c10fc7d3f11612"
          s=pathlib.Path("experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B36ActualPhysicalClosedFormPauliManuscriptProbe.lean").read_text()
          assert re.findall(r"^theorem (\w+)",s,re.M)==[
            "pairedSourceClosedPhysicalEnergy_on_invariantCore_eq_PauliB",
            "pairedExplicitPauliCoreEnergy_nonneg_on_invariantCore"]
          assert re.findall(r"^#print axioms (\w+)",s,re.M)==[
            "pairedSourceClosedPhysicalEnergy_on_invariantCore_eq_PauliB",
            "pairedExplicitPauliCoreEnergy_nonneg_on_invariantCore"]
          assert "sorry" not in s and "native_decide" not in s
          # Parse every embedded workflow Python script *before* downloading
          # Mathlib and four binary caches, to avoid six-minute syntax reds.
          import ast,textwrap
          workflow=pathlib.Path(".github/workflows/bfss-s4b36-closed-physical-form-pauli-b-strict.yml").read_text()
          pythonBlocks=re.findall(r"(?ms)^          python3 - <<'PY'\n(.*?)^          PY$",workflow)
          assert len(pythonBlocks)==4,("EMBEDDED_SCRIPT_COUNT_CHANGED",len(pythonBlocks))
          for n,script in enumerate(pythonBlocks):
            ast.parse(textwrap.dedent(script),filename=f"bfss_s4b36_ci_script_{n}.py")
          print("FCP_BFSS_S4B36_FOUR_EMBEDDED_PYTHON_SCRIPTS_PARSE_PASS")
          print("FCP_BFSS_S4B36_FROZEN_SOURCES_EXACT_TWO_CANDIDATES_PASS")
          PY
      - name: Independently confirm strict green producer checkpoints
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s4b36
          for id in 40146023874 40464747798 40467255128; do
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/etblink/Foundational-Convergence-Program/actions/runs/$id" \
              > "/tmp/bfss-s4b36/producer-$id.json"
          done
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("/tmp/bfss-s4b36")
          expected={40146023874:"94b6d14ad7e946747b3c0b2c51f42654755151a7",
                    40464747798:"4b4b5dc7802458ad54e586debca057b31b62eadc",
                    40467255128:"1adbd547213c2e0c2d631ebe720fed07376154f3"}
          for rid,sha in expected.items():
            r=json.loads((p/("producer-"+str(rid)+".json")).read_text())
            assert (r["id"],r["run_attempt"],r["status"],r["conclusion"],r["head_sha"])==(
              rid,1,"completed","success",sha)
          print("FCP_BFSS_S4B36_EXACT_SOURCE_QUALIFIED_CACHE_PRODUCERS_PASS")
          PY
      - name: Restore pinned Lean and Mathlib environment
        shell: bash
        timeout-minutes: 19
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true
          cd upstream-math/lean
          timeout 920s lake exe cache get > /tmp/bfss-s4b36/mathlib-cache.log 2>&1 || {
            tail -n 60 /tmp/bfss-s4b36/mathlib-cache.log; exit 1;
          }
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = "4.34.1"
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "d13f23b723b8a846827a245b89c10fc7d3f11612"
