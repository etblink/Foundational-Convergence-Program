name: BFSS K1D2A Original 48 Label Exterior Word Contractions Strict
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s1v52k1d2a-original-exterior-word-contraction-strict.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  k1d2a-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - name: Checkout exact research source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout pinned original mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: Exact original candidate and three theorem roots preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-k1d2a
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          for entry in \
            "experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52K1D2AOriginalExteriorCoordinateWordContractionProbe.lean:b99cd7c09b2c44e5282db7cd1549c5fa425d06a2" \
            "experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52K1D1OriginalPolarCoordinateExteriorContractionProbe.lean:46cd08ee5124dae7160f6fa2135b9b01c73b1030" \
            "experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52K1D0OriginalCliffordExteriorContractionTransportProbe.lean:c3a96cb1abd32e3cfaa82ed515224bb958e2c4eb"; do
            f="${entry%%:*}"; expected="${entry#*:}"
            test "$(git rev-parse "HEAD:$f")" = "$expected" || { echo "K1D2A_GIT_BLOB_MISMATCH=$f"; exit 1; }
            test "$(git hash-object --no-filters "$f")" = "$expected" || { echo "K1D2A_RAW_BLOB_MISMATCH=$f"; exit 1; }
          done
          python3 - <<'PY'
          import json,pathlib,re
          m=json.loads(pathlib.Path('upstream-math/lean/lake-manifest.json').read_text())
          assert next(p['rev'] for p in m['packages'] if p['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          s=pathlib.Path('experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52K1D2AOriginalExteriorCoordinateWordContractionProbe.lean').read_text()
          roots=['originalExteriorCoordinateWord_cons','originalExteriorCoordinateWord_contraction_zero_of_not_mem','originalExteriorCoordinateWord_leading_contraction']
          assert re.findall(r'^namespace (\S+)',s,re.M)==['FCP.BFSSS1V52K1D2A']
          assert re.findall(r'^theorem (\S+)',s,re.M)==roots
          assert re.findall(r'^#print axioms (\S+)',s,re.M)==roots
          assert not re.search(r'^\s*(?:sorry|native_decide|axiom)\b',s,re.M) and 'sorryAx' not in s
          print('K1D2A_SOURCE_THREE_ROOTS_PINNED_PASS')
          PY
      - name: Restore strictly accepted K1D1 source cache
        id: parent
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-k1d1-original-polar-coordinate-dual-46cd08ee5124dae7160f6fa2135b9b01c73b1030-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}
      - name: Fail closed on actual compiled accepted ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.parent.outputs.cache-hit }}" = true || { echo K1D2A_K1D1_QUALIFIED_CACHE_MISSING; exit 1; }
          for stem in \
            SU2BFSSPhysicalDomainS1V52K1D1OriginalPolarCoordinateExteriorContractionProbe \
            SU2BFSSPhysicalDomainS1V52K1D0OriginalCliffordExteriorContractionTransportProbe \
            SU2BFSSPhysicalDomainS1V52L9E5F20BOriginalSource48CliffordPBWBasisFiniteDimensionalProbe; do
            test -s "upstream-math/lean/.lake/build/lib/lean/$stem.olean" || { echo "K1D2A_PARENT_OLEAN_MISSING=$stem"; exit 1; }
          done
          echo K1D2A_ORIGINAL_SOURCE_K1D1_AND_F20B_ANCESTRY_PASS
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
      - name: Install pinned Lean 4.34.1 and restore frozen Mathlib cache
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-k1d2a/toolchain.log; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo K1D2A_LEAN_TOOLCHAIN_MISSING; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-k1d2a/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo K1D2A_PINNED_ENV_PASS
      - name: Fresh compile actual three source roots and audit axioms
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=SU2BFSSPhysicalDomainS1V52K1D2AOriginalExteriorCoordinateWordContractionProbe
          cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
          set +e
          timeout 540s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" > /tmp/bfss-k1d2a/lean.log 2>&1
          exitcode=$?
          set -e
          cat /tmp/bfss-k1d2a/lean.log
          COMPILER_EXIT="$exitcode" python3 - <<'PY'
          import os,pathlib,re
          roots=['originalExteriorCoordinateWord_cons','originalExteriorCoordinateWord_contraction_zero_of_not_mem','originalExteriorCoordinateWord_leading_contraction']
          expected=['FCP.BFSSS1V52K1D2A.'+x for x in roots]
          log=pathlib.Path('/tmp/bfss-k1d2a/lean.log').read_text()
          reports=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          allowed={'propext','Classical.choice','Quot.sound'}
          warnings=[l for l in log.splitlines() if '.lean:' in l and ': warning:' in l]
          obj=pathlib.Path('.lake/build/lib/lean/SU2BFSSPhysicalDomainS1V52K1D2AOriginalExteriorCoordinateWordContractionProbe.olean')
          good=(int(os.environ['COMPILER_EXIT'])==0 and [name for name,_ in reports]==expected
            and all({a.strip() for a in v.split(',') if a.strip()}<=allowed for _,v in reports)
            and not warnings and 'error:' not in log and 'sorryAx' not in log
            and obj.is_file() and obj.stat().st_size>0)
          print('K1D2A_COMPILER_EXIT',os.environ['COMPILER_EXIT'],'REPORTS',reports,'WARNINGS',warnings)
          if not good: raise SystemExit('K1D2A_TWO_ORIGINAL_SOURCE_ROOTS_STRICT_RED')
          print('K1D2A_ORIGINAL_EXTERIOR_WORD_CONTRACTION_THREE_ROOTS_STRICT_PASS')
          PY
      - name: Save qualified original K1D2A compiled binary
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-k1d2a-original-exterior-word-contraction-b99cd7c09b2c44e5282db7cd1549c5fa425d06a2-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}
      - name: Preserve precise failure and success evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-k1d2a-exterior-word-${{ github.run_id }}
          path: /tmp/bfss-k1d2a
          if-no-files-found: warn
