name: BFSS L6G0 Source Clifford Word Bridge

# Isolated, source-pinned gate. No R4B/R4D or monolithic cubic modules.
on:
  pull_request:
    branches:
      - research/openai-math-su2-s3k-physical-spin-flow
    paths:
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G0SourceCliffordWordBridgeProbe.lean
      - .github/workflows/bfss-l6g0-source-clifford-word-bridge.yml

permissions:
  contents: read

concurrency:
  group: bfss-l6g0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-clifford-word-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout isolated FCP research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout exact pinned upstream mathematical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Reclaim proven disposable runner headroom
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore pinned Lean and Mathlib dependencies
        id: dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake
            ~/.elan
          key: family270b-bridge-ubuntu-lean4341-openai-adc7f124-deformedcharge-v2

      - name: Fail closed on original source, version or cache mismatch
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.dependencies.outputs.cache-hit }}" = "true"
          test "$(cat upstream-math/lean/lean-toolchain)" = "leanprover/lean4:v4.34.1"
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' upstream-math/lean/lake-manifest.json
          test -s upstream-math/lean/.lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean
          test -s upstream-math/lean/.lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GammaWords.olean
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2RealGammaProbe.lean)" = "5ec0fcb039fb5c1367f72b2bd0f8c05fcd936587"

      - name: Restore accepted original gamma source objects where available
        id: accepted_s3e
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: upstream-math/lean/.lake/build
          key: bfss-su2-accepted-s3e-v1-5ab0ee08dfca4565-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/openai-math-su2-concrete-potential/*.lean', 'upstream-math/lean/lean-toolchain', 'upstream-math/lean/lake-manifest.json') }}

      - name: Compile ONLY accepted gamma dependency if missing, then L6G0
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainL6G0SourceCliffordWordBridgeProbe
          cp "experiments/openai-math-su2-concrete-potential/SU2RealGammaProbe.lean" upstream-math/lean/
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          if ! test -s .lake/build/lib/lean/SU2RealGammaProbe.olean; then
            echo SOURCE_GAMMA_OLEAN_MISSING__BUILD_EXACT_FROZEN_SOURCE
            timeout 300s lake env lean -o .lake/build/lib/lean/SU2RealGammaProbe.olean SU2RealGammaProbe.lean
          fi
          echo L6G0_SOURCE_WORD_BRIDGE_BEGIN
          timeout 240s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee /tmp/bfss-l6g0-lean.log
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import re
          s=open('/tmp/bfss-l6g0-lean.log').read()
          names=[
            'originalGamma_clifford','originalGamma_symmetric',
            'originalGamma_word_transpose','originalGamma_trace_words',
            'originalGamma_words_span','originalGamma_sandwich_word',
            'originalGamma_matrix_eq_of_word_traces']
          prefix='FCP.BFSSSU2PhysicalDomainL6G0.'
          allowed={'propext','Classical.choice','Quot.sound'}
          matches=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          actual={name:{a.strip() for a in ax.split(',') if a.strip()} for name,ax in matches}
          assert all(prefix+n in actual for n in names),actual
          for n in names: assert actual[prefix+n] <= allowed,(n,actual[prefix+n])
          print('L6G0_ACCEPTED_ALL_SEVEN_SOURCE_THEOREMS_AXIOM_AUDITED')
          PY
