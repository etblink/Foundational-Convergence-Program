name: BFSS S3K Pinned Environment Preflight

on:
  pull_request:
    branches:
      - research/openai-math-su2-concrete-potential
    paths:
      - .github/workflows/bfss-s3k-pinned-environment-preflight.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-dependency-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Inspect existing pinned dependency caches without extracting them
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo "CACHE_INVENTORY_BEGIN"
          if gh api "repos/$GH_REPO/actions/caches?per_page=100" \
             --jq '.actions_caches[] | select(.key | contains("family270b-bridge-ubuntu-lean4341-openai-adc7f124")) | [.key, .ref, (.size_in_bytes | tostring)] | @tsv'; then
            echo "CACHE_INVENTORY_QUERY_COMPLETE"
          else
            echo "CACHE_INVENTORY_UNAVAILABLE__NOT_A_PROOF_FAILURE"
          fi

      - name: Check out exact pinned OpenAI Math source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: openai/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Cold-bootstrap pinned Lean and Mathlib without restoring the 3.5 GB cache
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = "leanprover/lean4:v4.34.1"
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd lean
          echo "PINNED_MATHLIB_COLD_CACHE_BEGIN"
          timeout 1200s lake exe cache get
          test -x "$HOME/.elan/toolchains/leanprover--lean4---v4.34.1/bin/lean"
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "d13f23b723b8a846827a245b89c10fc7d3f11612"
          git diff --exit-code -- lake-manifest.json
          echo "PINNED_S3K_MATHLIB_ENVIRONMENT_AVAILABLE__NO_BFSS_THEOREM_TESTED"
