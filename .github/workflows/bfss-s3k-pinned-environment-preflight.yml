name: BFSS S3K Pinned Environment Preflight

# The bounded PR evidence gates #3 and #4 are archived; this diagnostic
# workflow is no longer part of automatic PR execution.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-dependency-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect lightweight runner and cache inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/s3k-diag
          {
            echo "BFSS_S3K_PINNED_ENVIRONMENT_DIAGNOSTIC_V2"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "REF=$GITHUB_REF"
            echo "DIAGNOSTIC_ONLY__NO_BFSS_PROOFS_RUN"
            echo "UTC_DATE=$(date -u +%FT%TZ)"
            echo "RUNNER_OS=$(uname -sr)"
            echo "RUNNER_DISK:"
            df -h / /home/runner/work || true
            echo "RUNNER_MEMORY:"
            free -m || true
            echo "RUNNER_DISK_INODES:"
            df -i / || true
            echo "CACHE_INVENTORY_RESULT:"
            gh api "repos/$GH_REPO/actions/caches?per_page=100" \
              --jq '[.actions_caches[] | select(.key | contains("family270b-bridge-ubuntu-lean4341-openai-adc7f124")) | {key,ref,size_in_bytes,created_at,last_accessed_at}]' \
              2>&1 || echo "CACHE_INVENTORY_QUERY_FAILED"
            echo "LEAN_RELEASE_HEAD_STATUS:"
            curl -LIs -o /dev/null --max-time 15 -w '%{http_code}\n' https://github.com/leanprover/lean4/releases/tag/v4.34.1 || echo "LEAN_RELEASE_HEAD_UNAVAILABLE"
            echo "MATHLIB_CACHE_ENDPOINT_STATUS:"
            curl -LIs -o /dev/null --max-time 15 -w '%{http_code}\n' https://cache.mathlib.org/ || echo "MATHLIB_CACHE_HEAD_UNAVAILABLE"
            echo "DIAGNOSTIC_SCRIPT_REACHED_END"
          } | tee /tmp/s3k-diag/runner-and-cache.txt

      - name: Inspect exact source pins without downloading Mathlib artifacts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Verify exact toolchain and lockfile identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/s3k-diag
          {
            echo "OPENAI_MATH_HEAD=$(git rev-parse HEAD)"
            echo "TOOLCHAIN=$(cat lean/lean-toolchain)"
            grep '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lean/lake-manifest.json
            test "$(git rev-parse HEAD)" = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
            test "$(cat lean/lean-toolchain)" = "leanprover/lean4:v4.34.1"
            echo "PINNED_SOURCE_IDENTITIES_VERIFIED__NO_COMPILATION"
          } | tee /tmp/s3k-diag/source-pins.txt

      - name: Publish diagnostic evidence for independent inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s3k-env-diagnostic-v2
          path: /tmp/s3k-diag/
          if-no-files-found: error
          retention-days: 14

  bounded-cache-restore:
    needs: exact-dependency-preflight
    if: ${{ needs.exact-dependency-preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Free disposable runner disk before large dependency restoration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/s3k-cache-restore
          {
            echo "BFSS_S3K_RESTORE_ONLY_SMOKE__NO_THEOREM_COMPILATION"
            echo "BEFORE_DISK"
            df -h /
            echo "BEFORE_MEMORY"
            free -m
            echo "DISPOSABLE_SOFTWARE_SIZES"
            for p in /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift; do
              sudo du -sh "$p" 2>/dev/null || true
            done
          } | tee /tmp/s3k-cache-restore/before.txt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          {
            echo "AFTER_DISK_RECLAMATION"
            df -h /
            echo "AFTER_MEMORY"
            free -m
          } | tee /tmp/s3k-cache-restore/reclaimed.txt

      - name: Check out exact source for the historical cache path
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Restore existing exact 3.46 GiB pinned environment cache only
        id: restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake
            ~/.elan
          key: family270b-bridge-ubuntu-lean4341-openai-adc7f124-deformedcharge-v2

      - name: Verify resulting Lean and Mathlib payload without BFSS compilation
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "CACHE_HIT=${{ steps.restore.outputs.cache-hit }}"
            test "${{ steps.restore.outputs.cache-hit }}" = "true"
            test -s upstream-math/lean/.lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean
            test -x "$HOME/.elan/toolchains/leanprover--lean4---v4.34.1/bin/lean"
            echo "EXACT_PINNED_MATHLIB_OLEAN_PRESENT"
            echo "AFTER_CACHE_RESTORE_DISK"
            df -h /
            echo "AFTER_CACHE_RESTORE_MEMORY"
            free -m
            echo "PINNED_ENV_RESTORE_SMOKE_PASS__NO_BFSS_THEOREM_TESTED"
          } | tee /tmp/s3k-cache-restore/verified.txt

      - name: Publish restore evidence, even after recoverable failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s3k-bounded-cache-restore
          path: /tmp/s3k-cache-restore/
          if-no-files-found: warn
          retention-days: 14
