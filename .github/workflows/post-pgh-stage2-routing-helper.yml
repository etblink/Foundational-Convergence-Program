name: Post-PGH Stage-2 routing reconciliation helper

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/post-pgh-stage2-routing-helper.yml
      - .github/scripts/post_pgh_stage2_routing.py

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply bounded reconciliation
        shell: bash
        run: |
          python .github/scripts/post_pgh_stage2_routing.py
          sed -i 's/[[:space:]]\+$//' audits/POST_PGH_STAGE2_ROUTING_AND_NAVIGATION_RECONCILIATION_0_1_0.md

      - name: Commit bounded result
        shell: bash
        run: |
          git config user.name "Evan Kotler"
          git config user.email "etblink@users.noreply.github.com"
          rm .github/workflows/post-pgh-stage2-routing-helper.yml
          rm .github/scripts/post_pgh_stage2_routing.py
          git add CURRENT_STATE.md audits/POST_PGH_STAGE2_ROUTING_AND_NAVIGATION_RECONCILIATION_0_1_0.md .github/workflows/post-pgh-stage2-routing-helper.yml .github/scripts/post_pgh_stage2_routing.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m "Reconcile routing after PGH Stage-2 taxonomy"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
