name: Post NFC process-matrix provenance reconciliation

on:
  push:
    branches:
      - maintenance/post-nfc-process-matrix-provenance-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/post-nfc-process-matrix-provenance-reconciliation
          fetch-depth: 0

      - name: Bind verified comparison blob and apply reconciliation
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/9d279102f2b7d5024fded2fd58b5a58c304957cf/0e4226a3dfc616554c8829dc677aab5c23128626/g' tools/post_nfc_process_matrix_reconcile.py
          python tools/post_nfc_process_matrix_reconcile.py

      - name: Verify bounded working-tree diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t paths < <(git status --short | sed -E 's/^.. //' | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            '.github/workflows/post-nfc-process-matrix-reconcile.yml'
            'CLAIM_LEDGER.md'
            'CURRENT_STATE.md'
            'FRAMEWORK_REGISTER.md'
            'tools/post_nfc_process_matrix_reconcile.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "$(printf '%s\n' "${paths[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]]; then
            echo 'Unexpected path set after reconciliation' >&2
            exit 1
          fi
          grep -Fq 'CLAIM_LEDGER_DURABLE_ROW_COUNT = 99' CURRENT_STATE.md
          grep -Fq 'NFC_PROCESS_MATRIX_PAIRWISE_E5 = 5' CURRENT_STATE.md
          grep -Fq '## FWPM-001 —' CLAIM_LEDGER.md
          grep -Fq '## FCP-NFCPM-001 —' CLAIM_LEDGER.md
          grep -Fq '0e4226a3dfc616554c8829dc677aab5c23128626' CLAIM_LEDGER.md

      - name: Commit exact reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- CLAIM_LEDGER.md CURRENT_STATE.md FRAMEWORK_REGISTER.md .github/workflows/post-nfc-process-matrix-reconcile.yml tools/post_nfc_process_matrix_reconcile.py
          mapfile -t staged < <(git diff --cached --name-only | sort)
          printf '%s\n' "${staged[@]}"
          expected=(
            '.github/workflows/post-nfc-process-matrix-reconcile.yml'
            'CLAIM_LEDGER.md'
            'CURRENT_STATE.md'
            'FRAMEWORK_REGISTER.md'
            'tools/post_nfc_process_matrix_reconcile.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "$(printf '%s\n' "${staged[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]]; then
            echo 'Unexpected staged path set' >&2
            exit 1
          fi
          git commit -m 'Reconcile process-matrix durable provenance'
          git push origin HEAD:maintenance/post-nfc-process-matrix-provenance-reconciliation
