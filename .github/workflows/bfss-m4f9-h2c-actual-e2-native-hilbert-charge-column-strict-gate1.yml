      - name: Fail-closed original qualified graph and Hamiltonian source .olean ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.parent.outputs.cache-hit }}" = true || { echo M4F9_H2C_EXACT_H2B_PARENT_CACHE_MISSING; exit 1; }
          base=upstream-math/lean/.lake/build/lib/lean
          for stem in FCPM4F9H2BPhysicalHilbertE2GraphRebase FCPM4F9H2APhysicalHilbertOutputUnitary FCPM4F8OriginalNamedFullPhysicalGraphDE4 FCPM4F8IndependentActualE2FullPhysicalGraphRebaseDE2 SU2BFSSPhysicalDomainL6H5E8BHOriginalHistoricalPairedHamiltonianEqualityProbe; do
            test -s "$base/$stem.olean" || { echo "M4F9_H2C_PARENT_OLEAN_MISSING=$stem"; exit 1; }
          done
          echo M4F9_H2C_ALL_QUALIFIED_H2B_H2A_H1_DE4_ANCESTRY_PASS

      - name: Fresh native PiLp2 true independent E2 partial charge three-root strict compilation
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=FCPM4F9H2CActualE2NativeHilbertChargeColumn
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          timeout 240s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-m4f9-h2c-gate1/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/bfss-m4f9-h2c-gate1/FCPM4F9H2CActualE2NativeHilbertChargeColumn.log').read_text()
          roots=['independentActualE2HilbertPhysicalGraph_vertical',
                 'independentActualE2NativeHilbertChargeColumn',
                 'independentActualE2NativeHilbertChargeColumn_graph_eq']
          ns='FCP.M4F9H2CActualE2NativeHilbertChargeColumn.'
          reports=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          got={n:{v.strip() for v in ax.split(',') if v.strip()} for n,ax in reports}
          assert len(reports)==len(got)==3 and set(got)=={ns+r for r in roots},('H2C_WRONG_ROOTS',reports)
          for n,axioms in got.items():
              assert axioms<={'propext','Classical.choice','Quot.sound'},(n,axioms)
          known={'belyi','formal-schemes','elliptic-curves',
                 'tempered-fundamental-groups','oka','orbicurve-cores',
                 'pi1','heights','genl','tate-curves-theta','iut'}
          checked=[]
          for line in s.splitlines():
              m=re.fullmatch(r"warning: ([a-z0-9-]+): repository '([^']+)' has local changes",line)
              if m:
                  package,path=m.groups()
                  if package in known and path.endswith('/upstream-math/lean/.lake/packages/'+package):
                      continue
              checked.append(line)
          checked='\n'.join(checked)
          assert not any(x in checked for x in ('sorryAx','error:','warning:','unknownIdentifier')),checked[-5000:]
          print('M4F9_H2C_ACTUAL_NATIVE_HILBERT_E2_PARTIAL_CHARGE_THREE_ROOT_STRICT_PASS')
          PY

