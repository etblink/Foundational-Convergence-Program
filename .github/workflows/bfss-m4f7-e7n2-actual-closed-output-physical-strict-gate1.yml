            'FCPM4F7OpaqueLiteralGraphInterfaceE7D.lean':'8f8545753cb4643d62e06c075e86222d59a2e4d3',
            'FCPM4F7IndependentPhysicalInputCutOperatorE2.lean':'32e6535fc9c1e65d153d09dd434ac8f271a5cb86'
          }
          for name,sha in pins.items():
            path=str(d/name)
            assert subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()==sha,(name,'TREE')
            assert subprocess.check_output(['git','hash-object','--no-filters',path],text=True).strip()==sha,(name,'WORKING')
          src=(d/'FCPM4F7IndependentActualClosedPhysicalOutputsE7N2.lean').read_text()
          assert src.startswith('import FCPM4F7IndependentActualClosedGraphNamedBridgeE7N1\n')
          assert re.findall(r'^namespace (\S+)',src,re.M)==['FCP.M4F7IndependentActualClosedPhysicalOutputsE7N2']
          root='independentPhysicalInputCutClosedChargeColumn_graph_all_outputs_physical'
          assert re.findall(r'^theorem (\S+)',src,re.M)==[root]
          assert re.findall(r'^#print axioms (\S+)',src,re.M)==[root]
          code=src.split('noncomputable section',1)[1]
          for fragment in ('FCP.M4F7IndependentActualClosedGraphNamedBridgeE7N1.independentPhysicalInputCutClosedChargeColumn_graph_eq_named_literal','FCP.M4F7IndependentLiteralClosedPhysicalOutputsE7M.independentLiteralRestrictedClosedGraph_subset_allPhysicalOutputs','independentAllSixteenOutputsPhysicalSet'):
            assert fragment in code,fragment
          assert not re.search(r'(?m)^[ \t]*(?:sorry|admit|axiom)\b|\bsorryAx\b',code)
          assert 'deformedModelGraph' not in code
          print('E7N2_GATE1_ACTUAL_E2_CLOSED_OPERATOR_ORIGINAL_SOURCE_PASS')
          PY

      - name: Fresh strict E7N2 actual E2 closed operator all sixteen physical outputs
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=FCPM4F7IndependentActualClosedPhysicalOutputsE7N2
          cp "$GITHUB_WORKSPACE/experiments/openai-math-su2-physical-domain/$stem.lean" "upstream-math/lean/$stem.lean"
          cd upstream-math/lean
          mkdir -p .lake/build/lib/lean
          /usr/bin/time -f 'E7N2_RESOURCE_TIME %e CPU %P MAX_RSS_KB %M' -o "/tmp/bfss-m4f7-e7n2-actual-closed-output-physical-strict-gate1/$stem.resource" \
            timeout --signal=TERM --kill-after=5s 105s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" >"/tmp/bfss-m4f7-e7n2-actual-closed-output-physical-strict-gate1/$stem.log" 2>&1 || {
              ec=$?
              echo E7N2_GATE1_FRESH_LEAN_EXIT=$ec
              grep -n 'error:' "/tmp/bfss-m4f7-e7n2-actual-closed-output-physical-strict-gate1/$stem.log" | head -n 24 || true
              tail -n 95 "/tmp/bfss-m4f7-e7n2-actual-closed-output-physical-strict-gate1/$stem.log"
              cat "/tmp/bfss-m4f7-e7n2-actual-closed-output-physical-strict-gate1/$stem.resource" || true
              exit "$ec"
            }
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/bfss-m4f7-e7n2-actual-closed-output-physical-strict-gate1/FCPM4F7IndependentActualClosedPhysicalOutputsE7N2.log').read_text()
          target='FCP.M4F7IndependentActualClosedPhysicalOutputsE7N2.independentPhysicalInputCutClosedChargeColumn_graph_all_outputs_physical'
          r=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",t)
          ax={n:{x.strip() for x in a.split(',') if x.strip()} for n,a in r}
          assert len(r)==len(ax)==1,('ONE_EXACT_THEOREM',r)
          assert set(ax)=={target},('QUALIFIED_REAL_E2_GRAPH_NAME',ax)
          assert all(v <= {'propext','Classical.choice','Quot.sound'} for v in ax.values()),('UNAUTHORIZED_AXIOM',ax)
          assert 'error:' not in t and 'sorryAx' not in t
          warns=[x for x in t.splitlines() if 'warning:' in x and not re.fullmatch(r"warning: [A-Za-z0-9_-]+: repository '[^']+' has local changes",x)]
          assert not warns,('UNEXPECTED_LEAN_WARNING',warns)
          print('E7N2_GATE1_ACTUAL_INDEPENDENT_CLOSED_OPERATOR_ALL_SIXTEEN_OUTPUTS_PHYSICAL_PRINCIPAL_STRICT_PASS',ax)
          PY
          cat "/tmp/bfss-m4f7-e7n2-actual-closed-output-physical-strict-gate1/$stem.resource"

