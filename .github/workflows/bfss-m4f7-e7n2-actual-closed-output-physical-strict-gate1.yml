            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentActualClosedGraphNamedBridgeE7N1.olean
          key: bfss-fcp-m4f7-e7n1-actual-e2-named-graph-0a38b376-gate1-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Verify immutable actual E2 E7N2 statement and qualified E7N1 parents
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.e7n1cache.outputs.cache-hit }}" = true || { echo E7N2_GATE1_QUALIFIED_E7N1_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in OAI/MathematicalPhysics/BFSS/Core OAI/MathematicalPhysics/BFSS/GaugeCore FCPM4F7IndependentPhysicalInputCutOperatorE2 FCPM4F7IndependentLiteralRestrictedGraphBridgeE3 FCPM4F7OpaqueLiteralGraphInterfaceE7D FCPM4F7IndependentLiteralClosedPhysicalOutputsE7M FCPM4F7IndependentActualClosedGraphNamedBridgeE7N1 FCPM4F7IndependentPhysicalOutputPredicateE7I; do
