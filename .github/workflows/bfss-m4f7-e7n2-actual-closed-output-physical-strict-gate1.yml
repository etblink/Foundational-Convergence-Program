          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re
          d=Path('experiments/openai-math-su2-physical-domain')
          pins={
            'FCPM4F7IndependentActualClosedPhysicalOutputsE7N2.lean':'50a6253b8b219c7e7c21417bc17682f8f0f34b49',
            'FCPM4F7IndependentActualClosedGraphNamedBridgeE7N1.lean':'0a38b3768bb1422cfc4a64ab4e89fd9856a32a85',
