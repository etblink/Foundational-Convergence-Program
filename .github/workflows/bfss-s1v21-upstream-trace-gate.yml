name: BFSS S1V21 Original Upstream Adjoint Trace Conditional Gate

on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v21-upstream-trace-gate.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v21-upstream-trace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  genuine-upstream-API:
    runs-on: ubuntu-latest
    timeout-minutes: 46
    steps:
      - name: Checkout isolated source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout pinned original OAI/Mathlib library
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Enforce immutable original Pauli/Spin source and candidate pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v21
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          j=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in j['packages'] if p['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.lean)" = 22f3101b243a7b7857d9597b547322174d9281c8
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V1StandaloneSpin48AllVectorProbe.lean)" = 1adb9000a3bbad937b1e2fc3bd4bd486c777fdd7
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V4TwoDisjointSpinRotorsCommuteProbe.lean)" = debd4f447d075a2f65817860d156fee8061ce024
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V5ConcreteSixteenSourceColorBlocksProbe.lean)" = 6d15a3a76625b3677f132c544f71e5d5eb1dc93c
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V6ConcreteSource48ColorAxisOrthogonalityProbe.lean)" = 4ae8b38d5601b8c57f09e94c523beb9b4598dcb1
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V8ConcreteSource48SixteenSpinRotorsProbe.lean)" = e22fb0fd376112d76ed1e79c4decd5eb65008465
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V12SourceLiteralPauliQuarterSpinSignProbe.lean)" = 20b8708eea4c9c3ec30e3b3c47eea66dcbd19e93
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2ColorCrossProbe.lean)" = 399e9380ba1c679dc173a9dec0ac21e09d7757fd
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V21OriginalUpstreamAdjointQuarterConditionalProbe.lean)" = 5b6059104dda78fbcd1cc073f8f51a986489a50a
          echo EXACT_ORIGINAL_API_AND_STANDALONE_SOURCE_PINS_VERIFIED

      - name: Free disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Install immutable toolchain and pinned Mathlib
        shell: bash
        timeout-minutes: 23
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v21/toolchain.log; then
              ok=true; break
            fi
            echo PINNED_TOOLCHAIN_TLS_RETRY_$attempt | tee -a /tmp/bfss-s1v21/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo PINNED_TOOLCHAIN_INSTALL_FAILED; exit 1; }
          cd upstream-math/lean
          timeout 1050s lake exe cache get 2>&1 | tee /tmp/bfss-s1v21/mathlib-cache.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo ORIGINAL_PINNED_LEAN_MATHLIB_READY

      - name: Restore genuine accepted upstream OAI GaugeCore and Fock import roots
        id: fock
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2Fermion*.olean
          key: bfss-s1v19-isolated-fock-base-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed unless original GaugeCore source .olean is present
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.fock.outputs.cache-hit }}" = true || { echo PINNED_ORIGINAL_OAI_CACHE_MISSING; exit 1; }
          test -s upstream-math/lean/.lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GaugeCore.olean
          echo ORIGINAL_UPSTREAM_ADJOINTCOEFFICIENT_API_AVAILABLE

      - name: Build original OAI color prerequisites without surrogate basis
        shell: bash
        timeout-minutes: 13
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          timeout 720s lake build OAI.MathematicalPhysics.BFSS.PotentialBasis OAI.Analysis.CharacterCriterion.Pauli 2>&1 | tee /tmp/bfss-s1v21/upstream-color-deps.log
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/PotentialBasis.olean
          test -s .lake/build/lib/lean/OAI/Analysis/CharacterCriterion/Pauli.olean
          echo ACTUAL_ORIGINAL_PAULI_AND_POTENTIAL_IMPORTS_COMPILED

      - name: Recompile exact accepted source geometry through S1V12 and original ColorCross
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          for stem in SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe SU2BFSSPhysicalDomainS1V1StandaloneSpin48AllVectorProbe SU2BFSSPhysicalDomainS1V4TwoDisjointSpinRotorsCommuteProbe SU2BFSSPhysicalDomainS1V5ConcreteSixteenSourceColorBlocksProbe SU2BFSSPhysicalDomainS1V6ConcreteSource48ColorAxisOrthogonalityProbe SU2BFSSPhysicalDomainS1V8ConcreteSource48SixteenSpinRotorsProbe SU2BFSSPhysicalDomainS1V12SourceLiteralPauliQuarterSpinSignProbe; do
            cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
            timeout 100s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v21/$stem.log"
            test -s ".lake/build/lib/lean/$stem.olean"
            if grep -E 'error:|sorryAx' "/tmp/bfss-s1v21/$stem.log"; then echo ACCEPTED_SOURCE_CHANGED; exit 1; fi
          done
          cp ../../experiments/openai-math-su2-concrete-potential/SU2ColorCrossProbe.lean .
          timeout 150s lake env lean -o .lake/build/lib/lean/SU2ColorCrossProbe.olean SU2ColorCrossProbe.lean 2>&1 | tee /tmp/bfss-s1v21/SU2ColorCrossProbe.log
          test -s .lake/build/lib/lean/SU2ColorCrossProbe.olean
          if grep -E 'error:|sorryAx' /tmp/bfss-s1v21/SU2ColorCrossProbe.log; then echo SOURCE_ORIGINAL_PAULI_CHANGED; exit 1; fi
          echo EXACT_SOURCE_PAULI_AND_SPIN_PREREQUISITES_RECOMPILED

      - name: Strictly compile original-upstream OAI adjointCoefficient positive-i source bridge
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=SU2BFSSPhysicalDomainS1V21OriginalUpstreamAdjointQuarterConditionalProbe
          cp ../../experiments/openai-math-su2-physical-domain/$stem.lean .
          timeout 220s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v21/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          stem='SU2BFSSPhysicalDomainS1V21OriginalUpstreamAdjointQuarterConditionalProbe'
          s=pathlib.Path('/tmp/bfss-s1v21',stem+'.log').read_text()
          roots=['original_normalizedPauli_eq_source_literal',
                 'original_normalizedPauli_zquarter_sign',
                 'original_upstream_adjointCoefficient_of_pinned_quarter']
          hits=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          got={k:{x.strip() for x in v.split(',') if x.strip()} for k,v in hits}
          assert len(hits)==len(roots),(hits,roots)
          for n in roots:
            k='FCP.BFSSS1V21.'+n
            assert k in got and got[k]<={'propext','Classical.choice','Quot.sound'},(k,got)
          assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,s[-4000:]
          print('S1V21_GENUINE_UPSTREAM_OAI_ADJOINTCOEFFICIENT_PLUS_I_QUARTER_3_CONDITIONAL_ROOTS_PASS')
          PY

      - name: Preserve original-source compiler failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v21-upstream-original-${{ github.run_id }}
          path: /tmp/bfss-s1v21/
          if-no-files-found: warn
          retention-days: 14
