name: BFSS Form Original Gamma Spinor Entry Contraction Strict Gate 110

# Source-exact real symmetric gamma entry contraction of nine original directions to 8 times original gamma, without manuscript B(x) leap.
# Direct Lean 4.34.1 compilation with pinned Core / MassiveCoercivity / ColorMatrices ancestry,
# fresh source/S4B3 oleans and exact axiom audit; no E3B/E3C sixfold ancestry.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-form-original-gamma-spinor-entry-contraction-strict-gate110.yml
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B22OriginalGammaSpinorEntryContractionProbe.lean
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-form-original-gamma-spinor-entry-contraction-gate110-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-source-bracket-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 35
