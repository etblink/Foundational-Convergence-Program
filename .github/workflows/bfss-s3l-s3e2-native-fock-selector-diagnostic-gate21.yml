          s=pathlib.Path("/tmp/bfss-s3e2-native-fock-gate21/lean.log").read_text()
          prefix="FCP.BFSSSU2PhysicalDomainS3E2NativeFockSelectorDiagnosticGate20."
          expected=[prefix+"actualFockCLM_smul_zero",prefix+"actualFockCLM_selector"]
          reports=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          assert [n for n,a in reports]==expected,("PRINT_AXIOMS_MISSING",reports)
          for n,raw in reports:
              axioms={a.strip() for a in raw.split(",") if a.strip()}
              assert axioms <= {"propext","Classical.choice","Quot.sound"},("UNAUTHORIZED_AXIOM",n,axioms)
