name: BFSS S3E2 Native Fock Selector Diagnostic Gate 21

# Narrow diagnostic following six distinct failed S3E2 attempts.
# Gate20 red only on four deprecated constants; V2 is EXACTLY those four changes. Still no accepted principal root.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s3l-s3e2-native-fock-selector-diagnostic-gate21.yml
permissions:
  contents: read
concurrency:
  group: bfss-s3e2-native-fock-diagnostic-21-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-fock-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - name: Checkout research proof and frozen original BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout immutable BFSS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: Freeze original source, exact helper and ancestry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s3e2-native-fock-gate21
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json,pathlib,re,subprocess
          m=json.loads(pathlib.Path("upstream-math/lean/lake-manifest.json").read_text())
          assert next(p["rev"] for p in m["packages"] if p["name"]=="mathlib") == "d13f23b723b8a846827a245b89c10fc7d3f11612"
          p=pathlib.Path("experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3E2NativeFockSelectorDiagnosticGate20V2.lean")
          sha=subprocess.check_output(["git","rev-parse","HEAD:"+str(p)],text=True).strip()
          assert sha=="3c31ad597a9f6f5dc52ac6a5276e78ebad82361e",("GATE21_DIAGNOSTIC_SOURCE_CHANGED",sha)
          assert subprocess.check_output(["git","hash-object","--no-filters",str(p)],text=True).strip()==sha
          s=p.read_text()
          base=pathlib.Path("experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3E2NativeFockSelectorDiagnosticGate20.lean")
          assert subprocess.check_output(["git","rev-parse","HEAD:"+str(base)],text=True).strip()=="3c0f7804209b4b09f348536246209933785c3bd9"
          prior=base.read_text()
          updates=[("ContinuousLinearMap.smul_apply","smul_apply"),("ContinuousLinearMap.zero_apply","zero_apply"),("rw [if_neg hβ]","rw [ite_eq_right hβ]"),("rw [if_pos rfl]","rw [ite_eq_left rfl]")]
          for old,new in updates:
              assert prior.count(old)==1,("EXPECTED_ONE_DEPRECATED_ALIAS",old)
              prior=prior.replace(old,new)
          assert s==prior,"GATE21_DIFFERENCE_NOT_EXACTLY_FOUR_COMPILER_PRESCRIBED_ALIASES"
          assert s.startswith("import SU2BFSSPhysicalDomainS3E1ActualSameColorFermionicBilinearCommSourceProbe")
          assert re.findall(r"(?m)^theorem (\w+)",s)==["actualFockCLM_smul_zero","actualFockCLM_selector"]
          assert re.findall(r"(?m)^#print axioms (\S+)",s)==["actualFockCLM_smul_zero","actualFockCLM_selector"]
          assert "Fermion 2 →L[ℂ] Fermion 2" in s and "Finset.sum_eq_single" in s
          assert not re.search(r"(?m)^[ \t]*(?:axiom|sorry|admit)(?:\s|$)|\bsorryAx\b",s)
          parent="experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3E1ActualSameColorFermionicBilinearCommSourceProbe.lean"
          assert subprocess.check_output(["git","rev-parse","HEAD:"+parent],text=True).strip()=="4b5f4f9e1ba4a0277062d7e98f0d749b38ba4453"
          print("GATE21_SOURCE_PINNED "+sha)
          print("GATE21_SCOPE_DIAGNOSTIC_ZERO_PRINCIPAL_ROOTS")
          PY
      - name: Reclaim runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
      - name: Restore frozen Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true
          cd upstream-math/lean
          timeout 1080s lake exe cache get > /tmp/bfss-s3e2-native-fock-gate21/mathlib.log 2>&1 || {
            tail -n 100 /tmp/bfss-s3e2-native-fock-gate21/mathlib.log
            exit 1
          }
