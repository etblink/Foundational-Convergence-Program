        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS3E2NativeFockSelectorDiagnosticGate20
          cp "experiments/openai-math-su2-physical-domain/recovery/${stem}V2.lean" "upstream-math/lean/$stem.lean"
          cd upstream-math/lean
          timeout --signal=TERM --kill-after=5s 260s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee /tmp/bfss-s3e2-native-fock-gate21/lean.log
