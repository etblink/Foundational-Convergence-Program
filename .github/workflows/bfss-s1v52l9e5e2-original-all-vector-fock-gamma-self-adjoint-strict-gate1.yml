      - name: Restore exact original Pauli transitive OAI modules from pinned upstream source
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          for stem in \
            OAI/MathematicalPhysics/BFSS/GammaWords \
            OAI/MathematicalPhysics/BFSS/GammaIdentity \
            OAI/MathematicalPhysics/BFSS/MassIdentity \
            OAI/MathematicalPhysics/BFSS/CliffordSymbols \
            OAI/MathematicalPhysics/BFSS/PotentialBasis \
            OAI/Analysis/CharacterCriterion/Definitions \
            OAI/Analysis/CharacterCriterion/Pauli
          do
            mkdir -p ".lake/build/lib/lean/$(dirname "$stem")"
            if test -s ".lake/build/lib/lean/$stem.olean"; then
              echo "S1V52L9E5E2_GATE2_PINNED_UPSTREAM_ALREADY_CACHED=$stem"
            else
              timeout 360s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee -a /tmp/bfss-s1v52l9e5e2/qualified-original-oai-dependencies.log
              test -s ".lake/build/lib/lean/$stem.olean" || { echo "S1V52L9E5E2_GATE2_UPSTREAM_OLEAN_MISSING=$stem"; exit 1; }
              echo "S1V52L9E5E2_GATE2_PINNED_UPSTREAM_SOURCE_COMPILED=$stem"
            fi
          done

      - name: Compile exact original source normalized Pauli foundation (pinned)
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=SU2ColorCrossProbe
          cp "../../experiments/openai-math-su2-concrete-potential/$stem.lean" "$stem.lean"
          timeout 630s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v52l9e5e2/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean" || { echo S1V52L9E5E2_ORIGINAL_PAULI_OLEAN_MISSING; exit 1; }
          echo S1V52L9E5E2_EXACT_PINNED_PAULI_SOURCE_READY

      - name: Compile exact original source Spin48 real-vector action dependency closure if missing
        shell: bash
        timeout-minutes: 26
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          # The native L9D1 cache may already contain all genuine S1V31
          # source-real 48-vector foundations. Never assume so: restore
          # missing original FCP imports in their real topological order.
          python3 - <<'PY'
          import pathlib
          sources={}
          for directory in ("openai-math-su2-physical-domain","openai-math-su2-concrete-potential"):
            for p in (pathlib.Path("experiments")/directory).glob("SU2*.lean"):
              assert p.stem not in sources,("Duplicate source module",p.stem)
              sources[p.stem]=p
          marked=set()
          visiting=set()
          order=[]
          def visit(stem):
            if stem in marked:return
            assert stem not in visiting,("Source dependency cycle",stem)
            assert stem in sources,("Missing actual FCP module",stem)
            visiting.add(stem)
            for line in sources[stem].read_text().splitlines():
              if line.startswith("import "):
                for dep in line[7:].split():
                  if dep.startswith("SU2"):visit(dep)
            visiting.remove(stem)
            marked.add(stem)
            order.append(stem)
          visit("SU2BFSSPhysicalDomainS1V52L9D6OriginalNativeSixteenSpin48SourceAxisActionProbe")
          visit("SU2BFSSPhysicalDomainS1V48OriginalGaugeSpin48ProjectionFiberProbe")
          visit("SU2BFSSPhysicalDomainS1V52L9D8OriginalFockMajorana48SourceBasisMulVecProbe")
          out=pathlib.Path("/tmp/bfss-s1v52l9e5e2/source-spin48-vector-import-order.txt")
          out.write_text("\n".join(order)+"\n")
          print("S1V52L9E5E2_ACTUAL_ORIGINAL_REAL_VECTOR_DAG="+",".join(order))
          PY
          while IFS= read -r stem; do
            relative=$(find experiments/openai-math-su2-concrete-potential experiments/openai-math-su2-physical-domain -maxdepth 1 -name "$stem.lean" -print -quit)
            test -n "$relative" && test -s "$relative" || { echo "S1V52L9E5E2_SOURCE_DEPENDENCY_MISSING=$stem"; exit 1; }
            cp "$relative" "upstream-math/lean/$stem.lean"
            cd upstream-math/lean
            if test -s ".lake/build/lib/lean/$stem.olean"; then
              echo "S1V52L9E5E2_QUALIFIED_ORIGINAL_DEPENDENCY_REUSED=$stem"
            else
              timeout 420s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v52l9e5e2/$stem.log"
              test -s ".lake/build/lib/lean/$stem.olean" || { echo "S1V52L9E5E2_ACTUAL_ORIGINAL_OLEAN_MISSING=$stem"; exit 1; }
              if grep -Eq "(sorryAx|error:|unknownIdentifier)" "/tmp/bfss-s1v52l9e5e2/$stem.log"; then
                echo "S1V52L9E5E2_ORIGINAL_SOURCE_COMPILE_REJECTED=$stem"; exit 1
              fi
              echo "S1V52L9E5E2_ACTUAL_ORIGINAL_SOURCE_COMPILED=$stem"
            fi
            cd ../..
          done < /tmp/bfss-s1v52l9e5e2/source-spin48-vector-import-order.txt
          test -s upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainS1V30Real48CliffordGeneratorInjectiveViaExteriorProbe.olean
          test -s upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainS1V31CanonicalAllSpin48RealVectorActionProbe.olean
          test -s upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainS1V32AllSpin48CanonicalVectorLinearGroupActionProbe.olean
          echo S1V52L9E5E2_GENUINE_SOURCE_REAL_VECTOR_IMPORT_CLOSURE_READY

      - name: Compile exact original all real 48-vector Fock gamma self-adjointness
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          mkdir -p .lake/build/lib/lean
          stem=SU2BFSSPhysicalDomainS1V52L9E5E2OriginalAllRealVectorFockGammaSelfAdjointProbe
          cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
          timeout 780s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v52l9e5e2/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean" || { echo S1V52L9E5E2_FRESH_SOURCE_OLEAN_MISSING; exit 1; }
          python3 - <<'PY'
          import pathlib,re
          stem="SU2BFSSPhysicalDomainS1V52L9E5E2OriginalAllRealVectorFockGammaSelfAdjointProbe"
          ns="FCP.BFSSS1V52L9E5E2"
          expected=[
            "originalFockGammaRealLinear_selfAdjoint"]
          src=pathlib.Path(stem+".lean").read_text()
          log=pathlib.Path("/tmp/bfss-s1v52l9e5e2",stem+".log").read_text()
          assert re.findall(r'^namespace (\S+)',src,re.M)==[ns]
          assert re.findall(r'^#print axioms (\S+)',src,re.M)==expected
          rr=re.findall(r"'("+re.escape(ns)+r"\.[^\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          found={k:{x.strip() for x in v.split(",") if x.strip()} for k,v in rr}
          assert len(rr)==len(found)==len(expected),rr
          allowed={"propext","Classical.choice","Quot.sound"}
          for name in expected:
            key=ns+"."+name
            assert key in found and found[key]<=allowed,(key,found)
          assert "sorryAx" not in log and "error:" not in log and "unknownIdentifier" not in log,log[-9000:]
          print("S1V52L9E5E2_ORIGINAL_ALL_VECTOR_FOCK_GAMMA_SELFADJOINT_1_ROOT_KERNEL_PASS")
          PY

