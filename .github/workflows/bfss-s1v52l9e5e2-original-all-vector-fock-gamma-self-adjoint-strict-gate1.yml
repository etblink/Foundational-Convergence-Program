name: BFSS S1V52L9E5E2 Original All Vector Fock Gamma Self Adjoint Strict Gate 1

# Deliberately branch-isolated and single-shot. Only the workflow file
# triggers a push gate; source and audit commits do NOT automatically run.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s1v52l9e5e2-original-all-vector-fock-gamma-self-adjoint-strict-gate1.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v52l9e5e2-original-fock-clifford-algebra-lift-gate2-${{ github.ref }}
  cancel-in-progress: false

