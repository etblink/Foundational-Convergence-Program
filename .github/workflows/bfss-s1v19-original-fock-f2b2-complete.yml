name: BFSS S1V19 Original Fock F2B2 Complete CAR Strict Gate

on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v19-original-fock-f2b2-complete.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v19-fock-f2b2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-f2b2-CAR:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout original isolated research source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout immutable independent original OAI math source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: Enforce exact original six CAR sources and pinned Lake environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v19-f2b2
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          d=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in d['packages'] if p['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2FermionF2B2ImagProbe.lean)" = c2b0f0dd651fd9c8786be475adf531aed1f2f6f4
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2FermionF2B2MixedProbe.lean)" = 3da7fc2293313a9db570f74e7ba6636f0719684c
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2FermionF2B2MixedDiagProbe.lean)" = 5268e6e81614e12a98a19090c563be39db224ea8
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2FermionF2B2MixedAllProbe.lean)" = 7afb106bc5f5af98a973fcd6a4ee61b99dbcc036
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2FermionF2B2IndexedProbe.lean)" = a61f2e3080a60b18a9298336a79643b2d25359a2
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2FermionF2B2ThetaProbe.lean)" = 04acfa41a3ab0183bb9038549c0ef8c6fba68c23
          echo PINNED_ORIGINAL_F2B2_6_SOURCES_VERIFIED

      - name: Reclaim disposable runner disk capacity
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore exact original Lean and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v19-f2b2/toolchain.log; then
              ok=true; break
            fi
            echo PINNED_LEAN_TLS_RETRY_$attempt | tee -a /tmp/bfss-s1v19-f2b2/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo PINNED_TOOLCHAIN_INSTALL_FAILED; exit 1; }
          cd upstream-math/lean
          timeout 1070s lake exe cache get 2>&1 | tee /tmp/bfss-s1v19-f2b2/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo EXACT_ORIGINAL_LEAN_MATHLIB_READY

      - name: Restore accepted original 13-root Fock CAR base and OAI modules
        id: fock
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2Fermion*.olean
          key: bfss-s1v19-isolated-fock-base-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed unless the exact accepted base is restored
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.fock.outputs.cache-hit }}" = true || { echo ORIGINAL_FOCK_BASE_CACHE_MISSING; exit 1; }
          for stem in SU2FermionFockProbe SU2FermionF2Probe SU2FermionF2BProbe SU2FermionF2B2Probe; do
            test -s "upstream-math/lean/.lake/build/lib/lean/$stem.olean"
          done
          test -s upstream-math/lean/.lake/build/lib/lean/OAI/MathematicalPhysics/ContinuumCoulomb/ManyBody/FockNorm.olean
          echo ACCEPTED_ORIGINAL_FOCK_BASE_4_MODULES_RESTORED

      - name: Strictly qualify six sequential original 48-Majorana CAR lemmas
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          for stem in SU2FermionF2B2ImagProbe SU2FermionF2B2MixedProbe SU2FermionF2B2MixedDiagProbe SU2FermionF2B2MixedAllProbe SU2FermionF2B2IndexedProbe SU2FermionF2B2ThetaProbe; do
            cp "../../experiments/openai-math-su2-concrete-potential/$stem.lean" "$stem.lean"
            timeout 105s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v19-f2b2/$stem.log"
            test -s ".lake/build/lib/lean/$stem.olean" || { echo ORIGINAL_F2B2_OLEAN_MISSING_$stem; exit 1; }
          done
          python3 - <<'PY'
          import pathlib,re
          roots={
            'SU2FermionF2B2ImagProbe':['majorana1_car_all'],
            'SU2FermionF2B2MixedProbe':['majorana01_car_ne'],
            'SU2FermionF2B2MixedDiagProbe':['majorana01_car_self'],
            'SU2FermionF2B2MixedAllProbe':['majorana01_car_all'],
            'SU2FermionF2B2IndexedProbe':['majoranaCandidate_car'],
            'SU2FermionF2B2ThetaProbe':['thetaCandidate_CAR']
          }
          pattern=r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
          for stem,rr in roots.items():
            s=pathlib.Path('/tmp/bfss-s1v19-f2b2',stem+'.log').read_text()
            hits=re.findall(pattern,s)
            got={k:{v.strip() for v in vals.split(',') if v.strip()} for k,vals in hits}
            assert len(hits)==len(rr),(stem,hits,rr)
            for n in rr:
              matches=[(name,axioms) for name,axioms in got.items() if name.split('.')[-1]==n]
              assert len(matches)==1 and matches[0][1]<={'propext','Classical.choice','Quot.sound'},(stem,n,matches)
            assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,(stem,s[-4500:])
            print(stem,'ORIGINAL_F2B2_CAR_AXIOM_CLEAN_PASS',len(rr))
          print('ORIGINAL_FOCK_F2B2_IMAG_MIXED_ALL_INDEXED_THETA_6_ROOTS_KERNEL_PASS')
          PY

      - name: Save strictly qualified extended original Fock OAI and CAR roots
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2Fermion*.olean
          key: bfss-s1v19-isolated-f2b2-complete-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve compiler first-causal diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v19-f2b2-${{ github.run_id }}
          path: /tmp/bfss-s1v19-f2b2/
          if-no-files-found: warn
          retention-days: 14
