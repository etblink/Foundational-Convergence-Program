name: BFSS Form Source Gamma Contraction Strict Gate 89

# Small original-source gamma contraction, NOT source fermion-field B equality.
# Direct Lean 4.34.1 compilation with pinned Core / GammaWords ancestry,
# fresh source oleans and exact axiom audit; no E3B/E3C sixfold ancestry.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-form-source-gamma-contraction-strict-gate89.yml
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B1OriginalGammaFermionContractionProbe.lean
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-form-source-gamma-gate89-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-source-gamma-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pinned research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout immutable original BFSS Lean mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: Verify exact source identities, source blobs and manifest pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream-math rev-parse HEAD)" = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
          test "$(cat upstream-math/lean/lean-toolchain)" = "leanprover/lean4:v4.34.1"
          test "$(git -C upstream-math rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Core.lean)" = "9882359ced78b0a3bd7e2f057974bd0a031b3e60"
          test "$(git -C upstream-math rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/GammaWords.lean)" = "d12051e70de679f5458dbd456667a32c7b407ce4"
          test "$(git rev-parse HEAD:experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B1OriginalGammaFermionContractionProbe.lean)" = "bbeae5475fd4be6e9a587dafb67f28c552fd7df9"
          test "$(git hash-object --no-filters experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B1OriginalGammaFermionContractionProbe.lean)" = "aec9bb5415299cf8a0b13be238f7a8aa2a7cc324"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("upstream-math/lean")
          manifest=json.loads((root/"lake-manifest.json").read_text())
          assert next(p["rev"] for p in manifest["packages"] if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          src=Path("experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B1OriginalGammaFermionContractionProbe.lean").read_text()
          assert src.count("\ntheorem ")==2 and src.count("\n#print axioms ")==2
          assert "sourceGammaTwo_contract" in src and "originalSourceGammaTwo_contract" in src
          assert "gammaTwo_alt G hG" in src and "M.gamma_clifford" in src
          assert not any(line.lstrip().startswith(("sorry", "admit", "axiom ")) for line in src.splitlines())
          print("GATE89_ORIGINAL_SOURCE_AND_PROOF_IMMUTABILITY_PASS")
          PY
      - name: Validate self-test and Gate89 YAML before heavy Lean work
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/bfss-gate89-venv
          /tmp/bfss-gate89-venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: PyYAML==6.0.3
          /tmp/bfss-gate89-venv/bin/python tools/bfss_gate_workflow_preflight.py --self-test
          /tmp/bfss-gate89-venv/bin/python tools/bfss_gate_workflow_preflight.py .github/workflows/bfss-form-source-gamma-contraction-strict-gate89.yml
      - name: Restore source pinned Lean and mathlib binary cache
        shell: bash
        timeout-minutes: 19
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-gate89
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true
          cd upstream-math/lean
          timeout 920s lake exe cache get > /tmp/bfss-gate89/mathlib-cache.log 2>&1 || {
            tail -n 70 /tmp/bfss-gate89/mathlib-cache.log; exit 1;
          }
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo GATE89_FROZEN_TOOLCHAIN_AND_MATHLIB_PASS
      - name: Freshly compile exactly two original BFSS source ancestor modules and candidate
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p /tmp/bfss-gate89
          python3 - <<'PY'
          import pathlib,subprocess,re
          work=pathlib.Path("upstream-math/lean")
          lib=work/".lake/build/lib/lean"
          for mod in ["OAI.MathematicalPhysics.BFSS.Core","OAI.MathematicalPhysics.BFSS.GammaWords"]:
              rel=mod.replace(".","/")
              obj=lib/(rel+".olean")
              obj.parent.mkdir(parents=True,exist_ok=True)
              if obj.exists(): obj.unlink()  # fresh source compile, never foreign object
              path=rel+".lean"
              log=pathlib.Path("/tmp/bfss-gate89")/(rel.replace("/","_")+".log")
              with log.open("w") as o:
                  p=subprocess.run(["timeout","120s","lake","env","lean","-DwarningAsError=true","-o",
                                    ".lake/build/lib/lean/"+rel+".olean",path],cwd=work,stdout=o,stderr=subprocess.STDOUT)
              if p.returncode or not obj.is_file() or not obj.stat().st_size:
                  print(log.read_text()[-4000:],flush=True)
                  raise SystemExit("GATE89_ORIGINAL_"+mod+"_FRESH_COMPILE_RED")
              print("GATE89_ORIGINAL_SOURCE_FRESH_COMPILED",mod,obj.stat().st_size,flush=True)
          stem="SU2BFSSPhysicalDomainS4B1OriginalGammaFermionContractionProbe"
          src=pathlib.Path("experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B1OriginalGammaFermionContractionProbe.lean")
          (work/(stem+".lean")).write_bytes(src.read_bytes())
          obj=lib/(stem+".olean")
          if obj.exists(): obj.unlink()
          log=pathlib.Path("/tmp/bfss-gate89/strict-candidate.log")
          cmd=["timeout","120s","lake","env","lean","-DwarningAsError=true",
               "-o",".lake/build/lib/lean/"+stem+".olean",stem+".lean"]
          with log.open("w") as o:
              p=subprocess.run(cmd,cwd=work,stdout=o,stderr=subprocess.STDOUT)
          data=log.read_text()
          expected=[
             "FCP.BFSSSU2PhysicalDomainS4B1.sourceGammaTwo_contract",
             "FCP.BFSSSU2PhysicalDomainS4B1.originalSourceGammaTwo_contract"
          ]
          matched=re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",data)
          allowed={"propext","Classical.choice","Quot.sound"}
          normalized=[(name,{a.strip() for a in s.split(",") if a.strip()}) for name,s in matched]
          verified=(p.returncode==0 and len(normalized)==2
             and [name for name,_ in normalized]==expected
             and all(ax<=allowed for _,ax in normalized)
             and "sorryAx" not in data and "error:" not in data
             and "warning:" not in data
             and obj.is_file() and obj.stat().st_size>0)
          print("GATE89_COMPILER_EXIT",p.returncode,"AXIOM_REPORTS",normalized,flush=True)
          if not verified:
              print("GATE89_GAMMA_TWO_SOURCE_CONTRACTION_STRICT_RED",flush=True)
              print(data[-5000:],flush=True)
              raise SystemExit(1)
          print("GATE89_ORIGINAL_SOURCE_GAMMA_CONTRACTION_TWO_ROOTS_STRICT_PASS",flush=True)
          PY
      - name: Preserve Gate89 original source and candidate compiler logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-form-source-gamma-contraction-gate89-${{ github.run_id }}
          path: |
            /tmp/bfss-gate89/*.log
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainS4B1OriginalGammaFermionContractionProbe.olean
          if-no-files-found: warn
