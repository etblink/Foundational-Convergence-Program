      - name: Fail-closed exact literal J-free graph alias A2 source-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.v1cache.outputs.cache-hit }}" = true || { echo QUALIFIED_V1_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          test -s .lake/build/lib/lean/FCPM4F7IndependentRestrictedClosedGraphVerticalC1Cut.olean
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('experiments/openai-math-su2-physical-domain')
          src=(p/'FCPM4F7IndependentClosedGraphAliasA2Rfl.lean').read_text()
          v2=(p/'FCPM4F7IndependentClosedChargeOperatorV2.lean').read_text()
          car=lambda x: re.search(r'    \(hCAR : ∀ α β A B,[\s\S]*?    \(hHermitian :',x).group(0)
          assert car(src)==car(v2),('A2_V2_CAR_DRIFT',)
          assert src.startswith('import FCPM4F7IndependentRestrictedClosedGraphVerticalC1Cut\n')
          assert re.findall(r'^namespace (\S+)',src,re.M)==['FCP.M4F7IndependentClosedGraphAliasA2']
          assert re.findall(r'^noncomputable def (\S+)',src,re.M)==['independentRestrictedClosedGraph']
          roots=['independentRestrictedClosedGraph_set_eq_literal','independentRestrictedClosedGraph_isClosed']
          assert re.findall(r'^theorem (\S+)',src,re.M)==roots
          assert re.findall(r'^#print axioms (\S+)',src,re.M)==['independentRestrictedClosedGraph']+roots
          assert src.count('independentInvariantCore theta hCAR hHermitian')>=3
          original=(p/'FCPM4F7IndependentClosedGraphAliasA2.lean').read_text()
          before='  unfold independentRestrictedClosedGraph\n  exact Submodule.topologicalClosure_coe _'
          assert original.count(before)==1
          expected=original.replace(before,'  rfl',1)
          # Documentation change is permitted; the entire math from set_option must be exact.
          math=lambda t: t.split('set_option autoImplicit false',1)[1]
          assert math(src)==math(expected),('LITERAL_A2_THEOREM_PROOF_OR_MATH_CHANGED',)
          assert '  rfl\n\n/-- Closedness' in src
          assert 'Submodule.isClosed_topologicalClosure _' in src
          assert not re.search(r'(?m)^[ \t]*set_option[ \t]+maxRecDepth',src)
          assert not re.search(r'(?m)^[ \t]*(?:sorry|admit|axiom)\b',src.split('noncomputable section',1)[1])
          print('M4F7_A2_GATE2_SOURCE_EXACT_J_FREE_NAMED_GRAPH_ALIAS_TWO_CERTIFICATES_PASS')
          PY

      - name: Fresh Lean proof of literal independent graph Set closure and named closedness
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=FCPM4F7IndependentClosedGraphAliasA2Rfl
          cp "$GITHUB_WORKSPACE/experiments/openai-math-su2-physical-domain/$stem.lean" "upstream-math/lean/$stem.lean"
          cd upstream-math/lean
          /usr/bin/time -f 'DIAG_RESOURCE_TIME %e CPU %P MAX_RSS_KB %M' -o "/tmp/bfss-m4f7-closed-graph-alias-a2-rfl-strict-gate2/$stem.resource" \
            timeout --signal=TERM --kill-after=5s 105s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" >"/tmp/bfss-m4f7-closed-graph-alias-a2-rfl-strict-gate2/$stem.log" 2>&1 || {
              code=$?
              echo M4F7_A2_GATE2_LITERAL_GRAPH_CERTIFICATE_LEAN_EXIT=$code
              grep -n 'error:' "/tmp/bfss-m4f7-closed-graph-alias-a2-rfl-strict-gate2/$stem.log" | head -n 20 || true
              tail -n 65 "/tmp/bfss-m4f7-closed-graph-alias-a2-rfl-strict-gate2/$stem.log"
              cat "/tmp/bfss-m4f7-closed-graph-alias-a2-rfl-strict-gate2/$stem.resource" || true
              exit "$code"
            }
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import re
          from pathlib import Path
          src=Path('FCPM4F7IndependentClosedGraphAliasA2Rfl.lean').read_text()
          log=Path('/tmp/bfss-m4f7-closed-graph-alias-a2-rfl-strict-gate2/FCPM4F7IndependentClosedGraphAliasA2Rfl.log').read_text()
          ns='FCP.M4F7IndependentClosedGraphAliasA2'
          roots=['independentRestrictedClosedGraph_set_eq_literal','independentRestrictedClosedGraph_isClosed']
          names=['independentRestrictedClosedGraph']+roots
          assert re.findall(r'^noncomputable def (\S+)',src,re.M)==names[:1]
          assert re.findall(r'^theorem (\S+)',src,re.M)==roots
          assert re.findall(r'^#print axioms (\S+)',src,re.M)==names
          reports=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          ax={name:{t.strip() for t in raw.split(',') if t.strip()} for name,raw in reports}
          assert len(reports)==len(ax)==3,('REPORT_COUNT',reports)
          assert set(ax)=={ns+'.'+n for n in names},('REPORT_NAMES',ax)
          assert all(v <= {'propext','Classical.choice','Quot.sound'} for v in ax.values()),('FORBIDDEN_AXIOMS',ax)
          assert not any(e in log for e in ['error:','sorryAx','unknownIdentifier'])
          warnings=[line for line in log.splitlines() if 'warning:' in line and not re.fullmatch(r"warning: [A-Za-z0-9_-]+: repository '[^']+' has local changes",line)]
          assert not warnings,('UNEXPECTED_WARNINGS',warnings)
          print('M4F7_A2_GATE2_TWO_LITERAL_CLOSED_GRAPH_ALIAS_SUPPORT_CERTIFICATES_STRICT_PASS_NO_V2',ax)
          PY
          cat "/tmp/bfss-m4f7-closed-graph-alias-a2-rfl-strict-gate2/$stem.resource"

