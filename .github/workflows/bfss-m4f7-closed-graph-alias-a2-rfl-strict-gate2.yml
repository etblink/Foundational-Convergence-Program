          test "${{ steps.c2cache.outputs.cache-hit }}" = true || { echo QUALIFIED_C2_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in FCPM4F6IndependentGraphInputCutNamedAlias FCPM4F6PairedSourceGraphInputCut FCPM4F6GenericNamedAliasInputCut FCPM4F6IndependentLiteralAliasBoundary FCPRestrictedGraphInputCut FCPIndependentPhysicalSpace FCPIndependentFullCoreGraphImage FCPIndependentGraphTransportHomeomorph; do
