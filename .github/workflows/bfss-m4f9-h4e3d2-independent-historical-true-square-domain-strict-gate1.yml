          test "$(git hash-object --no-filters experiments/openai-math-su2-physical-domain/FCPM4F9H4D4AActualNativeAdjointSquareDomain.lean)" = 4062f563486088fcfeb47647938bc03a19363639
          test "$(git hash-object --no-filters experiments/openai-math-su2-physical-domain/FCPM4F9H4D4BActualNativeAdjointSquareAction.lean)" = 67f10232b7b03d33a6ad5a83ab8a65b152bfc391
          base=upstream-math/lean/.lake/build/lib/lean
          for stem in FCPM4F9H4E3D1NativeHistoricalExactPartialOperator FCPM4F9H4E3C2NativeSquareHistoricalFullDomainAction FCPM4F9H4E3C1HistoricalDomainNativeCharge FCPM4F9H4D4AActualNativeAdjointSquareDomain FCPM4F9H4D4BActualNativeAdjointSquareAction FCPM4F9H2CActualE2NativeHilbertChargeColumn SU2BFSSPhysicalDomainD2B28ConcretePairedSU2HamiltonianProbe; do
            test -s "$base/$stem.olean" || { echo H4E3D2_MISSING_ACCEPTED_ANCESTOR=$stem; exit 1; }
          done
          echo BFSS_H4E3D2_QUALIFIED_D1_H4D4A_B_HISTORICAL_ANCESTRY_PASS
      - name: Fresh independent physical square natural domain iff historical H compilation
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=FCPM4F9H4E3D2IndependentHistoricalTrueSquareDomain
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          timeout 270s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-m4f9-h4e3d2-gate1/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/bfss-m4f9-h4e3d2-gate1/FCPM4F9H4E3D2IndependentHistoricalTrueSquareDomain.log').read_text()
          ns='FCP.M4F9H4E3D2IndependentHistoricalTrueSquareDomain.'
          roots=['independentNativeAdjointSquare_domain_iff_historical']
          reports=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          got={n:{a.strip() for a in v.split(',') if a.strip()} for n,v in reports}
          assert len(reports)==len(got)==1 and set(got)=={ns+n for n in roots},('H4E3D2_WRONG_ROOT',reports)
          for name,axioms in got.items():
              assert axioms <= {'propext','Classical.choice','Quot.sound'},(name,axioms)
          known={'belyi','formal-schemes','elliptic-curves','tempered-fundamental-groups','oka','orbicurve-cores','pi1','heights','genl','tate-curves-theta','iut'}
          filtered=[]
          for line in s.splitlines():
              m=re.fullmatch(r"warning: ([a-z0-9-]+): repository '([^']+)' has local changes",line)
              if m and m.group(1) in known and m.group(2).endswith('/upstream-math/lean/.lake/packages/'+m.group(1)): continue
              filtered.append(line)
          checked='\n'.join(filtered)
          assert not any(t in checked for t in ('sorryAx','error:','warning:','unknownIdentifier')),checked[-5000:]
          print('BFSS_M4F9_H4E3D2_INDEPENDENT_HISTORICAL_SQUARE_DOMAIN_ONE_ROOT_STRICT_PASS')
          PY
