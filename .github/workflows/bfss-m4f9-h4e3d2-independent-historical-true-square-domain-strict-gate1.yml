          set -euo pipefail
          test "${{ steps.parent.outputs.cache-hit }}" = true || { echo H4E3D2_QUALIFIED_PARENT_MISS; exit 1; }
          test "$(git hash-object --no-filters experiments/openai-math-su2-physical-domain/FCPM4F9H4E3D1NativeHistoricalExactPartialOperator.lean)" = d68bdb555eca4cc1bc1ca9ac1811d481ccb31764
