name: BFSS S3L S3E2 Explicit Smul Zero Strict Gate 17

# Actual source Fock delta-one CAR, both color selectors contracted with
# exact J(alpha,gamma)-J(gamma,alpha) spinor index order.
# Three new helper + final theorem roots. This does NOT prove global Spin9.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s3l-s3e2-explicit-smul-zero-strict-gate17.yml
permissions:
  contents: read
concurrency:
  group: bfss-s3l-s3e2-smulzero-gate17-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-fermion-contraction:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - name: Checkout immutable research source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout original BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: Verify original CAR ancestry and exact three root S3E2 research source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s3l-s3e2-gate17
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json,pathlib,re,subprocess
          m=json.loads(pathlib.Path("upstream-math/lean/lake-manifest.json").read_text())
          assert next(p["rev"] for p in m["packages"] if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          pairs={
            "experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3CActualMajoranaQuadraticCommutatorProbe.lean":"2eaaffa5e3554d3af2cc694c10dd9ac4e1b0f69f",
            "experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3CActualMajoranaQuadraticCommutatorProbe.lean":"7d3ad2bdce570e4d3b2d7e56fba47f1e81a4b2d6",
            "experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3DActualFermionSpinQuadraticGeneratorProbe.lean":"14fa985ddd24f4fd37db229f7fc87f4303cce4be",
            "experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3E1ActualSameColorFermionicBilinearCommSourceProbe.lean":"fba5fa3b72c80c396a8b9cccb0dccfecb9e41331",
            "experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3E1ActualSameColorFermionicBilinearCommSourceProbe.lean":"4b5f4f9e1ba4a0277062d7e98f0d749b38ba4453",
            "experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3E2SameColorActualGammaCoefficientContractionProbe.lean":"d7a784e0679b279e5ca3c71206cd7d1994e70959",
            "experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3E2SameColorActualGammaCoefficientContractionProbe.lean":"6f875bd79654815de82ff4967058e7ee730f336e",
            "experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3E2SameColorActualGammaCoefficientContractionProbeV3.lean":"18d6beeb68e8db36fbeccbcf0b195816ce8a7aa7",
            "experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3E2SameColorActualGammaCoefficientContractionProbeV4.lean":"cccca70f645548958f60337fef36cc1a44b3c521",
          }
          for path,sha in pairs.items():
              assert subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip()==sha,(path,"GIT_SHA_CHANGED")
              assert subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()==sha,(path,"WORKTREE_CHANGED")
          base=pathlib.Path("experiments/openai-math-su2-physical-domain")
          original=(base/"SU2BFSSPhysicalDomainS3E1ActualSameColorFermionicBilinearCommSourceProbe.lean").read_text()
          repaired=(base/"recovery/SU2BFSSPhysicalDomainS3E1ActualSameColorFermionicBilinearCommSourceProbe.lean").read_text()
          assert original.replace("← Finset.sum_sub_distrib, ← smul_sub","← Finset.sum_sub_distrib, smul_sub")==repaired
          source=(base/"SU2BFSSPhysicalDomainS3E2SameColorActualGammaCoefficientContractionProbe.lean").read_text()
          assert source.startswith("import SU2BFSSPhysicalDomainS3E1ActualSameColorFermionicBilinearCommSourceProbe")
          names=re.findall(r"(?m)^#print axioms (\S+)",source)
          assert names==["pairedFermionSpinQuadraticColor_delta_beta","pairedFermionSpinQuadraticColor_delta_alpha","pairedFermionSpinQuadraticColor_comm_same_color_coefficient"],names
          assert "pairedFermionSpinQuadraticColor_comm_same_color_raw" in source
          assert not re.search(r"(?m)^[ \t]*(?:axiom|sorry|admit)(?:\s|$)|\bsorryAx\b",source)
          adapter=(base/"recovery/SU2BFSSPhysicalDomainS3E2SameColorActualGammaCoefficientContractionProbeV3.lean").read_text()
          previous=(base/"recovery/SU2BFSSPhysicalDomainS3E2SameColorActualGammaCoefficientContractionProbe.lean").read_text()
          statements=lambda t: re.findall(r"(?ms)^theorem .*? := by",t)
          assert statements(source)==statements(previous)==statements(adapter),("DECLARATION_STATEMENTS_DIFFER")
          assert source.count("  intro α _\n  simp\n")==1
          assert previous.count("  intro α _\n  simp only [smul_ite, smul_zero]\n  simp\n")==1
          assert previous.count("      intro β _\n      simp only [smul_ite, smul_zero]\n      simp\n")==1
          assert adapter.count("        by_cases h : β = γ")==1 and adapter.count("            by_cases h : α = γ")==1
          assert adapter.count("        · subst β")==1 and adapter.count("            · subst α")==1
          assert adapter.count("      exact (sub_smul")==1
          assert len(re.findall(r"(?m)^#print axioms (\S+)",adapter))==3
          assert not re.search(r"(?m)^[ \t]*(?:axiom|sorry|admit)(?:\s|$)|\bsorryAx\b",adapter)
          v3=(base/"recovery/SU2BFSSPhysicalDomainS3E2SameColorActualGammaCoefficientContractionProbeV3.lean").read_text()
          v4=(base/"recovery/SU2BFSSPhysicalDomainS3E2SameColorActualGammaCoefficientContractionProbeV4.lean").read_text()
          v3_lines=v3.splitlines(keepends=True)
          old_beta="        · simp [h]"+chr(10)
          old_alpha="            · simp [h]"+chr(10)
          assert v3_lines.count(old_beta)==1 and v3_lines.count(old_alpha)==1
          expected="".join(line+
            ("          exact smul_zero _"+chr(10) if line==old_beta else
             "              exact smul_zero _"+chr(10) if line==old_alpha else "")
            for line in v3_lines)
          assert expected==v4,("UNEXPECTED_V4_SOURCE_DIFF")
          assert statements(v3)==statements(v4)==statements(source)
          assert re.findall(r"(?m)^#print axioms (\S+)",v4)==names
          assert not re.search(r"(?m)^[ \t]*(?:axiom|sorry|admit)(?:\s|$)|\bsorryAx\b",v4)
          print("BFSS_S3L_S3E2_GATE17_EXACT_TWO_ZERO_SMUL_PROOF_INSERTIONS_PASS")
          print("BFSS_S3L_S3E2_GATE17_EXACT_REAL_SOURCE_PREFLIGHT_PASS")
          print("BFSS_S3L_S3E2_GATE17_SAME_THREE_STATEMENTS_FIXED_POINTWISE_CAR_SELECTORS")
          PY
      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
      - name: Restore frozen Lean and exact Mathlib
