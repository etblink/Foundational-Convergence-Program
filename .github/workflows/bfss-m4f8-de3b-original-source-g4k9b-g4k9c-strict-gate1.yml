            upstream-math/lean/.lake/build/lib/lean/FCPM4F7IndependentActualClosedPhysicalOutputsE7N2.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentInvariantCoreL2ImageDA.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentConditionalPhysicalCoreDensityDB.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentE2ConditionalPhysicalDomainDenseDD.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentE2UnconditionalPhysicalDomainDenseDC.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentActualE2PhysicalInputRebaseDE1.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentActualE2PhysicalInputRebaseDE1B.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentActualE2PhysicalInputRebaseDE1C.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentActualE2FullPhysicalGraphRebaseDE2.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F8IndependentActualE2FullPhysicalDomainDE2B.olean
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSG4K9ASourceChargeCoefficientCrosswalkProbe.olean
          key: bfss-fcp-m4f8-de3a-g4k9a-direct-source-faaf3b84-gate1-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed on current-branch accepted parent and original imported types
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.g4k9acache.outputs.cache-hit }}" = true || { echo M4F8_DE3B_GATE1_G4K9A_PARENT_CACHE_MISSING; exit 1; }
          for stem in OAI/MathematicalPhysics/BFSS/ClosedProfiles SU2BFSSG4K9ASourceChargeCoefficientCrosswalkProbe; do
            test -s "upstream-math/lean/.lake/build/lib/lean/$stem.olean" || { echo M4F8_DE3B_GATE1_ANCESTOR_OLEAN_MISSING=$stem; exit 1; }
          done

      - name: Fresh strict G4K9B and G4K9C original sources eleven axiom reports
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          for stem in SU2BFSSG4K9BSourcePairAndChargeReductionProbe SU2BFSSG4K9COrderedPairCoefficientProbe; do
            cp "$GITHUB_WORKSPACE/experiments/openai-math-su2-concrete-potential/$stem.lean" "$stem.lean"
            /usr/bin/time -f 'G4K9BC_RESOURCE_TIME %e CPU %P MAX_RSS_KB %M' -o "/tmp/bfss-de3b-original-g4k9bc-gate1/$stem.resource" \
              timeout --signal=TERM --kill-after=5s 240s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" >"/tmp/bfss-de3b-original-g4k9bc-gate1/$stem.log" 2>&1 || {
              code=$?
              echo M4F8_DE3B_GATE1_FRESH_LEAN_EXIT=$code
              grep -n 'error:' "/tmp/bfss-de3b-original-g4k9bc-gate1/$stem.log" | head -n 40 || true
              tail -n 105 "/tmp/bfss-de3b-original-g4k9bc-gate1/$stem.log"
              cat "/tmp/bfss-de3b-original-g4k9bc-gate1/$stem.resource" || true
              exit "$code"
            }
            test -s ".lake/build/lib/lean/$stem.olean"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          specs=[{"stem":"SU2BFSSG4K9BSourcePairAndChargeReductionProbe","namespace":"FCP.BFSSSU2GaugeG4K9B.","roots":["sourceCoordinateBracketUpperPair","sourceGammaTwoUpperPair","sourceMasslessCoefficient_eq_originalUpperTriangle","sourceChargeDifference_eq_potentialDifference","sourceCharge_eq_of_potentialAgreement","sourceCoreForm_eq_of_potentialAgreement"]},{"stem":"SU2BFSSG4K9COrderedPairCoefficientProbe","namespace":"FCP.BFSSSU2GaugeG4K9C.","roots":["symmetricZeroDiagonal_halfDoubleSum_eq_upper","sourceOrderedCoefficient_symmetric","sourceOrderedCoefficient_diagonal_zero","sourceOriginalOrderedCoefficient_eq_upper","sourceMasslessCoefficient_eq_halfOriginalOrdered"]}]
          all_reports={}
          for spec in specs:
              s=(Path('/tmp/bfss-de3b-original-g4k9bc-gate1')/(spec['stem']+'.log')).read_text()
              reports=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
              axioms={n:{v.strip() for v in raw.split(',') if v.strip()} for n,raw in reports}
              required={spec['namespace']+n for n in spec['roots']}
              assert len(reports)==len(axioms)==len(required) and set(axioms)==required,('AXIOM_ROOTS',spec['stem'],reports)
              assert all(a <= {'propext','Classical.choice','Quot.sound'} for a in axioms.values()),('BAD_AXIOMS',axioms)
              assert 'sorryAx' not in s and 'error:' not in s,('SORRY_OR_ERROR',spec['stem'])
              known=r"warning: [A-Za-z0-9_-]+: repository '[^']*/upstream-math/lean/\.lake/packages/[A-Za-z0-9_-]+' has local changes"
              extra=[line for line in s.splitlines() if 'warning:' in line and not re.fullmatch(known,line)]
              assert not extra,('UNEXPECTED_WARNINGS',spec['stem'],extra)
              all_reports.update(axioms)
          assert len(all_reports)==11
          print('M4F8_DE3B_GATE1_ORIGINAL_G4K9B_G4K9C_ELEVEN_ROOTS_STRICT_PASS',all_reports)
          PY
          cat /tmp/bfss-de3b-original-g4k9bc-gate1/*.resource

