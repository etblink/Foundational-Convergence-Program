name: BFSS M4F8 DE3B Original Source G4K9B G4K9C Strict Gate 1

on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-m4f8-de3b-original-source-g4k9b-g4k9c-strict-gate1.yml

permissions:
  contents: read

concurrency:
  group: bfss-m4f8-de3-physical-source-graph-source-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - name: Checkout research sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact original BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Strict immutable original G4K9B G4K9C theorem-body provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-de3b-original-g4k9bc-gate1
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,re
          d=json.loads(Path('upstream-math/lean/lake-manifest.json').read_text())
          assert next(x['rev'] for x in d['packages'] if x['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          sources=[{"name":"SU2BFSSG4K9BSourcePairAndChargeReductionProbe.lean","stem":"SU2BFSSG4K9BSourcePairAndChargeReductionProbe","sha":"3bc2712a1c56e86e9e996dcee3052409e23a2e73","ns":"FCP.BFSSSU2GaugeG4K9B.","roots":["sourceCoordinateBracketUpperPair","sourceGammaTwoUpperPair","sourceMasslessCoefficient_eq_originalUpperTriangle","sourceChargeDifference_eq_potentialDifference","sourceCharge_eq_of_potentialAgreement","sourceCoreForm_eq_of_potentialAgreement"],"imports":["import SU2BFSSG4K9ASourceChargeCoefficientCrosswalkProbe"]},{"name":"SU2BFSSG4K9COrderedPairCoefficientProbe.lean","stem":"SU2BFSSG4K9COrderedPairCoefficientProbe","sha":"de0c447a73990b1beb271fb2afc14dc5b4e20318","ns":"FCP.BFSSSU2GaugeG4K9C.","roots":["symmetricZeroDiagonal_halfDoubleSum_eq_upper","sourceOrderedCoefficient_symmetric","sourceOrderedCoefficient_diagonal_zero","sourceOriginalOrderedCoefficient_eq_upper","sourceMasslessCoefficient_eq_halfOriginalOrdered"],"imports":["import SU2BFSSG4K9BSourcePairAndChargeReductionProbe"]}]
          for item in sources:
              path=Path('experiments/openai-math-su2-concrete-potential')/(item['name'])
              expected=item['sha']
              assert subprocess.check_output(['git','rev-parse','HEAD:'+str(path)],text=True).strip()==expected,(path,'TREE_SHA')
              assert subprocess.check_output(['git','hash-object','--no-filters',str(path)],text=True).strip()==expected,(path,'FILE_SHA')
              s=path.read_text()
              assert s.startswith(item['imports'][0]+'\n')
              assert re.findall(r'^#print axioms (\S+)',s,re.M)==item['roots'],('AXIOM_DECLARATIONS',path)
              assert not re.search(r'(?m)^[ \t]*(?:sorry|admit|axiom)\b|\bsorryAx\b',s.split('noncomputable section',1)[1])
          print('M4F8_DE3B_GATE1_ORIGINAL_G4K9BC_TWO_UNALTERED_SOURCE_BLOBS_PASS')
          PY

      - name: Reclaim runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore exact original toolchain and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true
          cd upstream-math/lean
          timeout 1080s lake exe cache get > /tmp/bfss-de3b-original-g4k9bc-gate1/mathlib.log 2>&1 || {
            tail -n 100 /tmp/bfss-de3b-original-g4k9bc-gate1/mathlib.log
            exit 1
          }
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612

