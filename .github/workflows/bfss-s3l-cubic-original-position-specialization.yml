      - name: Compile S3L5J7 original full kinetic response coefficient transport
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS3L5J7OriginalFullResponseCoefficientTransportProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
