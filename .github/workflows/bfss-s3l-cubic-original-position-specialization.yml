      - name: Compile S3L5K1 genuine source potential position-pair rotation
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS3L5K1SourceCubicPositionPairProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          test -s .lake/build/lib/lean/SU2BFSSPhysicalDomainS3L5J9ActualKineticFreeSpinorCovarianceProbe.olean
          timeout 140s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee /tmp/s3l5k1-axioms.log
