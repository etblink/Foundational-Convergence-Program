            'FCP.BFSSSU2PhysicalDomainS3L5J6.sourceKineticOrbitalPiece_asDerivativeCases',
            'FCP.BFSSSU2PhysicalDomainS3L5J6.sourceOrbitalFixedColorSpinor_reindex',
            'FCP.BFSSSU2PhysicalDomainS3L5J6.pairedOrbitalFixedColorSpinor_reindex']
          assert [n for n,_ in matches] == expected,matches
          for n, ax in matches:
            assert {v.strip() for v in ax.split(',') if v.strip()} <= {'propext','Classical.choice','Quot.sound'},(n,ax)
          assert 'sorryAx' not in s and 'error:' not in s,s[-4000:]
