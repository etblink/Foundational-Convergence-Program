          timeout 150s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee /tmp/s3l5j7-axioms.log
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
