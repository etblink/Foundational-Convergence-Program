name: BFSS M4F7 Unrestricted Full Closed Graph Vertical B4 CoeAlign Strict Gate 2

# Isolated research branch, exact self-path trigger only.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-m4f7-unrestricted-full-vertical-b4-coealign-strict-gate2.yml

permissions:
  contents: read

concurrency:
  group: bfss-m4f7-unrestricted-full-vertical-b4-coealign-strict-gate2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restricted-core-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - name: Checkout isolated research sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout immutable original BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Fail-closed exact original and candidate source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-m4f7-unrestricted-full-vertical-b4-coealign-strict-gate2
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import pathlib,subprocess,json,re
          d=json.loads(pathlib.Path('upstream-math/lean/lake-manifest.json').read_text())
          assert next(p['rev'] for p in d['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          p=pathlib.Path('experiments/openai-math-su2-physical-domain')
          blobs={
            'FCPIndependentFullSmoothCharge.lean':'4fa31d97ddfbb80e3258070caccd7b0a6b0bc874',
            'FCPIndependentChargeVectorL2.lean':'6492f4b08181020f611f7d7d4b751394805420d2',
            'FCPIndependentFullCoreGraph.lean':'2139e7fc9e7b9d5bf99ec57d096686078b8ffdf7',
            'FCPIndependentFullCoreGraphImage.lean':'06e98a1b867f21577b5b74033e411d27ba688985',
            'FCPIndependentGraphTransportHomeomorph.lean':'8455a6c42f23b2d08f7945188fe5b8ca9e75ac4b',
            'FCPIndependentFullCoreGraphClosure.lean':'a6aacf285206ba79f331bf2c6818fc0b7df1a6e4',
            'FCPIndependentInvariantSmoothEquiv.lean':'5083f0ce9bfb43f616a9c3e5dc286887bd073de4',
            'FCPM4F6PairedSourceGraphInputCut.lean':'c217d66cf9e8ccf39b64aab6488fe62b11447beb',
            'FCPM4F6IndependentGraphInputCut.lean':'4db1bbd1685555a3c00efd836577186782ff08bb',
            'FCPM4F6IndependentLiteralAliasBoundary.lean':'88a0cfdf5c5a4e407906462a56f62b9df9281ea0',
            'FCPM4F6GenericNamedAliasInputCut.lean':'b826575e5c39739a49e2797c02b79024c9f7e692',
            'FCPM4F6IndependentGraphInputCutNamedAlias.lean':'976ca4ed439f63566d49611566299d66d33a5fd1',
            'FCPM4F6RestrictedGraphImageC3.lean':'b9d707d8a9ca1100fda35872ebbfeb83c56dbd2a',
            'FCPM4F6RestrictedGraphClosureC4.lean':'7a248ff92d8f1d3e7ee7cbf9e94b7addf5db5e0d',
            'FCPM4F7IndependentRestrictedClosedGraphVertical.lean':'6b607a8276fa5f787e94473ca47f874c3b69d7b8',
            'FCPM4F7IndependentRestrictedClosedGraphVerticalC1Cut.lean':'71a0b11174a1c5beef4ad674a0ac1666ec35347c',
            'FCPM4F7IndependentClosedChargeOperatorV2.lean':'571890437e52ce1a0e2de7267862a8a69f5f00be',
            'FCPM4F7IndependentClosedGraphAliasA2.lean':'87c3804ed5602bc2e3365489d556bb8314138780',
            'FCPM4F7IndependentClosedGraphAliasA3.lean':'f38ff58df7afe69562c3059c71b7c2f7d7a28e60',
            'FCPM4F7FullClosedGraphVerticalB4.lean':'03a51889a1060e7407bdecab607b4bfa2e7b3070',
            'FCPM4F7FullClosedGraphVerticalB4CoeAlign.lean':'2b485db6576f37cd13acd861eb9549d26f49bc51',
            'FCPRestrictedGraphInputCut.lean':'cbcb667d15fccd67eaa185a69eb8b476546d977d',
          }
          for name,sha in blobs.items():
            file=p/name
            assert subprocess.check_output(['git','rev-parse','HEAD:'+str(file)],text=True).strip() == sha,(name,'git source pin')
            assert subprocess.check_output(['git','hash-object','--no-filters',str(file)],text=True).strip() == sha,(name,'working source pin')
          def lean_code_only(text):
            # Lean nested block comments, including documentation, are NOT code.
            out=[]
            depth=0
            i=0
            while i < len(text):
              if text.startswith('/-',i):
                depth+=1
                i+=2
              elif depth and text.startswith('-/',i):
                depth-=1
                i+=2
              else:
                c=text[i]
                if depth==0 or c=='\n':
                  out.append(c)
                i+=1
            assert depth==0,('UNTERMINATED_LEAN_COMMENT',)
            return '\n'.join(line.split('--',1)[0] for line in ''.join(out).splitlines())
          for candidate in ['FCPRestrictedGraphInputCut.lean','FCPM4F6PairedSourceGraphInputCut.lean','FCPM4F6IndependentGraphInputCut.lean','FCPM4F6IndependentLiteralAliasBoundary.lean','FCPM4F6GenericNamedAliasInputCut.lean','FCPM4F6IndependentGraphInputCutNamedAlias.lean','FCPM4F6RestrictedGraphImageC3.lean','FCPM4F6RestrictedGraphClosureC4.lean','FCPM4F7IndependentRestrictedClosedGraphVertical.lean','FCPM4F7IndependentRestrictedClosedGraphVerticalC1Cut.lean','FCPM4F7IndependentClosedChargeOperatorV2.lean','FCPM4F7IndependentClosedGraphAliasA2.lean','FCPM4F7IndependentClosedGraphAliasA3.lean','FCPM4F7FullClosedGraphVerticalB4.lean','FCPM4F7FullClosedGraphVerticalB4CoeAlign.lean']:
            source=(p/candidate).read_text()
            code=lean_code_only(source)
            assert not re.search(r'(?m)^[ \t]*(?:sorry|admit|axiom)\b|\bsorryAx\b',code),('UNAPPROVED_LEAN_CODE',candidate)
          print('M4F7_B4_GATE2_COMMENT_AWARE_EXACT_SOURCE_PASS')
          PY

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore pinned Lean 4.34.1 and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-m4f7-unrestricted-full-vertical-b4-coealign-strict-gate2/toolchain.log; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-m4f7-unrestricted-full-vertical-b4-coealign-strict-gate2/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo M4F7_B4_GATE2_PINNED_TOOLCHAIN_PASS

      - name: Restore M4F5 qualified original source and graph cache
        id: m4f5cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM3*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependent*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4E5*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentFullSmoothCharge.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentChargeVectorL2.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentFullCoreGraph.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentFullCoreGraphImage.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentGraphTransportHomeomorph.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentFullCoreGraphClosure.olean
          key: bfss-fcp-m4f5-unrestricted-graph-closure-gate1-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Verify exact accepted source import closure
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.m4f5cache.outputs.cache-hit }}" = true || { echo M4F6_M4F5_QUALIFIED_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in OAI/MathematicalPhysics/BFSS/Core OAI/MathematicalPhysics/BFSS/GaugeCore SU2BFSSG4JExactGaugeDataAssemblyProbe FCPIndependentFullSmoothCharge FCPIndependentChargeVectorL2 FCPIndependentSmoothCore FCPIndependentInvariantSmoothEquiv FCPIndependentFullCoreGraph FCPIndependentFullCoreGraphImage FCPIndependentGraphTransportHomeomorph FCPIndependentFullCoreGraphClosure; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "M4F6_REQUIRED_PARENT_OLEAN_MISSING=$stem"; exit 1; }
          done
          echo M4F7_B4_GATE2_QUALIFIED_PARENT_CLOSURE_PASS


      - name: Restore strictly qualified C1 source and generic input-cut certificate cache
        id: c1cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM3*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependent*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4E5*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPRestrictedGraphInputCut.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F6PairedSourceGraphInputCut.olean
          key: bfss-fcp-m4f6-paired-source-cut-c1-c217d66c-gate1-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Require exact accepted C1 parent proof and literal independent graph closure
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.c1cache.outputs.cache-hit }}" = true || { echo QUALIFIED_C1_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in FCPRestrictedGraphInputCut FCPM4F6PairedSourceGraphInputCut FCPIndependentFullSmoothCharge FCPIndependentChargeVectorL2 FCPIndependentFullCoreGraph FCPIndependentFullCoreGraphClosure FCPIndependentSmoothCore FCPIndependentPhysicalUnitary; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo QUALIFIED_C1_PARENT_OLEAN_MISSING=$stem; exit 1; }
          done
          echo M4F7_B4_GATE2_SAVED_GENERIC_AND_C1_SOURCE_PROOFS_VERIFIED





      - name: Require qualified M4F5 source full-graph closure and exact B4 statement
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.m4f5cache.outputs.cache-hit }}" = true || { echo QUALIFIED_M4F5_UNRESTRICTED_CLOSURE_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for f in FCPIndependentFullCoreGraphClosure FCPIndependentFullCoreGraphImage FCPIndependentGraphTransportHomeomorph FCPIndependentFullCoreGraph OAI/MathematicalPhysics/BFSS/Core; do
            test -s ".lake/build/lib/lean/$f.olean" || { echo M4F7_B4_PARENT_OLEAN_MISSING=$f; exit 1; }
          done
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('experiments/openai-math-su2-physical-domain')
          src=(p/'FCPM4F7FullClosedGraphVerticalB4CoeAlign.lean').read_text()
          m4f5=(p/'FCPIndependentFullCoreGraphClosure.lean').read_text()
          original=(p/'FCPM4F7FullClosedGraphVerticalB4.lean').read_text()
          before='    rw [Submodule.topologicalClosure_coe]\n    exact hh0'
          after='    rw [← Submodule.topologicalClosure_coe pairedAlgebraData.fullCoreGraph] at hh0\n    exact hh0'
          assert original.count(before)==1,('OLD_FAILING_REWRITE_NOT_UNIQUE',)
          assert src.split('set_option autoImplicit false',1)[1]==original.replace(before,after,1).split('set_option autoImplicit false',1)[1],('UNAUTHORIZED_B4_MATHEMATICS_CHANGE',)
          assert src.count(after)==1,('EXPECTED_EXACT_COERCION_REWRITE_MISSING',)
          assert src.startswith('import FCPIndependentFullCoreGraphClosure\n')
          assert re.findall(r'^namespace (\S+)',src,re.M)==['FCP.M4F7FullClosedGraphVerticalB4']
          assert re.findall(r'^theorem (\S+)',src,re.M)==['independentFullCoreGraph_closure_vertical']
          assert re.findall(r'^#print axioms (\S+)',src,re.M)==['independentFullCoreGraph_closure_vertical']
          assert re.findall(r'^#check (\S+)',src,re.M)==['independentFullCoreGraph_closure_vertical']
          assert 'sourceFullCoreGraph_closure_eq_independent_image_closure' in m4f5
          assert 'sourceFullCoreGraph_closure_eq_independent_image_closure' in src
          assert 'pairedAlgebraData.fullClosedGraph_vertical' in src
          assert '(fiberTransportUnitary J).injective' in src
          assert 'independentFullCoreGraph color gamma theta' in src
          assert 'independentInvariantCore' not in src
          assert not re.search(r'(?m)^[ \t]*set_option[ \t]+maxRecDepth',src)
          assert not re.search(r'(?m)^[ \t]*(?:sorry|admit|axiom)\b',src.split('noncomputable section',1)[1])
          print('M4F7_B4_GATE2_NAMED_UNRESTRICTED_GRAPH_VERTICAL_SOURCE_PREFLIGHT_PASS')
          PY

      - name: Fresh strict original-source independent full closed graph vertical proof
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=FCPM4F7FullClosedGraphVerticalB4CoeAlign
          cp "$GITHUB_WORKSPACE/experiments/openai-math-su2-physical-domain/$stem.lean" "upstream-math/lean/$stem.lean"
          cd upstream-math/lean
          mkdir -p .lake/build/lib/lean
          /usr/bin/time -f 'DIAG_RESOURCE_TIME %e CPU %P MAX_RSS_KB %M' -o "/tmp/bfss-m4f7-unrestricted-full-vertical-b4-coealign-strict-gate2/$stem.resource" \
            timeout --signal=TERM --kill-after=5s 105s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" >"/tmp/bfss-m4f7-unrestricted-full-vertical-b4-coealign-strict-gate2/$stem.log" 2>&1 || {
              code=$?
              echo M4F7_B4_GATE2_FRESH_LEAN_EXIT=$code
              grep -n 'error:' "/tmp/bfss-m4f7-unrestricted-full-vertical-b4-coealign-strict-gate2/$stem.log" | head -n 22 || true
              tail -n 75 "/tmp/bfss-m4f7-unrestricted-full-vertical-b4-coealign-strict-gate2/$stem.log"
              cat "/tmp/bfss-m4f7-unrestricted-full-vertical-b4-coealign-strict-gate2/$stem.resource" || true
              exit "$code"
            }
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('FCPM4F7FullClosedGraphVerticalB4CoeAlign.lean').read_text()
          log=Path('/tmp/bfss-m4f7-unrestricted-full-vertical-b4-coealign-strict-gate2/FCPM4F7FullClosedGraphVerticalB4CoeAlign.log').read_text()
          full='FCP.M4F7FullClosedGraphVerticalB4.independentFullCoreGraph_closure_vertical'
          assert re.findall(r'^theorem (\S+)',src,re.M)==['independentFullCoreGraph_closure_vertical']
          assert re.findall(r'^#print axioms (\S+)',src,re.M)==['independentFullCoreGraph_closure_vertical']
          reports=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          ax={n:{w.strip() for w in parts.split(',') if w.strip()} for n,parts in reports}
          assert len(reports)==len(ax)==1,('EXACT_AXIOM_REPORT_COUNT',reports)
          assert set(ax)=={full},('EXACT_PRINCIPAL_THEOREM',ax)
          assert all(v <= {'propext','Classical.choice','Quot.sound'} for v in ax.values()),('UNAUTHORIZED_AX',ax)
          assert 'error:' not in log and 'sorryAx' not in log and 'unknownIdentifier' not in log
          warnings=[line for line in log.splitlines() if 'warning:' in line and not re.fullmatch(r"warning: [A-Za-z0-9_-]+: repository '[^']+' has local changes",line)]
          assert not warnings,('UNEXPECTED_LEAN_WARNING',warnings)
          print('M4F7_B4_GATE2_SOURCE_EXACT_UNRESTRICTED_CLOSED_GRAPH_VERTICAL_ONE_THEOREM_STRICT_PASS',ax)
          PY
          cat "/tmp/bfss-m4f7-unrestricted-full-vertical-b4-coealign-strict-gate2/$stem.resource"

      - name: Save source-exact B4 unrestricted vertical theorem only after strict success
        if: success()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM3*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependent*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4E5*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentFullSmoothCharge.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentChargeVectorL2.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentFullCoreGraph.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentFullCoreGraphImage.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentGraphTransportHomeomorph.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependentFullCoreGraphClosure.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM4F7FullClosedGraphVerticalB4CoeAlign.olean
          key: bfss-fcp-m4f7-full-closed-vertical-b4-coealign-2b485db6-gate2-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve full B4 original compiler and resource logs on any outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4f7-full-closed-vertical-b4-${{ github.run_id }}
          path: /tmp/bfss-m4f7-unrestricted-full-vertical-b4-coealign-strict-gate2
          if-no-files-found: warn
