name: BFSS S1V43 Original Lipschitz Grade Determinant Parity Interfaces Strict Gate

# Deliberate branch-isolated single candidate; source/audit edits do not
# cause CI. The workflow itself is the only push trigger.
on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v43-original-lipschitz-grade-det-parity-interfaces-strict.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v43-grade-parity-interfaces-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source48-grade-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout original FCP research sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout immutable original upstream BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Strict original source, SHA and toolchain preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v43
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          data=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in data['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          r=experiments/openai-math-su2-physical-domain
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.lean")" = 22f3101b243a7b7857d9597b547322174d9281c8
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V37Original48CliffordGeneratorRankOneDeterminantProbe.lean")" = 2d3d40134e4eaba80751c62a160d1803f22c828b
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V38Original48PolarCoefficientBridgeProbe.lean")" = 27ed1e4933499c108ee614b4731a3479a318aa8b
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V39Original48CliffordGeneratorMatrixActionProbe.lean")" = 9a800e9e30f55cf41517dd9ac6098b3a497db607
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V30Real48CliffordGeneratorInjectiveViaExteriorProbe.lean")" = 59d40c5c74cc4803a6a6096cfe5ea87c800bd7f9
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V40ActualSource48LipschitzVectorActionProbe.lean")" = 106286d7cc48e326368cfd53b03a48f5e2815260
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V41GenuineLipschitz48RealGLHomProbe.lean")" = 818408f1834ba7798b4129fc3a96cbada5a63089
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V42ActualLipschitzGeneratorDeterminantProbe.lean")" = 0c13c4928e463c5a81ccf812957e0f19b276fccd
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V43OriginalLipschitzGradeDetParityInterfacesProbe.lean")" = e343fb5482663ac42f8595d11a38238df1dd975c
          echo S1V43_ORIGINAL_SOURCE_AND_TOOLCHAIN_PINS_PASS

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore immutable original Lean and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v43/toolchain.log; then
              ok=true; break
            fi
            echo ORIGINAL_PINNED_LEAN_RETRY_$attempt | tee -a /tmp/bfss-s1v43/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo PINNED_ORIGINAL_LEAN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v43/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo S1V43_PINNED_LEAN_MATHLIB_VERIFIED

      - name: Restore strictly accepted S1V42 actual Lipschitz generator determinant cache
        id: cache42
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v42-isolated-source48-actual-generator-det-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed without qualified original source geometry
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.cache42.outputs.cache-hit }}" = true || { echo S1V43_ACCEPTED_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe SU2BFSSPhysicalDomainS1V35ActualSpin48RealAutomorphismGroupHomProbe SU2BFSSPhysicalDomainS1V36ActualSpin48OriginalRealDeterminantCharacterProbe SU2BFSSPhysicalDomainS1V37Original48CliffordGeneratorRankOneDeterminantProbe SU2BFSSPhysicalDomainS1V38Original48PolarCoefficientBridgeProbe SU2BFSSPhysicalDomainS1V39Original48CliffordGeneratorMatrixActionProbe SU2BFSSPhysicalDomainS1V30Real48CliffordGeneratorInjectiveViaExteriorProbe SU2BFSSPhysicalDomainS1V40ActualSource48LipschitzVectorActionProbe SU2BFSSPhysicalDomainS1V41GenuineLipschitz48RealGLHomProbe SU2BFSSPhysicalDomainS1V42ActualLipschitzGeneratorDeterminantProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "S1V43_ACCEPTED_OLEAN_MISSING=$stem"; exit 1; }
          done
          echo S1V43_ACCEPTED_ORIGINAL_GEOMETRY_DEPENDENCIES_READY

      - name: Compile and strictly audit four genuine grade determinant parity interface roots
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=SU2BFSSPhysicalDomainS1V43OriginalLipschitzGradeDetParityInterfacesProbe
          cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
          timeout 600s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v43/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean" || { echo S1V43_ORIGINAL_ROOT_OLEAN_MISSING; exit 1; }
          python3 - <<'PY'
          import pathlib,re
          stem='SU2BFSSPhysicalDomainS1V43OriginalLipschitzGradeDetParityInterfacesProbe'
          src=pathlib.Path(stem+'.lean').read_text()
          log=pathlib.Path('/tmp/bfss-s1v43',stem+'.log').read_text()
          names=re.findall(r'^#print axioms (\S+)',src,re.M)
          expected=['source48LipschitzGradeDetParity',
                    'source48LipschitzGradeDetParity_one',
                    'source48LipschitzGradeDetParity_mul',
                    'source48LipschitzGradeDetParity_generator']
          assert names==expected, names
          assert re.findall(r'^namespace (\S+)',src,re.M)==['FCP.BFSSS1V43']
          reports=re.findall(r"'(FCP\.BFSSS1V43\.[^\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          found={k:{x.strip() for x in v.split(',') if x.strip()} for k,v in reports}
          assert len(reports)==len(found)==4,reports
          allowed={'propext','Classical.choice','Quot.sound'}
          for name in expected:
            key='FCP.BFSSS1V43.'+name
            assert key in found and found[key]<=allowed,(key,found)
          assert 'sorryAx' not in log and 'error:' not in log and 'unknownIdentifier' not in log,log[-9000:]
          print('S1V43_ORIGINAL_GRADE_DET_PARITY_4_ROOTS_KERNEL_PASS')
          PY

      - name: Save qualified S1V43 original grade determinant parity interfaces cache only after strict green
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v43-isolated-source48-grade-det-parity-interfaces-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve source logs for failure diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v43-grade-det-parity-${{ github.run_id }}
          path: /tmp/bfss-s1v43/
          if-no-files-found: warn
