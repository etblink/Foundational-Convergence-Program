name: BFSS S1V19 Original OAI GaugeCore Cold Bootstrap (NO PROOF)

# One bounded prerequisite probe. No original gauge Spin theorem is claimed.
# Does not touch PR25 or main; only this isolated workflow's own path triggers.
on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v19-original-oai-gaugecore-cold.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v19-oai-gaugecore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pinned-original-oai-gaugecore:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - name: Checkout isolated source research
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout immutable original OAI Lean library
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Enforce original sources and toolchain exact pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v19-original
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          python3 - <<'PY'
          import json
          p='upstream-math/lean/lake-manifest.json'
          d=json.load(open(p))
          assert next(x['rev'] for x in d['packages'] if x['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V19OriginalSourceZQuarterAdjointCoefficientBridgeProbe.lean)" = 5d77be869b4df35462af4c66bd5452e5ab908198
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2BFSSG1APairedThetaProbe.lean)" = 4f8fbf05a35c1d625746931b7ff0361b7ffc2ec4
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2BFSSFullAlgebraDataProbe.lean)" = f85d2ee672e3c6c9b83a5e3db8d21f95492cb724
          echo PINNED_ORIGINAL_OAI_PROVENANCE_VERIFIED_NO_NEW_THEOREM

      - name: Reclaim disposable runner space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Bootstrap EXACT original Lean/Mathlib no surrogate dependencies
        shell: bash
        timeout-minutes: 23
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          elan_ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v19-original/lean-install.log; then
              elan_ok=true; break
            fi
            echo PINNED_TOOLCHAIN_RETRY_$attempt | tee -a /tmp/bfss-s1v19-original/lean-install.log
            sleep $((attempt * 6))
          done
          test "$elan_ok" = true || { echo PINNED_LEAN_INSTALL_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1050s lake exe cache get 2>&1 | tee /tmp/bfss-s1v19-original/mathlib-cache.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo ORIGINAL_PINNED_MATHLIB_PREPARED

      - name: Build only original OAI GaugeCore import root and its transitive OAI modules
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          timeout 650s lake build OAI.MathematicalPhysics.BFSS.GaugeCore 2>&1 | tee /tmp/bfss-s1v19-original/oai-gaugecore-build.log
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GaugeCore.olean
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Core.olean
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo ORIGINAL_OAI_GAUGECORE_TRANSITIVE_IMPORTS_COMPILED__NO_NEW_BFSS_THEOREM

      - name: Save exact isolated OAI compiled source layer for reuse
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
          key: bfss-s1v19-isolated-oai-gaugecore-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve first causal diagnostics even on infrastructure failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v19-original-oai-cold-${{ github.run_id }}
          path: /tmp/bfss-s1v19-original/
          if-no-files-found: warn
          retention-days: 14
