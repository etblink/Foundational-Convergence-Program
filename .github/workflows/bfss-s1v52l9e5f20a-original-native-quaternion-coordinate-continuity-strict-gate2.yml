name: BFSS S1V52L9E5F20A Original Native Quaternion Coefficient Continuity Strict Gate 2

# Research branch isolated; source/audit commits do not trigger this gate.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s1v52l9e5f20a-original-native-quaternion-coordinate-continuity-strict-gate2.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v52l9e5f20a-native-original-quaternion-continuity-gate2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-original-quaternion-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - name: Checkout original FCP research sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout immutable original upstream BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Strict F20A real original-source pins and Mathlib manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v52l9e5f20a
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          data=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in data['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52L9E5F20AOriginalNativeQuaternionCoordinateContinuityProbe.lean)" = f76b71b1b47227bd75727b997064e381f016e913 || { echo F20A_ORIGINAL_SOURCE_SHA_FAIL=SU2BFSSPhysicalDomainS1V52L9E5F20AOriginalNativeQuaternionCoordinateContinuityProbe; exit 1; }
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52L9E5F19AOriginalNativeFockFullL2GaugePhysicalBridgeProbe.lean)" = 5218ba3e5f831d0c991bbb0d4c1d296e7882fab8 || { echo F20A_ORIGINAL_SOURCE_SHA_FAIL=SU2BFSSPhysicalDomainS1V52L9E5F19AOriginalNativeFockFullL2GaugePhysicalBridgeProbe; exit 1; }
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52L7C7OriginalNativeEulerWitnessAndSpinHomProbe.lean)" = 581dd3f565f4b32260470f51bf240deac057c1a8 || { echo F20A_ORIGINAL_SOURCE_SHA_FAIL=SU2BFSSPhysicalDomainS1V52L7C7OriginalNativeEulerWitnessAndSpinHomProbe; exit 1; }
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52C1OriginalNativeGaugeQuaternionCoordinatesProbe.lean)" = bbb6fd81e68787d236a9919c3a7675230e899818 || { echo F20A_ORIGINAL_SOURCE_SHA_FAIL=SU2BFSSPhysicalDomainS1V52C1OriginalNativeGaugeQuaternionCoordinatesProbe; exit 1; }
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52B1SourcePauliQuaternionMatrixMultiplicationProbe.lean)" = 8a5558fa127893b6bbb971a8047df4840d74e760 || { echo F20A_ORIGINAL_SOURCE_SHA_FAIL=SU2BFSSPhysicalDomainS1V52B1SourcePauliQuaternionMatrixMultiplicationProbe; exit 1; }
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52B2Original48CliffordQuaternionPolynomialMulProbe.lean)" = 164add0b3a17b9d5417aa3595de841ad5eee33f4 || { echo F20A_ORIGINAL_SOURCE_SHA_FAIL=SU2BFSSPhysicalDomainS1V52B2Original48CliffordQuaternionPolynomialMulProbe; exit 1; }
          target=experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52L9E5F20AOriginalNativeQuaternionCoordinateContinuityProbe.lean
          committed="$(git rev-parse "HEAD:$target")"
          filtered="$(git hash-object --path="$target" "$target")"
          raw="$(git hash-object --no-filters "$target")"
          echo "F20A_SOURCE_PIN expected=f76b71b1b47227bd75727b997064e381f016e913 committed=$committed filtered=$filtered raw=$raw"
          test "$committed" = "f76b71b1b47227bd75727b997064e381f016e913" && test "$filtered" = "f76b71b1b47227bd75727b997064e381f016e913" && test "$raw" = "f76b71b1b47227bd75727b997064e381f016e913"
          echo F20A_STRICT_REAL_SOURCE_PREFLIGHT_PASS

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore immutable original Lean and Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v52l9e5f20a/toolchain.log; then
              ok=true; break
            fi
            echo F20A_PINNED_LEAN_RETRY_$attempt | tee -a /tmp/bfss-s1v52l9e5f20a/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo F20A_PINNED_LEAN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v52l9e5f20a/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo F20A_PINNED_LEAN_MATHLIB_PASS

      - name: Restore accepted F19A native Spin48 FullL2 cache
        id: cacheF19A
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v52l9e5f19a-original-full-l2-physical-bridge-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed if qualified F19A and native quaternion dependencies missing
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.cacheF19A.outputs.cache-hit }}" = true || { echo F20A_STRICT_QUALIFIED_F19A_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/Core.olean || { echo F20A_PINNED_ORIGINAL_BFSS_CORE_MISSING; exit 1; }
          for stem in SU2BFSSPhysicalDomainS1V52L9E5F19AOriginalNativeFockFullL2GaugePhysicalBridgeProbe SU2BFSSPhysicalDomainS1V52L7C7OriginalNativeEulerWitnessAndSpinHomProbe SU2BFSSPhysicalDomainS1V52C1OriginalNativeGaugeQuaternionCoordinatesProbe SU2BFSSPhysicalDomainS1V52B1SourcePauliQuaternionMatrixMultiplicationProbe SU2BFSSPhysicalDomainS1V52B2Original48CliffordQuaternionPolynomialMulProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "F20A_REQUIRED_QUALIFIED_ORIGINAL_OLEAN_MISSING=$stem"; exit 1; }
          done
          echo F20A_EXACT_NATIVE_SPIN48_AND_F19A_OLEANS_READY

      - name: Compile true source SU2 quaternion four-coordinate continuity
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=SU2BFSSPhysicalDomainS1V52L9E5F20AOriginalNativeQuaternionCoordinateContinuityProbe
          cp "../../experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V52L9E5F20AOriginalNativeQuaternionCoordinateContinuityProbe.lean" "$stem.lean"
          timeout 660s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v52l9e5f20a/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean" || { echo F20A_FRESH_OLEAN_NOT_CREATED; exit 1; }
          python3 - <<'PY'
          import pathlib,re
          stem="SU2BFSSPhysicalDomainS1V52L9E5F20AOriginalNativeQuaternionCoordinateContinuityProbe"
          ns="FCP.BFSSS1V52L9E5F20A"
          root="originalNativeQuaternionCoefficients_continuous"
          source=pathlib.Path(stem+'.lean').read_text()
          log=pathlib.Path('/tmp/bfss-s1v52l9e5f20a',stem+'.log').read_text()
          assert re.findall(r'^namespace (\S+)',source,re.M)==[ns]
          assert re.findall(r'^theorem (\S+)',source,re.M)==[root]
          assert re.findall(r'^#print axioms (\S+)',source,re.M)==[root]
          rr=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          results={k:{v.strip() for v in axioms.split(',') if v.strip()} for k,axioms in rr}
          assert len(rr)==len(results)==1,rr
          key=ns+'.'+root
          assert key in results and results[key]<={'propext','Classical.choice','Quot.sound'},(key,results)
          assert 'error:' not in log and 'sorryAx' not in log and 'unknownIdentifier' not in log,log[-9000:]
          print('F20A_SOURCE_QUATERNION_FOUR_REAL_COEFFICIENTS_CONTINUOUS_STRICT_ONE_ROOT_PASS')
          PY

      - name: Save qualified original native quaternion coefficient continuity cache
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v52l9e5f20a-native-quaternion-coordinate-continuity-v2-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve F20A source-continuity logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v52l9e5f20a-continuity-${{ github.run_id }}
          path: /tmp/bfss-s1v52l9e5f20a
          if-no-files-found: ignore
