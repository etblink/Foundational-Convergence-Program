      - name: Fail-closed accepted Hamiltonian and actual independent graph imports
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.h1cache.outputs.cache-hit }}" = true || { echo H2A_EXACT_QUALIFIED_H1_CACHE_MISSING; exit 1; }
          base=upstream-math/lean/.lake/build/lib/lean
          for stem in SU2BFSSPhysicalDomainL6H5E8BHOriginalHistoricalPairedHamiltonianEqualityProbe SU2BFSSPhysicalDomainL6H5E8BFOriginalSourceGraphAndPairedHamiltonianProbe FCPM4F8OriginalNamedFullPhysicalGraphDE4 FCPIndependentPhysicalUnitary; do
            test -s "$base/$stem.olean" || { echo "H2A_MISSING_PARENT_OLEAN=$stem"; exit 1; }
          done
          echo M4F9_H2A_EXACT_H1_DE4_AND_PHYSICAL_UNITARY_PARENT_OLEANS_PASS

      - name: Fresh compile and strictly validate native physical PiLp2 output Hilbert unitary
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=FCPM4F9H2APhysicalHilbertOutputUnitary
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          timeout 240s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-m4f9-h2a-gate2/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/bfss-m4f9-h2a-gate2/FCPM4F9H2APhysicalHilbertOutputUnitary.log').read_text()
          roots=['independentPhysicalHilbertOutputUnitary',
                 'independentPhysicalHilbertOutputUnitary_apply',
                 'independentPhysicalHilbertOutputUnitary_norm']
          prefix='FCP.M4F9H2APhysicalHilbertOutputUnitary.'
          reports=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          got={n:{v.strip() for v in a.split(',') if v.strip()} for n,a in reports}
          assert len(reports)==len(got)==3 and set(got)=={prefix+r for r in roots},('H2A_NOT_THREE_EXACT_REPORTS',reports)
          for n,axioms in got.items():
              assert axioms<={'propext','Classical.choice','Quot.sound'},(n,axioms)
          # Lake emits repository-dirty warnings for bundled dependency
          # checkout directories before Lean starts. Admit ONLY the exact
          # known package diagnostics; preserve the raw log without filtering.
          # Every other warning, including any Lean declaration warning,
          # remains fatal. -DwarningAsError=true remains in the Lean command.
          known={'belyi','formal-schemes','elliptic-curves',
                 'tempered-fundamental-groups','oka','orbicurve-cores',
                 'pi1','heights','genl','tate-curves-theta','iut'}
          clean=[]
          removed=0
          for line in s.splitlines():
              m=re.fullmatch(r"warning: ([a-z0-9-]+): repository '([^']+)' has local changes",line)
              if m:
                  package,path=m.groups()
                  if package in known and path.endswith(
                      '/upstream-math/lean/.lake/packages/'+package):
                      removed+=1
                      continue
              clean.append(line)
          checked='\\n'.join(clean)
          assert not any(x in checked for x in
              ('sorryAx','error:','warning:','unknownIdentifier')),checked[-5000:]
          print('M4F9_H2A_LAKE_DEPENDENCY_WARNINGS_EXACTLY_CLASSIFIED',removed)
          print('M4F9_H2A_NATIVE_SIXTEEN_PHYSICAL_PILP2_OUTPUT_UNITARY_THREE_ROOT_STRICT_PASS')
          PY

