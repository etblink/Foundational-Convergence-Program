        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout original frozen BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: Exact new source S3E1 and inherited S3CD mathematical source checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s3l-s3e1-gate12
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import pathlib,subprocess,json,re
          d=json.loads(pathlib.Path("upstream-math/lean/lake-manifest.json").read_text())
          assert next(x["rev"] for x in d["packages"] if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          cases={
            "experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3CActualMajoranaQuadraticCommutatorProbe.lean":"2eaaffa5e3554d3af2cc694c10dd9ac4e1b0f69f",
            "experiments/openai-math-su2-physical-domain/recovery/SU2BFSSPhysicalDomainS3CActualMajoranaQuadraticCommutatorProbe.lean":"7d3ad2bdce570e4d3b2d7e56fba47f1e81a4b2d6",
            "experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3DActualFermionSpinQuadraticGeneratorProbe.lean":"14fa985ddd24f4fd37db229f7fc87f4303cce4be",
            "experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS3E1ActualSameColorFermionicBilinearCommSourceProbe.lean":"fba5fa3b72c80c396a8b9cccb0dccfecb9e41331"
          }
          for path,sha in cases.items():
              assert subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip()==sha
              assert subprocess.check_output(["git","hash-object","--no-filters",path],text=True).strip()==sha
          base=pathlib.Path("experiments/openai-math-su2-physical-domain")
          src=(base/"SU2BFSSPhysicalDomainS3E1ActualSameColorFermionicBilinearCommSourceProbe.lean").read_text()
          assert src.startswith("import SU2BFSSPhysicalDomainS3DActualFermionSpinQuadraticGeneratorProbe")
          assert re.findall(r"(?m)^#print axioms (\S+)",src)==["pairedFermionSpinQuadraticColor_comm_same_color_raw"]
          assert "pairedTheta_quadratic_commutator_same_color" in src
          assert not re.search(r"(?m)^[ \t]*(?:axiom|sorry|admit)(?:\s|$)|\bsorryAx\b",src)
          old=(base/"SU2BFSSPhysicalDomainS3CActualMajoranaQuadraticCommutatorProbe.lean").read_text()
          new=(base/"recovery/SU2BFSSPhysicalDomainS3CActualMajoranaQuadraticCommutatorProbe.lean").read_text()
          assert old.replace("simp only [if_neg hnot, if_neg hnot', sub_zero] at h","simp only [ite_eq_right hnot, ite_eq_right hnot', sub_zero] at h")==new
          print("BFSS_S3L_S3E1_GATE12_EXACT_SOURCE_IMPORT_AND_CAR_PIN_PASS")
          PY
      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
      - name: Restore frozen Lean and exact Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1; then ok=true; break; fi
            sleep $((attempt * 6))
          done
