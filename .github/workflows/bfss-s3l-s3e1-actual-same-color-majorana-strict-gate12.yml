  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s3l-s3e1-actual-same-color-majorana-strict-gate12.yml
permissions:
  contents: read
concurrency:
  group: bfss-s3l-s3e1-source-gate12-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-source-fock-same-color:
