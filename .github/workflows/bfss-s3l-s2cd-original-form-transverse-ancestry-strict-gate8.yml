          for stem in SU2BFSSPhysicalDomainS2ASpatialWedgePotentialProbe SU2BFSSPhysicalDomainS2BPotentialChargeEnergyBridgeProbe SU2BFSSG4K9COrderedPairCoefficientProbe SU2BFSSG4K9DSourcePotentialMultiplierProbe; do
            test -s "$base/$stem.olean" || { echo BFSS_S3L_S2CD_GATE8_MISSING_ACCEPTED_OLEAN=$stem; exit 1; }
          done
          echo BFSS_S3L_S2CD_GATE8_VERIFIED_IMPORTED_SOURCE_OLEANS
      - name: Verify pinned original MassiveMoments module is importable
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          if ! test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/MassiveMoments.olean; then
            echo BFSS_S3L_S2CD_BUILD_PINNED_UPSTREAM_MASSIVE_MOMENTS
            timeout 270s lake build OAI.MathematicalPhysics.BFSS.MassiveMoments 2>&1 | tee /tmp/bfss-s3l-s2cd-gate8/massive-moments.log
          fi
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/MassiveMoments.olean
          echo BFSS_S3L_S2CD_ORIGINAL_MASSIVE_MOMENTS_IMPORT_READY
      - name: Strictly compile unchanged original S2C then S2D and check eight theorem roots
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          root=experiments/openai-math-su2-physical-domain
          base=upstream-math/lean
          for stem in SU2BFSSPhysicalDomainS2CCoreFormLinearFermionBoundProbe SU2BFSSPhysicalDomainS2DTransverseSliceWedgeProbe; do
            cp "$root/$stem.lean" "$base/$stem.lean"
          done
          cd "$base"
          for stem in SU2BFSSPhysicalDomainS2CCoreFormLinearFermionBoundProbe SU2BFSSPhysicalDomainS2DTransverseSliceWedgeProbe; do
            echo "BFSS_S3L_S2CD_SOURCE_COMPILING=$stem"
            timeout --signal=TERM --kill-after=5s 190s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s3l-s2cd-gate8/$stem.log"
            test -s ".lake/build/lib/lean/$stem.olean"
          done
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path("/tmp/bfss-s3l-s2cd-gate8")
          tests=[
            ("SU2BFSSPhysicalDomainS2CCoreFormLinearFermionBoundProbe","FCP.BFSSSU2PhysicalDomainS2C",[
              "pairedFermionRemainder_linearLower",
              "pairedCoreForm_ge_sourcePotential_minusLinearFermion",
              "pairedCoreForm_ge_spatialWedges_minusLinearFermion"]),
            ("SU2BFSSPhysicalDomainS2DTransverseSliceWedgeProbe","FCP.BFSSSU2PhysicalDomainS2D",[
              "spatialWedgeSq_lagrange",
              "spatialWedgeSq_longitudinalShift",
              "spatialWedgeSq_transverse",
              "sourceSpatialWedgeSq_eq_spatialWedgeSq",
              "pairedPotential_ge_transverseSlice_color0"]),
          ]
          allowed={"propext","Classical.choice","Quot.sound"}
          pkgstatus=re.compile(r"warning: ([a-z0-9-]+): repository '([^']+)' has local changes")
          for stem,namespace,names in tests:
              s=(root/(stem+".log")).read_text()
              reports=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
              assert [name for name,_ in reports]==[namespace+"."+name for name in names],("ROOT_REPORTS",stem,reports)
              for name,raw in reports:
                  axioms={x.strip() for x in raw.split(",") if x.strip()}
                  assert axioms<=allowed,("FORBIDDEN_AX",name,axioms)
              for line in s.splitlines():
                  m=pkgstatus.fullmatch(line)
                  if m and m.group(2).endswith("/upstream-math/lean/.lake/packages/"+m.group(1)):
                      continue
                  assert "warning:" not in line,("SOURCE_WARNING",stem,line)
              assert not any(t in s for t in ("sorryAx","error:","unknownIdentifier")),("COMPILER_FAIL",stem,s[-2000:])
              print("BFSS_S3L_S2CD_ACTUAL_SOURCE_THEOREMS_STRICT_PASS",stem,len(reports))
          PY
      - name: Save qualified S2C S2D exact source form and transverse ancestry
        if: success()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
