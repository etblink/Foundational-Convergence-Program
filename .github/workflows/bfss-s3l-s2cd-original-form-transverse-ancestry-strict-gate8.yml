name: BFSS S3L S2CD Original Form and Transverse Strict Gate 8

# Requalify two ORIGINAL historical S2A and S2B proofs individually.
# Never conflate G4 historical accepted source vs warning-free recovery.
# Inspect recovered G4 cache by lookup-only: never overlay incompatible
# K9A import profiles onto modern accepted H4G1B proof objects.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-s3l-s2cd-original-form-transverse-ancestry-strict-gate8.yml
permissions:
  contents: read
concurrency:
  group: bfss-s3l-s2cd-original-source-gate8-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-s2a-s2b:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout frozen FCP research source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout immutable BFSS source mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: Source-exact original S2C S2D and historical G4K9C K9D
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s3l-s2cd-gate8
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import pathlib,subprocess,json,re
          d=json.loads(pathlib.Path("upstream-math/lean/lake-manifest.json").read_text())
          assert next(x["rev"] for x in d["packages"] if x["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          roots=[
              ("experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS2ASpatialWedgePotentialProbe.lean","2574f86c7e0c99a1275ef55b51bb0c19a217cd5b"),
              ("experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS2BPotentialChargeEnergyBridgeProbe.lean","0c72a36548d116344bb5138fb9076393aceb9781"),
              ("experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS2CCoreFormLinearFermionBoundProbe.lean","4f70aa506efdc6ccb821901ed4fc258139f4568b"),
              ("experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS2DTransverseSliceWedgeProbe.lean","a5695d5942006a6bd59db3fe621a06d15b3eccf5"),
              ("experiments/openai-math-su2-concrete-potential/SU2BFSSG4K9COrderedPairCoefficientProbe.lean","de0c447a73990b1beb271fb2afc14dc5b4e20318"),
              ("experiments/openai-math-su2-concrete-potential/SU2BFSSG4K9DSourcePotentialMultiplierProbe.lean","0695420e4e1d6fbe8accdc4aee9df6dd2d52d1ca"),
          ]
          for file,sha in roots:
              x=pathlib.Path(file)
              assert subprocess.check_output(["git","rev-parse","HEAD:"+file],text=True).strip()==sha
              assert subprocess.check_output(["git","hash-object","--no-filters",file],text=True).strip()==sha
          a=pathlib.Path(roots[2][0]).read_text()
          b=pathlib.Path(roots[3][0]).read_text()
          assert len(re.findall(r"(?m)^#print axioms \S+",a))==3
          assert len(re.findall(r"(?m)^#print axioms \S+",b))==5
          assert a.startswith("import SU2BFSSPhysicalDomainS2BPotentialChargeEnergyBridgeProbe")
          assert "import SU2BFSSG4K9DSourcePotentialMultiplierProbe" in a
          assert "import OAI.MathematicalPhysics.BFSS.MassiveMoments" in a
          assert b.startswith("import SU2BFSSPhysicalDomainS2CCoreFormLinearFermionBoundProbe")
          assert "import SU2BFSSG4K9COrderedPairCoefficientProbe" in b
          for content in (a,b):
              assert not re.search(r"(?m)^[ \t]*(?:axiom|sorry|admit)(?:\s|$)|\bsorryAx\b",content)
          print("BFSS_S3L_S2CD_GATE8_PINNED_ORIGINAL_SOURCES_AND_IMPORTED_G4_PASS")
          PY
      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
      - name: Restore frozen Lean and exact Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true
          cd upstream-math/lean
          timeout 1080s lake exe cache get > /tmp/bfss-s3l-s2cd-gate8/mathlib.log 2>&1 || {
            tail -n 100 /tmp/bfss-s3l-s2cd-gate8/mathlib.log
            exit 1
          }
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
