      - name: Verify qualified prior source modules and historical G4K9C K9D imports
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.parent.outputs.cache-hit }}" = true || { echo BFSS_S3L_S2CD_GATE8_MISSING_ACCEPTED_S2AB_CACHE; exit 1; }
