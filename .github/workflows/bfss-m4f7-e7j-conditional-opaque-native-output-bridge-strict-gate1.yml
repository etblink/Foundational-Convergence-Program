      - name: Verify three strictly accepted caches and exact frozen E7J theorem
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.dcache.outputs.cache-hit }}" = true || { echo E7J_GATE1_ACCEPTED_E7D_CACHE_MISSING; exit 1; }
          test "${{ steps.icache.outputs.cache-hit }}" = true || { echo E7J_GATE1_ACCEPTED_E7I_CACHE_MISSING; exit 1; }
          test "${{ steps.hcache.outputs.cache-hit }}" = true || { echo E7J_GATE1_ACCEPTED_E7H_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in OAI/MathematicalPhysics/BFSS/Core OAI/MathematicalPhysics/BFSS/GaugeCore FCPIndependentPhysicalSpace FCPIndependentSmoothCore FCPIndependentChargeVectorL2 FCPM4F7IndependentLiteralRestrictedGraphBridgeE3 FCPM4F7IndependentClosedChargePhysicalInputE6 FCPM4F7IndependentChargeOutputTypedE7A FCPM4F7GenericClosedRangeOutputsE7G FCPM4F7OpaqueLiteralGraphInterfaceE7D FCPM4F7IndependentPhysicalOutputPredicateE7I FCPM4F7GenericOpaqueOutputConstraintE7H; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo E7J_GATE1_ACCEPTED_PARENT_OLEAN_MISSING=$stem; exit 1; }
          done
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          root=Path('experiments/openai-math-su2-physical-domain')
          pins={
            'FCPM4F7ConditionalPhysicalOutputBridgeE7J.lean':'222289ff56212107d16645ea18402b5d4932915b',
            'FCPM4F7GenericOpaqueOutputConstraintE7H.lean':'7b403433ce79ac12eb5d5fbf2f13b4dd01240f9d',
            'FCPM4F7IndependentPhysicalOutputPredicateE7I.lean':'054e7e18a93fdfe225fae59c19efb7566667ad7e',
            'FCPM4F7OpaqueLiteralGraphInterfaceE7D.lean':'8f8545753cb4643d62e06c075e86222d59a2e4d3'
          }
          for name,sha in pins.items():
            path=str(root/name)
            assert subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()==sha,(name,'TREE_SOURCE')
            assert subprocess.check_output(['git','hash-object','--no-filters',path],text=True).strip()==sha,(name,'CHECKOUT_SOURCE')
          src=(root/'FCPM4F7ConditionalPhysicalOutputBridgeE7J.lean').read_text()
          assert src.startswith('import FCPM4F7GenericOpaqueOutputConstraintE7H\nimport FCPM4F7IndependentPhysicalOutputPredicateE7I\nimport FCPM4F7OpaqueLiteralGraphInterfaceE7D\n')
          assert re.findall(r'^namespace (\S+)',src,re.M)==['FCP.M4F7ConditionalPhysicalOutputBridgeE7J']
          assert re.findall(r'^theorem (\S+)',src,re.M)==['literalRestrictedClosedGraph_subset_allPhysicalOutputs_of_core']
          assert re.findall(r'^#print axioms (\S+)',src,re.M)==['literalRestrictedClosedGraph_subset_allPhysicalOutputs_of_core']
          assert 'FCP.M4F7GenericOpaqueOutputConstraintE7H.opaque_closed_product_range_subset_allOutputConstraint' in src
          assert 'FCP.M4F7OpaqueLiteralGraphInterfaceE7D.literalRestrictedClosedGraphSet_eq' in src
          assert 'FCP.M4F7IndependentPhysicalOutputPredicateE7I.mem_independentAllSixteenOutputsPhysicalSet_iff' in src
          code=src.split('noncomputable section',1)[1]
          assert 'deformedModelGraph' not in code
          assert not re.search(r'(?m)^[ \t]*(?:sorry|admit|axiom)\b|\bsorryAx\b',code)
          assert not re.search(r'(?m)^[ \t]*set_option[ \t]+maxRecDepth',code)
          print('M4F7_E7J_GATE1_THREE_STRICT_QUALIFIED_PARENTS_EXACT_CONDITIONAL_NATIVE_OUTPUT_PREFLIGHT_PASS')
          PY

      - name: Fresh strict actual E7J conditional independent graph output inclusion
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=FCPM4F7ConditionalPhysicalOutputBridgeE7J
          cp "$GITHUB_WORKSPACE/experiments/openai-math-su2-physical-domain/$stem.lean" "upstream-math/lean/$stem.lean"
          cd upstream-math/lean
          mkdir -p .lake/build/lib/lean
          /usr/bin/time -f 'E7J_RESOURCE_TIME %e CPU %P MAX_RSS_KB %M' -o "/tmp/bfss-m4f7-e7j-conditional-opaque-native-output-bridge-strict-gate1/$stem.resource" \
            timeout --signal=TERM --kill-after=5s 105s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" >"/tmp/bfss-m4f7-e7j-conditional-opaque-native-output-bridge-strict-gate1/$stem.log" 2>&1 || {
