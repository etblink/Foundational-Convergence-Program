name: BFSS M4A Independent Original Real Clifford Bridge Strict Gate 2

# Single source-exact gate: only this workflow path on the isolated research
# branch can trigger; source/audit-only changes do not trigger this gate.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-m4a-independent-source-clifford-bridge-strict-gate2.yml

permissions:
  contents: read

concurrency:
  group: bfss-m4a-independent-real-clifford-gate2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  independent-original-clifford-intertwining:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout isolated research sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout immutable original BFSS mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Fail-closed original-source and candidate provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-m4a-gate2
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY_CHECK'
          import pathlib,hashlib,subprocess,json
          d=json.loads(pathlib.Path('upstream-math/lean/lake-manifest.json').read_text())
          assert next(p['rev'] for p in d['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          root=pathlib.Path('experiments/openai-math-su2-physical-domain')
          old={
            'SU2BFSSPhysicalDomainS1V52M3JIndependentUnitaryExistenceProbe.lean':'1cd42b286a18abf6e7f8c2348949f8de3748151c',
            'FCPM3JIndependentCliffordAction.lean':'6f9312093df1fa155203ca2c4371237932298e20',
            'SU2BFSSPhysicalDomainS1V52L9E5C1OriginalFockCliffordAlgebraUniversalLiftProbe.lean':'91313c5e622577fd12fa4ce7ec59f457a816ae3a',
            'SU2BFSSPhysicalDomainS1V52L9E4OriginalFockRealLinearCliffordGeneratorMapProbe.lean':'b0035401f5b75b4f9d07622842b1fb05de5cac8d',
          }
          for name,sha in old.items():
            assert subprocess.check_output(['git','rev-parse','HEAD:'+str(root/name)],text=True).strip()==sha, ('ACCEPTED_SOURCE_CHANGED',name)
          new={
            'FCPIndependentCliffordIntertwining.lean':'0ac8b615b2006895acd7d74e82a59099848b3c1f54388353a7627d21896b4a38',
            'FCPIndependentSpinRealization.lean':'08ea65c3496d8e64a49a2c8205326e48ca7d2fd2625173c40255f1d03a3fb971',
            'FCPIndependentMajoranaAction.lean':'9f15de012b5a9ac2410f21beadb775df8226d8d0cd6b5c9f833b25a2838f4ff0',
            'FCPIndependentOriginalCliffordBridge.lean':'9070514fc8eac01bb6873fbbc40b0bed1dedae0e413a98b5875191f5275b4393',
          }
          for name,sha in new.items():
            b=(root/name).read_bytes()
            assert hashlib.sha256(b).hexdigest()==sha, ('M4A_CANDIDATE_CHANGED',name)
            assert subprocess.check_output(['git','hash-object','--no-filters',str(root/name)],text=True).strip()==subprocess.check_output(['git','rev-parse','HEAD:'+str(root/name)],text=True).strip(),('WORKTREE_DIRTY',name)
          print('M4A_SOURCE_EXACT_PROVENANCE_PASS')
          PY_CHECK

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore original Lean 4.34.1 and pinned Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-m4a-gate2/toolchain.log; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo M4A_PINNED_LEAN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-m4a-gate2/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo M4A_PINNED_TOOLCHAIN_PASS

      - name: Restore accepted original Fock real Clifford algebra cache
        id: cacheC1
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v52l9e5c1-original-fock-clifford-algebra-lift-v3-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Restore accepted M3J independent original unitary cache
        id: cacheM3J
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM3*.olean
          key: bfss-fcp-m3j-independent-original-unitary-v3-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Confirm both qualified source closures before Lean
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.cacheC1.outputs.cache-hit }}" = true || { echo M4A_ACCEPTED_C1_CACHE_MISSING; exit 1; }
          test "${{ steps.cacheM3J.outputs.cache-hit }}" = true || { echo M4A_ACCEPTED_M3J_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in \
            OAI/MathematicalPhysics/BFSS/Core \
            SU2BFSSPhysicalDomainS1V52L9E5C1OriginalFockCliffordAlgebraUniversalLiftProbe \
            SU2BFSSPhysicalDomainS1V52L9E4OriginalFockRealLinearCliffordGeneratorMapProbe \
            SU2BFSSPhysicalDomainS1V52M3JIndependentUnitaryExistenceProbe \
            FCPM3JIndependentCliffordAction; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "M4A_ACCEPTED_PARENT_OLEAN_MISSING=$stem"; exit 1; }
          done
          echo M4A_BOTH_ACCEPTED_SOURCE_CACHE_CLOSURES_READY

      - name: Compile three new generic independent modules fresh
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          src="$GITHUB_WORKSPACE/experiments/openai-math-su2-physical-domain"
          for stem in FCPIndependentCliffordIntertwining FCPIndependentSpinRealization FCPIndependentMajoranaAction; do
            cp "$src/$stem.lean" "$stem.lean"
            timeout 600s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-m4a-gate2/$stem.log"
            test -s ".lake/build/lib/lean/$stem.olean"
          done
          echo M4A_GENERIC_MODULES_FRESH_LEAN_COMPILE_PASS

      - name: Strictly compile one original-source Clifford bridge
        shell: bash
        timeout-minutes: 14
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=FCPIndependentOriginalCliffordBridge
          cp "$GITHUB_WORKSPACE/experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
          timeout 720s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-m4a-gate2/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY_ASSERT'
          from pathlib import Path
          import re
          allow={'propext','Classical.choice','Quot.sound'}
          names={
            'FCPIndependentCliffordIntertwining':'FCP.IndependentCliffordIntertwining',
            'FCPIndependentSpinRealization':'FCP.IndependentSpinRealization',
            'FCPIndependentMajoranaAction':'FCP.IndependentMajoranaAction',
            'FCPIndependentOriginalCliffordBridge':'FCP.IndependentOriginalCliffordBridge',
          }
          for module,namespace in names.items():
            src=Path(module+'.lean').read_text()
            log=Path('/tmp/bfss-m4a-gate2',module+'.log').read_text()
            expected=[namespace+'.'+n for n in re.findall(r'^#print axioms ([^\s]+)',src,re.M)]
            reports=re.findall(r"'([^'\n]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
            actual={n:{a.strip() for a in v.split(',') if a.strip()} for n,v in reports}
            assert len(reports)==len(actual)==len(expected) and set(actual)==set(expected),(module,'AXIOM_REPORT_MISMATCH',expected,reports)
            assert all(v <= allow for v in actual.values()),(module,'FORBIDDEN_AXIOM',actual)
            assert 'sorryAx' not in log and 'error:' not in log and 'unknownIdentifier' not in log,(module,'COMPILER_ERROR')
          target='FCP.IndependentOriginalCliffordBridge.independent_original_clifford_intertwining'
          assert target in actual and actual[target] <= allow
          assert re.findall(r'^theorem ([^\s]+)',Path('FCPIndependentOriginalCliffordBridge.lean').read_text(),re.M)==['originalLabelledTheta_CAR','independent_original_axis_intertwining','independent_original_clifford_intertwining']
          print('M4A_ORIGINAL_INDEPENDENT_CLIFFORD_INTERTWINING_ONE_ROOT_STRICT_PASS')
          PY_ASSERT

      - name: Save qualified strict M4A Clifford bridge cache
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPM3*.olean
            upstream-math/lean/.lake/build/lib/lean/FCPIndependent*.olean
          key: bfss-fcp-m4a-independent-real-clifford-bridge-v2-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve exact original source and generic diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-m4a-gate2-${{ github.run_id }}
          path: /tmp/bfss-m4a-gate2
          if-no-files-found: ignore
