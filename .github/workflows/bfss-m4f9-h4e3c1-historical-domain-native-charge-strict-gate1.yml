          test "$(git hash-object --no-filters experiments/openai-math-su2-physical-domain/FCPM4F9H4E3B2GenericAdjointWeakFormHistoricalAction.lean)" = ea73b16cbfbd7dc4d30c21a09320685f20e1346c
