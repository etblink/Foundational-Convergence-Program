name: BFSS M4F9 H4E3C1 Historical Hamiltonian Domain to Native Charge Strict Gate 1
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-m4f9-h4e3c1-historical-domain-native-charge-strict-gate1.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bfss-m4f9-h4e3c1-historical-native-domain-gate1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-hilbert-coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
