      - name: Checkout exact research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout pinned original mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: H4E3C1 source-exact historical-to-native-domain preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-m4f9-h4e3c1-gate1
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json,pathlib,re,subprocess
          d=json.loads(pathlib.Path('upstream-math/lean/lake-manifest.json').read_text())
          assert next(x['rev'] for x in d['packages'] if x['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          p=pathlib.Path('experiments/openai-math-su2-physical-domain/FCPM4F9H4E3C1HistoricalDomainNativeCharge.lean')
          h='b41c4a939ec4b999af801ae06e0e846196b43fde'
          assert subprocess.check_output(['git','rev-parse','HEAD:'+str(p)],text=True).strip()==h
          assert subprocess.check_output(['git','hash-object','--no-filters',str(p)],text=True).strip()==h
          s=p.read_text()
          assert s.startswith('import FCPM4F9H4E3B2GenericAdjointWeakFormHistoricalAction'+chr(10))
          assert re.findall(r'(?m)^namespace (\S+)',s)==['FCP.M4F9H4E3C1HistoricalDomainNativeCharge']
          assert re.findall(r'(?m)^#print axioms (\S+)',s)==[
            'historicalHamiltonian_domain_subset_nativeCharge']
          assert 'naturalComp_domain_le' in s and 'pairedOriginalPhysicalNormalizedHamiltonian_eq_historical' in s
          assert 'pairedOriginalAYAmbientNative_fullNaturalDomain_iff' in s
          assert not re.search(r'(?m)^\s*(?:sorry|admit|axiom)\b|\bsorryAx\b',s)
          print('BFSS_H4E3C1_EXACT_HISTORICAL_NATIVE_CHARGE_DOMAIN_PREFLIGHT_PASS')
          PY
      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
      - name: Restore frozen Lean and exact Mathlib
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true
          cd upstream-math/lean
          timeout 1080s lake exe cache get > /tmp/bfss-m4f9-h4e3c1-gate1/mathlib.log 2>&1 || {
            tail -n 100 /tmp/bfss-m4f9-h4e3c1-gate1/mathlib.log
            exit 1
          }
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
