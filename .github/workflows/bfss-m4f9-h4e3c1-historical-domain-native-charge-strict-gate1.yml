          test "$(git hash-object --no-filters experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8BHOriginalHistoricalPairedHamiltonianEqualityProbe.lean)" = 05a540772eb1b0e5c8570fd4eca101be76bbdd9b
          base=upstream-math/lean/.lake/build/lib/lean
          for stem in FCPM4F9H4E3B2GenericAdjointWeakFormHistoricalAction FCPM4F9H4E3B1NativeActualAdjointSquareWeakRepresentative FCPM4F9H4E3AOriginalNativeHistoricalHamiltonianWeakForm FCPM4F9H4E2BOriginalAYAmbientNativeFullDomainForm FCPM4F9H4D1OriginalNativeHilbertChargeDomainDense SU2BFSSPhysicalDomainL6H5E8BCOriginalPhysicalChargeNaturalAdjointSquareProbe SU2BFSSPhysicalDomainL6H5E8BFOriginalSourceGraphAndPairedHamiltonianProbe SU2BFSSPhysicalDomainL6H5E8BHOriginalHistoricalPairedHamiltonianEqualityProbe; do
