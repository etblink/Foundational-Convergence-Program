name: BFSS S1V25 Actual Historical Quarter Source48 Matrix Block Entry Strict Gate

# Actual historical L6G6X quarter -> original G3A and S1J 48-real matrix entries.
# Exactly two fresh roots. No separate Spin48 rotor or global lift claimed.
on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v25-historical-quarter-source48-block-entries-strict.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v25-original-source48-historical-quarter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  historical-source48-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact original source candidates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout immutable original upstream OAI mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Verify all source hashes and toolchain pins before expensive setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v25-historical-quarter
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          data=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in data['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          r=experiments/openai-math-su2-physical-domain
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V23OriginalPlusICurveNativeQuarterBridgeProbe.lean")" = cb29eb6261fc50550cc275bceb5b000619d521b7
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1COneParticleSpecialUnitaryProbe.lean")" = c5de7c744744212711780aee2d4f9742c002cd84
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1JActual48RealMajoranaColorActionProbe.lean")" = 3f845ae219586be47fa76aabc3259027b1bb4bae
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V25HistoricalSourceQuarter48BlockEntryProbe.lean")" = 4fe6ec843a1231d601374e98463b474435c7877d
          echo S1V25_NEW_SOURCE_TYPED_QUARTER_MATRIX_BLOB_PINNED

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore pinned Lean 4.34.1 and exact Mathlib sources
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v25-historical-quarter/toolchain.log; then
              ok=true; break
            fi
            echo ORIGINAL_PINNED_LEAN_RETRY_$attempt | tee -a /tmp/bfss-s1v25-historical-quarter/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo PINNED_ORIGINAL_LEAN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v25-historical-quarter/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo S1V25_PINNED_LEAN_MATHLIB_VERIFIED

      - name: Restore accepted S1V24 original 48-real SO48 matrix and S1V23 source quarter cache
        id: accepted_s1v24
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v24-isolated-source-s1c-s1j-original-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed unless exact accepted S1V24 source matrix and historical source quarter are cached
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.accepted_s1v24.outputs.cache-hit }}" = true || { echo ORIGINAL_S1V24_ORIGINAL_MATRIX_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in SU2BFSSPhysicalDomainS1V23OriginalPlusICurveNativeQuarterBridgeProbe SU2BFSSPhysicalDomainL6G6XOriginalSU2GaugeCurveProbe SU2BFSSPhysicalDomainS1COneParticleSpecialUnitaryProbe SU2BFSSPhysicalDomainS1JActual48RealMajoranaColorActionProbe SU2BFSSG4KOriginalGaugeDataQuarterConditionalProbe SU2BFSSG4LNativeQuarterSourceGaugeWitnessProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "S1V25_ORIGINAL_SOURCE_DEPENDENCY_MISSING=$stem"; exit 1; }
          done
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GaugeCore.olean
          echo ORIGINAL_S1V25_ACTUAL_SOURCE48_AND_QUARTER_CACHE_READY

      - name: Compile new source-typed actual historical S1V25 quarter block identities and strictly audit both roots
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=SU2BFSSPhysicalDomainS1V25HistoricalSourceQuarter48BlockEntryProbe
          cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
          timeout 600s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v25-historical-quarter/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean" || { echo S1V25_HISTORICAL_SOURCE48_QUARTER_OLEAN_MISSING; exit 1; }
          python3 - <<'PY'
          import pathlib,re
          stem='SU2BFSSPhysicalDomainS1V25HistoricalSourceQuarter48BlockEntryProbe'
          src=pathlib.Path(stem+'.lean').read_text()
          log=pathlib.Path('/tmp/bfss-s1v25-historical-quarter',stem+'.log').read_text()
          names=re.findall(r'^#print axioms (\S+)',src,re.M)
          expected=['actualHistoricalQuarter_adjointColorMatrix','actualHistoricalQuarter_sourceRealMajoranaMatrix_entry']
          assert names==expected,(stem,names)
          nsm=re.findall(r'^namespace (\S+)',src,re.M)
          assert nsm==['FCP.BFSSS1V25'],nsm
          entries=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          found={name:{a.strip() for a in axs.split(',') if a.strip()} for name,axs in entries}
          assert len(entries)==len(found)==len(expected)==2,(stem,entries)
          allowed={'propext','Classical.choice','Quot.sound'}
          for root in expected:
            key='FCP.BFSSS1V25.'+root
            assert key in found and found[key]<=allowed,(stem,key,found)
          assert 'sorryAx' not in log and 'error:' not in log and 'unknownIdentifier' not in log,(stem,log[-7000:])
          print('S1V25_ACTUAL_HISTORICAL_SOURCE_QUARTER_48_REAL_BLOCK_ENTRIES_2_ROOTS_KERNEL_PASS')
          PY

      - name: Save genuine historical source quarter original 48-real matrix block cache on strict success
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v25-isolated-original-source48-historical-quarter-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve first causal source and pin logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v25-historical-matrix-${{ github.run_id }}
          path: /tmp/bfss-s1v25-historical-quarter/
          if-no-files-found: warn
          retention-days: 14
