name: BFSS Form Original Bracket Derivative Strict Gate 90

# Exact original-source color-bracket affine derivative, NOT the full fermion B equality.
# Direct Lean 4.34.1 compilation with pinned Core / MassiveCoercivity / ColorMatrices ancestry,
# fresh source oleans and exact axiom audit; no E3B/E3C sixfold ancestry.
on:
  push:
    branches:
      - research/openai-math-su2-s1v52-global-lift-scoping-20261019
    paths:
      - .github/workflows/bfss-form-original-bracket-derivative-strict-gate90.yml
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B2OriginalCoordinateBracketDirectionalDerivativeProbe.lean
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-form-original-bracket-gate90-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-source-bracket-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pinned research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout immutable original BFSS Lean mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: Verify exact source identities, source blobs and manifest pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream-math rev-parse HEAD)" = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
          test "$(cat upstream-math/lean/lean-toolchain)" = "leanprover/lean4:v4.34.1"
          test "$(git -C upstream-math rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/Core.lean)" = "9882359ced78b0a3bd7e2f057974bd0a031b3e60"
          test "$(git -C upstream-math rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/MassiveCoercivity.lean)" = "1a9a8fe629e69f3946602a786c2e63c2ca354462"
          test "$(git -C upstream-math rev-parse HEAD:lean/OAI/MathematicalPhysics/BFSS/ColorMatrices.lean)" = "1c1c2a838c48c0aea2a1c1640da5d412f22e3f0c"
          test "$(git rev-parse HEAD:experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B2OriginalCoordinateBracketDirectionalDerivativeProbe.lean)" = "68b3d0c37dcab6fccab57a60eb3cdaa75ef8f48a"
          test "$(git hash-object --no-filters experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B2OriginalCoordinateBracketDirectionalDerivativeProbe.lean)" = "68b3d0c37dcab6fccab57a60eb3cdaa75ef8f48a"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("upstream-math/lean")
          manifest=json.loads((root/"lake-manifest.json").read_text())
          assert next(p["rev"] for p in manifest["packages"] if p["name"]=="mathlib")=="d13f23b723b8a846827a245b89c10fc7d3f11612"
          src=Path("experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B2OriginalCoordinateBracketDirectionalDerivativeProbe.lean").read_text()
          assert src.count("\ntheorem ")==3 and src.count("\n#print axioms ")==3
          assert "originalBosonAffine_coordinate_deriv" in src and "originalCoordinateBracketAll_directional_deriv" in src and "originalCoordinateBracketAll_single_coordinate_deriv" in src
          assert "M.coordinateBracketAll" in src and "M.structureConstant" in src
          assert not any(line.lstrip().startswith(("sorry", "admit", "axiom ")) for line in src.splitlines())
          print("GATE90_ORIGINAL_SOURCE_AND_PROOF_IMMUTABILITY_PASS")
          PY
      - name: Validate self-test and Gate90 YAML before heavy Lean work
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/bfss-gate90-venv
          /tmp/bfss-gate90-venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: PyYAML==6.0.3
          /tmp/bfss-gate90-venv/bin/python tools/bfss_gate_workflow_preflight.py --self-test
          /tmp/bfss-gate90-venv/bin/python tools/bfss_gate_workflow_preflight.py .github/workflows/bfss-form-original-bracket-derivative-strict-gate90.yml
      - name: Restore source pinned Lean and mathlib binary cache
        shell: bash
        timeout-minutes: 19
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-gate90
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1; then ok=true; break; fi
            sleep $((attempt * 6))
          done
          test "$ok" = true
          cd upstream-math/lean
          timeout 920s lake exe cache get > /tmp/bfss-gate90/mathlib-cache.log 2>&1 || {
            tail -n 70 /tmp/bfss-gate90/mathlib-cache.log; exit 1;
          }
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo GATE90_FROZEN_TOOLCHAIN_AND_MATHLIB_PASS
      - name: Freshly compile three original BFSS source ancestor modules and candidate
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p /tmp/bfss-gate90
          python3 - <<'PY'
          import pathlib,subprocess,re
          work=pathlib.Path("upstream-math/lean")
          lib=work/".lake/build/lib/lean"
          for mod in ["OAI.MathematicalPhysics.BFSS.Core","OAI.MathematicalPhysics.BFSS.MassiveCoercivity","OAI.MathematicalPhysics.BFSS.ColorMatrices"]:
              rel=mod.replace(".","/")
              obj=lib/(rel+".olean")
              obj.parent.mkdir(parents=True,exist_ok=True)
              if obj.exists(): obj.unlink()  # fresh source compile, never foreign object
              path=rel+".lean"
              log=pathlib.Path("/tmp/bfss-gate90")/(rel.replace("/","_")+".log")
              with log.open("w") as o:
                  p=subprocess.run(["timeout","120s","lake","env","lean","-DwarningAsError=true","-o",
                                    ".lake/build/lib/lean/"+rel+".olean",path],cwd=work,stdout=o,stderr=subprocess.STDOUT)
              if p.returncode or not obj.is_file() or not obj.stat().st_size:
                  print(log.read_text()[-4000:],flush=True)
                  raise SystemExit("GATE90_ORIGINAL_"+mod+"_FRESH_COMPILE_RED")
              print("GATE90_ORIGINAL_SOURCE_FRESH_COMPILED",mod,obj.stat().st_size,flush=True)
          stem="SU2BFSSPhysicalDomainS4B2OriginalCoordinateBracketDirectionalDerivativeProbe"
          src=pathlib.Path("experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS4B2OriginalCoordinateBracketDirectionalDerivativeProbe.lean")
          (work/(stem+".lean")).write_bytes(src.read_bytes())
          obj=lib/(stem+".olean")
          if obj.exists(): obj.unlink()
          log=pathlib.Path("/tmp/bfss-gate90/strict-candidate.log")
          cmd=["timeout","120s","lake","env","lean","-DwarningAsError=true",
               "-o",".lake/build/lib/lean/"+stem+".olean",stem+".lean"]
          with log.open("w") as o:
              p=subprocess.run(cmd,cwd=work,stdout=o,stderr=subprocess.STDOUT)
          data=log.read_text()
          expected=[
             "FCP.BFSSSU2PhysicalDomainS4B2.originalBosonAffine_coordinate_deriv",
             "FCP.BFSSSU2PhysicalDomainS4B2.originalCoordinateBracketAll_directional_deriv",
             "FCP.BFSSSU2PhysicalDomainS4B2.originalCoordinateBracketAll_single_coordinate_deriv"
          ]
          matched=re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",data)
          allowed={"propext","Classical.choice","Quot.sound"}
          normalized=[(name,{a.strip() for a in s.split(",") if a.strip()}) for name,s in matched]
          # Known pinned Lake-package working-tree-state notices are
          # not candidate Lean diagnostics. Enforce identical package names.
          # Everything else containing "warning:" remains a strict failure.
          lakeNotice=re.compile(
              r"warning: (?P<package>[a-z0-9-]+): repository '[^']*/upstream-math/lean/[.]lake/packages/(?P=package)' has local changes")
          assert lakeNotice.fullmatch(
              "warning: belyi: repository '/tmp/upstream-math/lean/.lake/packages/belyi' has local changes")
          assert not lakeNotice.fullmatch(
              "warning: belyi: repository '/tmp/upstream-math/lean/.lake/packages/iut' has local changes")
          assert not lakeNotice.fullmatch("Candidate.lean:3:1: warning: unused simp argument")
          print("GATE90_LAKE_NOTICE_FILTER_SELF_TEST_PASS",flush=True)
          lakeNotices=[line for line in data.splitlines() if lakeNotice.fullmatch(line)]
          sourceWarnings=[line for line in data.splitlines()
              if "warning:" in line and not lakeNotice.fullmatch(line)]
          print("GATE90_IGNORED_LAKE_PACKAGE_STATE_NOTICES",len(lakeNotices),flush=True)
          print("GATE90_CANDIDATE_SOURCE_WARNINGS",sourceWarnings,flush=True)
          verified=(p.returncode==0 and len(normalized)==3
             and [name for name,_ in normalized]==expected
             and all(ax<=allowed for _,ax in normalized)
             and "sorryAx" not in data and "error:" not in data
             and not sourceWarnings
             and obj.is_file() and obj.stat().st_size>0)
          print("GATE90_COMPILER_EXIT",p.returncode,"AXIOM_REPORTS",normalized,flush=True)
          if not verified:
              print("GATE90_SOURCE_BRACKET_DIRECTIONAL_DERIVATIVE_STRICT_RED",flush=True)
              print(data[-5000:],flush=True)
              raise SystemExit(1)
          print("GATE90_ORIGINAL_SOURCE_BRACKET_DERIVATIVE_THREE_ROOTS_STRICT_PASS",flush=True)
          PY
      - name: Preserve Gate90 original source and candidate compiler logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-form-source-gamma-contraction-gate90-${{ github.run_id }}
          path: |
            /tmp/bfss-gate90/*.log
            upstream-math/lean/.lake/build/lib/lean/SU2BFSSPhysicalDomainS4B2OriginalCoordinateBracketDirectionalDerivativeProbe.olean
          if-no-files-found: warn
