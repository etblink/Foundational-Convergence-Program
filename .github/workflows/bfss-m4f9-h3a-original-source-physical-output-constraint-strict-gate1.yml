      - name: Fail-closed AY BF DE4 and native H2D2B all original parent objects
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.parent.outputs.cache-hit }}" = true || { echo H2D2B_ACCEPTED_H2D2A_CACHE_MISSING; exit 1; }
          base=upstream-math/lean/.lake/build/lib/lean
          for stem in SU2BFSSPhysicalDomainL6H5E8AYOriginalPhysicalHilbertChargeGraphProbe SU2BFSSPhysicalDomainL6H5E8BFOriginalSourceGraphAndPairedHamiltonianProbe FCPM4F9H2D2BNativeHilbertE2ClosedGraph FCPM4F9H2D2ANativeHilbertE2ContinuityAndDensity FCPM4F8IndependentActualE2FullPhysicalDomainDE2B FCPM4F9H2D1ActualE2HilbertOutputDomainEquivalence FCPM4F9H2CActualE2NativeHilbertChargeColumn FCPM4F9H2BPhysicalHilbertE2GraphRebase FCPM4F9H2APhysicalHilbertOutputUnitary FCPM4F8OriginalNamedFullPhysicalGraphDE4 SU2BFSSPhysicalDomainL6H5E8BHOriginalHistoricalPairedHamiltonianEqualityProbe; do
            test -s "$base/$stem.olean" || { echo "H2D2B_QUALIFIED_PARENT_MISSING=$stem"; exit 1; }
          done
          echo M4F9_H3A_ALL_NATIVE_PHYSICAL_E2_CLOSED_ANALYTIC_PARENT_IMPORTS_PASS

      - name: Fresh Lean compile original paired AY source physical-output constraint one root
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=FCPM4F9H3AOriginalPairedPhysicalChargeOutputConstraint
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          timeout 240s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-m4f9-h3a-gate1/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/bfss-m4f9-h3a-gate1/FCPM4F9H3AOriginalPairedPhysicalChargeOutputConstraint.log').read_text()
          name='FCP.M4F9H3AOriginalPairedPhysicalChargeOutputConstraint.pairedOriginalMinimalPhysicalHilbertChargeGraph_outputs_physical'
          reports=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          got={n:{t.strip() for t in a.split(',') if t.strip()} for n,a in reports}
          assert len(reports)==len(got)==1 and set(got)=={name},('H2D2B_WRONG_ROOTS',reports)
          for n,axioms in got.items():
              assert axioms<={'propext','Classical.choice','Quot.sound'},(n,axioms)
          known={'belyi','formal-schemes','elliptic-curves',
                 'tempered-fundamental-groups','oka','orbicurve-cores',
                 'pi1','heights','genl','tate-curves-theta','iut'}
          checked=[]
          removed=0
          for line in s.splitlines():
              m=re.fullmatch(r"warning: ([a-z0-9-]+): repository '([^']+)' has local changes",line)
              if m:
                  package,path=m.groups()
                  if package in known and path.endswith('/upstream-math/lean/.lake/packages/'+package):
                      removed+=1
                      continue
              checked.append(line)
          checked='\n'.join(checked)
          assert not any(t in checked for t in ('sorryAx','error:','warning:','unknownIdentifier')),checked[-5000:]
          print('M4F9_H3A_LAKE_WARNINGS_EXACTLY_CLASSIFIED',removed)
          print('M4F9_H3A_ORIGINAL_AY_PHYSICAL_OUTPUT_CONSTRAINT_ONE_ROOT_STRICT_PASS')
          PY

