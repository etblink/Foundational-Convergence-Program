name: BFSS SU2 Original Minimal Closed Charge Operator

on:
  pull_request:
    branches:
      - research/openai-math-su2-s3k-physical-spin-flow
    paths:
      - .github/workflows/bfss-su2-original-minimal-closed-charge-operator.yml
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AOOriginalPhysicalCoreGraphGeneratorParityProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8APOriginalPhysicalClosedGraphParityProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AQOriginalPhysicalClosedChargeDomainParityProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8ASOriginalPhysicalClosedChargeGraphEnergyParityProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8ATOriginalPiLp16OutputParityUnitaryProbe.lean
      - experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AUOriginalMinimalClosedChargeLinearPMapProbe.lean
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-su2-original-minimal-closed-charge-operator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  minimal-closed-charge-operator-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check source and workflow delta against last accepted AT original Hilbert output unitary commit
        id: check
        shell: bash
        run: |
          set -euo pipefail
          baseline=11cd89365de7dd2af45c653fe4cbdf46177dae16
          git fetch --quiet --no-tags --depth=1 origin "$baseline"
          changed="$(git diff --name-only "$baseline" HEAD -- .github/workflows/bfss-su2-original-minimal-closed-charge-operator.yml experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8ADOppositeGammaOrientationProbe.lean experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AEOriginalChargeGammaOrientationSplitProbe.lean experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AFOriginalSmoothParityInvolutionProbe.lean experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AGOriginalSmoothParityDerivativeProbe.lean experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AHOriginalSourceChargeParityConjugationProbe.lean experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AIOriginalFullL2ParityLiftProbe.lean experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AMOriginalSourceChargeVectorParityProbe.lean experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AKOriginalFullL2ParityBosonGaugeProbe.lean experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8ALOriginalFullL2PhysicalParityProbe.lean experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8ANOriginalOppositeGammaGaugeDataProbe.lean experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AOOriginalPhysicalCoreGraphGeneratorParityProbe.lean experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AJOriginalFullL2ParityUnitaryProbe.lean experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8APOriginalPhysicalClosedGraphParityProbe.lean experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AQOriginalPhysicalClosedChargeDomainParityProbe.lean experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8ASOriginalPhysicalClosedChargeGraphEnergyParityProbe.lean experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8ATOriginalPiLp16OutputParityUnitaryProbe.lean experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AUOriginalMinimalClosedChargeLinearPMapProbe.lean)"
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "MINIMAL_CLOSED_CHARGE_OPERATOR_PROOF_OR_WORKFLOW_CHANGED"
            echo "$changed"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "NO_MINIMAL_CLOSED_CHARGE_OPERATOR_CHANGES_SKIP_EXPENSIVE_GATE"
          fi

  exact-minimal-closed-charge-operator:
    needs: minimal-closed-charge-operator-delta
    if: needs.minimal-closed-charge-operator-delta.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Check out exact candidate sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out exact original OpenAI Lean source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: Fail closed on original upstream and candidate pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-minimal-closed-charge-operator
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          python3 - <<'PY'
          import json
          d=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in d['packages'] if p['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          test "$(git hash-object experiments/openai-math-su2-concrete-potential/SU2BFSSG1APairedThetaProbe.lean)" = 4f8fbf05a35c1d625746931b7ff0361b7ffc2ec4
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AFOriginalSmoothParityInvolutionProbe.lean)" = c9f71c6929121226788181ce3547979dcfe6afef
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AGOriginalSmoothParityDerivativeProbe.lean)" = 0e96b538f3a3eb63a3aaa24772a4d0e883bdb141
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8ADOppositeGammaOrientationProbe.lean)" = f699d1a814c1646cfb819089356a64c3f5a169bc
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AEOriginalChargeGammaOrientationSplitProbe.lean)" = 82fd9226043d059f78a79e64ad8de016729c9246
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AHOriginalSourceChargeParityConjugationProbe.lean)" = c2e280e5ae1d541f21ef870b86dbea01f7253f99
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AIOriginalFullL2ParityLiftProbe.lean)" = 4832b4bdf140adaefa3271bea2325a05fde7d1be
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AMOriginalSourceChargeVectorParityProbe.lean)" = 0c42f5111fd9ff58ba9410f31047a2e922b28d76
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AKOriginalFullL2ParityBosonGaugeProbe.lean)" = fc298c8d2236d4294992577d08d30072c1777bf9
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8ALOriginalFullL2PhysicalParityProbe.lean)" = 15cf6c8a2ea0f2da7f210e41efd5d0c249d3fbe1
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8ANOriginalOppositeGammaGaugeDataProbe.lean)" = d5c3f7d6d2314bd28e9e15ec023a3a80ce303131
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AOOriginalPhysicalCoreGraphGeneratorParityProbe.lean)" = 8ed162109704a1bee07869dab8d60fc70446d484
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AJOriginalFullL2ParityUnitaryProbe.lean)" = 23bce6337e42dffb530339d54eef95378d9230b1
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8APOriginalPhysicalClosedGraphParityProbe.lean)" = 148cb78c918f9ab6836e3bc49acc7d60e356b817
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AQOriginalPhysicalClosedChargeDomainParityProbe.lean)" = 12c245924eb0e5ba4b1a1f9b7b10c34d29402995
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8ASOriginalPhysicalClosedChargeGraphEnergyParityProbe.lean)" = 395f75d87a0ca2d4001b6ee2eccd4611ded90676
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8ATOriginalPiLp16OutputParityUnitaryProbe.lean)" = dba70e368ad17344329782cb77da77cfb295328f
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6H5E8AUOriginalMinimalClosedChargeLinearPMapProbe.lean)" = c7c26e577ff4e751876bd9d1ddf88fd3bc3dff1d
          echo MINIMAL_CLOSED_CHARGE_OPERATOR_FROZEN_SOURCE_AND_CANDIDATE_PINS_PASS
      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift
      - name: Restore accepted Lean and Mathlib environment
        id: dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake
            ~/.elan
          key: bfss-l6-pinned-env-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}
      - name: Verify accepted Lean Mathlib dependency provenance
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.dependencies.outputs.cache-hit }}" = true || { echo PINNED_LEAN_CACHE_MISSING; exit 1; }
          source "$HOME/.elan/env"
          test -s upstream-math/lean/.lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean
          test "$(git -C upstream-math/lean/.lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          cd upstream-math/lean
          lake env lean --version | tee /tmp/bfss-minimal-closed-charge-operator/compiler.txt
          grep -q 'version 4.34.1' /tmp/bfss-minimal-closed-charge-operator/compiler.txt
      - name: Restore exact accepted source G1A closure
        id: qualified
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-l6g7w-accepted-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G[1-6]*Probe.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainL6G7[A-W]*Probe.lean', 'experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1[A-B]*Probe.lean', 'experiments/openai-math-su2-concrete-potential/SU2*.lean') }}
      - name: Check exact G1A and upstream BFSS compiled objects
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.qualified.outputs.cache-hit }}" = true || { echo ACCEPTED_SOURCE_CACHE_MISSING; exit 1; }
          base=upstream-math/lean/.lake/build/lib/lean
          for stem in SU2BFSSG1APairedThetaProbe SU2FermionFockProbe; do
            test -s "$base/$stem.olean" || { echo "MISSING_SOURCE=$stem"; exit 1; }
          done
          test -s "$base/OAI/MathematicalPhysics/BFSS/Core.olean"
          echo MINIMAL_CLOSED_CHARGE_OPERATOR_ACCEPTED_INPUTS_PASS
      - name: Compile original source minimal closed true LinearPMap and domain
        shell: bash
        timeout-minutes: 13
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stems="SU2BFSSPhysicalDomainL6H5E8ADOppositeGammaOrientationProbe SU2BFSSPhysicalDomainL6H5E8AEOriginalChargeGammaOrientationSplitProbe SU2BFSSPhysicalDomainL6H5E8AFOriginalSmoothParityInvolutionProbe SU2BFSSPhysicalDomainL6H5E8AGOriginalSmoothParityDerivativeProbe SU2BFSSPhysicalDomainL6H5E8AHOriginalSourceChargeParityConjugationProbe SU2BFSSPhysicalDomainL6H5E8AIOriginalFullL2ParityLiftProbe SU2BFSSPhysicalDomainL6H5E8AJOriginalFullL2ParityUnitaryProbe SU2BFSSPhysicalDomainL6H5E8AKOriginalFullL2ParityBosonGaugeProbe SU2BFSSPhysicalDomainL6H5E8ALOriginalFullL2PhysicalParityProbe SU2BFSSPhysicalDomainL6H5E8AMOriginalSourceChargeVectorParityProbe SU2BFSSPhysicalDomainL6H5E8ANOriginalOppositeGammaGaugeDataProbe SU2BFSSPhysicalDomainL6H5E8AOOriginalPhysicalCoreGraphGeneratorParityProbe SU2BFSSPhysicalDomainL6H5E8APOriginalPhysicalClosedGraphParityProbe SU2BFSSPhysicalDomainL6H5E8AQOriginalPhysicalClosedChargeDomainParityProbe SU2BFSSPhysicalDomainL6H5E8ASOriginalPhysicalClosedChargeGraphEnergyParityProbe SU2BFSSPhysicalDomainL6H5E8ATOriginalPiLp16OutputParityUnitaryProbe SU2BFSSPhysicalDomainL6H5E8AUOriginalMinimalClosedChargeLinearPMapProbe"
          for stem in $stems; do
            cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          done
          cd upstream-math/lean
          for stem in $stems; do
            echo "COMPILING_EXACT_SOURCE=$stem"
            timeout 180s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" \
              2>&1 | tee "/tmp/bfss-minimal-closed-charge-operator/$stem.log"
            test -s ".lake/build/lib/lean/$stem.olean"
          done
          python3 - <<'PY'
          import pathlib,re
          d=pathlib.Path('/tmp/bfss-minimal-closed-charge-operator')
          logs=list(d.glob('*.log'))
          assert len(logs)==17,len(logs)
          for path in logs:
              txt=path.read_text()
              assert 'sorryAx' not in txt and 'error:' not in txt,path.name
          s=(d/'SU2BFSSPhysicalDomainL6H5E8AUOriginalMinimalClosedChargeLinearPMapProbe.log').read_text()
          prefix='FCP.BFSSSU2PhysicalDomainL6H5E8AU.'
          names=['originalMinimalCoreGraph','originalMinimalClosedGraph','originalMinimalClosedGraph_set_eq','originalMinimalClosedGraph_le_full','originalMinimalClosedChargeColumn','originalMinimalClosedChargeColumn_graph_eq','originalMinimalClosedChargeColumn_isClosed','originalMinimalClosedChargeColumn_domain_eq']
          m=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          got={name:{v.strip() for v in ax.split(',') if v.strip()} for name,ax in m}
          allowed={'propext','Classical.choice','Quot.sound'}
          for n in names:
              root=prefix+n
              assert root in got,(root,got)
              assert got[root] <= allowed,(root,got[root])
          print('L6H5E8AU_SOURCE_ORIGINAL_MINIMAL_CLOSED_LINEARPMAP_EIGHT_ROOTS_CLEAN_PASS')
          PY

      - name: Preserve exact source-pinned evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-su2-opposite-gamma-${{ github.run_id }}
          path: /tmp/bfss-minimal-closed-charge-operator/
          if-no-files-found: warn
          retention-days: 14
