name: BFSS S1V4 Disjoint Source48 Spin Rotor Commutation

# Deliberately single-branch, one-file-only push trigger. No pull_request.
# Does not restore PR25-only Lean module caches or rebuild BFSS sources.
on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v4-disjoint-spin-rotors-cold-mathlib.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-s1v4-isolated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-exact-real-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    steps:
      - name: Checkout isolated geometric proof candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout exact independent original BFSS Lean environment
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Verify immutable source and toolchain inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v0
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.lean)" = 22f3101b243a7b7857d9597b547322174d9281c8
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V1StandaloneSpin48AllVectorProbe.lean)" = 1adb9000a3bbad937b1e2fc3bd4bd486c777fdd7
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V4TwoDisjointSpinRotorsCommuteProbe.lean)" = debd4f447d075a2f65817860d156fee8061ce024
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V5ConcreteSixteenSourceColorBlocksProbe.lean)" = 830747f5e50dbf12a558b32b594015c2d04d0cff
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V2StandaloneSpin48PlaneFlipInvolutionProbe.lean)" = 7a8c80dd7ef8a8772d4ffb9b2611a7bd31096d50
          python3 - <<'PY'
          import json
          m=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(x['rev'] for x in m['packages'] if x['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          print('S1V0_SOURCE_TOOLCHAIN_AND_MATHLIB_PIN_VERIFIED')
          PY

      - name: Bootstrap only pinned Lean and Mathlib without PR25 cache
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          cd upstream-math/lean
          timeout 1300s lake exe cache get 2>&1 | tee /tmp/bfss-s1v0/mathlib-cache.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo S1V0_PINNED_COLD_MATHLIB_AVAILABLE

      - name: Strictly qualify the three actual 48-real geometry roots
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          mkdir -p .lake/build/lib/lean
          timeout 210s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v0/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          stem='SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe'
          s=pathlib.Path('/tmp/bfss-s1v0',stem+'.log').read_text()
          roots=['sourcePlane_decomposition','sourcePlaneComplement_ortho_first',
                 'sourcePlaneComplement_ortho_second']
          pattern=r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
          hits=re.findall(pattern,s)
          got={k:{t.strip() for t in v.split(',') if t.strip()} for k,v in hits}
          assert len(hits)==len(roots),(got,roots)
          for n in roots:
              k='FCP.BFSSS1V0.'+n
              assert k in got and got[k]<={'propext','Classical.choice','Quot.sound'},(k,got)
          assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,s[-5000:]
          print('S1V0_STANDALONE_SOURCE48_GEOMETRY_3_ROOTS_KERNEL_PASS')
          PY

      - name: Strictly qualify the exact source-48 Spin rotor and all-vector generator equality
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS1V1StandaloneSpin48AllVectorProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          test -s ".lake/build/lib/lean/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.olean" || { echo S1V0_EXACT_PROVENANCE_OLEAN_MISSING; exit 1; }
          mkdir -p .lake/build/lib/lean
          timeout 300s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v0/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          stem='SU2BFSSPhysicalDomainS1V1StandaloneSpin48AllVectorProbe'
          s=pathlib.Path('/tmp/bfss-s1v0',stem+'.log').read_text()
          roots=['sourceSpinPair','sourceSpinPair_conjugates_first',
                 'sourceSpinPair_conjugates_second',
                 'sourceSpinPair_conjugates_perpendicular',
                 'sourceSpinPair_conjugates_plane_combination',
                 'sourceSpinPair_conjugates_every_source_vector']
          pattern=r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
          hits=re.findall(pattern,s)
          got={k:{t.strip() for t in v.split(',') if t.strip()} for k,v in hits}
          assert len(hits)==len(roots),(got,roots)
          for n in roots:
              k='FCP.BFSSS1V1.'+n
              assert k in got and got[k]<={'propext','Classical.choice','Quot.sound'},(k,got)
          assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,s[-5000:]
          print('S1V1_SOURCE48_SPIN_ROTOR_ALL_VECTOR_6_ROOTS_KERNEL_PASS')
          PY

      - name: Strictly qualify two orthogonal source48 Spin rotor commutation
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS1V4TwoDisjointSpinRotorsCommuteProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          test -s ".lake/build/lib/lean/SU2BFSSPhysicalDomainS1V1StandaloneSpin48AllVectorProbe.olean" || { echo ACCEPTED_S1V1_OLEAN_MISSING; exit 1; }
          mkdir -p .lake/build/lib/lean
          timeout 270s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v0/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          stem='SU2BFSSPhysicalDomainS1V4TwoDisjointSpinRotorsCommuteProbe'
          s=pathlib.Path('/tmp/bfss-s1v0',stem+'.log').read_text()
          roots=['sourceSpinPair_coe_comm_of_cross_ortho',
                 'sourceSpinPair_comm_of_cross_ortho']
          pattern=r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
          hits=re.findall(pattern,s)
          got={k:{t.strip() for t in v.split(',') if t.strip()} for k,v in hits}
          assert len(hits)==len(roots),(got,roots)
          for n in roots:
              k='FCP.BFSSS1V4.'+n
              assert k in got and got[k]<={'propext','Classical.choice','Quot.sound'},(k,got)
          assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,s[-5000:]
          print('S1V4_SOURCE48_ORTHOGONAL_SPIN_ROTORS_COMMUTE_2_ROOTS_KERNEL_PASS')
          PY

      - name: Strictly qualify explicit sixteen-by-three actual 48-label source indexing
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS1V5ConcreteSixteenSourceColorBlocksProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          test -s ".lake/build/lib/lean/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.olean" || { echo ACCEPTED_S1V0_OLEAN_MISSING; exit 1; }
          mkdir -p .lake/build/lib/lean
          timeout 240s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v0/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          stem='SU2BFSSPhysicalDomainS1V5ConcreteSixteenSourceColorBlocksProbe'
          s=pathlib.Path('/tmp/bfss-s1v0',stem+'.log').read_text()
          roots=['sourceBlockColorEquiv','sourceBlockColorLabel_injective',
                 'sourceBlockColorAxis_self','sourceBlockColorAxis_other']
          pattern=r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
          hits=re.findall(pattern,s)
          got={k:{t.strip() for t in v.split(',') if t.strip()} for k,v in hits}
          assert len(hits)==len(roots),(got,roots)
          for n in roots:
              k='FCP.BFSSS1V5.'+n
              assert k in got and got[k]<={'propext','Classical.choice','Quot.sound'},(k,got)
          assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,s[-5000:]
          print('S1V5_CONCRETE_SOURCE48_SIXTEEN_COLOR_BLOCK_INDEX_4_ROOTS_KERNEL_PASS')
          PY

      - name: Preserve full first-causal diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v4-isolated-${{ github.run_id }}
          path: /tmp/bfss-s1v0/
          if-no-files-found: warn
          retention-days: 14
