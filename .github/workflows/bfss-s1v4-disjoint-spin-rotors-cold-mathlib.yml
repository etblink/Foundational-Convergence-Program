name: BFSS S1V4 Disjoint Source48 Spin Rotor Commutation

# Deliberately single-branch, one-file-only push trigger. No pull_request.
# Does not restore PR25-only Lean module caches or rebuild BFSS sources.
on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v4-disjoint-spin-rotors-cold-mathlib.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfss-s1v4-isolated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-exact-real-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    steps:
      - name: Checkout isolated geometric proof candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout exact independent original BFSS Lean environment
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Verify immutable source and toolchain inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v0
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.lean)" = 22f3101b243a7b7857d9597b547322174d9281c8
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V1StandaloneSpin48AllVectorProbe.lean)" = 1adb9000a3bbad937b1e2fc3bd4bd486c777fdd7
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V4TwoDisjointSpinRotorsCommuteProbe.lean)" = debd4f447d075a2f65817860d156fee8061ce024
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V5ConcreteSixteenSourceColorBlocksProbe.lean)" = 6d15a3a76625b3677f132c544f71e5d5eb1dc93c
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V6ConcreteSource48ColorAxisOrthogonalityProbe.lean)" = 4ae8b38d5601b8c57f09e94c523beb9b4598dcb1
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V8ConcreteSource48SixteenSpinRotorsProbe.lean)" = e22fb0fd376112d76ed1e79c4decd5eb65008465
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V9OrderedSixteenSpin48RotorProductProbe.lean)" = 3d2faad8ad01b4142012036278119079873f587d
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V10SourceColorBlockRotorCentralSignProbe.lean)" = 78379ea6749efa3b1074a3da0bc3c9b1d1682d9f
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V11SixteenSourceSpin48CenterParityProbe.lean)" = ba4328851907efcb59dee45c6c0a2cecde07fa06
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V12SourceLiteralPauliQuarterSpinSignProbe.lean)" = 20b8708eea4c9c3ec30e3b3c47eea66dcbd19e93
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V14GlobalSixteenSpin48ColorTwoFixationProbe.lean)" = 335d60dcc6552ab4dbbc29f467d919b761f26269
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V15GlobalSixteenSpin48AllColorAxisActionProbe.lean)" = 95bdb9560c064618e434ebc9bd932bedfeda8284
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V16GlobalSpin48AllRealSourceVectorActionProbe.lean)" = 51f2299511ecb9d94e4a4b2a3b38299107061711
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V17QuarterFlipLiteralCoordinateAndInvolutionProbe.lean)" = ceac341fe05fbe4d54c45a7c12120c03eb646157
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V18QuarterFlipRealMajoranaDiagonalMatrixProbe.lean)" = 980109459761da5438ce48aa347d3dacbcf3c82d
          test "$(git hash-object experiments/openai-math-su2-physical-domain/SU2BFSSPhysicalDomainS1V2StandaloneSpin48PlaneFlipInvolutionProbe.lean)" = 7a8c80dd7ef8a8772d4ffb9b2611a7bd31096d50
          python3 - <<'PY'
          import json
          m=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(x['rev'] for x in m['packages'] if x['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          print('S1V0_SOURCE_TOOLCHAIN_AND_MATHLIB_PIN_VERIFIED')
          PY

      - name: Bootstrap only pinned Lean and Mathlib without PR25 cache
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          # The exact pinned Lean release host intermittently fails TLS. This
          # bounded loop retries only its immutable versioned toolchain; it
          # never changes the source pin, Mathlib lockfile, or theorem roots.
          elan_ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v0/elan-install.log; then
              elan_ok=true
              break
            fi
            echo "PINNED_LEAN_TLS_DOWNLOAD_RETRY_$attempt" | tee -a /tmp/bfss-s1v0/elan-install.log
            sleep $((attempt * 6))
          done
          test "$elan_ok" = true || { echo PINNED_LEAN_DOWNLOAD_FAILED_AFTER_THREE_ATTEMPTS; exit 1; }
          cd upstream-math/lean
          timeout 1250s lake exe cache get 2>&1 | tee /tmp/bfss-s1v0/mathlib-cache.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo S1V0_PINNED_COLD_MATHLIB_AVAILABLE

      - name: Strictly qualify the three actual 48-real geometry roots
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          mkdir -p .lake/build/lib/lean
          timeout 210s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v0/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          stem='SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe'
          s=pathlib.Path('/tmp/bfss-s1v0',stem+'.log').read_text()
          roots=['sourcePlane_decomposition','sourcePlaneComplement_ortho_first',
                 'sourcePlaneComplement_ortho_second']
          pattern=r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
          hits=re.findall(pattern,s)
          got={k:{t.strip() for t in v.split(',') if t.strip()} for k,v in hits}
          assert len(hits)==len(roots),(got,roots)
          for n in roots:
              k='FCP.BFSSS1V0.'+n
              assert k in got and got[k]<={'propext','Classical.choice','Quot.sound'},(k,got)
          assert 'sorryAx' not in s and 'error:' not in s and 'unknownIdentifier' not in s,s[-5000:]
          print('S1V0_STANDALONE_SOURCE48_GEOMETRY_3_ROOTS_KERNEL_PASS')
          PY

