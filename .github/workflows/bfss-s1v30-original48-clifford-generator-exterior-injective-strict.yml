name: BFSS S1V30 Original Source48 Clifford Generator Injection Via Exterior Strict Gate

# Restore accepted S1V29 universal Spin48 Clifford action cache.
# Verify source-exact Clifford ι to exterior degree-one correspondence and injectivity.
# Not yet a Spin48 to SO48 projection, covering or global SU2 lift.
on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v30-original48-clifford-generator-exterior-injective-strict.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v30-clifford-generator-inj-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-clifford-degree-one-injective:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact original source candidates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout immutable original upstream OAI mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Verify all source hashes and toolchain pins before expensive setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v30-clifford-inj
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          data=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in data['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          r=experiments/openai-math-su2-physical-domain
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe.lean")" = 22f3101b243a7b7857d9597b547322174d9281c8
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V29AllSpin48CliffordGeneratorConjugationProbe.lean")" = 2483cb5646b8df2b5958cee2d02769de2018ab7f
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V30Real48CliffordGeneratorInjectiveViaExteriorProbe.lean")" = 59d40c5c74cc4803a6a6096cfe5ea87c800bd7f9
          echo S1V30_ACTUAL_SOURCE48_CLIFFORD_TO_EXTERIOR_BLOBS_PINNED

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore pinned Lean 4.34.1 and exact Mathlib sources
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v30-clifford-inj/toolchain.log; then
              ok=true; break
            fi
            echo ORIGINAL_PINNED_LEAN_RETRY_$attempt | tee -a /tmp/bfss-s1v30-clifford-inj/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo PINNED_ORIGINAL_LEAN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v30-clifford-inj/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo S1V30_PINNED_LEAN_MATHLIB_VERIFIED

      - name: Restore strictly accepted S1V29 universal source Spin48 generator action cache
        id: accepted_spin
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v29-isolated-universal-spin48-clifford-generator-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed unless exact accepted S1V29 Spin48 and source geometry cache are present
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.accepted_spin.outputs.cache-hit }}" = true || { echo ACCEPTED_S1V29_GENERIC_SPIN48_SOURCE_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in SU2BFSSPhysicalDomainS1V0StandaloneOrthogonalGeometryProbe SU2BFSSPhysicalDomainS1V29AllSpin48CliffordGeneratorConjugationProbe SU2BFSSPhysicalDomainS1MSourceSO48GaugeContinuityProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "S1V30_ACCEPTED_SOURCE_DEPENDENCY_MISSING=$stem"; exit 1; }
          done
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GaugeCore.olean
          echo S1V30_ACCEPTED_SOURCE_CLIFFORD_OLEANS_READY

      - name: Compile exactly two source-sized Clifford-to-exterior degree-one and ι injectivity roots
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          stem=SU2BFSSPhysicalDomainS1V30Real48CliffordGeneratorInjectiveViaExteriorProbe
          cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
          timeout 600s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v30-clifford-inj/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean" || { echo S1V30_ORIGINAL48_CLIFFORD_GENERATOR_OLEAN_MISSING; exit 1; }
          python3 - <<'PY'
          import pathlib,re
          stem='SU2BFSSPhysicalDomainS1V30Real48CliffordGeneratorInjectiveViaExteriorProbe'
          src=pathlib.Path(stem+'.lean').read_text()
          log=pathlib.Path('/tmp/bfss-s1v30-clifford-inj',stem+'.log').read_text()
          names=re.findall(r'^#print axioms (\S+)',src,re.M)
          expected=['source48_cliffordGenerator_equivExterior','source48_cliffordGenerator_injective']
          assert names==expected,(stem,names)
          assert re.findall(r'^namespace (\S+)',src,re.M)==['FCP.BFSSS1V30']
          reports=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          found={k:{x.strip() for x in v.split(',') if x.strip()} for k,v in reports}
          assert len(reports)==len(found)==2,(stem,reports)
          allowed={'propext','Classical.choice','Quot.sound'}
          for name in expected:
            key='FCP.BFSSS1V30.'+name
            assert key in found and found[key]<=allowed,(stem,key,found)
          assert 'sorryAx' not in log and 'error:' not in log and 'unknownIdentifier' not in log,(stem,log[-8000:])
          print('S1V30_ORIGINAL_SOURCE48_CLIFFORD_GENERATOR_INJECTIVITY_2_ROOTS_KERNEL_PASS')
          PY

      - name: Save source48 Clifford generator injectivity source cache only after both strict roots
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v30-isolated-source48-clifford-generator-inj-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve first causal source and pin logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v30-clifford-inj-${{ github.run_id }}
          path: /tmp/bfss-s1v30-clifford-inj/
          if-no-files-found: warn
          retention-days: 14
