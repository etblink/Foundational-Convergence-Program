        run: |
          set -euo pipefail
          test "${{ steps.parent.outputs.cache-hit }}" = true || { echo H4E3D4C3_MISSING_ACCEPTED_C2_CACHE; exit 1; }
          test "$(git hash-object --no-filters experiments/openai-math-su2-physical-domain/FCPM4F9H4E3D4C2ActualIndependentHistoricalUnitaryGraphEquivalence.lean)" = b75423cbb244e260a079f2e03925ed4cbfb29a4f
