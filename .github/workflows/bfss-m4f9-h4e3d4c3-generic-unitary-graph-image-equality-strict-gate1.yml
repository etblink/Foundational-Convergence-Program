          done
          echo BFSS_H4E3D4C3_C2_C1_ACCEPTED_SOURCE_GRAPH_ANCESTRY_PASS
      - name: Fresh generic exact unitary Hilbert partial graph submodule map equality
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          stem=FCPM4F9H4E3D4C3GenericUnitaryPartialGraphImageEquality
          cp "experiments/openai-math-su2-physical-domain/$stem.lean" upstream-math/lean/
          cd upstream-math/lean
          timeout 270s lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-m4f9-h4e3d4c3-gate1/$stem.log"
          test -s ".lake/build/lib/lean/$stem.olean"
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/bfss-m4f9-h4e3d4c3-gate1/FCPM4F9H4E3D4C3GenericUnitaryPartialGraphImageEquality.log').read_text()
          ns='FCP.M4F9H4E3D4C3GenericUnitaryPartialGraphImageEquality.'
          roots=['genericUnitaryPartialGraph_map_eq']
          reports=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s)
          got={n:{a.strip() for a in v.split(',') if a.strip()} for n,v in reports}
          assert len(reports)==len(got)==1 and set(got)=={ns+n for n in roots},('H4E3D4C3_WRONG_ROOT',reports)
          for name,axioms in got.items():
              assert axioms <= {'propext','Classical.choice','Quot.sound'},(name,axioms)
          known={'belyi','formal-schemes','elliptic-curves','tempered-fundamental-groups','oka','orbicurve-cores','pi1','heights','genl','tate-curves-theta','iut'}
          filtered=[]
          for line in s.splitlines():
              m=re.fullmatch(r"warning: ([a-z0-9-]+): repository '([^']+)' has local changes",line)
              if m and m.group(1) in known and m.group(2).endswith('/upstream-math/lean/.lake/packages/'+m.group(1)): continue
              filtered.append(line)
          checked='\n'.join(filtered)
          assert not any(t in checked for t in ('sorryAx','error:','warning:','unknownIdentifier')),checked[-5000:]
          print('BFSS_M4F9_H4E3D4C3_GENERIC_UNITARY_GRAPH_IMAGE_SUBMODULE_EQ_ONE_ROOT_STRICT_PASS')
          PY
