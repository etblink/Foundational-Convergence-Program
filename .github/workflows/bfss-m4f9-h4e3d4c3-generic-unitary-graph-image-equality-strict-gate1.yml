        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
      - name: H4E3D4C3 generic exact transported graph image source preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-m4f9-h4e3d4c3-gate1
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json,pathlib,re,subprocess
          d=json.loads(pathlib.Path('upstream-math/lean/lake-manifest.json').read_text())
          assert next(x['rev'] for x in d['packages'] if x['name']=='mathlib')=='d13f23b723b8a846827a245b89c10fc7d3f11612'
          p=pathlib.Path('experiments/openai-math-su2-physical-domain/FCPM4F9H4E3D4C3GenericUnitaryPartialGraphImageEquality.lean')
          h='16604c940adcf2044dd3442500877ec5149831ae'
          assert subprocess.check_output(['git','rev-parse','HEAD:'+str(p)],text=True).strip()==h
          assert subprocess.check_output(['git','hash-object','--no-filters',str(p)],text=True).strip()==h
          s=p.read_text()
          assert s.startswith('import FCPM4F9H4E3D4C2ActualIndependentHistoricalUnitaryGraphEquivalence'+chr(10))
          assert re.findall(r'(?m)^namespace (\S+)',s)==['FCP.M4F9H4E3D4C3GenericUnitaryPartialGraphImageEquality']
          assert re.findall(r'(?m)^#print axioms (\S+)',s)==['genericUnitaryPartialGraph_map_eq']
          assert 'genericUnitaryPartialGraph_mem_iff' in s and 'Submodule.ext' in s
          assert 'toLinearEquiv.toLinearMap' in s and 'prodMap' in s
          assert 'U.apply_symm_apply' in s and 'A.graph.map' in s and 'B.graph' in s
          assert not re.search(r'(?m)^\s*(?:sorry|admit|axiom)\b|\bsorryAx\b',s)
          print('BFSS_H4E3D4C3_GENERIC_UNITARY_GRAPH_IMAGE_SOURCE_EXACT_PREFLIGHT_PASS')
          PY
      - name: Reclaim disposable runner disk
        shell: bash
