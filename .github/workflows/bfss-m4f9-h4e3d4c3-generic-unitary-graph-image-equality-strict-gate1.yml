          for stem in FCPM4F9H4E3D4C2ActualIndependentHistoricalUnitaryGraphEquivalence FCPM4F9H4E3D4C1GenericUnitaryPartialGraphEquivalence FCPM4F9H4E3D4BIndependentNormalizedHistoricalHamiltonianAction FCPM4F9H4E3D4AIndependentNormalizedPhysicalHamiltonianDomain FCPM4F9H4E3D3IndependentHistoricalTrueSquareAction; do
