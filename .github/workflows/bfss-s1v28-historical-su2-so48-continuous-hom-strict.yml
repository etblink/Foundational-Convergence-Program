name: BFSS S1V28 Historical SU2 to SO48 Hom and Continuity Source Strict Cache

# Restore accepted joint historical SU2 quarter vs independent Spin48 source cache.
# Rebuild exact historical S1K, S1L, S1M 48-real SU2-to-SO48 hom and continuity.
# Proves the continuous base representation, NOT a Spin48 global lift.
on:
  push:
    branches:
      - research/openai-math-su2-s1v-orthogonal-decomposition-isolated-20261018
    paths:
      - .github/workflows/bfss-s1v28-historical-su2-so48-continuous-hom-strict.yml

permissions:
  contents: read

concurrency:
  group: bfss-s1v28-so48-topological-base-${{ github.ref }}
  cancel-in-progress: false

jobs:
  historical-su2-so48-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact original source candidates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout immutable original upstream OAI mathematics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: etblink/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Verify all source hashes and toolchain pins before expensive setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bfss-s1v28-so48
          test "$(git -C upstream-math rev-parse HEAD)" = adc7f1241b42e322a6451854ab7e4b4c146bf78a
          test "$(cat upstream-math/lean/lean-toolchain)" = leanprover/lean4:v4.34.1
          python3 - <<'PY'
          import json
          data=json.load(open('upstream-math/lean/lake-manifest.json'))
          assert next(p['rev'] for p in data['packages'] if p['name']=='mathlib') == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          PY
          r=experiments/openai-math-su2-physical-domain
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1V27HistoricalOriginalQuarterVsIndependentSpin48MatrixProbe.lean")" = d4b20266b01f827eb12ba3c3efff0d7b95c07dce
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1KActualSO48SourceGaugeHomProbe.lean")" = e7f09cc289bc254aa4b23568dfec70552a0f613c
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1LOriginalManuscript48ColorLabelBridgeProbe.lean")" = f225a7417413008e281a143fe6db4c0da4b86026
          test "$(git hash-object "$r/SU2BFSSPhysicalDomainS1MSourceSO48GaugeContinuityProbe.lean")" = bed1023e4bfb6b48ee866fdad79cb88a880bcfbc
          echo S1V28_HISTORICAL_S1KLM_SO48_HOM_CONTINUITY_SOURCES_PINNED

      - name: Reclaim disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Restore pinned Lean 4.34.1 and exact Mathlib sources
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          ok=false
          for attempt in 1 2 3; do
            if timeout 150s elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tee -a /tmp/bfss-s1v28-so48/toolchain.log; then
              ok=true; break
            fi
            echo ORIGINAL_PINNED_LEAN_RETRY_$attempt | tee -a /tmp/bfss-s1v28-so48/toolchain.log
            sleep $((attempt * 6))
          done
          test "$ok" = true || { echo PINNED_ORIGINAL_LEAN_UNAVAILABLE; exit 1; }
          cd upstream-math/lean
          timeout 1080s lake exe cache get 2>&1 | tee /tmp/bfss-s1v28-so48/mathlib.log
          test "$(lake env lean --version | grep -oE '4\.34\.1')" = 4.34.1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          echo S1V28_PINNED_LEAN_MATHLIB_VERIFIED

      - name: Restore strictly accepted combined S1V27 original SU2 vs Spin48 48-real matrix source cache
        id: accepted_quarter
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v27-isolated-historical-source-spin48-matrix-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Fail closed unless accepted S1V27 original historical SU2/independent Spin48 source cache is present
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.accepted_quarter.outputs.cache-hit }}" = true || { echo ACCEPTED_HISTORICAL_S1V27_SOURCE_SPIN48_CACHE_MISSING; exit 1; }
          cd upstream-math/lean
          for stem in SU2BFSSPhysicalDomainS1V27HistoricalOriginalQuarterVsIndependentSpin48MatrixProbe SU2BFSSPhysicalDomainS1JActual48RealMajoranaColorActionProbe SU2BFSSPhysicalDomainS1V18QuarterFlipRealMajoranaDiagonalMatrixProbe SU2BFSSPhysicalDomainS1V23OriginalPlusICurveNativeQuarterBridgeProbe; do
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "S1V28_ACCEPTED_SOURCE_DEPENDENCY_MISSING=$stem"; exit 1; }
          done
          test -s .lake/build/lib/lean/OAI/MathematicalPhysics/BFSS/GaugeCore.olean
          echo S1V28_ACCEPTED_HISTORICAL_AND_SPIN48_SOURCE_OLEANS_READY

      - name: Compile pinned original S1K S1L S1M source hom continuity and audit eleven original roots
        shell: bash
        timeout-minutes: 18
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          cd upstream-math/lean
          for stem in SU2BFSSPhysicalDomainS1KActualSO48SourceGaugeHomProbe SU2BFSSPhysicalDomainS1LOriginalManuscript48ColorLabelBridgeProbe SU2BFSSPhysicalDomainS1MSourceSO48GaugeContinuityProbe; do
            cp "../../experiments/openai-math-su2-physical-domain/$stem.lean" "$stem.lean"
            echo "S1V28_HISTORICAL_SO48_SOURCE_BEGIN=$stem"
            timeout 340s lake env lean -o ".lake/build/lib/lean/$stem.olean" "$stem.lean" 2>&1 | tee "/tmp/bfss-s1v28-so48/$stem.log"
            test -s ".lake/build/lib/lean/$stem.olean" || { echo "S1V28_MISSING_ORIGINAL_SO48_OLEAN=$stem"; exit 1; }
            STEM="$stem" python3 - <<'PY'
          import pathlib,os,re
          stem=os.environ['STEM']
          src=pathlib.Path(stem+'.lean').read_text()
          log=pathlib.Path('/tmp/bfss-s1v28-so48',stem+'.log').read_text()
          roots=re.findall(r'^#print axioms (\S+)',src,re.M)
          nsm=re.findall(r'^namespace (\S+)',src,re.M)
          n=(3 if 'S1K' in stem or 'S1L' in stem else 5)
          assert len(roots)==n and len(nsm)==1,(stem,roots,nsm)
          reports=re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log)
          found={k:{a.strip() for a in axs.split(',') if a.strip()} for k,axs in reports}
          assert len(reports)==len(found)==n,(stem,reports)
          allowed={'propext','Classical.choice','Quot.sound'}
          for root in roots:
            key=root if '.' in root else nsm[0]+'.'+root
            private=re.compile(r'_private\.'+re.escape(stem)+r'\.[0-9]+\.'+re.escape(key))
            hits=[x for x in found if x==key or private.fullmatch(x)]
            assert len(hits)==1 and found[hits[0]]<=allowed,(stem,key,hits,found)
          assert 'sorryAx' not in log and 'error:' not in log and 'unknownIdentifier' not in log,(stem,log[-7500:])
          print('S1V28_ACTUAL_SO48_ORIGINAL_SOURCE_KERNEL_PASS',stem,len(roots))
          PY
          done
          python3 - <<'PY'
          import pathlib,re
          logs=list(pathlib.Path('/tmp/bfss-s1v28-so48').glob('SU2BFSSPhysicalDomainS1*.log'))
          counts=[]
          for log in logs:
            counts.append(len(re.findall(r'^#print axioms ',pathlib.Path(log.stem+'.lean').read_text(),re.M)))
          assert len(logs)==3 and sum(counts)==11,(len(logs),counts)
          print('S1V28_HISTORICAL_SU2_SO48_HOM_AND_CONTINUITY_3_MODULES_11_ROOTS_KERNEL_PASS')
          PY

      - name: Save original SU2 to SO48 hom and continuity closure only after eleven verified roots
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            upstream-math/lean/.lake/build/lib/lean/OAI
            upstream-math/lean/.lake/build/lib/lean/SU2*.olean
          key: bfss-s1v28-isolated-source-su2-so48-continuous-v1-adc7f124-lean4341-d13f23b-${{ runner.os }}-${{ runner.arch }}

      - name: Preserve first causal source and pin logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfss-s1v28-so48-${{ github.run_id }}
          path: /tmp/bfss-s1v28-so48/
          if-no-files-found: warn
          retention-days: 14
